  - {run: setblock ~2 ~1 ~1 stone}
  - {wait: 10}
  - expect:
      o1: 1
      o2: 0
      o3: 0
      o4: 0
      o5: 0
      o6: 0
      o7: 0
      o8: 0
  - {run: 'execute positioned ~0.5 ~1.5 ~2.5 as @e[type=item_frame,distance=..0.8] run data merge entity @s {ItemRotation:1b}'}
  - {run: setblock ~2 ~1 ~1 air}
