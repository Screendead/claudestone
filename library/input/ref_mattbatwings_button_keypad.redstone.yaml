name: ref_mattbatwings_button_keypad
description: "Phone keypad of 10 stone buttons (1 2 3 / 4 5 6 / 7 8 9 / 0), each with its own active-low output line (high idle, low while its key is held); the lines leave at the north face on x=0,2,4 at y=7 (keys 1-3), 5 (4-6), 3 (7-9) and 1 (key 0), two blocks apart. Source (SOURCED): mattbatwings, Logical Redstone Archive INTERFACE003_Button_Keypad, tagged Tested and Functional, Recommended; https://discord.com/channels/1361854816837435433/1472388736200478883. Size 5x8x5; buttons face south, so the player stands south of it. Harness change: support blocks are smooth_stone instead of iron_block, because use only emulates plain full supports; both are full opaque conductors, so the circuit is the same. How it works (INFERRED from the layout, consistent with the tests): a pressed button strongly powers the block it sits on and switches off the wall torch on that block; each key has one torch and one dust line to the north face, and the lines are kept apart by a block or a top slab between them (dust climbs over a top slab, which does not cut the link). Key 0 has no torch of its own at the button: its powered block feeds the dust under it, which powers the support block of a lower torch. MEASURED: all 10 lines fall 2 ticks after the click and rise 21 ticks after it (the button holds 20); keys pressed together pull only their own lines. Not in the README: while key 0 is held, key 8's line stays high (key 0 is masked onto it), so key 8 pressed with key 0 is not seen."
