  .: air
  A: smooth_stone
  B: redstone_wire[east=none,north=side,south=side,west=none]
  n: redstone_wall_torch[facing=north]
  C: smooth_stone_slab[type=top,waterlogged=false]
  D: redstone_wire[east=side,north=side,south=side,west=side]
