name: ref_mattbatwings_banner_keyboard
description: 'Rebuild of INTERFACE004 Banner Keyboard by mattbatwings (Logical Redstone Archive, Tested & Functional, Recommended; https://discord.com/channels/1361854816837435433/1472393642403430654):
  26 letter buttons in QWERTY rows plus two wooden special keys; a letter drives one of two analog dust outputs (out_u west end of y=2, out_v west end of y=4) whose strength is its position, ''key is output
  as 2 hex numbers'' (SOURCED). 13x9x7. Harness changes: black_wool is white_wool (the harness only emulates plain supports for buttons); the white wall banners and oak signs (labels, no circuit role) are
  left out, so which letter sits on which button is INFERRED from the QWERTY layout (the parse has no banner patterns); the dust ends and lamps are named cells. How it works (INFERRED, then confirmed by
  the full trace): row 1 (ZXCVBNM, y=2) lights a dust line y=1 whose east end is read by a comparator and fed onto the y=2 line at its east end; row 2 (ASDFGHJKL, y=4) buttons hard-power wool read by one
  comparator each, each comparator powers the wool above a tap of the same y=2 line; so a key''s strength is its distance along the line, read at the west end by a comparator through wool into out_u. Row
  3 (QWERTYUIOP, y=6) taps the y=5 line directly, read the same way into out_v; L (row 2, last column) is wired by a dust ramp into the y=5 line instead of the y=2 line. The two special keys (oak wall buttons,
  east end) each go through a repeater to a lamp. Measured: out_u/out_v strengths Z..M = u 1..7, K..A = u 8..15 (A=15, S=14 ... K=8), L = v 5, P..Q = v 6..15 (Q=15, W=14 ... P=6); the other output is 0;
  an output rises 4 gt after the click for rows 1 and 2 and L, 2 gt for row 3, and falls 19 gt later plus the same delay (stone button 20 gt); the special keys light a lamp 2 gt after the click for 33 gt
  (oak button 30 gt plus the repeater and lamp). Not tested: two keys at once.'
