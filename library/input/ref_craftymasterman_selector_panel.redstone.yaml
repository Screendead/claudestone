name: ref_craftymasterman_selector_panel
description: >-
  Radio-button selector, five rows 1 wide: pressing a row lights its copper bulb and darkens the one that was lit. Source: mattbatwings' Logical Redstone Archive, INTERFACE001_Modern_Selector_Panel (INTERFACE001_modern_selector.schem), by CraftyMasterman, endorsed by mattbatwings, tags Recommended and Tested & Functional, Discord https://discord.com/channels/1361854816837435433/1472385072261763346. Size 3x4x5, 5 rows of one 3x4 slice, all blocks as in the schematic (the README says 'a modern, 1 wide design for a selector panel using copper bulbs'). Harness changes: update_pass strict (a normal pass pulses all 10 observers, which lights every bulb at load); presses are run steps (setblock the powered stone_button, clone its wool, wait 20 gt, setblock it unpowered, clone), because `use` only emulates buttons on plain full blocks and these hang on wool. MEASURED: it selects one row per press for all 20 ordered transitions between 5 rows; the lit bulb goes dark 6 gt after the press (b new +0, comparator +2, observer E pulse +4, old row's observer D +6); dust over glass is why it works (orange_concrete in its place lights all five bulbs); the button must be held 4 gt or the row is not marked. DEFECTS, MEASURED: pressing the lit row again turns it off but leaves its dropper triggered, so the next press of another row lights that row again (two lit); a hold under 4 gt leaves the row lit but unmarked, so the next press leaves it lit. INFERRED mechanism: bulb toggles on a button's wool; its comparator turns the bulb state into a powered edge for observer E, whose pulse feeds the dust line of all rows (15 minus distance); each dust change updates its row's dropper, which re-reads whether the wool above its observer is powered and clears (button not held) or sets (button held) its triggered flag; observer D watches that flag, and its pulse into the wool toggles the bulb, so the old row switches itself off.
update_pass: strict
