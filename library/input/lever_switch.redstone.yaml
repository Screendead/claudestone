name: lever_switch
description: A lever for the player, with a wire out the back.
palette:
  .: air
  '=': smooth_stone
  s: {name: switch, block: 'lever[face=wall,facing=north,powered=false]'}
  '#': white_concrete
  v: repeater[facing=north]
  o: {output: out, block: redstone_wire}
layers:
  0: |
    .
    =
    =
    =
  1: |
    s
    #
    v
    o
tests:
- name: flick on and off
  steps:
  - {use: switch}
  - {wait: 4}
  - expect: {out: 1}
  - {use: switch}
  - {wait: 4}
  - expect: {out: 0}
