name: ref_mattbatwings_counter_8bit_3x3
description: "Rebuild of mattbatwings' 8-bit Counter (3x3), Logical Redstone Archive COUNT003, https://discord.com/channels/1361854816837435433/1472420962086686740 (README SOURCED: 'a compact & synced binary counter', input count button, output 8b number, tested and functional). 3x4 footprint, 18 high (vertical stack: base at y1-2, then one 2-layer cell per bit at y3,5,...,17; lamps at x2,z2 are bits b0 (bottom) to b7 (top)). Harness changes: cyan wool -> white_wool (harness button emulation needs a plain support; wool is otherwise identical); button named btn, the 8 lamps b0..b7. How it works (INFERRED from traces, MEASURED timings): a press makes the comparator at (2,1,1) (rear = button-powered wool, side = the button delayed by repeater C, 4 gt) emit a 4 gt pulse; it switches off the torch at (1,1,0), which at rest keeps a dust ladder high. The ladder (dust zigzagging up x1/x2 on glass, 16 dust for 8 bits) is refreshed at every bit by that bit's torch (lit while the bit is 0), so with the pulse low, stage k stays low only if bits 0..k-1 are all 1: stage k = the carry into bit k, all stages falling together (dust is instant). Each bit is a lock-glitch T flip-flop: repeater M (the bit, feeding its lamp) has its data input and its lock (side repeater) both driven by the same stage; when the stage drops M is unlocked and sees its input fall in the same tick, an ON M turns off and an OFF M's pending turn-on fires before the lock returns 4 gt later, so M toggles. Because every stage falls at once the counter is synchronous: a press at tick 0 changes every M at +8 and the lamps that go out do so at +12 (a redstone lamp keeps its light 4 gt after losing power), so a count lights the new high bit 4 gt before the lower bits go dark. The dust decays 1 per block along the ladder and would reach strength 1 at the top with no torch refresh (arithmetic, not measured), a likely reason the stack stops at 8 bits. MEASURED: counts 0..255 and wraps (257 presses, every bit checked after each); 0->1, 1->2, 127->128 and 255->0 each show risers at +8 and fallers at +12 after the press, identical for the 1-bit and the 8-bit carry; one count per press (the button's 20 gt hold counts once). Not tested: pulses shorter than a button press."
traits: [entityless, pistonless, torch_based, compact]
palette:
  .: air
  A: white_wool
  (: redstone_wall_torch[facing=west]
  B: redstone_wire[east=side,north=none,south=side,west=none]
