  I: redstone_wire[east=up,north=none,south=side,west=side]
  J: cyan_stained_glass
  K: repeater[delay=1,facing=north]
  n: redstone_wall_torch[facing=north]
  M: repeater[delay=1,facing=west]
  L: redstone_lamp
