- name: 0 to 1
  steps:
  - {wait: 20}
  - use: btn
  - wave:
      b0: '00000000111111'
      b1: '00000000000000'
      b2: '00000000000000'
      b3: '00000000000000'
      b4: '00000000000000'
      b5: '00000000000000'
      b6: '00000000000000'
      b7: '00000000000000'
  - {wait: 30}
- name: 1 to 2
  steps:
  - {wait: 20}
  - repeat: {times: 1, steps: [{use: btn}, {wait: 30}]}
  - use: btn
  - wave:
      b0: '11111111111100'
      b1: '00000000111111'
      b2: '00000000000000'
      b3: '00000000000000'
      b4: '00000000000000'
      b5: '00000000000000'
      b6: '00000000000000'
      b7: '00000000000000'
  - {wait: 30}
- name: 127 to 128 (carry through all 8 bits)
  steps:
  - {wait: 20}
  - repeat: {times: 127, steps: [{use: btn}, {wait: 30}]}
  - use: btn
  - wave:
      b0: '11111111111100'
      b1: '11111111111100'
      b2: '11111111111100'
      b3: '11111111111100'
      b4: '11111111111100'
      b5: '11111111111100'
      b6: '11111111111100'
      b7: '00000000111111'
  - {wait: 30}
- name: 255 to 0 (all clear)
  steps:
  - {wait: 20}
  - repeat: {times: 255, steps: [{use: btn}, {wait: 30}]}
  - use: btn
  - wave:
      b0: '11111111111100'
      b1: '11111111111100'
      b2: '11111111111100'
      b3: '11111111111100'
      b4: '11111111111100'
      b5: '11111111111100'
      b6: '11111111111100'
      b7: '11111111111100'
  - {wait: 30}
