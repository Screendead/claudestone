name: ref_mattbatwings_counter_updown_load
description: 'Rebuild of mattbatwings'' 8-bit Up/Down Counter with Load, Logical Redstone Archive COUNT002, https://discord.com/channels/1361854816837435433/1472420753168404642 (README SOURCED: counts up, counts down or loads a new number; inputs an 8-bit number, a Load button, a Count button and an Up/down lever; output an 8-bit number; tested and functional). 19x18x4, a vertical stack: base cells at y1-6 hold the up/down lever (0,1,1), the load button (0,3,1) and the count button (0,5,1), then one 2-layer cell per bit at y7,9,...,17 (bit 0 at the bottom); data levers d0..d5 at x1,z0 of each bit cell, output trapdoors q0..q5 at (9,y,3). MEASURED DISCREPANCY: the schematic has six bit cells, six data levers and six trapdoors, not eight, and the count wraps 63 -> 0 and 0 -> 63, so this is a 6-bit counter; no cell of the stack holds a seventh or eighth bit (the y3 and y5 cells carry the load and count buttons instead, and nothing there toggles on a count). Harness changes: orange wool -> white_wool (the harness emulates a button or lever only on plain white wool; every lamp the levers and buttons sat on became white_wool as well, the original lamps only displayed the lever); the iron trapdoors q0..q5 are the readout (open = bit set; INFERRED from the only cells that follow the count, MEASURED that they equal the counter''s value after every operation) and were saved with y7 and y9 open, which is now open=false so the build starts consistent; names for the controls and outputs. How it works (INFERRED from traces, only the measured parts are certain): a count press feeds a pulse (comparator minus delayed side, the same edge trick as ref_mattbatwings_counter_8bit_3x3) onto a dust ladder zigzagging up x17/x18 that reaches every bit cell in the same tick, so the counter is synchronous. The bit itself is held by the torch (10,y,0), repeater (12,y,0) and target block (13,y,0) loop: a count flips exactly those, and the trapdoor follows through the dust and repeater line along z2. Two south-facing subtract comparators at (13,y,1) and (14,y,1) and a four-dust decay line (strengths 15 down to 11 at (12..15,y,2)) per bit are the toggle gate; the carry/borrow path and the up/down mux were not traced further. Load: each bit cell has a comparator at (4,y,0) reading the lever-powered wool; the load pulse first sets every bit that is 0 and then clears the bits whose lever is 0. MEASURED: a count press at tick T changes every output that changes at T+10, up or down, carry or not (0->1, 1->2, 31->32, 63->0, down 32->31 and 0->63 checked by wave over 14 ticks, with no glitch on any bit); a load press at T gives the final value at T+18 at the latest. Bits whose lever and state are both 0 pulse high for 2 gt (T+16..T+17) and fall at T+18; a bit that is 1 and loads 0 falls at T+16, 0 loading 1 rises at T+16, 1 loading 1 stays up (tested 0->42, 42->21, 63->1, 21->0). Counts 0..8, wraps both ways, carries through 15, 31, 47 and 63, loads 42, 21, 0, 63, 1, 32, 5, 58, load while the lever is on down, load over a counted value, up then down then up from 42. Fastest count tested: a press every 24 gt counts every press (70 up and 70 down presses land on 6 and 58); 22 gt lost counts in an earlier 7-press probe, so about 24 gt is the limit with a stone button (20 gt hold, not pinned down).'
