tests:
- name: counts through all 8 Johnson states and wraps
  steps:
  - {expect: {q0: 0, q1: 0, q2: 0, q3: 0}}
  - {drive: {clk: 1}}
  - {wait: 16}
  - {drive: {clk: 0}}
  - {wait: 16}
  - {expect: {q0: 1, q1: 0, q2: 0, q3: 0}}
  - {drive: {clk: 1}}
  - {wait: 16}
  - {drive: {clk: 0}}
  - {wait: 16}
  - {expect: {q0: 1, q1: 1, q2: 0, q3: 0}}
  - {drive: {clk: 1}}
  - {wait: 16}
  - {drive: {clk: 0}}
  - {wait: 16}
  - {expect: {q0: 1, q1: 1, q2: 1, q3: 0}}
  - {drive: {clk: 1}}
  - {wait: 16}
  - {drive: {clk: 0}}
  - {wait: 16}
  - {expect: {q0: 1, q1: 1, q2: 1, q3: 1}}
  - {drive: {clk: 1}}
  - {wait: 16}
  - {drive: {clk: 0}}
  - {wait: 16}
  - {expect: {q0: 0, q1: 1, q2: 1, q3: 1}}
  - {drive: {clk: 1}}
  - {wait: 16}
  - {drive: {clk: 0}}
  - {wait: 16}
  - {expect: {q0: 0, q1: 0, q2: 1, q3: 1}}
  - {drive: {clk: 1}}
  - {wait: 16}
  - {drive: {clk: 0}}
  - {wait: 16}
  - {expect: {q0: 0, q1: 0, q2: 0, q3: 1}}
  - {drive: {clk: 1}}
  - {wait: 16}
  - {drive: {clk: 0}}
  - {wait: 16}
  - {expect: {q0: 0, q1: 0, q2: 0, q3: 0}}
