name: count_johnson_4
description: '4-stage Johnson (twisted-ring) counter, 8 states, lightless and silent, with every stage changing exactly 2 gt after the rising edge. Each stage is a new 2 gt edge-triggered D flip-flop made only of comparators, repeaters, dust and a composter: its output q is one dust cell fed by two subtract comparators, C1 (rear: the clock; side: latch L) and C2 (rear: a hold ring; side: the clock). On a rising edge C1 passes NOT L and C2 is zeroed, both 2 gt later; while the clock is low C2 passes the ring. The ring is three compare comparators and three concrete blocks round a 3x3 (q, H, block, H2, block, H3, block, C2), so it keeps its level with no decay and needs no repeater; it holds the clock level c that C1 wrote, and C2 is zeroed because its clock side is at least c. L is a repeater that a lock repeater K (from the clock) freezes from 2 gt after the rising edge, so the previous stage changing at +2 is ignored; L is fed by an inverter (subtract comparator, level-1 composter at the rear, the previous stage on its side) for stages 1-3, and by a plain repeater from q3 for stage 0, which is the twist. The four stages are one module turned 90 degrees each time round the clock input, so every clock tap is close to it (C2 sides and C1 rears all read 11) and the data runs round the outside; each stage reads the previous one from the last block of its ring. Sequence q0..q3: 0000, 1000, 1100, 1110, 1111, 0111, 0011, 0001, 0000; loads at 0000; the falling edge changes nothing. Interface (top view, north up): clk is the cell at (x6,y1,z6), inside the footprint at the centre of the pinwheel; outputs are dust cells q0 (x3,y1,z8), q1 (x8,y1,z9), q2 (x9,y1,z4), q3 (x4,y1,z3). Clock: tested tick by tick at 16/16 and 8/4 gt high/low; 6/6, 7/5, 7/4, 6/5 and 5/6 fail (with under 8 gt high the output drops for a few ticks after the falling edge, because the ring takes 6 gt to carry a new value round to C2). 13x2x13, 206 blocks. Trade-off: missed the 60-block volume goal by far (a single stage alone is 6x2x5 = 60): it is 2.25x the volume of count_bulb_sync, which is also 2 gt synchronous but uses copper bulbs, so it is not lightless, and 1.7x count_lock_ripple (lightless but 8-26 gt ripple). It is the folder''s only lightless synchronous counter, and a Johnson count decodes each state with one 2-input gate.'
traits: [lightless, silent, pistonless, entityless, flat, horizontal, fast, comparator_based, tick_accurate, reset_safe, survival_friendly]
palette:
  ".": air
  "=": smooth_stone
  "#": white_concrete
  "-": redstone_wire
  d: redstone_wire
  K: composter[level=1]
  c: {"input": "clk"}
  A: comparator[facing=east,mode=compare]
  B: comparator[facing=north,mode=subtract]
  C: comparator[facing=north,mode=compare]
  D: comparator[facing=south,mode=compare]
  E: repeater[facing=north]
  F: repeater[facing=east]
  G: comparator[facing=west,mode=subtract]
  '3': {"output": "q3", "block": "redstone_wire"}
  H: comparator[facing=east,mode=subtract]
  '2': {"output": "q2", "block": "redstone_wire"}
  I: comparator[facing=west,mode=compare]
  J: comparator[facing=south,mode=subtract]
  L: repeater[facing=south]
  M: repeater[facing=west]
  '0': {"output": "q0", "block": "redstone_wire"}
  '1': {"output": "q1", "block": "redstone_wire"}
