name: ref_mattbatwings_counter_8bit_load
description: "Rebuild of mattbatwings' 8-bit Counter with Load (a 'program counter'), Logical Redstone Archive COUNT001, https://discord.com/channels/1361854816837435433/1472420348317270228 (README SOURCED: counts up or loads a new number; inputs an 8-bit number, a Load button and a Count-up button; output 8-bit number; tested and functional). 8x4 footprint, 20 high: base at y1-3, then a 2-layer cell per bit at y5,7,...,19 (bit 0 at the bottom); output lamps at x5,z3, data levers at x0,z2, load button at (0,1,2), count button at (0,3,2). Harness changes: cyan wool -> white_wool; the lamp each lever sat on (x1,z2) is white_wool so the lever has a plain support (the original lamp only displayed the data; the comparator beside it reads the lever-powered block either way); levers named d0..d7, buttons btn_y1 (load) and btn_y3 (count), output lamps q0..q7. How it works (INFERRED from traces, MEASURED timings): the count half is COUNT003's design, a pulse (comparator minus delayed side) dropping a refreshed dust ladder whose stage k falls only when bits 0..k-1 are all 1, each bit a lock-glitch repeater T flip-flop (see ref_mattbatwings_counter_8bit_3x3). The load button pulses two vertical dust buses (x1 and x7, 8 bits tall) in the base: first every bit is set, then a per-bit comparator at x2 reading the lever-powered wool clears the bits whose lever is 0. MEASURED: counts 0..255 and wraps; loads 0x00, 0xFF, 0xA5, 0x5A, 0x01, 0x80, 0x7F and counts two on from each; count 0->1, 7->8, 127->128 and 255->0 show risers at +8 and fallers at +12 after the press (lamps); a load turns every lamp on at +6 and the lamps whose lever is 0 go dark at +16, so the load shows a transient all-ones for 10 gt (tested from 0x00 and from 0xFF with 0xA5 on the levers)."
traits: [entityless, pistonless, torch_based]
