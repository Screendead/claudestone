  - {drive: {in: 1}}
  - {wait: 10}
  - {drive: {in: 0}}
  - {wait: 10}
  - {check: 'if block ~3 ~1 ~4 redstone_wire[power=3]'}
  - {drive: {in: 1}}
  - {wait: 10}
  - {drive: {in: 0}}
  - {wait: 10}
  - {check: 'if block ~3 ~1 ~4 redstone_wire[power=6]'}
  - {drive: {in: 1}}
  - {wait: 10}
  - {drive: {in: 0}}
  - {wait: 10}
  - {check: 'if block ~3 ~1 ~4 redstone_wire[power=9]'}
  - {drive: {in: 1}}
  - {wait: 10}
  - {drive: {in: 0}}
  - {wait: 10}
  - {check: 'if block ~3 ~1 ~4 redstone_wire[power=12]'}
  - {drive: {in: 1}}
  - {wait: 10}
  - {drive: {in: 0}}
  - {wait: 10}
  - {check: 'if block ~3 ~1 ~4 redstone_wire[power=15]'}
  - {drive: {in: 1}}
  - {wait: 10}
  - {drive: {in: 0}}
  - {wait: 10}
  - {check: 'if block ~3 ~1 ~4 redstone_wire[power=15]'}
  - {drive: {reset: 1}}
  - {wait: 60}
  - {check: 'if block ~3 ~1 ~4 redstone_wire[power=0]'}
  - {drive: {reset: 0}}
  - {wait: 10}
  - {check: 'if block ~3 ~1 ~4 redstone_wire[power=0]'}
  - {drive: {in: 1}}
  - {wait: 10}
  - {drive: {in: 0}}
  - {wait: 10}
  - {check: 'if block ~3 ~1 ~4 redstone_wire[power=3]'}
- name: a long high input still counts once
