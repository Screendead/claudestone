  - {expect: {a0: 1, a1: 1, a2: 1, a3: 1, b0: 0, b1: 1, b2: 1, b3: 1, c0: 1, c1: 0, c2: 1, c3: 1, d0: 0, d1: 0, d2: 1, d3: 1}}
  - {drive: {clk_a: 1, clk_b: 1, clk_c: 1, clk_d: 1}}
  - {wait: 10}
  - {drive: {clk_a: 0, clk_b: 0, clk_c: 0, clk_d: 0}}
  - {wait: 10}
