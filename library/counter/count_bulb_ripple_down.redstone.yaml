name: count_bulb_ripple_down
description: 'Four copper-bulb T flip-flops in a 1-wide ripple chain, 2 blocks per bit. A waxed copper bulb toggles on the tick its power rises (CopperBulbBlock.checkAndFlip runs in neighborChanged, no scheduled tick), and each comparator reads its bulb (15 when lit) and points straight into the next bulb, so bit n+1 toggles whenever bit n turns on: the chain counts DOWN (0, 15, 14, ..., 1, 0). Interface (side view, west on the left, everything on z0): clk is the cell west of the first bulb (x0,y1); bulbs at x1, x3, x5, x7 (y1); outputs q0..q3 (q0 least significant) are the comparators at x2, x4, x6, x8 (y1, facing west), each powering the cell east of it; smooth stone at y0. 8x2x1. Delay 2 gt per bit: q_n settles 2(n+1) gt after the rising edge, 8 gt worst case (0 to 15); falling edges do nothing. Loads at 0 (all bulbs unlit). Bulbs are not redstone conductors, so copies tile at a 1-block pitch side by side and a 2-block pitch stacked (count_bulb_ripple_bus). Trade-off: the smallest binary
  counter here, but it counts down and ripples (intermediate values show for up to 8 gt) and the bulbs light up and click; use count_bulb_ripple_up to count up and count_bulb_sync for glitch-free outputs.'
traits:
- ultracompact
- fast
- one_wide
- flat
- horizontal
- tileable
- stackable
- tick_accurate
- entityless
- pistonless
- comparator_based
- reset_safe
- survival_friendly
palette:
  .: air
  '=': smooth_stone
  c: {input: clk}
  B: waxed_copper_bulb
  '0': {output: q0, block: 'comparator[facing=west]'}
  '1': {output: q1, block: 'comparator[facing=west]'}
  '2': {output: q2, block: 'comparator[facing=west]'}
  '3': {output: q3, block: 'comparator[facing=west]'}
layers:
  0: |
    .========
  1: |
    cB0B1B2B3
