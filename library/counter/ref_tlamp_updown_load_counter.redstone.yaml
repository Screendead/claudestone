name: ref_tlamp_updown_load_counter
description: 'Rebuild of tlamp''s compact up/down counter with load (endorsed by Mixel), Logical Redstone Archive COUNT004_UpDown_counter_with_load, https://discord.com/channels/1361854816837435433/1472880052722204738. README claims (SOURCED): counts up, down and loads any 8-bit number; inputs an 8-bit number, a load button, a count button and an up/down lever; output 8-bit number; count 4 ticks, load 6 ticks; the lamps light faster than they go out but the signal is synchronous; tested and functional. Size 13x18x8 as built (base 7x9 in the README): a control base at y1-3 and a two-layer cell per bit at y3,5,...,17 (bit 0 at the bottom); output lamp q_i at (4,y,2), data lamp ld_i at (8,y,4). Harness changes: yellow_wool -> white_wool (the harness only emulates a button or lever on plain full blocks, and the colour does nothing); each data lever sat on its lamp ld_i (the lamp only displays the data; the subtract comparator beside it reads the lever-powered lamp), which the harness cannot click, so a fixture repeater[facing=east] on a fixture wool block feeds the lamp strongly instead, fed by the input cell d_i beside it (same strong power; one extra redstone tick on the data path, settled long before any load); names: bk the birch button (load), bo the oak button (count), ud the lever (on = count down), q0..q7 output lamps. How it works (INFERRED from traces of every dust, torch, repeater and comparator, not from the author): each bit is a repeater (x5,z4) used as a latch. A repeater beside it (x5,z5), fed from an idle-high dust bus that zigzags up the stack through glass blocks (x4/5,z7), locks it, so the bit holds while the bus is high. The count button goes through a comparator whose side input is the same button delayed by a 2-tick repeater, which makes a 4 gt pulse; a torch inverts it and the bus falls for 4 gt. A torch in each cell (x3,z7) lights when its bit is 0 (up) and re-feeds the bus above it, so the fall reaches bit k only when bits 0..k-1 are all 1: the dust carry chain. A bit the fall reaches is unlocked while its input repeater (x6,z5) is still on in that tick and takes 1 where it held 0; the other bits'' comparators (x2,x3,z5) feed back so a set bit''s input is off, which turns it back off: a toggle. The up/down lever feeds a second zigzag (x1/2,z2) that swaps which state lights the torch, so the chain follows 1s going down. Load: the load button drops the right-hand zigzag (x7/8,z2) that normally holds each data comparator (x7,z4) at 0 and raises the left one (x0/1,z7) that switches off the booster torches, so each bit takes its data lamp. The lamps ld_i, q_i go on 4 gt before the previous value goes off, which is the ''asynchronous'' look the README mentions. MEASURED (26.3, satellite, button pressed at tick 0): count, a lamp turns on at +10 gt and the lamp it replaces goes off at +14 gt (wave on q0, q1 in count_timing); load, a lamp turns on at +12 gt (6 redstone ticks, which matches the README''s 6) and off at +16 gt (load_timing). The README''s 4 ticks for a count is the 8 gt from the pulse comparator (on at +2 gt) to the lamp, INFERRED; from the button it is 10 gt. MEASURED passes: 0 counts up to 63 one press at a time with every output checked each step; 63 counts down to 0; loads of 0xA5, 0x5A, 0x00, 0x80, 0x01, 0x7F, 0xC3, 0xFE, each overwriting the one before; load then count up and down; carries into bit 5 (0x9F -> 0xA0, 0xBE -> 0xBF); borrows (0x40 -> 0x3F, 0x20 -> 0x1F, 0x01 -> 0x00, 0xC3 -> 0xC0); switching direction mid-count; data changed without a load is ignored. MEASURED FAILURES, so this is not a working 8-bit counter in 26.3: (1) a carry into bit 6 is lost, 63 + 1 gives 0 (not 64) and 127 + 1 gives 0 (not 128); (2) 0xFF cannot be held, loading it settles to 0x7F, because bit 7 is locked only while some booster torch below it is lit and with bits 0..6 all 1 the bus has decayed to 0 at bit 7''s cell, so its latch is open and copies its input 0; counting down from 0 gives 0x3F (not 0xFF) and loading 0x80 while counting down gives 0x00 for the same reason, and 0x80 counting down to 0x7F is therefore not reachable; (3) wrap 255 -> 0 follows. Cause (MEASURED, the dust strengths in the trace): the bus loses 2 per stage and starts at 14, so with all lower bits at their blocking value stage 6''s input repeater (x6,z5) sees 0 and stage 7''s lock sees 0; the original schematic''s resting strengths match this build (they are the same dust, apart from the stored count 0x93 the schematic was saved in), so the limit is in the design, not the rebuild. The defect_ tests assert these results as measured and must be changed if a fix makes them fail.'
traits:
- vertical
- torch_based
- comparator_based
- pistonless
- entityless
