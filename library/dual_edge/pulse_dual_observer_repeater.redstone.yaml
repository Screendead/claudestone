name: pulse_dual_observer_repeater
description: 'Dual-edge detector with a longer pulse: an observer (x=1) facing west watches input a (x=0) and fires into a delay-2 repeater (x=2, facing west, on a single base block), which stretches the observer''s 2 tick pulse to 4 ticks. Both edges give a 4 tick pulse on the repeater (output east, x=3) 6 ticks after the edge. Set the repeater to delay 1 to 4 for a 2 to 8 tick pulse; the delay grows with it (2 + 2 x delay). Edges must be at least 8 ticks apart: closer edges merge into one pulse or the second is lost while the repeater is busy. 2x2x1, one wide, copies can sit side by side (parallel repeaters do not lock each other). Emits one pulse 6 ticks after placement. Trade-off versus pulse_dual_observer: a pulse long enough for slow receivers (a 2 tick pulse is ignored by redstone torches), at the cost of 4 ticks of delay and a longer minimum edge spacing.'
traits: [compact, flat, horizontal, one_wide, tileable, observer_based, silent, lightless, pistonless, entityless, tick_accurate, survival_friendly]
palette:
  .: air
  '=': smooth_stone
  a: {input: a}
  O: 'observer[facing=west]'
  o: {output: out, block: 'repeater[facing=west,delay=2]'}
layers:
  0: |
    ..=
  1: |
    aOo
