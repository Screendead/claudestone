name: pulse_dual_observer
description: 'One observer (x=1) facing west, watching the input cell a (x=0); both on one layer, no base: 1x1x1 plus the input. Every change of a, rising or falling, gives a 2 game tick pulse on the observer''s east face 2 ticks later (it strong-powers the block at x=2, so dust or a repeater there picks it up). Edges must be at least 4 ticks apart: an input of 1 to 3 ticks gives a single pulse, because an observer that is already scheduled ignores a second change. Turn it to face up or down for a vertical version. Emits one pulse 2 ticks after it is placed. Trade-off: the smallest and fastest edge detector there is, but the pulse length is fixed at 2 ticks and it cannot tell the edges apart; for a longer pulse see pulse_dual_observer_repeater, for one edge only see the rising_edge and falling_edge folders.'
traits: [ultracompact, ultrafast, flat, horizontal, one_wide, tileable, observer_based, silent, lightless, pistonless, entityless, tick_accurate, survival_friendly]
palette:
  .: air
  a: {input: a}
  o: {output: out, block: 'observer[facing=west]'}
layers:
  0: |
    ao
