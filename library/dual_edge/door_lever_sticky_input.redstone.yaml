name: door_lever_sticky_input
description: 'Door part 1 (input) for the design B / design_c 3x3 seamless door: a lever on top of K_in and I_A made sticky,
  so the lever works on both edges (Door_Rules.md:480). Cells are the door''s, at spec = design + (4,3,8). Added: only the
  lever, design (1,9,-2), face=floor on K_in (1,8,-2); I_A (1,7,-2) changes from a normal to a sticky piston. Moved block
  RB_A passes through / lands in (1,6,-2) and (1,5,-2). Rising edge: I_A extends in t0 g, RB_A (1,6,-2)->(1,5,-2), lands t2
  j, NA dies in t0 g. Falling edge: I_A retracts in c0 g and pulls RB_A home, landing c2 j; NA is live from c2 j and P7 re-extends
  c3 g. t0/c0 = the second tick after a drive of R_in, the first after a lever use. Pistons within Chebyshev 2 of the lever
  in the door (closed and open states): I_A (1,7,-2) and X2 (1,7,-3); the lever''s cell has only air neighbours besides K_in,
  so it powers and updates no piston directly; K_in''s neighbour update reaches only I_A and R_in, and K_in QC-powers X2 exactly
  as R_in input already does. Rebuilt door context: R_in and its glass (fixtures), K_in, RB_A, NA''s dust from (0,6,-2) to
  P7''s feed (2,4,-1) with the wall quartz under it; P7, its head and TR are a fixture stand-in. The third test is the control:
  I_A normal, RB_A never returns (I_A is read by check there: the named cell reads only the loaded block id).'
traits:
- piston_based
- tick_accurate
- vertical
