name: button_lamp
description: A stone button pulse through a torch inverter; the button releases after 20 ticks.
palette:
  .: air
  b: {name: button, block: 'stone_button[face=wall,facing=west,powered=false]'}
  A: stone
  ): redstone_wall_torch[facing=east]
  l: {name: lamp, block: redstone_lamp}
layers:
  1: |
    bA)l
tests:
- name: button pulse
  steps:
  - {use: button}
  - {wait: 6}
  - expect: {lamp: 0}
  - {wait: 13}
  - expect: {button: 1}
  - {wait: 11}
  - expect: {button: 0, lamp: 1}
