tests:
# Cells: reserve hopper ~5 ~3 ~3, farm feed hopper ~5 ~4 ~3, compactor ~6 ~3 ~3,
# bank chest ~5 ~3 ~4 (+ ~6 ~3 ~4), withdraw hopper ~5 ~2 ~4, decompactor ~5 ~2 ~3.
# A hopper cell reads 1 while locked. Hopper reserve: 23+ ingots read 2, 92+ read 5.
- name: surplus is banked down to the upper level
  steps:
  - expect: {reserve: 1}
  - run: 'data merge block ~5 ~3 ~3 {Items:[{Slot:0b,id:"minecraft:iron_ingot",count:64},{Slot:1b,id:"minecraft:iron_ingot",count:64},{Slot:2b,id:"minecraft:iron_ingot",count:22}]}'
  - wait: 20
  - expect: {reserve: 0, withdraw: 1}
  - wait: 600
  - expect: {reserve: 1, withdraw: 1}
  - level: {level: 4}
  - check: if data block ~5 ~3 ~3 Items[{Slot:0b,id:"minecraft:iron_ingot",count:5}]
  - check: if data block ~5 ~3 ~3 Items[{Slot:1b,count:64}]
  - check: if data block ~5 ~3 ~3 Items[{Slot:2b,count:22}]
  - check: if data block ~5 ~3 ~4 Items[{Slot:0b,id:"minecraft:iron_block",count:6}]
  - check: unless data block ~5 ~3 ~4 Items[1]
  - check: unless data block ~6 ~3 ~4 Items[0]
  - check: if data block ~6 ~3 ~3 Items[4]
  - check: unless data block ~6 ~3 ~3 Items[5]
  - log: data get block ~5 ~3 ~3 Items
  - log: data get block ~5 ~3 ~4 Items
- name: a low reserve draws blocks back out of the bank
  steps:
  - run: 'data merge block ~5 ~3 ~3 {Items:[{Slot:0b,id:"minecraft:iron_ingot",count:10}]}'
  - run: 'data merge block ~5 ~3 ~4 {Items:[{Slot:0b,id:"minecraft:iron_block",count:5}]}'
  - wait: 150
  - expect: {reserve: 1, withdraw: 1}
  - level: {level: 2}
  - check: if data block ~5 ~3 ~3 Items[{Slot:0b,id:"minecraft:iron_ingot",count:28}]
  - check: unless data block ~5 ~3 ~3 Items[1]
  - check: if data block ~5 ~3 ~4 Items[{Slot:0b,id:"minecraft:iron_block",count:2}]
  - check: if data block ~5 ~2 ~4 Items[{id:"minecraft:iron_block",count:1}]
  - check: unless data block ~5 ~2 ~3 Items[0]
  - log: data get block ~5 ~3 ~3 Items
  - log: data get block ~5 ~2 ~4 Items
- name: inside the band nothing moves
  steps:
  - run: 'data merge block ~5 ~3 ~3 {Items:[{Slot:0b,id:"minecraft:iron_ingot",count:50}]}'
  - wait: 6
  - run: 'data merge block ~5 ~3 ~4 {Items:[{Slot:0b,id:"minecraft:iron_block",count:3}]}'
  - wait: 300
  - expect: {reserve: 1, withdraw: 1}
  - check: if data block ~5 ~3 ~3 Items[{Slot:0b,id:"minecraft:iron_ingot",count:50}]
  - check: if data block ~5 ~3 ~4 Items[{Slot:0b,id:"minecraft:iron_block",count:3}]
  - check: unless data block ~5 ~2 ~4 Items[0]
  - check: unless data block ~6 ~3 ~3 Items[0]
- name: bank, withdraw, then a farm stream through the feed hopper
  steps:
  - run: 'data merge block ~5 ~3 ~3 {Items:[{Slot:0b,id:"minecraft:iron_ingot",count:64},{Slot:1b,id:"minecraft:iron_ingot",count:64},{Slot:2b,id:"minecraft:iron_ingot",count:22}]}'
  - wait: 620
  - check: if data block ~5 ~3 ~4 Items[{Slot:0b,id:"minecraft:iron_block",count:6}]
  # a player takes all but 5 ingots
  - run: 'data merge block ~5 ~3 ~3 {Items:[{Slot:0b,id:"minecraft:iron_ingot",count:5}]}'
  - wait: 150
  - expect: {reserve: 1, withdraw: 1}
  - level: {level: 2}
  - check: if data block ~5 ~3 ~3 Items[{Slot:0b,id:"minecraft:iron_ingot",count:23}]
  - check: if data block ~5 ~3 ~4 Items[{Slot:0b,id:"minecraft:iron_block",count:3}]
  - check: if data block ~5 ~2 ~4 Items[{id:"minecraft:iron_block",count:1}]
  # the farm delivers 84 ingots through the feed hopper
  - run: 'data merge block ~5 ~4 ~3 {Items:[{Slot:0b,id:"minecraft:iron_ingot",count:64},{Slot:1b,id:"minecraft:iron_ingot",count:20}]}'
  - wait: 800
  - expect: {reserve: 1, withdraw: 1}
  - level: {level: 4}
  - check: unless data block ~5 ~4 ~3 Items[0]
  - check: if data block ~5 ~3 ~3 Items[{Slot:0b,id:"minecraft:iron_ingot",count:55}]
  - check: if data block ~5 ~3 ~3 Items[{Slot:1b,id:"minecraft:iron_ingot",count:36}]
  - check: unless data block ~5 ~3 ~3 Items[2]
  - check: if data block ~6 ~3 ~3 Items[2]
  - check: unless data block ~6 ~3 ~3 Items[3]
  - check: if data block ~5 ~3 ~4 Items[{Slot:0b,id:"minecraft:iron_block",count:5}]
  - check: if data block ~5 ~2 ~4 Items[{id:"minecraft:iron_block",count:1}]
  - log: data get block ~5 ~3 ~3 Items
  - log: data get block ~5 ~3 ~4 Items
