name: ingot_reserve_bank
description: A self-compacting ingot store (a vanilla compacting drawer). Farm ingots drop into the reserve hopper you open; above 91 the surplus is crafted into blocks in the chest, and when you take the reserve below 23 a block is crafted back into 9 ingots, so loose ingots are always there and the bulk takes 9x less room. Iron shown; any 9-to-1 item works. No buttons.
traits: [survival_friendly, container_based, comparator_based, lockable, pistonless, entityless, lightless]
palette:
  .: air
  '=': smooth_stone
  '#': stone
  R: {name: reserve, block: 'hopper[facing=east]'}
  F: {name: feed, block: 'hopper[facing=down]'}
  '1': {name: compactor, block: 'crafter[orientation=south_up]'}
  '2': {name: decompactor, block: 'crafter[orientation=up_north]'}
  L: 'chest[facing=south,type=left]'
  r: 'chest[facing=south,type=right]'
  W: {name: withdraw, block: 'hopper[facing=north]'}
  K: {name: level, block: 'comparator[facing=east]'}
  I: {name: upper_lock, block: 'comparator[facing=south,mode=subtract]'}
  U: 'water_cauldron[level=3]'
  '<': {name: low, block: 'repeater[facing=east]'}
  C: {name: full, block: 'comparator[facing=west,mode=subtract]'}
  k: 'comparator[facing=south]'
  P: 'composter[level=8]'
  '{': 'repeater[facing=west]'
  '^': {name: fire, block: 'repeater[facing=north]'}
  D: {name: busy, block: 'comparator[facing=south]'}
  v: 'repeater[facing=south]'
  '}': {name: lock_w, block: 'repeater[facing=west]'}
  a: redstone_wire[north=none,south=up,west=none,east=side]
  b: redstone_wire[north=side,south=none,west=none,east=side]
  c: redstone_wire[north=none,south=none,west=up,east=side]
  d: redstone_wire[north=none,south=none,west=side,east=side]
  e: redstone_wire[north=none,south=side,west=none,east=side]
  f: redstone_wire[north=side,south=none,west=side,east=side]
  g: redstone_wire[north=side,south=side,west=none,east=none]
  h: redstone_wire[north=side,south=side,west=side,east=side]
  j: redstone_wire[north=none,south=none,west=side,east=up]
  m: redstone_wire[north=none,south=side,west=side,east=none]
  n: redstone_wire[north=side,south=none,west=side,east=none]
