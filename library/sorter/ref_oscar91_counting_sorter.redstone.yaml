name: ref_oscar91_counting_sorter
description: "Rebuild of SORT001 Counting Sorter by oscar91 (endorsed by mattbatwings; Tested & Functional, Recommended; mattbatwings' Logical Redstone Archive; https://discord.com/channels/1361854816837435433/1472398338405171393). Sorts 8 hex numbers (signal strengths 0-15) into descending order, shown as eight 15-lamp unary bars; README speed \"10 ticks\". Size 50x30x24 (7,970 blocks: 2,940 dust, 360 repeaters, 331 comparators, 180 barrels, 124 targets, 120 lamps), pure analog redstone, no torches, pistons or entities. Harness changes: the .schem has no inputs, so each of the 8 input comparators at x=48 (y=8, z=2,4,..,16, facing east, compare mode) reads a fixture barrel at x=49 (in0..in7) whose fill level is the number, set with insert (full stacks of redstone, m = ceil((s-1)*27/14) for s>=2); the barrels' item contents (12 constant barrels per level: 5 holding 246 redstone = signal 2, 4 holding 493 = signal 4, 3 holding 1728 = signal 15, 15 levels y=1,3,..,29) were taken from the .schem block entities (SOURCED); block states are the .schem's with power/lit stripped; I added only the named read cells o0..o7 (the first dust cell of each output line at x=14, y=22/23) and the lamps lamp<j>_r (x=14, lit when output j >= 1) and lamp<j>_l (x=0, lit only at 15). Output j is the j-th largest input: o0..o7 = (14,23,9) (14,22,11) (14,23,13) (14,22,15) (14,23,17) (14,22,19) (14,23,21) (14,22,23); a comparator pushes strength s into that dust and the dust's decay lights s of the 15 lamps. MEASURED: all 53 input vectors (zeros, all fifteens, ramps both ways, duplicates, a single 1 or 15 in each end position, every rotation of 0..15, 20 seeded random) come out sorted descending with exact dust strengths and the right lamps; every transition between those vectors settles within 24 gt; a rise (zeros to a vector) shows its lamps at exactly 20 gt (10 redstone ticks, the README's figure) and a fall (vector to zeros) at exactly 24 gt, for the mixed vector and for all fifteens. INFERRED (not tested apart): the 15 stacked levels (y odd) each correspond to a threshold k=1..15 - the dust line each input runs through gets one block longer per level, so decay passes it only when the number reaches the threshold - and the barrel constants with subtract comparators turn the 8 pass/fail bits into the count c_k of inputs >= k; the sorted j-th largest is then the number of levels with c_k > j, which is what the unary lamp bars show, and it is the counting sort of the title. Inputs are held by fixtures and not part of the size; the build is placed with the standard update pass."
traits: [pistonless, entityless, silent, comparator_based, container_based, analog, vertical, survival_friendly]
