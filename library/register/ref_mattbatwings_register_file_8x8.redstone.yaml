name: ref_mattbatwings_register_file_8x8
description: "Rebuild of mattbatwings' 8x 8-bit Register File, Logical Redstone Archive REGISTERFILE002 (tags Tested & Functional; Discord https://discord.com/channels/1361854816837435433/1472419743372935254). README SOURCED: 8 registers addressable in binary, write to or read from any, registers stack every 2 blocks; input an 8b number, a 3b register address, a Write and a Read button; output 8b number; no speed or size given. Size 20x29x10: 64 bits as 8 two-layer bit slices (layers 11-12 bit 0 ... 25-26 bit 7), four registers per layer, odd and even layers offset 2 blocks in x, so one bit of one register costs 2 blocks of height; the address levers a0..a2 (layers 2,4,6) and the two buttons (layer 8 Read = btn8, layer 10 Write = btn10, from the schem's signs) sit in the decoder block at the bottom, data levers d0..d7 on the even layers 12..26 (d0 lowest), output lamps q0..q7 on the odd layers 13..27 (q0 lowest) at the south edge. Harness changes: the 2 signs removed; the lamps behind the 11 levers and 2 buttons became white_wool (use only emulates levers and buttons on plain blocks; lamps only showed the input); the barrels' items taken from the .schem block entities (the parsed blocks had none): 143 barrels hold 1 redstone (comparator strength 1) or 64+60 redstone (strength 2), constants the comparators subtract from; input levers named a0..a2, d0..d7, buttons btn8 and btn10, output lamps q0..q7. How it works (INFERRED from the blocks, partly from traces): per register bit a short repeater chain along z on the data dust row of its layer is locked from the side by a subtract comparator that reads a 1-item barrel (strength 1) minus the register's select dust; a register's select dust goes high for 19 gt (traced on one register: up 6 gt after the write click, down 25 gt after it), which unlocks that register's repeaters to follow the data row and relocks them, so the word present at about click+25 is stored. Read: a strength-2 barrel feeds a subtract comparator per bit whose side input is the stored bit, so the output line carries the register's word only while its read select is on; the 8 read lines per bit merge on the bit's output row into the lamp q_i. The read path was not traced cell by cell. MEASURED on 26.3 (satellite): all 8 registers power on holding 0; words 0xA5,0x5A,0xFF,0x00,0x01,0x80,0x7F,0xC3 in registers 0..7 read back exactly in shuffled order with the data levers inverted meanwhile (levers are ignored unless Write); a walking one (register a holds 1<<a) reads back; rewriting one register leaves its neighbours alone; the lamps are dark between reads. Read: lamps rise 10 gt after the click and fall 33 gt after it (23 gt lit; the button lasts 20 gt). A read clicked 0, 3, 8 or 12 gt after a write click returns the NEW word, with the lamps rising at max(10 after the read click, 18 after the write click). Write timing: the address levers must stay put for 3 gt after the write click (changed at +2 the word lands in the new address; +3 it lands in the old one); the data levers must stay put until 24 gt after it (changed at +24 the new data is stored, at +26 the old). Not claimed: the README gives no speed or size; a write cycle shorter than 34 gt, reading while writing the same register in another order, and the 25 gt edge were not tested."
traits: [vertical, lockable, comparator_based, torch_based, container_based, pistonless, entityless]
