name: ref_zebronic_register_file_7x32_dual_read
description: 'Zebronic G''s 7-register file with two read ports (LRA REGISTERFILE004 ''7 32-bit Dual read Register file'', Tested & Functional, endorsed by Mixel; https://discord.com/channels/1361854816837435433/1517787012873195570; README SOURCED: 32-bit register file, two independent outputs A and B, size 30x25x19). 31x26x20 blocks (the README gives max coordinates). "32 bit" is eight analog nibbles: each register holds eight signal strengths 0-15 in comparator loops, one layer pair per nibble (layers 9/10 nibble 1 ... 23/24 nibble 8), seven registers side by side 4 blocks apart (x=3,7,..,27). Interface (names are ours): in1..in8 are the eight data inputs, each a strength 0-15 into a dust at (29,10+2(k-1),3) that runs west past every register through comparator diodes (2 game ticks a hop); wa0..wa2 are the write-address levers (layers 2,4,6, z=0), ra0..ra2 the A-address levers (layers 3,5,7, z=13), rb0..rb2 the B-address levers (layers 2,4,6, z=19), bit 0 first; write is the button at (29,6,6). Outputs: a1..a8 are the comparators at (29,9+2(k-1),15) (their output strength is the nibble) and b1..b8 the dust at (29,10+2(k-1),13). Address 1..7 selects a register, address 0 none (MEASURED from the write-select dust: address a lights the decode of the column x=3+4(7-a)); a write with address 0 changes nothing, a read with address 0 outputs 0. Write: the button drops a normally-high line along z=6 for about 16 ticks and the selected register takes the data; the data must still be on the input 18 ticks after the click (MEASURED on register 4: held 17 ticks, nothing stored; 18, stored) and a lead of 14 ticks was enough (register 7, the farthest; not probed lower). Read: a register''s value appears on its port a fixed time after the address change, register 1 fastest. MEASURED from the lever click (game ticks): B rises 14,16,18,20,24,26,28 for registers 1..7, A is 2 later, and both fall in the same times; a write shows on B 35, 41, 49 ticks after the click for registers 1, 4, 7 (A +4) and clears 16, 22, 30 (A +4). Harness changes: the supports of the 9 levers and the button are white_wool (the harness only clicks a lever on a plain block; was red_wool, same function); the 34 wall signs (address and port labels) are removed; the data inputs are test fixtures, a hopper at (31,y,3) read by a comparator at (30,y,3) on a white_wool block where the sign was, so a test sets a strength by filling the hopper (insert stone, 320 stone = 15); comparator OutputSignal NBT is not carried (the source snapshot held 95 nonzero values: constant 15s in the odd layers and some stored data), so every register starts at 0. Tests: all seven registers written with distinct strengths in all eight nibbles and read back in 14 port pairings (A and B on different registers at once), every strength 0 to 15 stored and overwritten, isolation (other registers, a write to address 0, input changes without a click), the read, write and hold timings above. Everything MEASURED on 26.3; the nibble structure and the decode-by-torch reasoning are INFERRED from the layout and the traces.'
traits: [analog, comparator_based, torch_based, vertical, pistonless, entityless]
