name: ref_mattbatwings_register8_lock
description: "Rebuild of mattbatwings' 8-bit register (Logical Redstone Archive REGISTER001_8-bit_Register, tags Tested & Functional and Recommended; Discord https://discord.com/channels/1361854816837435433/1472420025724829727; the README gives no speed or size and says only 'an 8-bit register with read and write', input an 8b number plus Write and Read buttons, output 8b number). Size 6x18x7, bits stacked vertically at a pitch of 2 on one tower, two button panels at the bottom. How it works (INFERRED from the blocks, MEASURED by the tests): per bit a repeater Q (delay 1, facing west, x=2) reads the input lever through a conductor block and is the memory cell; it is locked by a delay-1 repeater O pointing into its side from the north, which reads the WRITE line, a dust column (x=2) that zigzags up the tower over wool and glass (a 'V' dust climbs the north wall of the floor's wool, the next dust climbs the glass), so one line locks all 8 repeaters; the line idles high (locked). Q's output goes along a dust to a subtract comparator U (facing west, x=4) whose side input is the same kind of repeater O fed by the READ line (x=4 column); the line idles high, so U's side input cancels Q and the output lamp (x=5) stays dark. Each button feeds a pulse maker at the bottom: a subtract comparator C reads the button's dust and a 2-tick repeater E feeds the same signal back into C's side 4 game ticks later, so C emits a short pulse that powers the wool under a torch; the torch inverts it, so the whole line drops for the pulse. WRITE pulse: the 8 Q repeaters unlock, take the lever values and relock. READ pulse: U's side drops, so the lamp shows Q for a short window; the lamps do not hold the word. Harness changes: light_blue_wool and the lever's lamp became white_wool (use only emulates levers and buttons on plain blocks, so the lever's lamp is white_wool: same strong conduction, loses the input display), signs removed, output lamps named q0 (bottom floor y=3) .. q7 (y=17), levers d0..d7, buttons write and read. MEASURED on 26.3: a read click lights the lamps of the 1 bits 8 game ticks later for 8 ticks (wave); a read 2 ticks after a write click returns the new word, 0 or 1 ticks after returns a wrong word (the lamps are lit for one tick only on a bit, race with the unlocking Q); words 0xA5, 0x5A, 0xFF, 0x00, 0x01, 0x80, 0x7F, 0xFE read back exactly, lever changes while not written are ignored, and the lamps stay dark during a write and with no read. Not claimed: the README's speed or size (none given), reading while writing."
traits: [vertical, lockable, comparator_based, torch_based, pistonless, entityless, survival_friendly]
