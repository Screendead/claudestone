name: ref_wueffi_io_ports_7x8
description: 'Waffle [Wueffi]''s WafPortsV2, seven single-bus 8-bit I/O ports (Logical Redstone Archive IOPORT001_WafPortsV2, tag Tested & Functional, https://discord.com/channels/1361854816837435433/1472533176319479910). README (SOURCED): 4 blocks wide per port, 3915 blocks volume, 7 binary 8-bit inputs and 7 8-bit outputs on one bus, 3rt read and 6rt write, control and feedback lines top to bottom Data Out, Toggle Write (off = read, on = write), Address bit 2, 1, 0. Here the 26.3 build is 31x29x9 (x west-east, y layers, z north-south), 3248 blocks. ONLY PART OF THE README HOLDS IN 26.3, see FAILS. Harness changes: (1) the 27 signs and 7 player heads are decoration and left out; the 127 barrels that hold the comparator constants (119 hold one item, strength 1, 8 hold 27 full stacks, strength 15) hold sticks instead of player heads (same stack size, same strength). (2) The schem has no inputs: the address bits a0,a1,a2 and wrt are redstone-block drivers at (29,3/5/7/9,7) in front of the east-facing repeaters at x=28 (INFERRED from the repeaters and the signs, MEASURED: they decode and strobe); the bus lanes busd0..busd7 are drivers at (29,14+2b,7) feeding the east end of lane b, and the lane is read as the dust bus0..bus7 at (28,14+2b,7) (INFERRED, MEASURED); the output lamps are out<port>_<bit> at x=15+2i (i=0 is port 7), y=13+2b or 14+2b, z=3. (3) The data inputs are the 56 front levers, which hang on lamps so `use` cannot click them: tests flip them (and the front buttons) with `run: setblock` plus a `clone` of the lamp or concrete behind, which is what a click does. Layout (INFERRED from the schem, checked by traces): port $7..$1 inputs stand at x=1,3,..,13 and outputs at x=15,17,..,27, bit b in the layer pair y=13+2b and 14+2b (odd x-spacing alternates the two layers); an input is a lever on a lamp, a repeater, a subtract comparator that subtracts a mask dust T and a compare comparator whose side reads a barrel of strength 1; T is a dust staircase that loses one level per layer and is switched off by the port''s request torches; an output is a repeater chain locked by a subtract comparator that reads a strength-1 barrel minus a write-enable dust C, so the lamp holds when C is 0; the address is decoded by dust staircases on the three address lines that go dark only for the matching port. MEASURED on satellites: WRITE works for all seven ports: with a=n and wrt on, the bus lanes latch into port n''s lamps and no other port changes (seven distinct bytes, then 0xFF everywhere, then 0x00 into one port), nothing is written with wrt off or with address 0 and wrt on; the lamp lights exactly 18 gt after wrt rises (C rises 10 gt after wrt, the chain adds 8) and the lock is back only 12 gt after wrt falls, so the bus must stay valid at least 12 gt after wrt falls: dropping it 10 gt after wrt falls erases the write. READ by address alone works only for port 1: with a=1 and wrt off the lanes show port 1''s lever byte, 14 gt after the address changes (to the east end of the lane), and wrt on blanks it. Ports 2 to 7 do NOT read by address and wrt off: with a=n nothing reaches the bus until the port''s front button (the one above the ''WRITE PORT $n'' sign: (3,11,2) (7,11,2) (11,11,2) for ports 6, 4, 2 and (1,12,2) (5,12,2) (9,12,2) for ports 7, 5, 3) is also pressed, and then the byte appears. A structural search found no other source for the second request torch of those ports: it sits on a block that only the front button powers, so this is the published file, not a placement artefact; the README names no button. FAILS: (a) the ''binary'' bus is not clean: the mask T falls from 15 at layer 14 to 2 at layer 28, so an unselected port''s lever for bit b still gives subtract output 15 minus T, the regenerating repeater at x=14 lifts it to a full signal, and port n puts its bits n to 6 on the shared lanes whether or not it is addressed (port 3 all on and address 1 gives lanes 3 to 6 high; port 1 leaks lanes 1 to 6, port 7 none, lane 7 never) and in these runs the data out line rose only with a button or the port-7 test lever, never with an address alone. (b) 3rt/6rt is not met: read 14 gt (7rt) and write 18 gt (9rt) as measured at the east lane and the lamp. Not tested: the Data Out feedback line, the RESET buttons of the output ports, repeated back-to-back transfers.'
traits:
- comparator_based
- container_based
- pistonless
- entityless
- vertical
