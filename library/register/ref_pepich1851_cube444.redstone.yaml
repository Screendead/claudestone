name: ref_pepich1851_cube444
description: 'Rebuilt reference: Pepich1851''s "4^3 tileable memory cell" (YouTube, 2018-05-21; source and timestamps in tools/t8_ref64/SOURCE.md), the community 64-blocks-per-bit RAM cell, read block by block from the video into tools/t8_ref64/CELL.md and tiled here by tools/t8_ref64/cell_to_spec.py into a 2x2x2 array (8 cells). In each cell s is the storage repeater, locked from its side by l, and c a subtract comparator that reads s from behind and the read-enable line from its side. Words run along z (bits j), words sideways along x (i), layers up y (k): word ik is hold ik (write enable, dark blue wool) and nrd ik (read enable, cyan); bit jk is din jk (red, along x) and dout jk (orange, along x, read at its west end). Both enables are inverted: hold 1 keeps and 0 writes; nrd 1 keeps the word off dout (15 - 14 = 1, which dies before the line) and 0 reads it. Each enable line enters at its south end through a fixture repeater standing where the next cell''s repeater would be. Not built:
  the repeaters a long data line needs, which the video leaves to the user.'
traits:
- pistonless
- entityless
- silent
- lightless
