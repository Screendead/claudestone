name: ref_pepich1851_cube444
description: 'Rebuilt reference: Pepich1851''s "4^3 tileable memory cell" (YouTube, 2018-05-21; source and timestamps in tools/t8_ref64/SOURCE.md), the community 64-blocks-per-bit RAM cell, read block by block from the video into tools/t8_ref64/CELL.md and tiled here by tools/t8_ref64/cell_to_spec.py into a 2x2x2 array (8 cells). In each cell s is the storage repeater, locked from its side by l, and c a subtract comparator that reads s from behind and the read-enable line from its side. Words run along z (bits j), words sideways along x (i), layers up y (k): word ik is hold ik (write enable, dark blue wool) and nrd ik (read enable, cyan); bit jk is din jk (red, along x) and dout jk (orange, along x, read at its west end). Both enables are inverted: hold 1 keeps and 0 writes; nrd 1 keeps the word off dout (15 - 15 = 0) and 0 reads it. Each enable line enters at its south end through a fixture repeater standing where the next cell''s repeater would be. Not built: the repeaters a long data
  line needs, which the video leaves to the user.'
traits:
- pistonless
- entityless
- silent
- lightless
palette:
  .: air
  A: blue_wool
  B: orange_wool
  C: cyan_wool
  D: yellow_wool
  E: {block: stone, fixture: true}
  F: repeater[facing=south,delay=1]
  G: redstone_wire[north=side,east=none,south=up,west=none]
  c: {name: c000, block: 'comparator[facing=south,mode=subtract]'}
  H: redstone_wire[north=side,east=none,south=side,west=side]
  I: {name: c100, block: 'comparator[facing=south,mode=subtract]'}
  J: redstone_wire[north=side,east=side,south=none,west=none]
  l: {name: l000, block: 'repeater[facing=west,delay=1]'}
  s: {name: s000, block: 'repeater[facing=south,delay=1]'}
  K: {name: l100, block: 'repeater[facing=west,delay=1]'}
  M: {name: s100, block: 'repeater[facing=south,delay=1]'}
  N: red_wool
  O: {name: c010, block: 'comparator[facing=south,mode=subtract]'}
  P: {name: c110, block: 'comparator[facing=south,mode=subtract]'}
  Q: {name: l010, block: 'repeater[facing=west,delay=1]'}
