  .: air
  A: blue_wool
  B: orange_wool
  C: cyan_wool
  D: yellow_wool
  E: {block: stone, fixture: true}
  F: repeater[facing=south,delay=1]
  G: redstone_wire[north=side,east=none,south=up,west=none]
  H: redstone_wire[north=side,east=none,south=side,west=none]
  c: {name: c000, block: 'comparator[facing=south,mode=subtract]'}
