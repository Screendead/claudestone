  j: redstone_wire[north=none,east=side,south=none,west=side]
  k: {input: din00}
  m: {output: dout10, block: 'redstone_wire[north=none,east=side,south=none,west=side]'}
  p: {input: din10}
  q: {name: c001, block: 'comparator[facing=south,mode=subtract]'}
  r: {name: c101, block: 'comparator[facing=south,mode=subtract]'}
  t: {name: l001, block: 'repeater[facing=west,delay=1]'}
  w: {name: s001, block: 'repeater[facing=south,delay=1]'}
  x: {name: l101, block: 'repeater[facing=west,delay=1]'}
  y: {name: s101, block: 'repeater[facing=south,delay=1]'}
