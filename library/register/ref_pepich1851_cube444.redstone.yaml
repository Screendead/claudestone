  U: {name: l110, block: 'repeater[facing=west,delay=1]'}
  V: {name: s110, block: 'repeater[facing=south,delay=1]'}
  W: {block: 'repeater[facing=south,delay=1]', fixture: true}
  h: {input: hold00}
  X: {input: nrd00}
  Y: {input: hold10}
  Z: {input: nrd10}
  b: redstone_wire[north=side,east=up,south=none,west=up]
  d: redstone_wire[north=none,east=up,south=none,west=up]
  e: {output: dout00, block: 'redstone_wire[north=none,east=side,south=none,west=side]'}
  f: redstone_wire[north=none,east=side,south=none,west=side]
  g: {input: din00}
  i: {output: dout10, block: 'redstone_wire[north=none,east=side,south=none,west=side]'}
  j: {input: din10}
  k: {name: c001, block: 'comparator[facing=south,mode=subtract]'}
  m: {name: c101, block: 'comparator[facing=south,mode=subtract]'}
  p: {name: l001, block: 'repeater[facing=west,delay=1]'}
  q: {name: s001, block: 'repeater[facing=south,delay=1]'}
  r: {name: l101, block: 'repeater[facing=west,delay=1]'}
  t: {name: s101, block: 'repeater[facing=south,delay=1]'}
  w: {name: c011, block: 'comparator[facing=south,mode=subtract]'}
  x: {name: c111, block: 'comparator[facing=south,mode=subtract]'}
  y: {name: l011, block: 'repeater[facing=west,delay=1]'}
  z: {name: s011, block: 'repeater[facing=south,delay=1]'}
