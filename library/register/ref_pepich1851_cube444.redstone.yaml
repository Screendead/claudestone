tests:
- name: write, hold and read one bit
  initial:
    hold00: 1
    hold01: 1
    hold10: 1
    hold11: 1
    nrd00: 1
    nrd01: 1
    nrd10: 1
    nrd11: 1
  settle: 30
  steps:
  - drive: {din00: 1}
  - {wait: 2}
  - drive: {hold00: 0}
  - {wait: 10}
  - drive: {hold00: 1}
  - {wait: 10}
  - drive: {din00: 0}
  - {wait: 10}
  - expect: {s000: 1, s010: 0, dout00: 0}
  - drive: {nrd00: 0}
  - {wait: 10}
  - expect: {dout00: 1, dout10: 0}
  - drive: {nrd00: 1}
  - {wait: 10}
  - expect: {dout00: 0}
  - drive: {hold00: 0}
  - {wait: 10}
  - drive: {hold00: 1}
  - {wait: 10}
  - expect: {s000: 0}
  - drive: {nrd00: 0}
  - {wait: 10}
  - expect: {dout00: 0}
- name: checkerboard in all three directions, neighbours undisturbed
  initial:
    hold00: 1
    hold01: 1
    hold10: 1
    hold11: 1
    nrd00: 1
    nrd01: 1
    nrd10: 1
    nrd11: 1
  settle: 30
  steps:
  - drive: {din00: 0, din10: 1}
  - {wait: 2}
  - drive: {hold00: 0}
  - {wait: 10}
  - drive: {hold00: 1}
  - {wait: 10}
  - drive: {din00: 1, din10: 0}
  - {wait: 2}
  - drive: {hold10: 0}
  - {wait: 10}
  - drive: {hold10: 1}
  - {wait: 10}
  - drive: {din01: 1, din11: 0}
  - {wait: 2}
  - drive: {hold01: 0}
  - {wait: 10}
  - drive: {hold01: 1}
  - {wait: 10}
  - drive: {din01: 0, din11: 1}
  - {wait: 2}
  - drive: {hold11: 0}
  - {wait: 10}
  - drive: {hold11: 1}
  - {wait: 10}
  - drive:
      din00: 0
      din01: 0
      din10: 0
      din11: 0
  - {wait: 10}
  - expect:
      s000: 0
      s001: 1
      s010: 1
      s011: 0
      s100: 1
      s101: 0
      s110: 0
      s111: 1
      dout00: 0
      dout01: 0
      dout10: 0
      dout11: 0
  - drive: {nrd00: 0}
  - {wait: 10}
  - expect:
      dout00: 0
      dout01: 0
      dout10: 1
      dout11: 0
  - drive: {nrd00: 1}
  - {wait: 10}
  - drive: {nrd10: 0}
  - {wait: 10}
  - expect:
      dout00: 1
      dout01: 0
      dout10: 0
      dout11: 0
  - drive: {nrd10: 1}
  - {wait: 10}
  - drive: {nrd01: 0}
  - {wait: 10}
  - expect:
      dout00: 0
      dout01: 1
      dout10: 0
      dout11: 0
  - drive: {nrd01: 1}
  - {wait: 10}
  - drive: {nrd11: 0}
  - {wait: 10}
  - expect:
      dout00: 0
      dout01: 0
      dout10: 0
      dout11: 1
  - drive: {nrd11: 1}
  - {wait: 10}
  - expect:
      s000: 0
      s001: 1
      s010: 1
      s011: 0
      s100: 1
      s101: 0
      s110: 0
      s111: 1
