  K: {name: c100, block: 'comparator[facing=south,mode=subtract]'}
  M: redstone_wire[north=side,east=side,south=none,west=none]
  l: {name: l000, block: 'repeater[facing=west,delay=1]'}
  s: {name: s000, block: 'repeater[facing=south,delay=1]'}
  N: redstone_wire[north=side,east=side,south=none,west=side]
