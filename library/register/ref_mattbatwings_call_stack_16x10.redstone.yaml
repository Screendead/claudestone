name: ref_mattbatwings_call_stack_16x10
description: 'mattbatwings'' ''16 Layer 10 bit Call Stack'' (QSTACK001 in his Logical Redstone Archive, tagged Tested & Functional, endorsed by mattbatwings; discord.com/channels/1361854816837435433/1472398151980679231), rebuilt block for block from QSTACK001_call_stack.schem (55x24x18, 7280 blocks) with ONE added repeater. README (SOURCED): a call stack of 16 layers of 10 bits, push and pop; inputs a 10 bit data word on levers, a clock button and a push/pop lever; output the 10 bit word at the top of the stack on lamps. Harness changes: the 10 data levers, the push/pop lever and the clock stone button hang on a lamp or wool, which lever emulation cannot drive, so each is a fixture repeater[facing=west] on a fixture stone block with the input cell behind it (the whole build is shifted one block east to make room); the fixture repeater adds 2 game ticks to every input, and a press of the button is drive clk=1, wait, clk=0 (a stone button holds 20 game ticks). Inputs: d0..d9 data (bit i is
  the lever at y=5+2i), pp push/pop (1 = push, 0 = pop; the lever at y=1), clk (the button at y=3). Outputs: q0..q9, the lamps at (6, 5+2i, 10); the top of the stack is read from layer 0. BUILD CHANGE (MEASURED): as saved in the .schem, the pop control line (dust at y=3, z=12 in the schematic, fed by the repeater at x=6) has no regenerating repeater, so its pulse decays from 15 at x=8 to 0 at x=23 and never reaches layers 5 and deeper (the push line, y=3 z=5, has repeaters at x=7, 24 and 40; the row of delay-compensating repeaters beside the pop line, Y x5 then K x5 then dust x5, assumes one at x~23 as well). As saved, 16 ones pushed and one pop leave only layers 0-4 set, and 8 distinct words pushed then popped read right for 5 pops and 0 on the 6th. Replacing the dust at schematic (23,3,12) (x=24 here) with repeater[delay=1,facing=west], the same piece the push line has at x=24, makes all 16 layers pop right; every test below needs it. Whether the original author''s world had this repeater
  is not known. Layout (INFERRED from traces, then checked by the tests): a layer is 3 blocks wide in x (layer k at schematic x=7+3k, here +1) and a bit is a 2-block slice in y. In each slice row z=8 carries the push copy east: a subtract comparator reads the previous layer''s storage dust and a repeater (locked by a side repeater except during a push) writes this layer''s dust; row z=9 carries the pop copy west: a subtract comparator reads this layer''s dust and a repeater (locked by a south repeater except during a pop) writes the previous layer''s dust. Storage is the locked repeaters; the dust node between them is read by the next layer. A press makes a 4 game tick pulse (comparator edge detector under the button), which runs along two decaying dust lines at y=3 (push z=5, pop z=12) and is tapped at each layer through repeaters of delay 2, 1 then 0 (layers 0-5, 6-10, 11-15) that cancel the 2 game ticks each regenerating repeater adds, so every layer acts in the same tick; torches and
  glass/wool zigzag columns carry the pulse up the 10 slices. Output: layer 0''s storage reads out through a target block and a repeater to the lamp. MEASURED (tests): push 16 distinct words (all 10 walking ones and six dense patterns), each read at the top, then pop 15 times and read each older word, then a 16th pop reads 0; a 17th push onto a full stack drops the oldest word and the other 16 pop right; popping an empty stack reads 0 and the stack works afterwards; data, push/pop and the clock can change in the same tick (no setup time); a clock held 150 game ticks shifts once (edge triggered); a 4 game tick press works, 2 does nothing; pushes every 24 game ticks work, every 20 do not; pops every 16 work (the test uses 20). Latency from the clock input (fixture repeater included): the new top word''s bits rise 24 game ticks after the press and the old word''s bits fall 28, so the lamps show both words for 4 game ticks (22 and 26 from a button, INFERRED by subtracting the fixture). Push
  and pop take the same time. The README gives no speed.'
