  - {wait: 10}
  - expect: {q0: 0, q1: 0, q2: 0, q3: 1}
  - drive: {clk: 0}
  - {wait: 10}
  - drive: {clk: 1, p0: 1, p1: 0, p2: 0, p3: 0}
  - {wait: 10}
