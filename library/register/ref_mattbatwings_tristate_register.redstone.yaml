name: ref_mattbatwings_tristate_register
description: 'mattbatwings-endorsed 8-bit tristate register from the Logical Redstone Archive (REGISTER002 Tristate Register, https://discord.com/channels/1361854816837435433/1472729369951867113; README claims SOURCED: read
  and write at 10 Hz, 2 tick read (3 with a standard decoder), active-low read and write lines, reading while writing outputs 0). Size 8x18x4, one vertical slice per bit. Per bit: a data repeater (bit) held by a barrel-fed
  comparator lock (lock) is the storage; a hopper-fed comparator (container constant 1) plus a wall torch on a target block is the tristate output. Both lines drive one dust staircase on glass; the barrels'' redstone counts
  (signal 14 14 12 10 8 6 4 2, read from the schematic) match the dust loss so the write line is exactly the barrel strength at every bit (lock open) and the hold line one below (lock closed). Harness changes: the 8 data levers
  sat on redstone lamps and the read and write levers on black wool, which the lever emulation cannot click, so those supports are smooth_stone and white_wool (same conductor); the read/write levers start on (idle) as saved;
  names bit0..7, q0..7 (the output lamps), torch0, bus0, lock0, rdrep added for probes. How it works (INFERRED, then confirmed by the tests): read lever on = repeater rdrep drives the bus at 13..1 down the tower, so each lock
  sees barrel - bus = 1 and holds, and bus > 0 at the output block turns the torch off (output 0). Read lever off and write lever on = bus 0: torch relights, F = 1 - max(torch, bit) so the torch ends equal to the bit, output
  q = bit. Write lever off = bus at barrel strength, lock opens, the data repeater follows its lamp, output forced 0. MEASURED on a satellite: all tests pass; read lever to output 4 ticks (rdrep 2 + torch 2; bus to output
  2, matching the README''s 2 tick read), deselect 4 ticks to the torch and 8 to the lamp (lamp off delay), write lever to lock open 4 ticks, data in the repeater 6 ticks, minimum write pulse 2 ticks (1 tick pulse failed in
  a probe).'
traits:
- vertical
- lockable
- comparator_based
- torch_based
- container_based
- pistonless
- entityless
