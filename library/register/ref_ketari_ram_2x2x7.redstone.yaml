name: ref_ketari_ram_2x2x7
description: 'Ketari_''s ''2x2x7 per bit, 8 bits binary RAM (combinational)'' (schemat.io/schematics/77WUlf, 11x20x7, 859 blocks), rebuilt block for block from the downloaded .schem, barrel contents included (one diamond sword each, comparator strength 1). Changes for the harness only: the magenta/lime wool that the demo levers hang on and the row-lever lamps are white wool (lever emulation needs a plain block); dust power, lit and locked states are left for the game to compute (the schematic''s saved states are stale: every lock comparator reads side 1-14 yet shows output 1). Layout: 16 layers (y4-y19), two cells per layer at x pitch 4, odd layers shifted 2 in x, so 4x1x7 = 28 blocks per bit. Each cell stores in a locked repeater (q<y>_<x>) whose lock is a subtract comparator reading a barrel (1) minus a vertical glass-staircase dust tower (the word line, one tower per word, taps every other layer); the row dust at z6 is the data-in line of a bit, shared by the four words; the read is a subtract comparator (1 minus the bit) into a tower leaf on a barrel, a wall torch on that barrel drives the row output line at z0 (lamps out0-out7). So a tower at 0 holds its word and puts it on the outputs; a tower at 1 or more unlocks the word (it follows the data rows) and hides it. With the demo levers off the towers are at 15, so the whole module is transparent at load. Measured on 26.3: writes and holds all 8 bits through the south (t*s) driver; the north (t*n) driver reaches only bits 0-6 (bit 7''s lock dust is 0); held words are ORed onto the outputs, and there is no tower state that hides a word while keeping it, so reading one word alone overwrites the other three: not an addressable RAM as published.'
traits: [vertical, comparator_based, container_based, torch_based, lockable, pistonless, entityless, survival_friendly]
