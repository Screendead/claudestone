tests:
- name: transparent with the demo levers off
  settle: 40
  steps:
  - {use: row0}
  - {wait: 6}
  - expect: {q4_1: 1, q5_3: 1, q4_5: 1, q5_7: 1, q6_1: 0}
  - {use: row0}
  - {wait: 6}
  - expect: {q4_1: 0, q5_3: 0, q4_5: 0, q5_7: 0}
- name: tower levels from each driver
  settle: 40
  steps:
  - level: {lk4: 14, lk6: 12, lk8: 10, lk10: 8, lk12: 6, lk14: 4, lk16: 2, lk18: 0}
  - {use: t0n}
  - {use: t1n}
  - {use: t2n}
  - {use: t3n}
  - {wait: 6}
  - level: {lk4: 0, lk18: 0}
  - {use: t0s}
  - {wait: 4}
  - level: {lk4: 15, lk6: 13, lk8: 11, lk10: 9, lk12: 7, lk14: 5, lk16: 3, lk18: 1}
- name: south driver writes and holds all eight bits
  settle: 40
  steps:
  - {use: t0n}
  - {use: t1n}
  - {use: t2n}
  - {use: t3n}
  - {wait: 10}
  - {use: row0}
  - {use: row1}
  - {use: row2}
  - {use: row3}
  - {use: row4}
  - {use: row5}
  - {use: row6}
  - {use: row7}
  - {wait: 6}
  - {use: t0s}
  - {wait: 10}
  - expect: {q4_1: 1, q6_1: 1, q8_1: 1, q10_1: 1, q12_1: 1, q14_1: 1, q16_1: 1, q18_1: 1, q4_5: 0}
  - {use: t0s}
  - {wait: 6}
  - {use: row0}
  - {use: row1}
  - {use: row2}
  - {use: row3}
  - {use: row4}
  - {use: row5}
  - {use: row6}
  - {use: row7}
  - {wait: 10}
  - expect: {q4_1: 1, q10_1: 1, q18_1: 1, q4_5: 0, out0: 1, out3: 1, out7: 1}
- name: north driver cannot write bit 7
  settle: 40
  steps:
  - {use: t0n}
  - {use: t1n}
  - {use: t2n}
  - {use: t3n}
  - {wait: 10}
  - {use: row0}
  - {use: row1}
  - {use: row2}
  - {use: row3}
  - {use: row4}
  - {use: row5}
  - {use: row6}
  - {use: row7}
  - {wait: 6}
  - {use: t0n}
  - {wait: 10}
  - {use: t0n}
  - {wait: 6}
  - {use: row0}
  - {use: row1}
  - {use: row2}
  - {use: row3}
  - {use: row4}
  - {use: row5}
  - {use: row6}
  - {use: row7}
  - {wait: 10}
  - expect: {q4_1: 1, q16_1: 1, q18_1: 0}
- name: held words are read as an OR
  settle: 40
  steps:
  - {use: t0n}
  - {use: t1n}
  - {use: t2n}
  - {use: t3n}
  - {wait: 10}
  - {use: row0}
  - {use: t0s}
  - {wait: 10}
  - {use: t0s}
  - {wait: 6}
  - {use: row0}
  - {use: row1}
  - {use: t2s}
  - {wait: 10}
  - {use: t2s}
  - {wait: 6}
  - {use: row1}
  - {wait: 10}
  - expect: {q4_1: 1, q6_1: 0, q4_5: 0, q6_5: 1, out0: 1, out1: 1}
- name: reading one word alone erases the others
  settle: 40
  steps:
  - {use: t0n}
  - {use: t1n}
  - {use: t2n}
  - {use: t3n}
  - {wait: 10}
  - {use: row0}
  - {use: row1}
  - {use: row2}
  - {use: row3}
  - {use: row4}
  - {use: row5}
  - {use: row6}
  - {use: t0s}
  - {wait: 10}
  - {use: t0s}
  - {wait: 6}
  - {use: row0}
  - {use: row1}
  - {use: row2}
  - {use: row3}
  - {use: row4}
  - {use: row5}
  - {use: row6}
  - {wait: 10}
  - expect: {q4_1: 1, q16_1: 1, q4_5: 0, out0: 1, out6: 1}
  - {use: t0n}
  - {use: t1n}
  - {use: t3n}
  - {wait: 10}
  - expect: {out0: 0, out6: 0, q4_1: 0, q16_1: 0}
  - {use: t0n}
  - {use: t1n}
  - {use: t3n}
  - {wait: 10}
  - expect: {out0: 0, out6: 0, q4_1: 0, q16_1: 0}
