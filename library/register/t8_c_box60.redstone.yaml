name: t8_c_box60
description: 'Addressable RAM at 60 blocks per bit in a box: the cell is a 5x2x6 box (x east 5, y up 2, z south 6) that tiles in all three directions (ORE 4x4x4 Tileable RAM Cube rules: repeater-lock memory, no pistons, data-in/out lines parallel, hold/read control lines parallel, the two sets perpendicular, no diodes in any line). Found by the RAM-cell floor search (sat4, found_box_v60.jsonl, copied to tools/t8_found_box_v60.jsonl) and turned into this array by tools/t8_cell_to_spec.py. Same three-repeater model as t8_c_v51: s (memory) reads din through the block behind it and is side-locked by k (reads hold); o reads rd, is side-locked by s and powers dout through the block behind its output. s stores the inverted bit, so din carries the inverted bit and hold is active-low (1 keeps, 0 writes); rd=1 puts the bit on dout. Data lines run east along x on flat dust (din on the upper layer of each cell, dout on the lower), control lines climb y as glass staircases, which carry signal upward
  only, so hold and rd are driven from the bottom. This spec is a 3x3x2 array (words ik = hold ik/rd ik, bits j = din jk/dout jk; i east, j up, k south): 18 cells, din fed at the west end, dout read at its west end, hold and rd fed below the lowest cell (the columns of words 1x and 2x run one cell below the array to make room for their drivers). A data line is 5 dust per cell: din reaches the far cell at strength 2 and the far cell''s o gives 3 at dout, so 3 cells is the most one 15-strength data line serves. Reading and writing one word at the same time is not supported.'
traits:
- pistonless
- entityless
- silent
- lightless
