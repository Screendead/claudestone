name: ref_librok_register8_dual_read
description: 'LiBRoK''s 8-bit register with two read ports (LRA REGISTER004, Tested & Functional, endorsed by Wueffi; https://discord.com/channels/1361854816837435433/1479218770601054409): inputs are an
  8-bit number on levers d0..d7, a write button and read levers rd1 and rd2; outputs are two 8-bit lamp rows a0..a7 (shown while rd1 is on) and b0..b7 (while rd2 is on), 0 otherwise. 7x19x14, one bit per
  2 layers. Each bit is stored TWICE, in a repeater locked from the south (a stand-in for a second read port): copy A at (0,y,10), copy B at (3,y+1,10), both fed from the same data lever through dust, each
  unlocked by the one shared lock line (a zigzag of dust on glass up x=1/2, z=11) and each read through a subtract comparator whose side input is a read-off line, so the comparator passes the latch only
  while its read line is off. Write: the button''s wool powers a repeater into a subtract comparator whose side input is the same signal through a delay-3 repeater, so the comparator emits a fixed pulse;
  a repeater and a target turn it off a torch that feeds the lock line, which drops for 4 game ticks. Read: each read lever turns a target-on-torch inverter off, which lets a column of dust on glass release
  every bit''s comparator side input. Harness changes: the supports of the levers and the button (the 8 data lamps, and orange, yellow and blue wool) are white_wool, since the harness only clicks a lever
  or button on a plain block; the data-lamp displays are lost, nothing else changed. README claims (SOURCED): 2t write, 3t read. MEASURED here from the click: the lock line is open 4 game ticks (2 redstone
  ticks), the latches take the data 12 game ticks after the click, a read shows its row 12 game ticks after the click and clears 16 after it is released, the same for bit 0 and bit 7 and both ports; the
  3t read is not reproduced from the lever (INFERRED: it is the comparator-to-lamp part, 6 game ticks). Tested: 12 written values read back on each port alone and both with the data levers cleared, overwrite,
  data changes without a write, a write during a read.'
traits:
- vertical
- lockable
- comparator_based
- torch_based
- pistonless
- entityless
- reset_safe
- survival_friendly
