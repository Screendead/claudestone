name: t8_c_v51
description: 'Addressable RAM at 51 blocks per bit, stackable in three directions (ORE 4x4x4 Tileable RAM Cube rules: repeater-lock memory, no pistons, data-in/out lines parallel, hold/read control lines parallel, the two sets perpendicular, no diodes in any line), but the cell is not a box: it is the unit of a skewed lattice with basis (51,0,0), (2,1,0), (14,0,1), index 51 (x east, y up, z south). Found by a SAT search over periodic lattices (scratchpad t8b, found_v51.jsonl), same model and cell topology as t8_b_lock3_444: s (memory) reads din through the block under it and is side-locked by k (reads hold); o reads rd, is side-locked by s and powers dout. s stores the inverted bit, so din carries the inverted bit and hold is active-low (1 keeps, 0 writes); rd=1 puts the bit on dout. Data lines run along (1,-2,4) per cell, control lines along (2,1,0), dot product 0; planes stack along (-1,4,3). Per cell a data line has 5 dust and a control line 2, so a longer array needs a signal-extension repeater in each data line every 3 cells (none in this spec). This spec is a 3x3x2 array (words ik = hold ik/rd ik, bits j = din jk/dout jk; k is the plane): 18 cells in a 13x16x18 box, covering every lattice neighbour up to L1 length 8. Data lines are fed right at their first cell and read right after their last: 14 dust over 3 cells leaves strength 2 at the far din end and 4 at dout when the far cell reads, so 3 cells is the most one 15-strength data line serves. Write: k drops 2 gt after hold falls, s changes 4 gt after; read: dout 2 gt after rd. Reading and writing one word at the same time is not supported.'
traits: [pistonless, entityless, silent, lightless]
