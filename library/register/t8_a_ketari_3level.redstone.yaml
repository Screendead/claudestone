name: t8_a_ketari_3level
description: 'Ketari_''s RAM (see register/ref_ketari_ram_2x2x7) made addressable: same blocks and 4x1x7 = 28 blocks per bit pitch, but each word tower now has three levels instead of two. The lock comparators'' barrels are graded by height (stone stacks giving 15, 13, 11, 9, 7, 5, 3 for bits 0-6), exactly the level the south (write) driver puts on that tap, while the north driver''s idle level is one lower at every tap. So a tower at write (t<w>s on: 15 at the bottom) unlocks its word, idle (both levers off: 14) keeps it locked and, being at least 2 at every tap, keeps its read torches off, and read (t<w>n on: 0) keeps it locked and puts it on out0-out6. Ketari''s demo drivers already give 0, 14 and 15, but with every lock barrel at 1 the levels 14 and 15 both unlock, so a word can be hidden only by unlocking it. The top bit layer is dropped: the idle level reaches 0 there, so it could not be hidden. Result: 4 words x 7 bits, idle holds and hides every word, each word reads back alone. Timing from the demo levers: write 8 gt to the stored repeater (4 gt from the tower reaching 15), read 4 gt to the out lamps (2 gt from the tower reaching 0); keep the data rows steady until 6 gt after the write lever goes off. Every threshold is one signal strength apart from the idle level, which is deterministic in vanilla but leaves no margin for a weaker driver. The graded barrels make the 7 layers of a word different, so the array stacks in y only as 7-layer groups with a driver each. Demo lever supports and row-lever lamps are white wool, as in the ref.'
traits: [vertical, analog, comparator_based, container_based, torch_based, lockable, pistonless, entityless, survival_friendly, reset_safe]
