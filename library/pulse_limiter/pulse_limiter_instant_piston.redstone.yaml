name: pulse_limiter_instant_piston
description: 'Zero-latency pulse limiter, one block wide (all cells at x=0, running south). Input a (z=0, y=3) powers the dust under it (z=0, y=2), which dips under a glass block (z=1) and runs on y=2 to dust low (z=4) and climbs a step to output dust out (z=5, y=3): out rises in the same game tick as a. a also drives a delay-2 repeater (z=1, y=3, facing north, standing on the glass) into a sticky piston (z=2, facing south) that pushes a concrete block from z=3 into z=4, y=3, above the step, cutting the dust 6 ticks after the rise. So out = a limited to 6 ticks, with no delay; shorter inputs pass unchanged, even 1 tick. The repeater guarantees the piston a pulse of at least 4 ticks, so short inputs never make it drop its block (the fault of pulse_rising_instant_piston). Repeater delay d gives a limit of 2d + 2 ticks. 1x4x6. Trade-off versus pulse_limiter_comparator: no latency and one wide, but loud, a light-updating piston, and a limit of at most 10 ticks.'
traits: [ultrafast, one_wide, piston_based, entityless, tick_accurate, survival_friendly]
palette:
  .: air
  '=': smooth_stone
  '#': white_concrete
  g: glass
  a: {input: a}
  '-': redstone_wire
  r: repeater[facing=north,delay=2]
  P: 'sticky_piston[facing=south]'
  L: {name: low, block: redstone_wire}
  o: {output: out, block: redstone_wire}
