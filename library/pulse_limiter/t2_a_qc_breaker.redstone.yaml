name: t2_a_qc_breaker
description: 'Circuit breaker pulse limiter in 1x2x3 (6): the wiki circuit breaker without its dust column,
  because the input line quasi-powers the piston. Side view, one block wide, running east. The input line
  (fixture dust at x=2 on a glass fixture, so its support powers nothing) points into concrete block C
  (x=3, y=1), which a delay-1 repeater (x=4) reads; the sticky piston under C (x=3, y=0, facing up) is
  powered only through quasi-connectivity, by the input feeding the cell above it, and lifts C into x=3,
  y=2 (reserved), so the repeater gives one 2 gt pulse. Works fed by dust or by a repeater pointing straight
  into C. The fixture sticky piston at x=6 shows the pulse drops its block.'
traits:
- one_wide
- piston_based
- entityless
palette:
  .: air
  '=': smooth_stone
  '#': white_concrete
  _:
    reserve: true
  a:
    input: a
  b:
    input: b
  i:
    block: redstone_wire
    fixture: true
  g:
    block: glass
    fixture: true
  f:
    block: smooth_stone
    fixture: true
  P:
    name: piston
    block: sticky_piston[facing=up]
  R:
    name: rep
    block: repeater[facing=west,delay=1]
  o:
    output: out
    block: redstone_wire
    fixture: true
  S:
    name: drop
    block: sticky_piston[facing=up]
    fixture: true
  k:
    block: white_concrete
    fixture: true
layers:
  0: '..gP=f.

    '
  1: 'bai#RoS

    '
  2: '...._.k

    '
  3: '.......

    '
