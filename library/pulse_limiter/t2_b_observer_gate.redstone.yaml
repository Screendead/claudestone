name: t2_b_observer_gate
description: 'Observer-gated pulse shaper, 1x2x3 (6), one wide, running east. Observer O (x=3, y=2, facing west) watches the input dust fixture (x=2, y=2) and pulses 2 gt on each edge into cell X (x=4, y=2, reserved). The input steps down to dust D (x=3, y=1) on S, which powers sticky piston P (x=4, y=0, facing up); P lifts concrete C into X. So O''s rising-edge pulse lands in C and powers the output dust fixture (x=5, y=2, on glass); its falling-edge pulse finds X empty, because the retract empties X in its event tick. A 1-2 gt input drops C in X, which still gives the pulse, and the next input''s retract brings C home.'
traits: [one_wide, piston_based, entityless]
palette:
  .: air
  _: {reserve: true}
  a: {input: a}
  b: {input: b}
  i: {name: in, block: redstone_wire, fixture: true}
  f: {block: smooth_stone, fixture: true}
  g: {block: glass, fixture: true}
  S: smooth_stone
  D: redstone_wire
  P: {name: piston, block: 'sticky_piston[facing=up]'}
  C: white_concrete
  O: {name: obs, block: 'observer[facing=west]'}
  o: {output: out, block: redstone_wire, fixture: true}
layers:
  0: |
    ...SP.
  1: |
    ..fDCg
  2: |
    baiO_o
