name: t2_b_sand_breaker
description: 'Quasi-connected circuit breaker (the layout of t2_a_qc_breaker, itself the wiki circuit breaker without its dust column) with sand as the moved block, 1x2x3 (6), one wide, running east. The input dust fixture (x=2, on glass) points into sand C (x=3, y=1); the sticky piston under it (x=3, y=0, facing up) is quasi-powered through that cell and lifts C into x=3, y=2 (reserved); a delay-1 repeater (x=4) reads C into the output dust fixture (x=5). 2 gt delay and a 2 gt pulse fed by a placed block or by a repeater. A 1-2 gt input still gives its pulse and makes the piston drop C at y=2, but the sand falls home (a falling_block entity) and the next input works if it comes 10 gt or more later; the stone-block circuit breaker loses the next input at any gap.'
traits: [one_wide, piston_based]
palette:
  .: air
  '=': smooth_stone
  _: {reserve: true}
  a: {input: a}
  b: {input: b}
  i: {name: in, block: redstone_wire, fixture: true}
  f: {block: smooth_stone, fixture: true}
  g: {block: glass, fixture: true}
  P: {name: piston, block: 'sticky_piston[facing=up]'}
  C: sand
  R: 'repeater[facing=west,delay=1]'
  o: {output: out, block: redstone_wire, fixture: true}
layers:
  0: |
    ..gP=f
  1: |
    baiCRo
  2: |
    ...._.
