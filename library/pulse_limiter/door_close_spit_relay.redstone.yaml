name: door_close_spit_relay
description: "Door close primitive: a held spit and a spat-piston spit, each in the close tick c0 (drive in:0, wait 2) with the 0 gt pair (spit targets air at c-1, real quartz at c0). Standalone, not in door geometry. Three stages share input in; each goes through a fixture delay-1 repeater into sticky trigger E (facing south, held extended), whose retraction in c0 g stands in for the door's E0. Coordinates are spec cells (x,y,z). (a) Held spit, X facing down, like T and P1: X (2,4,6), quartz (2,3,6), target (2,2,6). X's feed: stone B (3,4,6) under dust H (3,5,6); dust L (4,4,6) on glass, always 15 from redstone block RB (4,4,7); gate stone G (4,5,6) above L cuts L->H. E (4,5,4) pulls G to (4,5,5), so H powers B and X in E's event. Relay D (2,4,7), a normal piston facing east beside X's base, QC-armed by a redstone block at (2,5,8) set after load. D pushes stone S (3,4,7) and RB, so RB lands at (5,4,7) and S at (4,4,7). (a') The same, with X facing east, like P11 and V: X (10,4,8), quartz (11,4,8), target (12,4,8); B (10,4,7), H (10,5,7), L (10,4,6) on glass, G (10,5,6) pulled to (10,5,5), RB (9,4,6) to (9,4,5), S (9,4,7), relay D (9,4,8) facing north behind X, arm (8,5,8). (b) Spat piston: X2' (17,4,6) faces down with the stage (a) feed and relay D0 (17,4,7), arm (17,5,8). Its payload is sticky M (17,3,6), facing east, spat to (17,2,6), where redstone block RBm (16,2,6) powers it from behind. M's quartz (18,2,6) is spat to (19,2,6). D1 (17,2,7) faces south, beside M's landing cell, arm (17,3,8). D2 (16,2,7) faces north, arm (15,3,7), and pushes RBm to (16,2,5). FIFO argument, per relay [SOURCED mc-src PistonBaseBlock.triggerEvent/moveBlocks, PistonMovingBlockEntity.finalTick, LevelChunk.setBlockState]. X is queued inside E's event, when G's vacated cell updates H; H is the only dust whose power changes then, and X is the only piston within 2 of it (D, E and the arms are at 3 or more). D is woken by X's own base update, which comes after X's push, inside X's event, so D is queued after X. D's push kills L, and the L/H storm reaches only X, so X's retract is queued inside D's event, before D's base update (the handoff). For (b): X2' is spat as in (a). In X2''s retract event M is placed (finalTick), which queues M's extension, and M's landing cell updates D1. D1's base update then wakes D2, one event later, so D2 is queued after M whichever of M and D1 came first. D2 moving RBm unpowers M, and M's retract spits its quartz in c0 g. No relay relies on dust storm order or neighbour-update direction. The task wakes the relay from E's retract base update; that does not work. A retracting piston updates its base before it pulls [SOURCED PistonBaseBlock.java:172-199; MEASURED scratch probe retract_wake_order], so a relay woken there is queued before X and drops X's extension. Arms are scaffolding, set with setblock strict after load. Mechanisms SOURCED: MECHANICS.md piston_zero_tick_chain_same_tick, piston_moved_source_zero_tick_depower, spat_piston_fires_same_tick. The in-phase depower of a spat piston after its H2 extension is MEASURED here: M never reads extended, and its quartz is real at c0. Handoff cells da, db, d2c read extended from c0. Controls remove D, D2 or D1 with setblock air strict, and the payload is then still moving_piston at c0 (M extended)."
traits: [piston_based, entityless, tick_accurate]
