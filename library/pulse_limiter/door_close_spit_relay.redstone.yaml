  .: air
  '=': smooth_stone
  '#': stone
  g: glass
  f: {block: glass, fixture: true}
  '-': redstone_wire
  R: redstone_block
  q: quartz_block
  '_': {reserve: true}
  i: {input: in}
  r: {block: 'repeater[facing=north,powered=true]', fixture: true}
  h: 'piston_head[facing=south,type=sticky]'
  A: {name: ea, block: 'sticky_piston[facing=south,extended=true]'}
  B: {name: eb, block: 'sticky_piston[facing=south,extended=true]'}
  C: {name: ec, block: 'sticky_piston[facing=south,extended=true]'}
  x: {name: xa, block: 'sticky_piston[facing=down]'}
  w: {name: xb, block: 'sticky_piston[facing=east]'}
  z: {name: xc, block: 'sticky_piston[facing=down]'}
  a: {name: da, block: 'piston[facing=east]'}
  b: {name: db, block: 'piston[facing=north]'}
  c: {name: d0c, block: 'piston[facing=east]'}
