tests:
- name: "every stage spits in c0 (0 gt pair)"
  initial: {in: 1}
  steps:
  - run: "setblock ~2 ~5 ~8 redstone_block strict"
  - run: "setblock ~8 ~5 ~8 redstone_block strict"
  - run: "setblock ~17 ~5 ~8 redstone_block strict"
  - run: "setblock ~17 ~3 ~8 redstone_block strict"
  - run: "setblock ~15 ~3 ~7 redstone_block strict"
  - wait: 2
  - expect: {xa: 0, xb: 0, xc: 0, da: 0, db: 0, d0c: 0, d1c: 0, d2c: 0}
  - drive: {in: 0}
  - wait: 1
  - expect: {xa: 0, xb: 0, xc: 0, da: 0, db: 0, d0c: 0, d1c: 0, d2c: 0}
  - expect: {ea: 1, eb: 1, ec: 1}
  - check: "if block ~2 ~2 ~6 air"
  - check: "if block ~12 ~4 ~8 air"
  - check: "if block ~17 ~2 ~6 air"
  - check: "if block ~19 ~2 ~6 air"
  - check: "if block ~2 ~3 ~6 quartz_block"
  - check: "if block ~11 ~4 ~8 quartz_block"
  - check: "if block ~18 ~2 ~6 quartz_block"
  - check: "if block ~17 ~3 ~6 sticky_piston[facing=east,extended=false]"
  - wait: 1
  - check: "if block ~2 ~2 ~6 quartz_block"
  - check: "if block ~12 ~4 ~8 quartz_block"
  - check: "if block ~19 ~2 ~6 quartz_block"
  - check: "if block ~2 ~3 ~6 air"
  - check: "if block ~11 ~4 ~8 air"
  - check: "if block ~17 ~3 ~6 air"
  - check: "if block ~18 ~2 ~6 air"
  - check: "if block ~2 ~4 ~6 moving_piston"
  - check: "if block ~10 ~4 ~8 moving_piston"
  - check: "if block ~17 ~4 ~6 moving_piston"
  - check: "if block ~17 ~2 ~6 moving_piston"
  - expect: {da: 1, db: 1, d0c: 1, d1c: 1, d2c: 1}
  - wait: 2
  - check: "if block ~2 ~4 ~6 sticky_piston[facing=down,extended=false]"
  - check: "if block ~10 ~4 ~8 sticky_piston[facing=east,extended=false]"
  - check: "if block ~17 ~4 ~6 sticky_piston[facing=down,extended=false]"
  - check: "if block ~17 ~2 ~6 sticky_piston[facing=east,extended=false]"
  - check: "if block ~2 ~2 ~6 quartz_block"
  - check: "if block ~12 ~4 ~8 quartz_block"
  - check: "if block ~19 ~2 ~6 quartz_block"
  - check: "if block ~5 ~4 ~7 redstone_block"
  - check: "if block ~9 ~4 ~5 redstone_block"
  - check: "if block ~20 ~4 ~7 redstone_block"
  - check: "if block ~16 ~2 ~5 redstone_block"
  - wait: 10
  - check: "if block ~17 ~2 ~6 sticky_piston[facing=east,extended=false]"
  - check: "if block ~2 ~2 ~6 quartz_block"
  - check: "if block ~12 ~4 ~8 quartz_block"
  - check: "if block ~19 ~2 ~6 quartz_block"
  - expect: {xa: 0, xb: 0, xc: 0}
- name: "spitters never read extended, relays rise at c0"
  initial: {in: 1}
  steps:
  - run: "setblock ~2 ~5 ~8 redstone_block strict"
  - run: "setblock ~8 ~5 ~8 redstone_block strict"
  - run: "setblock ~17 ~5 ~8 redstone_block strict"
  - run: "setblock ~17 ~3 ~8 redstone_block strict"
  - run: "setblock ~15 ~3 ~7 redstone_block strict"
  - wait: 2
  - drive: {in: 0}
  - wave: {xa: "0000000000000000", xb: "0000000000000000", xc: "0000000000000000", ea: "1100000000000000", eb: "1100000000000000", ec: "1100000000000000", da: "0011111111111111", db: "0011111111111111", d0c: "0011111111111111", d1c: "0011111111111111", d2c: "0011111111111111"}
- name: "without Da, X (down) extends and holds (control)"
  initial: {in: 1}
  steps:
  - run: "setblock ~2 ~5 ~8 redstone_block strict"
  - run: "setblock ~8 ~5 ~8 redstone_block strict"
  - run: "setblock ~17 ~5 ~8 redstone_block strict"
  - run: "setblock ~17 ~3 ~8 redstone_block strict"
  - run: "setblock ~15 ~3 ~7 redstone_block strict"
  - run: "setblock ~2 ~4 ~7 air strict"
  - wait: 2
  - drive: {in: 0}
  - wait: 2
  - expect: {xa: 1}
  - check: "if block ~2 ~2 ~6 moving_piston"
  - check: "if block ~2 ~3 ~6 moving_piston"
  - wait: 2
  - expect: {xa: 1}
  - check: "if block ~2 ~2 ~6 quartz_block"
  - check: "if block ~2 ~3 ~6 piston_head[facing=down,type=sticky]"
- name: "without Db, X (east) extends and holds (control)"
  initial: {in: 1}
  steps:
  - run: "setblock ~2 ~5 ~8 redstone_block strict"
  - run: "setblock ~8 ~5 ~8 redstone_block strict"
  - run: "setblock ~17 ~5 ~8 redstone_block strict"
  - run: "setblock ~17 ~3 ~8 redstone_block strict"
  - run: "setblock ~15 ~3 ~7 redstone_block strict"
  - run: "setblock ~9 ~4 ~8 air strict"
  - wait: 2
  - drive: {in: 0}
  - wait: 2
  - expect: {xb: 1}
  - check: "if block ~12 ~4 ~8 moving_piston"
  - check: "if block ~11 ~4 ~8 moving_piston"
  - wait: 2
  - expect: {xb: 1}
  - check: "if block ~12 ~4 ~8 quartz_block"
  - check: "if block ~11 ~4 ~8 piston_head[facing=east,type=sticky]"
- name: "without D2, spat M fires and holds (control)"
  initial: {in: 1}
  steps:
  - run: "setblock ~2 ~5 ~8 redstone_block strict"
  - run: "setblock ~8 ~5 ~8 redstone_block strict"
  - run: "setblock ~17 ~5 ~8 redstone_block strict"
  - run: "setblock ~17 ~3 ~8 redstone_block strict"
  - run: "setblock ~15 ~3 ~7 redstone_block strict"
  - run: "setblock ~16 ~2 ~7 air strict"
  - wait: 2
  - drive: {in: 0}
  - wait: 2
  - check: "if block ~17 ~2 ~6 sticky_piston[facing=east,extended=true]"
  - check: "if block ~19 ~2 ~6 moving_piston"
  - check: "if block ~18 ~2 ~6 moving_piston"
  - check: "if block ~17 ~3 ~6 air"
  - check: "if block ~17 ~4 ~6 moving_piston"
  - wait: 2
  - check: "if block ~17 ~2 ~6 sticky_piston[facing=east,extended=true]"
  - check: "if block ~19 ~2 ~6 quartz_block"
  - check: "if block ~18 ~2 ~6 piston_head[facing=east,type=sticky]"
- name: "without D1, spat M fires and holds (control)"
  initial: {in: 1}
  steps:
  - run: "setblock ~2 ~5 ~8 redstone_block strict"
  - run: "setblock ~8 ~5 ~8 redstone_block strict"
  - run: "setblock ~17 ~5 ~8 redstone_block strict"
  - run: "setblock ~17 ~3 ~8 redstone_block strict"
  - run: "setblock ~15 ~3 ~7 redstone_block strict"
  - run: "setblock ~17 ~2 ~7 air strict"
  - wait: 2
  - drive: {in: 0}
  - wait: 2
  - check: "if block ~17 ~2 ~6 sticky_piston[facing=east,extended=true]"
  - check: "if block ~19 ~2 ~6 moving_piston"
  - wait: 2
  - check: "if block ~17 ~2 ~6 sticky_piston[facing=east,extended=true]"
  - check: "if block ~19 ~2 ~6 quartz_block"
