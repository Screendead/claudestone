  H: repeater[delay=1,facing=east]
  I: redstone_wire[east=none,north=up,south=none,west=side]
  J: redstone_wire[east=up,north=none,south=none,west=side]
  K: redstone_wire[east=none,north=side,south=up,west=none]
  M: redstone_wire[east=none,north=side,south=none,west=side]
  N: redstone_wire[east=side,north=none,south=none,west=side]
  '1': {input: a0}
