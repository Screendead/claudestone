name: ref_qmb_official_bcd_shift_tile
description: "Vertical-to-horizontal BCD (one nybble) latch tile, SHIFT005 of mattbatwings' Logical Redstone Archive, by qmb_official (endorsed by mattbatwings; Discord https://discord.com/channels/1361854816837435433/1473818888876724254 ). SOURCED: 1 nybble in, 1 nybble out (locked), 2rt, tileable on the wires, modified from matt's first-calculator decoder; the README says the repeater on the locking line in its image is an error and the schematic has none (rebuilt from the schematic, no change to its blocks). Size 9x10x8 as rebuilt, plus the input row at z=8 (the four data inputs a0..a3 sit behind the four lock repeaters at (4,y,8), y=2,4,6,8, and hold at (8,1,8) feeds the lock line; the drivers are outside the footprint). INFERRED from tracing the blocks: each bit is a diode repeater at (4,y,7) facing south whose output dust runs north along x=4 to a tap at z=6-2k that a repeater sends west into a dust ladder through glass up to a lamp at (0,9,z), so bit k (y=2+2k) lights lamp q_k at z=6-2k, which turns the vertical stack into a horizontal row; the hold line (x=8, z=1..7) is read by a 2rt repeater into the iron block under a second ladder at x=6, and a 1rt repeater from that ladder at each level side-powers the bit repeater, locking it. The z=0 end of each x=4 dust line and the (8,1,0) repeater are the chain outputs to a next tile, never exercised here. MEASURED (26.3, satellite): hold=0 is transparent, input to lamp rise 4 and fall 8 game ticks; hold=1 holds the lamps against any change made at least 4 ticks after hold rises (a change 3 ticks after still leaks through), and releasing hold moves the lamps 14 ticks later."
