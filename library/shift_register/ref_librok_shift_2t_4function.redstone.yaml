name: ref_librok_shift_2t_4function
description: 'Rebuild of LRA entry SHIFT006 "compact 2t bidirectional shift register" by LiBRoK (endorsed by Waffle [Wueffi]; Discord https://discord.com/channels/1361854816837435433/1479218704087777464; README: 8-bit number, 4 functions load/reset/up/down, speed 2t, tags Tested & Functional). An 8-bit register stacked vertically, one bit per 2 layers (lamp q_i on the west face of each slice, load lever on the east). Functions: load copies the 8 data levers into the register, reset clears it, up shifts every bit one place toward q7 (q7 falls off, q0 gets 0), down shifts toward q0. Size: schematic 10x18x14; as rebuilt 10x18x15 (try) plus the driver cells. Changes for the harness: the schem has no up/down buttons, so up is a button on the north face of the yellow wool at schem (5,2,0) and down one on the north face of the orange wool at schem (4,1,0) (inferred from the README colours and the preview images; found by trying: up on the other yellow wool at (6,1,0) does nothing). The harness only emulates levers/buttons on plain full blocks, so each lever (on a lamp) is a repeater pointing west into that lamp on a smooth_stone support, and each button (on wool) a repeater pointing into the wool, each fed by an input cell at its back: all give the same strong power to the block, plus 2 gt of repeater delay. Inputs in0..in7 (data bit i, drive 1 = lever on), load, reset, up, down are level inputs; drive 1 then 0 to press. q0..q7 are the state lamps (x=0 side). The lamp''s own 4 gt turn-off delay is in the fall latencies below. MEASURED: all four functions work (tests), each press shifts exactly once however long it is held (a 30 gt hold shifts once), latency from the input drive to the lamp is 14 gt for a rising lamp (up, down, load), 18 gt for a lamp falling after up or down and 16 gt after reset (the lamp''s own 4 gt turn-off delay is included; so is the 2 gt of my driver repeater). Speed NOT reproduced as 2 redstone ticks: with a repeater-driven press, a 2 gt pulse does nothing, a pulse needs at least 3 gt high, and back-to-back presses need a period of at least 8 gt (3 on 5 off and 4 on 4 off pass 7 shifts in a row; 4 on 3 off, 5 on 3 off, 6 on 2 off and 3 on 4 off drop shifts). Whether the original''s ''2t'' means something else (button-driven, a clock of different shape) is not established. INFERRED, not traced: comparators with subtract mode make a pulse of each press and a target block / blue wool per bit pass it up the stack.'
