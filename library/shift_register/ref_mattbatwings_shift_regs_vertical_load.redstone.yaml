name: ref_mattbatwings_shift_regs_vertical_load
description: "Rebuild of mattbatwings' two 8-bit shift registers with parallel load, Logical Redstone Archive SHIFT001 (Up & Down versions), https://discord.com/channels/1361854816837435433/1472418543231438858 (README SOURCED: an upward and a downward shift register, both with load; input an 8-bit number, a Load button and a Shift button; output an 8-bit number; tested and functional, recommended). Two independent 8x7-footprint towers in one 8x25 file, 17 high, base at y1 and a 2-layer cell per bit from y4 (bit 0 at the bottom): tower a (z0-6) shifts up (bit k to bit k+1, a 0 enters at bit 0), tower b (z18-24) shifts down (bit k+1 to bit k, a 0 enters at bit 7). Harness changes: lime_wool -> white_wool (the harness only emulates plain white wool as a lever or button support); the lamp each data lever sat on (x3,z2 / x3,z20) is white_wool, because the lamp only displayed the data and the comparator beside it reads the lever-powered block either way; the decorative signs are dropped; levers named a_d0..a_d7 / b_d0..b_d7, load buttons a_btn1 / b_btn1 (z1), shift buttons a_btn3 / b_btn3 (z3), output lamps a_q0..a_q7 / b_q0..b_q7 (a: x7,z6 in the lever layers; b: x7,z24 in the layers below them). How it works (INFERRED from the layout and from full per-tick traces of a load and a shift): each bit is a delay-1 repeater (x6,z2) used as a lock latch: a repeater locked from the side by another repeater (x6,z1) holds its value. Three dust ladders climb the tower: x6/x7,z0 (lock line), x3/x4,z0 (data mask line, used by Load) and x3/x4,z4 (shift line, used by Shift); all three are held HIGH at rest (the dust power decays 15 -> 0 with height, but each stage re-powers its own repeater). The base (y1) turns each button press into inverted pulses with a comparator that subtracts a 2 gt delayed copy of itself from the press, then a repeater: load drops the data-mask ladder, 2 gt later the lock ladder, and raises them back in the same order, so for a few ticks every stage's comparator (x4,z2) is unmasked and passes its lever's value onto the stage's node (x5,z2) while the stage's latch is unlocked, so the latch copies the lever. Shift drops the shift ladder and the lock ladder: the shift ladder unmasks each stage's output comparator (x6,z3 odd layer, subtract mode, rear = the stored bit read from the dust sitting on the latch's output wool), which passes the stored bit through a dust that climbs one layer (tower a, up) or descends to the node (tower b, which reads the bit of the stage above) to the neighbouring stage's node, in the window while every latch is unlocked; the latch (delay 1) and the output comparator (delay 1) both read the old value before any latch has changed, so there is no race and no master-slave pair is needed: the whole tower shifts in one pulse. The bit lamp is a repeater -> wool -> lamp chain off the same latch output. MEASURED: both towers load 0xA5, 0x5A, 0xFF, 0x00, 0x01, 0x80 (each checked unchanged by the lever change before Load), and shift 0x01, 0x80, 0xA5, 0xFF eight times each with the exact value after every shift (up: bit 7 falls off the end and zeros enter at bit 0; down the mirror image); levers moved after a load change nothing until Load is pressed again; a Load over a shifted 0xFF loads 0; two shifts a stone-button period (24 gt) apart both take effect. Timing at the lamps: after a Load or Shift press the new lamp is lit at +12 gt and the old lamp is dark at +16 gt (the 4 gt gap is the redstone lamp's own off delay, so the lamps show the old and the new bit lit together for 4 gt)."
traits:
- entityless
- pistonless
- torch_based
