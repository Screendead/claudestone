name: ref_mattbatwings_bidir_shift_pistons
description: 'Bi-directional 8-bit shift register built from repeaters, locks and sticky pistons, rebuilt from mattbatwings'' Logical Redstone Archive entry SHIFT004_Bi-directional_Shift_Register (SHIFT004_bidirectional_shift_reg_pistons.schem,
  endorsed by mattbatwings, tagged Tested & Functional; original post https://discord.com/channels/1361854816837435433/1472419495921455297). SOURCED from the README: two shift buttons in, an 8b number out.
  Size 13x11x23 (the schematic is 13x11x22; the extra row is the q7 input''s support block). Lamps q0..q7 stand at x=3 on z=7,9,...,21 (q0 north); btn_to_q0 and btn_to_q7 are the two stone buttons at x=0,
  z=1 and z=3. HOW IT WORKS (INFERRED from the blocks, and the pistons'' role MEASURED by the mutant tests): each bit is a cell of two iron blocks, x=8 and x=10 at y=3, joined by a lone cross dust at x=9
  that passes a repeater''s strong power from either block to the other. Between cells, two repeater chains run in opposite directions: x=8 repeaters (facing north: input north, output south) move bits
  toward q7, x=10 repeaters (facing south) toward q0. Every repeater is LOCKED by a side repeater (x=7 and x=11) that two long lock lines (dust at x=6 and x=12, y=4, on iron) keep powered; a locked repeater
  holds its output, so the locked repeaters are the memory and there is no other latch. A lamp reads its cell through the dust under the cell blocks (y=2) and the iron under the lamp. A press is turned
  into a rising-edge pulse by a subtract comparator fed by the button and by a 2-tick-delayed copy of it; a torch inverts it, and a repeater makes a second copy 2 gt later, so each press has an early and
  a late edge. Through torches on iron the pulse drops the lock lines and one of two piston lines (dust at y=7 over top slabs, which power the sticky pistons below them by quasi-connectivity). btn_to_q0:
  the x=12 lock line drops first (the x=10 chain, toward q0, unlocks at +10 with the x=10 pistons still down) while the x=8 pistons retract at +10 and the x=8 chain unlocks at +12, so it reads a lifted,
  empty cell and clears itself; everything is relocked and the pistons are back by +16. btn_to_q7 is the mirror image (INFERRED from the layout; the timing in this sentence is MEASURED only for btn_to_q0)
  with the x=8 chain first and the x=10 pistons lifting. So one chain copies every cell onto the next and the other, whose cells are lifted away, is cleared. The two lift timings race the unlock of the
  copying chain; the copying chain wins in 26.3 (MEASURED: the alternating-direction test, which reads data held by the opposite chain through the cross dust, passes). HARNESS CHANGES: the iron blocks behind
  both buttons are smooth_stone (the harness only presses buttons on plain blocks); the schematic''s serial input is only a stub, so in_q0 is a fixture repeater at (8,3,6) driven by a redstone block (the
  redstone block alone does not hard-power the cell), which feeds cell q0 for shifts toward q7, and in_q7 a fixture repeater at (10,3,22) feeding cell q7 for shifts toward q0; the stub iron and a stale
  dust were removed. The saved snapshot had stale power in it (a lit lamp at q4 with no power source among the blocks), so it is rebuilt from the blocks and not from the saved state. MEASURED: an input
  end is live, not latched: q0 is in_q0 OR what a shift toward q0 stored (so hold in_q0 at the bit you want in while pressing btn_to_q7, and bits that fall off the far end are lost); a bit appears in the
  next lamp 12 ticks after the press and the vacated lamp goes dark at 16 (the lamp''s 4 gt turn-off delay; both lamps are lit for 4 ticks), both directions; presses 23 ticks apart all shift, presses 22
  apart lose shifts (button hold 20 gt plus the pulse maker); holds 600 ticks; with the x=8 pistons held down a shift toward q0 smears every bit to 1, with the x=10 pistons held down a shift toward q7 does,
  and the other direction is unaffected in both cases, which is what the pistons are for. Not claimed: the README''s left/right naming (the buttons are named by direction here), behaviour under simultaneous
  presses or faster press rates.'
