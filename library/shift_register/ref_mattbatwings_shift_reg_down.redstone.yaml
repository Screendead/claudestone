name: ref_mattbatwings_shift_reg_down
description: "Rebuild of LRA entry SHIFT002 \"Shift Registers (Up & Down versions)\" by mattbatwings, the Down version (Discord https://discord.com/channels/1361854816837435433/1472418887638192232; README: input shift button, output 8b number, tags Tested & Functional, Recommended). An 8-bit serial-in shift register stacked vertically, 2 layers per bit: data enters at the top (lever din, y=17) and every press moves the bits one stage DOWN; bit b0 is the top lamp (y=15) and b7 the bottom (y=1), each lamp reading the stage above it. Size 5x18x6 (the second half of the schematic). Changes for the harness: the schem's button and data lever sit on lime wool and a lamp, which the harness cannot emulate (it clicks only plain stone/white_wool supports), so the button's support is white_wool and the data lever's lamp is smooth_stone (same strong power; the original lamp only showed the lever state); the sign and its glass are dropped. HOW (INFERRED from the blocks, confirmed by the tests): each bit is a delay-1 repeater Q facing west, its input the previous stage's output (dust climbing a glass-supported zigzag) and its output the lamp feed and the next stage's input. A second repeater O (delay 1) beside it, fed by a vertical zigzag line (N/V dust alternating z=1/z=0 on glass) locks every Q at once while the line is high. The line is a torch on wool: high at rest, so all Q are locked and hold. A press feeds a subtract comparator (rear = button, side = the button delayed by a delay-2 repeater), which gives a short pulse; the torch inverts it, the line drops for a few gt, every Q unlocks together, copies its input once (2 gt delay, shorter than the window for a second hop) and locks again, so one press is exactly one shift however long the button is held. Lamps are powered by dust lying on a wool block beside each. MEASURED: idle all off; 9 ones then 9 zeros fill and flush the register; the pattern 01001101 plus zeros, and 16 alternating bits, shift exactly one place per press (24 gt apart, a button is 20 gt); a lamp rises 8 gt after the button click and falls 12 gt after it (the lamp's own 4 gt turn-off delay included), every changing bit at the same tick. Faster presses were not established: a stone button cannot be re-pressed inside its 20 gt."
traits: [vertical, comparator_based]
