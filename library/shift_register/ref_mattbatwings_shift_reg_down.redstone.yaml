  Q: repeater[delay=1,facing=west]
  U: redstone_wire[east=side,north=none,south=up,west=none]
  V: redstone_wire[east=none,north=side,south=up,west=none]
  X: redstone_wire[east=side,north=side,south=none,west=none]
  b: {name: btn, block: 'stone_button[face=wall,facing=west]'}
  d: {name: din, block: 'lever[face=wall,facing=west]'}
  s: smooth_stone
  w: white_wool
