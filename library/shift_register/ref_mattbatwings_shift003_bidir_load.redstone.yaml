name: ref_mattbatwings_shift003_bidir_load
description: "Rebuild of LRA entry SHIFT003 \"Bi-directional Shift Register w/ Load\" by mattbatwings (Tested & Functional, Recommended; Discord https://discord.com/channels/1361854816837435433/1472419123198824530). SOURCED from the README: pistonless, 8-bit number in on levers, Load / Shift up / Shift down buttons, 8-bit output. Size: schematic 11x18x9 (lime wool tower, one bit per 2 layers, 8 output lamps on the east face, data levers on lamps at the west). As rebuilt 12x18x9 (try; one extra west column for the driver cells). Harness changes: (1) the harness only emulates levers and buttons on plain full blocks, and these sit on lamps and wool, so each data lever (on a lamp) and each of the three buttons (on lime wool) is a repeater[delay=1] pointing east into that block, on a smooth_stone support added under it, fed by an input cell behind it: the same strong power into the block plus 2 gt of repeater delay (the lever's x=2 cell moved to x=3, input d0..d7 at x=2; button inputs at x=0). (2) The two oak signs are dropped. Inputs: d0..d7 level (1 = lever up, bit i), b1 = shift up, b4 = load, b7 = shift down (the buttons are the three on the west face at z=1, 4, 7; which does what found by trying: b4 loads, b1 shifts toward q7, b7 toward q0; the README does not say). A press is drive 1, wait, drive 0. Outputs q0..q7 are the lamps; q0 is the lowest layer (y=3), q7 the top (y=17). MEASURED (all PASS): load copies the levers into the register and replaces the old value (0xA5, 0x3C, 0xFF, 0x00, 0x81), later lever changes do nothing; up shifts toward q7 and the top bit falls off, zeros enter at q0 (a 1 walked through all 8 places and out, 0xA5 three times); down mirrors it; a mixed up/down run loses bits at the ends; a button held 80 gt shifts once; load after shifts works. Latency from the driver edge to the lamp: rise 14 gt, fall 18 gt for up, down and load (wave tests; includes my 2 gt repeater and the lamp's own 4 gt turn-off). Speed: a 20 gt press (a stone button's length) is what the original gets; MEASURED here with the repeater driver a 3 gt press passes and a 2 gt press drops shifts, and back-to-back presses pass 6 in a row at 3 on 5 off and 4 on 4 off (period 8 gt) but drop shifts at periods of 7 (3 on 4 off, 4 on 3 off) and below (also 3 on 3 off, 4 on 2 off, 5 on 2 off, 6 on 2 off); the README states no speed. INFERRED, not traced: each slice is a lever-fed lamp, a subtract comparator that reads it on load, and subtract comparators in the layers between slices (the 'b' cells at z=1 and z=7 facing east) that pass a neighbour bit up or down; the memory is built from comparator and dust loops with no torches in the stack (the only torches sit on the top and bottom wool)."
