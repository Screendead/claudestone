name: vwire_glass_zigzag_long
description: '28 blocks of rise in 2 ticks. A glass zigzag (see vwire_glass_zigzag_up) climbs 13 blocks in columns z1/z2; at y14 its last dust (strength 2) feeds a repeater at z3 facing north, which hard-powers a stone at z4; the dust on that stone restarts at 15 and a second zigzag in z3/z4 climbs to y29. Interface: input driver a north of the bottom dust (y1, z1); named mid is the regenerating repeater; output o is the dust at y29, z4. 1x30x4, rise 28, 2 ticks. Versus the others: the fastest way up over more than 15 blocks (a torch tower costs 1 tick per block, an observer tower 2), one-way like every glass zigzag, and lightless and silent. Chain more regenerator stages every 15 blocks for 2 ticks each; the zigzag direction flips at each stage.'
traits:
- vertical
- lightless
- silent
- one_wide
- ultrafast
- reset_safe
- tick_accurate
- pistonless
- entityless
- survival_friendly
palette:
  .: air
  S: stone
  a: {input: a}
  '-': redstone_wire
  A: glass
  m: {name: mid, block: 'repeater[facing=north]'}
  o: {output: o, block: redstone_wire}
