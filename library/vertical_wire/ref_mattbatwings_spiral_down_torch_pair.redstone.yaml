name: ref_mattbatwings_spiral_down_torch_pair
description: "Downward 2x2 spiral staircase (25 down) with the booster as two torches in series (a wall torch on a wool block inverts, a second wall torch beside re-inverts into a powered 4-way dust junction); like spiral_down_repeater but torch-boosted. 3x26x2. Source: mattbatwings' 'How To Wire Like a Redstone Pro!' world (Java 1.18.2), demo cluster W50 at world origin [-12, 58, -194] (SOURCED: block layout read from the world; the demo is one lever and two lamps).  Changed for the harness: the demo's input lamp under the lever became stone (the harness only emulates a lever on a plain full block; a lamp is a conductor too, so the lever still strongly powers it and the dust beside/below it), everything else is the cluster's blocks, with power/lit/powered state reset so the game recomputes it. The output lamp is cell 'out'; the test clicks the named lever. MEASURED on 26.3 (lever click to lamp): rise 4 gt, fall 8 gt; starts lit after placement, dark by tick 6 (settle 40). Not tested: W47 (same with two torch pairs, 41 tall) and W48 (plain 17-tall spiral, same as vwire_spiral), both skipped for plot height 32 / duplication. The how-it-works wording is INFERRED from the block layout (nothing was traced block by block); the pass shows only that the level arrives. No test shows the booster is necessary."
