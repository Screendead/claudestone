name: ref_mattbatwings_hex_down
description: "Downward hex (0-15 strength) transmission, 15 blocks down in a 9x17x3 box, strength kept exactly. The barrel and its comparator are at the top; the same ruler idea as ref_mattbatwings_hex_flat and ref_mattbatwings_hex_up runs down a spiral: a decaying dust line passes its power through a wool block to a 1-tick repeater at each level, the repeaters inject 15 into a second line, and a comparator at the bottom reads the strength S that survives. Source: mattbatwings' Logical Redstone Archive TRANSMIT004 'Downward Hex Transmission' (endorsed by mattbatwings, Tested & Functional, Recommended; discord.com/channels/1361854816837435433/1472406849079873610); README (SOURCED): 'a way to transmit hex downward quickly', Hex in, Hex out. The layout (repeaters read a dust-powered wool block and write into a wool block under the second line) is INFERRED from the blocks; I did not trace the spiral cell by cell. Harness changes: none to the circuit; the barrel is filled with insert (n full cobblestone stacks, n=1,2,4,6..27 give strengths 1..15), the top comparator is cin and the bottom output dust is out. MEASURED: strengths 0..15 all arrive on out at the source strength; after a full barrel cin rises at tick 2 and out at tick 6, so the 15-block drop costs 4 gt."
traits: [analog, vertical, comparator_based, container_based, lightless, silent, pistonless, entityless, survival_friendly]
