name: vwire_staircase_bus
description: 'Two vwire_staircase lanes at pitch 1, skewed: lane x1 runs two blocks higher than lane x0. With no skew or a skew of 1 a dust sees the next lane''s dust (directly, or diagonally through the air or the step beside it), which was checked live; at a skew of 2 every cell beside a dust is air with air below it. Interface: lane 0 bottom a/bottom at (x0, y1, z1), top t/o at (x0, y9, z9); lane 1 bottom b/bottom2 at (x1, y3, z1), top u/p at (x1, y11, z9). 2x12x9, 8 up or down per lane, 0 ticks, each lane independent in both directions. Add lanes with 2 more blocks of skew each. The dense bus for instant bidirectional risers; for a square bus use vwire_torch_tower_bus or vwire_observer_up.'
traits:
- vertical
- lightless
- silent
- tileable
- instant
- ultrafast
- reset_safe
- pistonless
- entityless
- survival_friendly
