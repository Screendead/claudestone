name: ref_mattbatwings_wire_target_repeater
description: "Flat dust line that turns a corner into a target block, a repeater reads the target and the line continues east on wool to the lamp: the target block acts as a conductor between dust and repeater. 9x2x17. Source: mattbatwings' 'How To Wire Like a Redstone Pro!' world (Java 1.18.2), demo cluster W82 at world origin [-9, 56, -90] (SOURCED: block layout read from the world; the demo is one lever and two lamps).  Changed for the harness: the demo's input lamp under the lever became stone (the harness only emulates a lever on a plain full block; a lamp is a conductor too, so the lever still strongly powers it and the dust beside/below it), everything else is the cluster's blocks, with power/lit/powered state reset so the game recomputes it. The output lamp is cell 'out'; the test clicks the named lever. MEASURED on 26.3 (lever click to lamp): rise 2 gt, fall 6 gt (repeater 2 + lamp off 4); target block passes dust's power to the repeater as a plain conductor would. The how-it-works wording is INFERRED from the block layout (nothing was traced block by block); the pass shows only that the level arrives. No test shows the booster is necessary."
palette:
  .: air
  A: light_blue_wool
  B: redstone_wire[east=side,north=none,south=side,west=none]
  C: target
  D: repeater[delay=1,facing=west]
  E: redstone_wire[east=side,north=none,south=none,west=side]
  o: {output: out, block: redstone_lamp}
  F: lime_wool
  G: redstone_wire[east=none,north=side,south=side,west=none]
  H: {block: stone, fixture: true}
  I: orange_wool
  l: {name: lever, block: 'lever[face=floor,facing=west]', fixture: true}
