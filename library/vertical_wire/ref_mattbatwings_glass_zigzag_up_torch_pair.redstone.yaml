name: ref_mattbatwings_glass_zigzag_up_torch_pair
description: "Upward glass zigzag riser, 24 rise, with a torch pair booster: a dust powers a wool block, wall torch (facing north) inverts into the wool beside it and a second wall torch (facing south) re-inverts onto the next dust, then the zigzag continues on glass. 1x26x4. Same build as W57 (cyan glass). Source: mattbatwings' 'How To Wire Like a Redstone Pro!' world (Java 1.18.2), demo cluster W64 at world origin [-13, 56, -139] (SOURCED: block layout read from the world; the demo is one lever and two lamps).  Changed for the harness: the demo's input lamp under the lever became stone (the harness only emulates a lever on a plain full block; a lamp is a conductor too, so the lever still strongly powers it and the dust beside/below it), everything else is the cluster's blocks, with power/lit/powered state reset so the game recomputes it. The output lamp is cell 'out'; the test clicks the named lever. MEASURED on 26.3 (lever click to lamp): rise 4 gt, fall 8 gt, starts lit after placement and settles dark by tick 6 (settle 40). The how-it-works wording is INFERRED from the block layout (nothing was traced block by block); the pass shows only that the level arrives. No test shows the booster is necessary."
