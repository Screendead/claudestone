  - {wait: 4}
  - drive: {a: 0}
  - {wait: 4}
  - drive: {a: 1}
  - {wait: 40}
  - expect: {o: 1}
  - drive: {a: 0}
  - {wait: 4}
  - drive: {a: 1}
  - {wait: 4}
  - drive: {a: 0}
  - {wait: 40}
  - expect: {o: 0}
