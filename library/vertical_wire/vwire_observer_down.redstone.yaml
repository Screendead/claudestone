name: vwire_observer_down
description: '1x1 pulse faller: observers facing up, each watching the one above and firing into the one below; the input dust sits on top of the column. Every input edge leaves the bottom observer as one 2-tick pulse after exactly 2 ticks per observer. Interface: input driver a north of the dust on top (y10); output o is the bottom observer (y2), which hard-powers the block beneath it. 1x9x1, 8 down, 16 ticks. Versus the others: the only lightless, silent 1x1 way down, tileable and stackable, but edge-only (see vwire_observer_bulb_down for a level).'
traits:
- vertical
- observer_based
- lightless
- silent
- one_wide
- tileable
- stackable
- ultracompact
- tick_accurate
- pistonless
- entityless
- survival_friendly
palette:
  .: air
  o: {output: o, block: 'observer[facing=up]'}
  A: observer[facing=up]
  a: {input: a}
  '-': redstone_wire
