name: ref_mattbatwings_spirals_updown
description: "Eight bits through a 3x16x24 box with the same spiral cell stamped twice per direction: four bits go up (inputs u0..u3 at the bottom, outputs U0..U3 at y=14) and four go down (inputs d0..d3 at the top, outputs D0..D3 at the bottom) in a second group 8 blocks further south. Each group is two 4-row spiral cells (one dust staircase turning a corner every step on cyan wool), the two bits in a cell offset by 2 rows, so no two lines touch. Source: mattbatwings' Logical Redstone Archive TRANSMIT005 'Upward/Downward Binary Transmission' (endorsed by mattbatwings, Tested & Functional, Recommended; discord.com/channels/1361854816837435433/1472406879345971349); README (SOURCED): 'a way to transmit binary upward or downward by staggering spirals every 2 blocks', 4b in, 4b out; overview video youtu.be/pT-VWjqYli0. Changed for the harness: the demo levers and the lamps under them are gone; each input is a redstone block in the lever's cell (up group) or in the lamp's cell under the lever (down group, directly on the dust column), and the lamps that show the outputs stay as o-cells. The up group is the original demo; the down group is the same shape upside down (its input lamps are at the top and output lamps at the bottom). MEASURED: 64 patterns (each of 16 values on up only, on down only, on both, and up against the complement down) all arrive bit for bit with no crosstalk; rise 0 gt (the spirals are pure dust, so instant), fall 4 gt (the output lamp's own turn-off delay). Not tested: stacking more cells."
traits: [vertical, pistonless, entityless, survival_friendly]
