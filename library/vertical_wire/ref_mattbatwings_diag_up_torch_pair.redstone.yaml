name: ref_mattbatwings_diag_up_torch_pair
description: "Upward 1:1 staircase, 19 steps, with the booster done by two redstone torches in series instead of a repeater: dust powers a wool block, torch 1 beside it inverts, torch 2 re-inverts and feeds the next dust at full strength; the 1-wide column stays 1 wide. 1x21x24. Source: mattbatwings' 'How To Wire Like a Redstone Pro!' world (Java 1.18.2), demo cluster W46 at world origin [-14, 56, -244] (SOURCED: block layout read from the world; the demo is one lever and two lamps).  Changed for the harness: the demo's input lamp under the lever became stone (the harness only emulates a lever on a plain full block; a lamp is a conductor too, so the lever still strongly powers it and the dust beside/below it), everything else is the cluster's blocks, with power/lit/powered state reset so the game recomputes it. The output lamp is cell 'out'; the test clicks the named lever. MEASURED on 26.3 (lever click to lamp): rise 4 gt, fall 8 gt (2 torches x 2 gt, lamp off adds 4); the circuit starts lit after placement and drops to dark by tick 6, so the test settles 40. Torches cost 2 gt more than a repeater here but need no facing. The how-it-works wording is INFERRED from the block layout (nothing was traced block by block); the pass shows only that the level arrives. No test shows the booster is necessary."
palette:
  .: air
  A: light_blue_wool
  B: {block: stone, fixture: true}
  C: orange_wool
  D: redstone_wire[east=none,north=up,south=side,west=none]
  l: {name: lever, block: 'lever[face=floor,facing=west]', fixture: true}
  n: redstone_wall_torch[facing=north]
  E: redstone_wire[east=none,north=side,south=side,west=none]
  F: lime_wool
  o: {output: out, block: redstone_lamp}
