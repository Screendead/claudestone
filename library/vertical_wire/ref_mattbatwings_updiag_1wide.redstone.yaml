name: ref_mattbatwings_updiag_1wide
description: "Upward diagonal 4-bit transmission in a 1-wide column (x=0): four dust lines climb one block for every block north, each dust resting on a cyan stained glass step (glass is climbable but not a redstone conductor); the four lines interleave 2 blocks apart, line i starting at y=1,3,5,7 and ending 14 higher at y=15,17,19,21. Source: mattbatwings' Logical Redstone Archive TRANSMIT001 'Upward Diagonal Binary Transmission' (endorsed by mattbatwings, Tested & Functional, Recommended; discord.com/channels/1361854816837435433/1472406729877753939). README (SOURCED): 'a way to transmit vertical binary using a signal strength trick, 1 wide', 4b in, 4b out. Changed for the harness: the demo levers and the lamps they sat on are gone and each input is a redstone block directly behind its 1-tick input repeater (a redstone block would not hard-power a lamp that then feeds the repeater); the four output lamps stay, named o1..o4, line i feeds oi. Size 1x22x18. MEASURED: all 16 input patterns reach the matching lamps with the other lines undisturbed; rise 4 gt (input repeater 2 + output repeater 2), fall 8 gt (not explained; 4 of it is the lamp's turn-off delay), so the 14-block climb itself adds no ticks on the rising edge. INFERRED, not traced: why neighbouring lines, whose dust sits diagonally next to each other with only glass between, do not merge."
traits: [vertical, one_wide, pistonless, entityless, survival_friendly]
palette:
  ".": "air"
  "A": "cyan_stained_glass"
  "B": "cyan_wool"
  "C": "redstone_wire[east=none,north=up,south=side,west=none]"
  "D": "repeater[delay=1,facing=south]"
  "F": "redstone_wire[east=none,north=up,south=up,west=none]"
  "G": "redstone_wire[east=none,north=side,south=up,west=none]"
  "H": "redstone_wire[east=none,north=side,south=side,west=none]"
  "a": {"input": "a"}
  "b": {"input": "b"}
  "c": {"input": "c"}
  "d": {"input": "d"}
  "w": {"output": "o1", "block": "redstone_lamp"}
  "x": {"output": "o2", "block": "redstone_lamp"}
  "z": {"output": "o4", "block": "redstone_lamp"}
  "u": {"output": "o3", "block": "redstone_lamp"}
