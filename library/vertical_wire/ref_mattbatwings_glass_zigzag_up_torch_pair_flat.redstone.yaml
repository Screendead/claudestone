name: ref_mattbatwings_glass_zigzag_up_torch_pair_flat
description: "Upward glass zigzag riser with a booster of two floor torches in a row on a three-wool run (wool, torch, wool, torch, wool) between a flat dust and the next zigzag dust; 1x26x4. Source: mattbatwings' 'How To Wire Like a Redstone Pro!' world (Java 1.18.2), demo cluster W61 at world origin [-13, 56, -149] (SOURCED: block layout read from the world; the demo is one lever and two lamps).  Changed for the harness: the demo's input lamp under the lever became stone (the harness only emulates a lever on a plain full block; a lamp is a conductor too, so the lever still strongly powers it and the dust beside/below it), everything else is the cluster's blocks, with power/lit/powered state reset so the game recomputes it. The output lamp is cell 'out'; the test clicks the named lever. MEASURED on 26.3 (lever click to lamp): rise 4 gt, fall 8 gt, settle 40. Same speed as the wall-torch pair (W64); skipped: W56, the same with two torch hops, 44 tall, over the plot height. The how-it-works wording is INFERRED from the block layout (nothing was traced block by block); the pass shows only that the level arrives. No test shows the booster is necessary."
