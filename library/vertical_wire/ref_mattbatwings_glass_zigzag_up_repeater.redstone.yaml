name: ref_mattbatwings_glass_zigzag_up_repeater
description: "Upward glass zigzag riser (dust on stained glass, the vwire_glass_zigzag_up trick, 1 wide) with a repeater booster in a 2-block dust detour mid-way; rise 24 vs the 15 a plain riser tops out at. The zigzag is one way (up only). 1x26x4. Source: mattbatwings' 'How To Wire Like a Redstone Pro!' world (Java 1.18.2), demo cluster W65 at world origin [24, 56, -138] (SOURCED: block layout read from the world; the demo is one lever and two lamps).  Changed for the harness: the demo's input lamp under the lever became stone (the harness only emulates a lever on a plain full block; a lamp is a conductor too, so the lever still strongly powers it and the dust beside/below it), everything else is the cluster's blocks, with power/lit/powered state reset so the game recomputes it. The output lamp is cell 'out'; the test clicks the named lever. MEASURED on 26.3 (lever click to lamp): rise 2 gt, fall 6 gt (repeater 2 + lamp off 4). W70 is the same build with a lever that started on; the glass colour variants (cyan/light blue) are decoration. The how-it-works wording is INFERRED from the block layout (nothing was traced block by block); the pass shows only that the level arrives. No test shows the booster is necessary."
