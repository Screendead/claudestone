name: ref_mattbatwings_diag_up_repeater
description: "Upward diagonal (1 up per block north) on the same wool staircase, 20 steps, with a repeater in the middle as a booster (the staircase dust passes into a flat dust section at the repeater's wool seat). 1x21x25. Source: mattbatwings' 'How To Wire Like a Redstone Pro!' world (Java 1.18.2), demo cluster W45 at world origin [-20, 56, -245] (SOURCED: block layout read from the world; the demo is one lever and two lamps).  Changed for the harness: the demo's input lamp under the lever became stone (the harness only emulates a lever on a plain full block; a lamp is a conductor too, so the lever still strongly powers it and the dust beside/below it), everything else is the cluster's blocks, with power/lit/powered state reset so the game recomputes it. The output lamp is cell 'out'; the test clicks the named lever. MEASURED on 26.3 (lever click to lamp): rise 2 gt, fall 6 gt (repeater 2 + lamp off 4). Same staircase as vwire_staircase, which is bidirectional, plus a repeater to beat the 15-strength limit. The how-it-works wording is INFERRED from the block layout (nothing was traced block by block); the pass shows only that the level arrives. No test shows the booster is necessary."
palette:
  .: air
  A: light_blue_wool
  B: {block: stone, fixture: true}
  C: orange_wool
  D: redstone_wire[east=none,north=up,south=side,west=none]
  l: {name: lever, block: 'lever[face=floor,facing=west]', fixture: true}
  E: repeater[delay=1,facing=south]
  F: redstone_wire[east=none,north=side,south=side,west=none]
  G: lime_wool
  o: {output: out, block: redstone_lamp}
