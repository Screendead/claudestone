name: ref_mattbatwings_glass_zigzag_torch_refresh_bus4
description: "Four-bit bus climbing 25 blocks in a 4x7 footprint: each bit is a dust zigzag on cyan stained glass (dust steps up one block per block north, glass is not a redstone conductor so dust climbs past it) with a pair of redstone torches on wool two-thirds of the way up (y=16 and y=18) that re-drives the signal at full strength, so two inversions restore 15. Source: mattbatwings' 'How To Wire Like a Redstone Pro!' world (Java 1.18.2), cluster W63, world origin 47,56,-146; a vertical bus riser with 4 levers at the bottom and 4 lamps at the top (SOURCED). Changed for the harness: the four demo levers become input cells (a redstone block next to the first dust of each line) and the four demo lamps under them are dropped; the output lamps stay, o1..o4 = lines a..d. Size 4x27x7. MEASURED in 26.3: all 16 patterns arrive on the matching lamps, delay 8 gt (rise 4, fall 8). INFERRED: rise 4 is the two torches at 2 gt each; the extra 4 on the fall is the lamp's own 4 gt turn-off delay, not the wire. INFERRED, not tested: the torch pair is what lets the signal exceed 15 dust blocks (the glass zigzag alone would lose a level per dust). The how-it-works wording is INFERRED from the block layout (nothing was traced block by block); the pass shows only that the level arrives. No test shows the booster is necessary."
traits:
- vertical
palette:
  .: air
  A: cyan_stained_glass
  B: orange_wool
  C: redstone_wire[east=none,north=up,south=side,west=none]
  a: {input: a}
  b: {input: b}
  d: {input: d}
  c: {input: c}
  D: redstone_wire[east=none,north=side,south=up,west=none]
  E: redstone_wire[east=none,north=side,south=side,west=none]
  F: cyan_wool
  '*': redstone_torch
  o: {output: o4, block: redstone_lamp}
  G: {output: o3, block: redstone_lamp}
  H: lime_wool
  I: {output: o1, block: redstone_lamp}
  J: {output: o2, block: redstone_lamp}
