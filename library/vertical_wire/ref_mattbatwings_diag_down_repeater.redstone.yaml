name: ref_mattbatwings_diag_down_repeater
description: "Downward diagonal wire, one block down per block along (north) on a 1:1 staircase: each dust sits on a light blue wool block and connects diagonally to the dust one step lower beside the next wool. 24 steps is more than dust's 15 strength, so one repeater (facing along the run, between wool blocks) restores it half way. Lever sits on a lamp (the lever strongly powers it) directly above the top dust. 1x26x27. Source: mattbatwings' 'How To Wire Like a Redstone Pro!' world (Java 1.18.2), demo cluster W24 at world origin [-16, 56, -306] (SOURCED: block layout read from the world; the demo is one lever and two lamps).  Changed for the harness: the demo's input lamp under the lever became stone (the harness only emulates a lever on a plain full block; a lamp is a conductor too, so the lever still strongly powers it and the dust beside/below it), everything else is the cluster's blocks, with power/lit/powered state reset so the game recomputes it. The output lamp is cell 'out'; the test clicks the named lever. MEASURED on 26.3 (lever click to lamp): rise 2 gt (the repeater), fall 6 gt (repeater 2 + the output lamp's 4 gt turn-off delay); the 24-step drop needs the repeater (INFERRED from dust strength loss 1/block, not tested without it). Library neighbour: vwire_staircase (same dust-on-solid staircase, 8 steps, no booster). The how-it-works wording is INFERRED from the block layout (nothing was traced block by block); the pass shows only that the level arrives. No test shows the booster is necessary."
palette:
  .: air
  A: light_blue_wool
  B: lime_wool
  o: {output: out, block: redstone_lamp}
  C: redstone_wire[east=none,north=side,south=up,west=none]
  D: redstone_wire[east=none,north=side,south=side,west=none]
  E: repeater[delay=1,facing=south]
  F: {block: stone, fixture: true}
  G: orange_wool
  l: {name: lever, block: 'lever[face=floor,facing=west]', fixture: true}
