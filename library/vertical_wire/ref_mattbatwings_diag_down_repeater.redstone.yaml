tests:
- name: lever on then off
  settle: 40
  steps:
  - expect: {out: 0}
  - use: lever
  - wave: {out: '00111111'}
  - wait: 20
  - expect: {out: 1}
  - use: lever
  - wave: {out: '111111000000'}
  - wait: 20
  - expect: {out: 0}
