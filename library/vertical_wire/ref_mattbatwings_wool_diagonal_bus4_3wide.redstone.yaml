name: ref_mattbatwings_wool_diagonal_bus4_3wide
description: "Four-bit bus rising 19 blocks in a 3-wide, 21-tall, 19-long diagonal with no repeaters or torches: each bit is dust on a cyan wool staircase (one block up per block south), the four lines offset by two in y and one in x so neighbours never touch. Source: mattbatwings' 'How To Wire Like a Redstone Pro!' world (Java 1.18.2), cluster W28, world origin 50,56,-302 (SOURCED). Changed for the harness: the cut-out cluster has lamps with levers at both ends. The bottom lamps are replaced by input cells (a redstone block beside the first dust of each line, where the lamp stood); the top lever and lamp pairs, whose dust ends had no lamp in the cut, are dropped and a fixture-free output lamp is placed where each top dust points. o1..o4 = lines a..d. MEASURED in 26.3: all 16 patterns map straight through, delay 4 gt (rise 0, fall 4). INFERRED: the rise is instant because dust and wool carry no delay, and the fall 4 is the output lamp's own turn-off delay. The top-end lamp placement is INFERRED from the dust's connection state and is why the pass counts for the staircase, not for the original demo lamps. The how-it-works wording is INFERRED from the block layout (nothing was traced block by block); the pass shows only that the level arrives. No test shows the booster is necessary."
traits:
- vertical
palette:
  .: air
  A: cyan_wool
  B: lime_wool
  a: {input: a}
  C: redstone_wire[east=none,north=side,south=side,west=none]
  D: redstone_wire[east=none,north=side,south=up,west=none]
  b: {input: b}
  c: {input: c}
  d: {input: d}
  E: orange_wool
  o: {output: o1, block: redstone_lamp}
  F: {output: o2, block: redstone_lamp}
  G: {output: o3, block: redstone_lamp}
  H: {output: o4, block: redstone_lamp}
