name: ref_mattbatwings_spiral_down_repeater
description: "Downward 2x2 spiral staircase (one block down per quarter turn, x0/x1 by z0/z1) of dust on light blue wool, as in vwire_spiral but long enough (23 down) to need a repeater; one repeater sits in a flat dust segment half way, the seat dust bridging with a glass block. 3x24x3. Source: mattbatwings' 'How To Wire Like a Redstone Pro!' world (Java 1.18.2), demo cluster W55 at world origin [-12, 60, -184] (SOURCED: block layout read from the world; the demo is one lever and two lamps).  Changed for the harness: the demo's input lamp under the lever became stone (the harness only emulates a lever on a plain full block; a lamp is a conductor too, so the lever still strongly powers it and the dust beside/below it), everything else is the cluster's blocks, with power/lit/powered state reset so the game recomputes it. The output lamp is cell 'out'; the test clicks the named lever. MEASURED on 26.3 (lever click to lamp): rise 2 gt, fall 6 gt. Spiral keeps the shaft 2x2 where the diag takes 1x25 along. The how-it-works wording is INFERRED from the block layout (nothing was traced block by block); the pass shows only that the level arrives. No test shows the booster is necessary."
