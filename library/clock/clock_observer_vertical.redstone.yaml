name: clock_observer_vertical
description: 'The observer pair stood on end, 1x2x1: observer a (y=1, facing up) and observer out (y=2, facing down) watch each other. out hard-powers the block above it (y=3) and a the block below it (y=0), so it clocks a column: a lamp, a dust line or a piston directly above or below with no wiring. Same timing as clock_observer_pair: self-starts on placement, out 2 ticks on, 4 off (period 6), a 2 ticks after out. No input, no support block, no light, no sound. Trade-off: the vertical twin of clock_observer_pair (1 block footprint, output up and down instead of north and south); not stackable directly on another copy, since the observers facing up and down would watch the copy''s observers.'
traits:
- ultracompact
- one_wide
- tileable
- vertical
- observer_based
- silent
- lightless
- pistonless
- entityless
- tick_accurate
- survival_friendly
palette:
  .: air
  a: {name: a, block: 'observer[facing=up]'}
  b: {output: out, block: 'observer[facing=down]'}
layers:
  1: |
    a
  2: |
    b
