name: clock_torch_repeater
description: 'The textbook torch clock at the fastest rate that never burns out: a wall torch (x=2, z=0, facing east, on the stone at x=1, z=0) lights the loop dust (x=2, z=1 and z=2, x=1, z=2), which feeds a 2-delay repeater (x=1, z=1, facing south) back into the stone, turning the torch off. Half period = torch 2 + repeater 4 = 6 ticks: out (the torch) is 6 on, 6 off, period 12, starting lit at placement. Burnout rule, read from RedstoneTorchBlock in 26.3 and confirmed here: a torch burns out when it turns off 8 times within 60 ticks, then stays off 160 ticks. Period 12 turns off 5 times per 60 ticks and runs forever (tested 600 ticks); with delay 1 (period 8) it burns out at tick 60 and restarts at 220. Only turn-offs count, so by the same rule a 3-torch ring (also period 12) should be safe too (not built here) and the old 5-torch rule looks like folklore. Input stop (x=0, z=2, west of the loop''s corner dust) holds the loop powered: the torch finishes its current lit half and then stays
  off; releasing stop relights it exactly 6 ticks later and it runs on from there. The torch powers its east neighbour (x=3) and the block above it, which is where to take the signal; the loop dust carries it too but stays on while stop is held. Delay 3 and 4 give periods 16 and 20. Size 2x2x3 plus the stop cell. Trade-off: survival-cheap and familiar, but torches mean light updates, and it has an active-high stop rather than an enable; clock_comparator_repeater does the same job silently, lightlessly and faster (period 8) in the same 2x2x3.'
traits:
- compact
- flat
- horizontal
- torch_based
- silent
- pistonless
- entityless
- tick_accurate
- reset_safe
- lockable
- survival_friendly
palette:
  .: air
  '=': smooth_stone
  s: {input: stop}
  S: stone
  t: {output: out, block: 'redstone_wall_torch[facing=east]'}
  o: {name: loop, block: redstone_wire}
  r: {name: rep, block: 'repeater[facing=south,delay=2]'}
  '-': redstone_wire
layers:
  0: |
    .==
    .==
    .==
  1: |
    .St
    .ro
    s--
