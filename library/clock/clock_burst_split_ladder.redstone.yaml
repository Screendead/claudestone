name: clock_burst_split_ladder
description: 'Burst generator in 23x2x11: one pulse in, eight pulses 10 game ticks apart out, toggling a waxed copper bulb (the compact 16x16 door''s spit ladder). layout3''s two-line repeater ladder (T flows out, C flows back, one rung every 3 blocks, 10 ticks per rung) split into two four-rung halves on either side of the bulb: the west half is fed at once, the east half 40 ticks later through a hairpin of delay-1/2 repeaters, so the pulse times are those of one eight-rung ladder (T_0 + 4 + 10 i) in half its length. Every repeater the train passes is at delay 1 or 2, so the pulses stay at most 4 ticks wide and keep their gaps (delay_pulse_preserving: a repeater swallows an off-gap no longer than its setting). Input a feeds the split block through a repeater; out is the comparator reading the bulb (lit after toggles 1, 3, 5, 7).'
traits: [flat, pistonless, entityless, tick_accurate, comparator_based]
