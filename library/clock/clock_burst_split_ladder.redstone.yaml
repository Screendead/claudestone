  .: air
  a: {input: a}
  A: 'repeater[facing=east,delay=1]'
  B: 'repeater[facing=east,delay=2]'
  C: 'repeater[facing=north,delay=1]'
  D: 'repeater[facing=south,delay=2]'
  E: 'repeater[facing=west,delay=1]'
  F: 'repeater[facing=west,delay=2]'
  G: 'stone'
  H: 'waxed_copper_bulb[lit=false,powered=false]'
  o: {output: out, block: 'comparator[facing=south,mode=compare]'}
