name: clock_comparator_dust
description: 'Fastest clean clock here: period 4 game ticks (2 on, 2 off), toggled by en, with no torches, repeater-free loop and no sound. A subtract-mode comparator (x=1, z=0, facing west) has en on its back (the cell west of it, x=0, z=0) and its output dust (x=2, z=0) runs round x=2, z=1 into the dust at x=1, z=1, which points into the comparator''s south side. The comparator output is 15 - side, and dust loses 1 per block, so the output swings 15, 15, 2, 2 while the side dust swings 13, 13, 0, 0: the side dust is a clean on/off square wave and the repeater out (x=1, z=2, facing north, delay 1) squares it to a 15/0 output 2 ticks later. First out edge 4 ticks after en rises; dropping en lets the current half period finish, then one last out pulse at most, then it rests at 0. Size 2x2x3 plus the en cell west of the comparator. Trade-off: twice the speed of clock_comparator_repeater and nothing to tune, but the period is fixed at 4 and the comparator''s own output dust is analog (15/2),
  so take the signal from the side dust or the repeater, never from the comparator''s front. No Java clock has a period of 2 game ticks: every component that can hold a state change (repeater, comparator, torch, observer) takes at least 2 ticks, so a loop half-period is at least 2.'
traits:
- ultrafast
- compact
- flat
- horizontal
- analog
- comparator_based
- silent
- lightless
- pistonless
- entityless
- tick_accurate
- reset_safe
- survival_friendly
palette:
  .: air
  '=': smooth_stone
  e: {input: en}
  C: {name: cmp, block: 'comparator[facing=west,mode=subtract]'}
  a: {name: front, block: redstone_wire}
  b: redstone_wire
  s: {name: side, block: redstone_wire}
  o: {output: out, block: 'repeater[facing=north,delay=1]'}
layers:
  0: |
    .==
    .==
    .=.
  1: |
    eCa
    .sb
    .o.
