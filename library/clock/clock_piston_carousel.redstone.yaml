tests:
- name: quiet after placement, first pulse 3 gt after en, then period 3
  steps:
  - {wait: 20}
  - wave: {out: '00000000000000000000'}
  - drive: {en: 1}
  - wave: {out: '0001001001001001001001001001001001001001001001001001001001001001001001001001'}
- name: stop mid-lap, one last pulse, restart
  steps:
  - drive: {en: 1}
  - {wait: 30}
  - drive: {en: 0}
  - wave: {out: '1001000000000000000000000000000000000000'}
  - drive: {en: 1}
  - wave: {out: '0001001001001001001001001001'}
- name: stop on the tick the block reaches the gated corner, one more lap
  steps:
  - drive: {en: 1}
  - {wait: 36}
  - drive: {en: 0}
  - wave: {out: '1001001001000000000000000000000000000000'}
  - expect: {pa: 0, pb: 0, pc: 0, pd: 0, gate: 0}
