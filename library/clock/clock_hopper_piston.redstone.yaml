  .: air
  '=': smooth_stone
  S: stone
  a: {name: ca, block: 'comparator[facing=east]'}
  b: {name: cb, block: 'comparator[facing=west]'}
  A: hopper[facing=east]{Items:[{Slot:0b,id:"minecraft:redstone",count:10}]}
  B: hopper[facing=west]
  d: {name: da, block: 'redstone_wire[north=side,south=side,east=side,west=side]'}
  e: {name: db, block: 'redstone_wire[north=side,south=side,east=side,west=side]'}
  L: sticky_piston[facing=east]
  M: sticky_piston[facing=west]
  R: redstone_block
  o: {output: out, block: 'repeater[facing=north]'}
