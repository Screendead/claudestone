name: clock_observer_pulse
description: 'Toggleable pulse clock: 2-tick pulses every 10 game ticks while en is on, from an observer loop gated by a comparator; lightless and silent. en (x=0, z=0) is the back of a subtract comparator (x=1, z=0, facing west); observer out (x=2, z=0, facing west) watches the comparator and hard-powers x=3, z=0 behind it; observer b (x=2, z=1, facing north) watches out and feeds the loop dust (x=2, z=2 and x=1, z=2) into a 2-delay repeater (x=1, z=1, facing south) that holds the comparator''s side high for 4 ticks. Each comparator fall makes out pulse, which comes back round as a side pulse that drops and releases the comparator again: out is 2 on, 8 off, the first pulse 4 ticks after en rises. Dropping en lets at most one more pulse out, then it rests. Placement makes both observers fire once (out pulses at ticks 2-3) and then it is idle. Size 2x2x3 plus the en cell west of the comparator. Trade-off: gives short pulses, which is what droppers, dispensers, pistons and note blocks want,
  with an on/off input and no torch; for a 50% square wave use clock_comparator_repeater, for a free-running pulse clock use clock_observer_pair.'
traits:
- compact
- flat
- horizontal
- observer_based
- comparator_based
- silent
- lightless
- pistonless
- entityless
- tick_accurate
- survival_friendly
palette:
  .: air
  '=': smooth_stone
  e: {input: en}
  C: {name: cmp, block: 'comparator[facing=west,mode=subtract]'}
  A: {output: out, block: 'observer[facing=west]'}
  B: {name: b, block: 'observer[facing=north]'}
  '-': redstone_wire
  d: {name: side, block: 'repeater[facing=south,delay=2]'}
layers:
  0: |
    .==
    .==
    .==
  1: |
    eCA
    .dB
    .--
