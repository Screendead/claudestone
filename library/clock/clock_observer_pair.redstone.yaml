name: clock_observer_pair
description: 'Smallest clock in the library: two observers facing each other, 1x1x2 with no support, no light, no sound. Observer a (z=0, facing south) watches observer out (z=1, facing north) and each fires a 2-tick pulse when the other changes. It starts itself on placement (both fire at ticks 2-3), then out pulses 2 ticks on, 4 off (period 6) with a pulsing 2 ticks after it, so each observer''s back face (out''s south face at z=2, a''s north face at z=-1) hard-powers the block behind it with a 6-tick clock; wire both backs together and you get 4 on, 2 off. Always on: there is no input, and it stops only if one observer is removed or moved (e.g. by a piston). Trade-off: 2 blocks, but fixed period 6 and pulse output only; for an on/off input use clock_comparator_repeater or clock_comparator_dust. Copies side by side (x) never see each other, so a row of them is a 1-wide tileable clock bus.'
traits:
- ultracompact
- one_wide
- tileable
- horizontal
- flat
- observer_based
- silent
- lightless
- pistonless
- entityless
- tick_accurate
- survival_friendly
palette:
  .: air
  a: {name: a, block: 'observer[facing=south]'}
  b: {output: out, block: 'observer[facing=north]'}
layers:
  1: |
    a
    b
