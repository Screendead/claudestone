name: clock_minecart_shuttle
description: 'Entity clock: a minecart shuttling on a 5-rail track between two stone walls, 7x2x2 and 1 wide along the track. Row z=0, y=1: stone (x=0), powered rail (x=1), detector rail (x=2), rails (x=3, 4), powered rail (x=5), stone (x=6); both powered rails sit on redstone blocks, so they are always on and each one kicks a stopped cart away from the wall beside it. The cart (summoned on x=1) runs to the far wall, stops, is kicked back, and so on forever. The detector rail stays on for 20 ticks after the cart last touched it, and the cart passes it twice in quick succession at the x=1 end, so out (repeater x=2, z=1, facing north, reading the detector rail) settles to exactly 20 on, 20 off (period 40) from tick 74; before that it starts with 20 on (ticks 6-25), 8 off, 20 on, 20 off. A longer track gives a longer period (only this 5-rail track is tested; add a powered rail on a redstone block every few rails so the cart keeps its speed). Trade-off: runs with no redstone loop at all and
  ignores light and block updates, but the cart is noisy, it is an entity (can be pushed, and stops if its chunk unloads), and it is bigger than clock_comparator_repeater for any period it can make. Mostly useful where a track already exists or as the start of a rail-based timer.'
traits:
- uses_entities
- rail_based
- flat
- horizontal
- lightless
- pistonless
- tick_accurate
- survival_friendly
palette:
  .: air
  '=': smooth_stone
  S: stone
  R: redstone_block
  P: powered_rail[shape=east_west]
  r: rail[shape=east_west]
  D: detector_rail[shape=east_west]
  o: {output: out, block: 'repeater[facing=north]'}
layers:
  0: |
    .R===R.
    ..=....
  1: |
    SPDrrPS
    ..o....
entities:
- type: minecart
  pos:
  - 1.0
  - 1.0
  - 0.0
