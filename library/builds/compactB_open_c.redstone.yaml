tests:
- name: opening
  settle: 20
  steps:
  - run: setblock ~10 ~8 ~5 air strict
  - run: setblock ~11 ~8 ~5 air strict
  - run: setblock ~4 ~7 ~10 air strict
  - run: setblock ~8 ~7 ~9 air strict
  - run: setblock ~2 ~8 ~9 air strict
  - run: setblock ~0 ~6 ~10 air strict
  - run: setblock ~5 ~11 ~4 redstone_block strict
  - wait: 4
  - check: if block ~4 ~3 ~8 quartz_block
  - check: if block ~4 ~4 ~8 quartz_block
  - check: if block ~4 ~5 ~8 quartz_block
  - check: if block ~5 ~3 ~8 quartz_block
  - check: if block ~5 ~4 ~8 quartz_block
