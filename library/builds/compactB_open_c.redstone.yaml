  - check: if block ~4 ~4 ~8 air
  - check: if block ~4 ~5 ~8 air
  - check: if block ~5 ~3 ~8 air
  - check: if block ~5 ~4 ~8 air
  - check: if block ~5 ~5 ~8 air
  - check: if block ~6 ~3 ~8 air
  - check: if block ~6 ~4 ~8 air
  - check: if block ~6 ~5 ~8 air
  - check: if block ~4 ~2 ~8 quartz_block
  - check: if block ~5 ~2 ~8 quartz_block
  - check: if block ~6 ~2 ~8 quartz_block
  - check: if block ~4 ~6 ~8 quartz_block
  - check: if block ~5 ~6 ~8 quartz_block
  - check: if block ~6 ~6 ~8 quartz_block
  - check: if block ~3 ~3 ~8 quartz_block
  - check: if block ~3 ~4 ~8 quartz_block
  - check: if block ~3 ~5 ~8 quartz_block
  - check: if block ~7 ~3 ~8 quartz_block
  - check: if block ~7 ~4 ~8 quartz_block
  - check: if block ~7 ~5 ~8 quartz_block
  - check: if block ~3 ~6 ~8 sticky_piston[facing=down,extended=false]
  - check: if block ~7 ~6 ~8 sticky_piston[facing=west,extended=false]
  - check: if block ~4 ~8 ~8 sticky_piston[facing=down,extended=true]
  - check: if block ~3 ~7 ~8 sticky_piston[facing=east,extended=false]
