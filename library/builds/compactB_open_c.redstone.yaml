  - check: if block ~6 ~3 ~8 quartz_block
  - check: if block ~6 ~4 ~8 quartz_block
  - check: if block ~6 ~5 ~8 quartz_block
  - drive:
      in: 1
  - wait: 2
  - check: if block ~6 ~6 ~8 moving_piston
  - check: if block ~5 ~4 ~8 air
  - check: if block ~5 ~5 ~8 moving_piston
  - check: if block ~4 ~3 ~8 quartz_block
  - wait: 2
  - check: if block ~4 ~3 ~8 air
  - check: if block ~5 ~3 ~8 air
