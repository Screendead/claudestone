name: cpu_fib4
description: 'The whole CPU4 computer running the Fibonacci program (words 10 80 11 A0 90 20 D8 B3 F0): clock, program counter, 16x8 lever ROM, control decoder (mirrored in x), ALU, register file and two-digit display. OUT shows 1, 1, 2, 3, 5, 8, 13, then JC 8 halts it at PC 8. The test samples every register mid-cycle for 41 cycles of 200 gt.'
traits:
- torch_based
- pistonless
- entityless
