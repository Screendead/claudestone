name: cpu_fib4
description: 'The whole CPU4 computer running the Fibonacci program (words 10 80 11 A0 90 20 D8 B3 F0): clock, program counter, 16x8 lever ROM, control decoder (mirrored in x), ALU, register file and two-digit display. OUT shows 1, 1, 2, 3, 5, 8, 13, then JC 8 halts it at PC 8. Player controls at the north edge: START (wall lever at x 35, z 0) starts the clock, flip it on once; RESET (x 41, z 0) on for 20 s (two 200 gt cycles) then off sends PC to 0 and the program runs again. Colour key (every solid block is concrete; the legend signs along the north edge, x 1-27, repeat it): red = Clock and clock lines; orange = Program counter; yellow = ROM program words; purple = Control decoder; blue = Register A + reg file; cyan = Register B; brown = Flags Z C + flag lines; green = ALU sum and mux; lime = ALU carry chain; light gray = OUT register + display; light blue = Data buses pc a b y; magenta = Control lines op, writes, jt; pink = Immediates to PC and ALU; white = START, RESET levers + lines;
  black = display frame. Tests sample every register mid-cycle: fibonacci (41 cycles of 200 gt), reset (rst through one CAP at cycle 10, the program replays) and rerun (through the levers: run to the halt, RESET for two cycles, the same OUT sequence and halt again).'
traits:
- torch_based
- pistonless
- entityless
