name: cpu_fib4
description: 'The whole CPU4 computer running the Fibonacci program (words 10 80 11 A0 90 20 D8 B3 F0), built from the compact parts: cpu_clock_compact, the 16x8 lever ROM (rom_ctrl), cpu_pc_compact abutting its east face, cpu_ctrl_compact turned under the ROM, cpu_alu_compact (n muxed inside) abutting cpu_regs_compact, and cpu_out_display_compact at the north edge. OUT shows 1, 1, 2, 3, 5, 8, 13, then JC 8 halts it at PC 8. Clock period 200 gt, CAP 150 gt after COM. Player controls at the north edge: START starts the clock, flip it on once; RESET on for two cycles then off sends PC to 0 and the program runs again. Colour key (every solid block is concrete in the colour of the circuit that placed it; the legend signs along the north edge repeat it): red = Clock and clock lines; orange = Program counter; yellow = ROM program words; purple = Control decoder; blue = Register A + reg file; cyan = Register B; brown = Flags Z C + flag lines; green = ALU sum and mux; lime = ALU carry chain; light
  gray = OUT register + display; light blue = Data buses pc a b y n; magenta = Control lines op, writes, jt; white = START, RESET levers + lines; black = display frame. Tests sample every register mid-cycle: fibonacci (41 cycles), reset (rst through one CAP at cycle 10, the program replays) and rerun (through the levers: run to the halt, RESET for two cycles, the same OUT sequence and halt again).'
traits:
- torch_based
- pistonless
- entityless
