name: ref_mattbatwings_cmp8_eq
description: 'Reference rebuild of OTHERCOMB002 "8-bit Magnitude Comparator w/ Equals" from mattbatwings'' Logical Redstone Archive (authors mattbatwings, sloimay, ECanDo; endorsed by mattbatwings; README speed "3 ticks"; https://discord.com/channels/1361854816837435433/1472423842793132254). A vertical stack of 8 identical 2-layer stages (bit b at y=6+2b), each with a gt lamp (x=4) and an eq lamp (x=7); stage b shows A>B and A==B for bits b..0 only, so stage 7 (y=20) is the full 8-bit result, A<B being both off. Stage inputs sit at the south face (A at x=4, B at x=7). INFERRED from traces: each stage''s two subtract comparators at z=8 read dust fed 15 on one side and 14 on the other, so they output 14 only for A<B (x=5) or A>B (x=6) on that bit; the dust, a target block and a torch combine that with the lower stage. Trimmed to 4x18x6 (decoration and signs dropped). Harness changes: the original lever sits on a redstone lamp that powers the dust beside it, which the harness
  cannot click, so each lever and its lamp are replaced by the input cell (a redstone block, a power source touching the same two dust cells the lamp did); signs dropped; output lamps kept. MEASURED: 51 vectors (edges, one-bit-apart, powers of two, random) all pass on all 16 outputs; every output rises 6 gt (3 rt) and falls 10 gt (5 rt) at worst, the same at every stage, so the stages are not a ripple chain. The README''s 3 ticks matches the rise only.'
