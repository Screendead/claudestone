name: ref_antekcookie_hex_cmp32
description: 'Reference rebuild of OTHERCOMB018 "32 bit Hex Comparator" from mattbatwings'' Logical Redstone Archive (author AntekCookie; endorsed by Mixel; Tested & Functional; README speed "10rt"; https://discord.com/channels/1361854816837435433/1495474063286603948). SOURCED: compares two 32-bit hex values (eight hex digits each) and lights one of three flags, A<B, A>B, A=B. Rebuilt: 5x16x14 as placed. Eight identical 2-layer stages at y=1+2k (k = digit, y=15 the MSB, MEASURED), the same comparator tree as the 8-bit OTHERCOMB017 (library/magnitude_comparator/ref_antekcookie_cmp8) with the input end changed: each digit is a signal strength 0-15, not a bit. A digit''s input is a container behind a compare comparator (INFERRED: A at x=0, B at x=3, z=13, MEASURED by the tests: A is the x=0 side, and lt lights when B is larger); the schematic holds no containers (undefined blocks), so the harness adds 16 barrels as fixtures and the tests set the strength with insert (27 stacks of 64 stone is 15, strength s needs ceil((s-1)*27/14) stacks). INFERRED from the layers: a digit''s pair of strengths goes through compare and subtract comparators (a-b and b-a, saturating at 0) into per-digit gt/lt dust and a per-digit target block, and the shared top layers 14-15 reduce the eight stages to three lamps with compare comparators, a torch and targets as in cmp8. Harness changes: the three output lamps kept as outputs eq, lt, gt; the two signs per stage dropped; barrels added behind the input comparators. MEASURED: 4 tests pass: 17 edge vectors plus one-digit-differs for all 8 digits both ways; 24 random pairs sharing a random-length prefix; all 256 digit pairs of the lowest digit; all 256 digit pairs of the top digit with lower digits A=0000000 B=FFFFFFF (so only the top digit decides unless equal, then B wins); every one waits 26 ticks. Timing (MEASURED over 57 transitions, edges plus random, changes at any digit): rises eq 16, lt 18, gt 14 gt; falls eq 20, lt 24, gt 18 gt, the same for the lowest and the top digit (the stages work in parallel, only the reduction layers differ), so the outputs are right 24 gt (12 rt) after the change. The README''s 10rt (20 gt) holds for eq falling, gt falling and all rises but not lt falling (24 gt). Not glitch-free: on the change gt -> equal, eq and lt are both lit from tick 16 until lt falls at 24; the timing test pins these waves tick by tick for 16 transitions.'
traits:
- analog
- comparator_based
- container_based
- silent
- pistonless
- entityless
