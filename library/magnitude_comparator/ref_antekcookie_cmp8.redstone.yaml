name: ref_antekcookie_cmp8
description: 'Reference rebuild of OTHERCOMB017 "8 bit Binary Comparator" from mattbatwings'' Logical Redstone Archive (author AntekCookie; endorsed by Mixel; README speed "8rt"; https://discord.com/channels/1361854816837435433/1495461386799546368). Two 8-bit numbers in, three one-hot lamps out (eq, lt = A<B, gt = A>B). Eight identical 2-layer stages stacked at y=1+2b for bit b (y=15 is the MSB, MEASURED: a_k beats b_0 for every k>=1); each stage has the same input block as OTHERCOMB002 (A at x=0, B at x=3, two subtract comparators and two repeaters per bit, INFERRED from the identical layers), and the top layers 14-15 reduce the eight stages to the three lamps with compare-mode comparators, a torch and target blocks. Harness changes: each lever and the lamp it sat on are replaced by the input cell (a redstone block touching the same dust cells); signs dropped; output lamps kept (the README''s lamps at the top). MEASURED: 51 vectors (edges, one-bit-apart, powers of two, random) all give
  the right one-hot; worst case 18 gt (9 rt): eq rise 10 fall 16, gt rise 10 fall 14, lt rise 14 fall 18, so the README''s 8rt (16 gt) holds for rises and for eq and gt but lt falling is 1 rt over. Outputs are not glitch-free: on returning to equal, eq and lt both light for a few ticks (seen in an exploration trace).'
