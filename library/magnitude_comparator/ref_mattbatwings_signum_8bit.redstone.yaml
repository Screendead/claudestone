name: ref_mattbatwings_signum_8bit
description: "Rebuild of OTHERARITH005 '8 bit instant signum' by mattbatwings (Logical Redstone Archive, Tested & Functional, Recommended; https://discord.com/channels/1361854816837435433/1474480601082892420). SOURCED: 8-bit input, 8-bit output, 0 ticks. 5x16x5, 118 blocks, dust and levers only. Eight levers b0..b7 (two's complement, b7 the sign, one every 2 y from y=1) each strong-power a wool block that feeds dust; each stage ends in a target block with a lamp beside it, the lamps l0..l7 being the 8 output bits. MEASURED: l0 = (input != 0) and l1..l7 = b7, so the output is 0x00 for 0, 0x01 for 1..127 and 0xFF for -128..-1 (all 256 inputs in a Gray-code sweep, plus simultaneous multi-bit changes such as 0x7F<->0x80 and 0x55<->0xAA); a lone low bit lights l0 only. Timing MEASURED: a lamp lights in the same tick as the lever click (wave 0) and goes dark 4 gt later, vanilla lamp turn-off delay, so the 0 ticks is the dust network and the 4 is the lamp, not the logic. INFERRED from the block layout: the OR of the 7 low bits climbs the stack as a dust ladder to l0 (dust adds no delay), and b7 is carried back down a second dust ladder to every target; a target block is a conductor dust can connect to from either side, so two dust lines pointing at it are an OR for the lamp beside it. Harness changes: orange_wool -> white_wool (same conduction; lint only lets `use` click a lever on stone-like blocks); lever and lamp block states otherwise as in the schematic; levers are driven by `use` steps because a driver redstone block does not strong-power the wool the way a lever does."
traits: [vertical, pistonless, entityless]
