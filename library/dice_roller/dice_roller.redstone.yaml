      - {"run": "execute if block ~4 ~3 ~1 redstone_lamp[lit=true] run scoreboard players add #c dice 16"}
      - {"run": "execute if block ~6 ~1 ~1 redstone_lamp[lit=true] run scoreboard players add #c dice 32"}
      - {"run": "execute if block ~2 ~1 ~1 redstone_lamp[lit=true] run scoreboard players add #c dice 64"}
      - {"run": "execute if block ~4 ~5 ~1 redstone_lamp[lit=true] run scoreboard players add #c dice 128"}
      - {"check": "if score #a dice = #c dice"}
