tests:
- name: valid face every press, all six occur
  settle: 30
  finally: ["scoreboard objectives remove dice"]
  steps:
  - {"run": "scoreboard objectives add dice dummy"}
  - {"run": "scoreboard players set #f1 dice 0"}
  - {"run": "scoreboard players set #f2 dice 0"}
  - {"run": "scoreboard players set #f3 dice 0"}
  - {"run": "scoreboard players set #f4 dice 0"}
  - {"run": "scoreboard players set #f5 dice 0"}
  - {"run": "scoreboard players set #f6 dice 0"}
  - repeat:
      times: 120
      steps:
      - {"use": "btn"}
      - {"wait": 60}
      - {"run": "scoreboard players set #p dice 0"}
      - {"run": "execute if block ~6 ~5 ~1 redstone_lamp[lit=true] run scoreboard players add #p dice 1"}
      - {"run": "execute if block ~2 ~5 ~1 redstone_lamp[lit=true] run scoreboard players add #p dice 2"}
      - {"run": "execute if block ~6 ~3 ~1 redstone_lamp[lit=true] run scoreboard players add #p dice 4"}
      - {"run": "execute if block ~2 ~3 ~1 redstone_lamp[lit=true] run scoreboard players add #p dice 8"}
      - {"run": "execute if block ~4 ~3 ~1 redstone_lamp[lit=true] run scoreboard players add #p dice 16"}
      - {"run": "execute if block ~6 ~1 ~1 redstone_lamp[lit=true] run scoreboard players add #p dice 32"}
      - {"run": "execute if block ~2 ~1 ~1 redstone_lamp[lit=true] run scoreboard players add #p dice 64"}
      - {"run": "execute if block ~4 ~5 ~1 redstone_lamp[lit=true] run scoreboard players add #p dice 128"}
      - {"run": "execute if score #p dice matches 16 run scoreboard players add #f1 dice 1"}
      - {"run": "execute if score #p dice matches 65 run scoreboard players add #f2 dice 1"}
      - {"run": "execute if score #p dice matches 81 run scoreboard players add #f3 dice 1"}
      - {"run": "execute if score #p dice matches 99 run scoreboard players add #f4 dice 1"}
      - {"run": "execute if score #p dice matches 115 run scoreboard players add #f5 dice 1"}
      - {"run": "execute if score #p dice matches 111 run scoreboard players add #f6 dice 1"}
  - {"run": "scoreboard players set #sum dice 0"}
  - {"run": "scoreboard players operation #sum dice += #f1 dice"}
  - {"run": "scoreboard players operation #sum dice += #f2 dice"}
  - {"run": "scoreboard players operation #sum dice += #f3 dice"}
  - {"run": "scoreboard players operation #sum dice += #f4 dice"}
  - {"run": "scoreboard players operation #sum dice += #f5 dice"}
  - {"run": "scoreboard players operation #sum dice += #f6 dice"}
  - {"check": "if score #sum dice matches 120"}
  - {"check": "if score #f1 dice matches 4..45"}
  - {"check": "if score #f2 dice matches 4..45"}
  - {"check": "if score #f3 dice matches 4..45"}
  - {"check": "if score #f4 dice matches 4..45"}
  - {"check": "if score #f5 dice matches 4..45"}
  - {"check": "if score #f6 dice matches 4..45"}
  - log: "scoreboard players get #f1 dice"
  - log: "scoreboard players get #f2 dice"
  - log: "scoreboard players get #f3 dice"
  - log: "scoreboard players get #f4 dice"
  - log: "scoreboard players get #f5 dice"
  - log: "scoreboard players get #f6 dice"
- name: face settles 50 gt after a press and holds until the next
  settle: 30
  finally: ["scoreboard objectives remove dice"]
  steps:
  - {run: "scoreboard objectives add dice dummy"}
  - repeat:
      times: 25
      steps:
      - {"use": "btn"}
      - {"wait": 50}
      - {"run": "scoreboard players set #a dice 0"}
      - {"run": "execute if block ~6 ~5 ~1 redstone_lamp[lit=true] run scoreboard players add #a dice 1"}
      - {"run": "execute if block ~2 ~5 ~1 redstone_lamp[lit=true] run scoreboard players add #a dice 2"}
      - {"run": "execute if block ~6 ~3 ~1 redstone_lamp[lit=true] run scoreboard players add #a dice 4"}
      - {"run": "execute if block ~2 ~3 ~1 redstone_lamp[lit=true] run scoreboard players add #a dice 8"}
      - {"run": "execute if block ~4 ~3 ~1 redstone_lamp[lit=true] run scoreboard players add #a dice 16"}
      - {"run": "execute if block ~6 ~1 ~1 redstone_lamp[lit=true] run scoreboard players add #a dice 32"}
      - {"run": "execute if block ~2 ~1 ~1 redstone_lamp[lit=true] run scoreboard players add #a dice 64"}
      - {"run": "execute if block ~4 ~5 ~1 redstone_lamp[lit=true] run scoreboard players add #a dice 128"}
      - {"wait": 100}
      - {"run": "scoreboard players set #b dice 0"}
      - {"run": "execute if block ~6 ~5 ~1 redstone_lamp[lit=true] run scoreboard players add #b dice 1"}
      - {"run": "execute if block ~2 ~5 ~1 redstone_lamp[lit=true] run scoreboard players add #b dice 2"}
      - {"run": "execute if block ~6 ~3 ~1 redstone_lamp[lit=true] run scoreboard players add #b dice 4"}
      - {"run": "execute if block ~2 ~3 ~1 redstone_lamp[lit=true] run scoreboard players add #b dice 8"}
      - {"run": "execute if block ~4 ~3 ~1 redstone_lamp[lit=true] run scoreboard players add #b dice 16"}
      - {"run": "execute if block ~6 ~1 ~1 redstone_lamp[lit=true] run scoreboard players add #b dice 32"}
      - {"run": "execute if block ~2 ~1 ~1 redstone_lamp[lit=true] run scoreboard players add #b dice 64"}
      - {"run": "execute if block ~4 ~5 ~1 redstone_lamp[lit=true] run scoreboard players add #b dice 128"}
      - {"check": "if score #a dice = #b dice"}
      - {"wait": 310}
      - {"run": "scoreboard players set #c dice 0"}
      - {"run": "execute if block ~6 ~5 ~1 redstone_lamp[lit=true] run scoreboard players add #c dice 1"}
      - {"run": "execute if block ~2 ~5 ~1 redstone_lamp[lit=true] run scoreboard players add #c dice 2"}
