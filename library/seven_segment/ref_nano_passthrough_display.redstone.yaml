name: ref_nano_passthrough_display
description: 'Rebuild of PIXDISPLAY001 Passthrough Display (Nano, Omeganx, TheWildJarvi, Penscii; endorsed by mattbatwings; Recommended, Tested & Functional; https://discord.com/channels/1361854816837435433/1472413166095827109). SOURCED: the README says only "a display that allows for multiple XY plotting at once by having one decoder pass through the other"; the .schem is 22x25x25 and its block entities hold 144 barrels with one redstone each (constant 1 for a comparator) and 256 comparators. MEASURED (sweeps below): a 16x16 lamp wall at x=0 (row = y-9 from y=9, column = z from z=0) shown by two ports, A and B, each with a 3-bit row address and a 3-bit column address (bit0 at y=2, bit1 at y=4, bit2 at y=6; rows on the x=10/x=18 levers a_row*/b_row*, columns on the x=12/x=20 levers a_col*/b_col*), so a port lights one 2x2 block of an 8x8 grid; the lit lamps are exactly block A union block B for all 64 positions of A (B parked at 7,7), all 64 of B (A parked at 7,7) and 16 pairs including same-row, same-column and coinciding ones, with no ghost at the crossing points. Idle (all levers off) lights the block at row 0, column 0. Delay 30 gt worst (rise 22, fall 30; lamp on after the input changes, lamp off after it falls), of which 2 gt is the input repeater below, so 20 and 28 gt from a lever click. Harness changes: the real levers sit on redstone lamps, which the harness cannot click, so each lever is a fixture repeater at z=24 (hard-powering its lamp as a lever does) fed by an input driver at z=25 (with a fixture stone under it); size 22x25x24 leaves those out. Barrels carry {Items:[redstone x1]} (the CustomName was dropped). Lamp counts are read by cloning the lit lamps of the wall (clone ... filtered redstone_lamp[lit=true], whose result is the count) to x=30. INFERRED from traces: each address bit is inverted by a torch and climbs a dust-and-glass ladder; the row bits feed a 3-input NOR at each even layer (torch or repeater per bit) whose repeater drives a 15-block dust line along z that stays dark only for the selected row; the column bits make one-hot vertical dust wires beside the odd z rows; a subtract comparator with a one-item barrel behind it (1 minus the row and column lines) is the pixel AND, and it feeds the barrel at the even column beside it; the other port enters that barrel through a subtract comparator whose side is held at 14, so only a full-strength 15 passes (as 1) and decayed dust does not; one torch pair then lights the 2x2 block (a torch beside the odd layer''s lamp and the wool above it for the layer above, and a second torch on the same wool for the odd column). Environment note (MEASURED, cause not found): on dsat2 alone this plot kept 27 extra lamps lit at idle (31 lit instead of 4, with or without sprint, after a forced clone update) while the design passed on the other 9 servers tried and seg_lamp_3x5 passed on dsat2.'
traits: [torch_based, comparator_based, container_based, pistonless, entityless]
