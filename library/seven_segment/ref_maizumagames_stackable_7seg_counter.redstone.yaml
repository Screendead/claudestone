name: ref_maizumagames_stackable_7seg_counter
description: 'Source (SOURCED): mattbatwings'' Logical Redstone Archive NUMDISPLAY006 ''Stackable 7-segment Counter'' (author MaizumaGames, endorsed by mattbatwings; tags Recommended, Tested & Functional; https://discord.com/channels/1361854816837435433/1472416502064877579). README: ''A stackable counter with a display. Input: 1 observer face. Use the observer on the right side to count. Stack side by side for automatic multi-digit counting.'' Source .schem 4x9x14 (x,y,z; 422 blocks): a 3x5 lamp face on the z=13 side (the viewer stands south of it looking north), a decimal counter behind it. Harness changes: a lever clk with its stone support (both fixtures) sits at x=5 in front of the input observer, so each flip of the lever is one count (an observer fires on any state change of the cell it faces, MEASURED: 12 flips, 12 counts); the build is shifted one block east, leaving an air column at x=0 (see below); the potion barrels'' CustomNames are dropped; container items and every comparator''s OutputSignal come from the .schem block entities and all blocks keep their saved states, loaded with update_pass strict (MEASURED: with update_pass all the display goes blank 14 gt after load and counting is dead, with unobserved it loads with part of a digit lit). The rest is as saved; it starts showing 0. Coordinates below are the .schem''s (x=0..3); in this file every x is one more. MEASURED on sat1, sat2 and dsat1-3 (all pass): the display counts 0 1 2 .. 9 0 1 2 on every lever flip, each digit lighting exactly its standard 7-segment pattern; the 13 lamps follow a fixed rule (the middle lamp of the three-lamp bars a, g, d is the segment; its hard power bleeds into the two end lamps of the bar, which are also lit by the vertical segment lamp beside them, so a 4 shows its top corners). The stone button on the south face at (3,1,13) resets the count to 0 (tested by run commands, since the harness cannot click a button on an iron block). Timing MEASURED from the lever flip: the lamps first change 38-42 gt later and the last lamp edge lands by +48 (8 to 9: lamp e falls at +48; 0 to 1: seven lamps fall together at +42); 9 to 0 flickers lamps d0/d1/e between +42 and +46. Counts need flips at least 17 gt apart (MEASURED on sat1: 7 flips 17 gt apart end on 7, 16 gt apart end on 4); the test uses 20. How it works (INFERRED from the layout, then checked against traces of every cell): the input observer (3,0,7) feeds a two-observer relay (3,0,8), (3,0,9), which powers an iron block under a note block at (3,0,11); an observer watching the note block fires the dropper at (0,0,11) (tick +8). The dropper holds one fern and pushes it up into a hopper; a comparator reading that hopper is the count pulse (on for 7 gt, +14 to +21), and the fern then runs hopper, barrel, hopper back into the dropper, so the loop is both the pulse shaper and the debounce that sets the 17 gt limit. The count is a signal strength: comparators along x=1..2 (y=1) hold d+1 (1..10, MEASURED), the ''Level 10'' barrel (18 potions, strength 10) minus that is 9-d on the comparator at (1,1,0), and from it a dust line at (0,2,z) reads |z-(9-d)| for z=0..9 (MEASURED for all ten digits), a V whose zero sits at row 9-d. Seven wall torches on target blocks at z=0,1,3,4,6,7,9 light only where their row''s dust is 0, a one-hot code for digits 9,8,6,5,3,2,0; digits 7,4,1 have no torch (their zero rows 2,5,8 are the gaps). Layers y=3 to y=8 of torches, comparators and dust lines combine those lines into the seven segments (their exact gate list was not traced); the vertical segments drive single lamps through comparators at z=12 and the bars drive their middle lamps through repeaters. Wrap and carry: when the strength reaches 10 and wraps to 1, a comparator at (2,1,7) fires an observer chain (2,0,7), (1,0,7), (0,0,7) whose last observer sits against the next digit''s input observer at x-1, which is the stacking interface (see ref_maizumagames_stackable_7seg_counter_x2). Why it is compact: the whole count and its decoder live in strengths of 15 dust, comparators and 3 containers, with no clock and no extra memory; 4x9x14 for count, decode and lamps. Gotcha (MEASURED): a build whose x=0 face touches the plot edge reads blocks outside the plot, which the rig never clears; dsat3 had stray blocks at x=-1, y=2..8, and with the design at x=0 dsat2 stuck lamp f on for digits 1, 2, 3, 7 and dsat3''s display died on the first count, while sat1, sat2 and dsat1 passed, so the same build passed or failed by server; the one-block air margin at x=0 fixes all of them.'
traits:
- entityless
- pistonless
- container_based
- comparator_based
- observer_based
- analog
