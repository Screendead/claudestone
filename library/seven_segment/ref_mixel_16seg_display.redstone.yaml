name: ref_mixel_16seg_display
description: 'Rebuild of Mixel''s 16 Segment Display from mattbatwings'' Logical Redstone Archive, entry CHARDISPLAY001 (Discord: https://discord.com/channels/1361854816837435433/1518881602749468762, endorsed by mattbatwings, tagged Tested and Functional, schematic CHARDISPLAY001_16seg_5). SOURCED claims: a 16 segment display for letters and numbers, input 4 hex inputs, output the lamp display, speed 8 ticks, stackable horizontally 1 block apart and vertically 2 blocks apart, a text file maps common characters (A - CDFE, 1 - 0730, ...). Changes for the harness: the schematic has no input source, so each of the four hex lines enters where the build''s input comparators face west (x=0, z=8, one per even layer y=2,4,6,8); a fixture hopper (comparator-readable analog source, filled with redstone to 0-15) and a fixture comparator stand outside the footprint in two padding columns and the tests set the strength with insert steps. All barrels keep the schematic''s contents (redstone dust and totems
  as constant analog sources). The 49 lamps are the named cells l<y>_<z>. Size 14x10x11 with the lamp face on the east side (x=13). MEASURED on 26.3: the four layer pairs are four identical digit decoders. Each takes a 0-15 signal strength v and lights its own four segment groups by the reflected Gray code g = v ^ (v >> 1), bit 3 = v >= 8, bit 2 = 4 <= v < 12, bit 1 = 2..5 and 10..13, bit 0 = 1..2, 5..6, 9..10, 13..14, so a step of 1 in v changes exactly one segment. The 16 segment groups are 37 of the 49 lamps; the other 12 lamps (the corners between segments, each with its own torch) never light for any input. The top digit decoder (y=8) is the first digit of a character code, so CDFE puts C on the top layer: A, 1, 2, 7 and the slashed 0 of the README table render as those glyphs on the 7x7 lamp face (viewer on the east, z=7 on the left), INFERRED from the rendered lamp pattern. Tests: every value of every digit alone (64 values), all 50 README characters at once, 30 random four-digit
  jumps, all against the Gray rule; a sweep over all 480 ordered value pairs of two digits (not kept here) showed the right final lamps with no segment leaving a state it holds before and after the change and no other lamp lighting. Delay, from the tick the fixture comparator is told to change (2 gt of that is the fixture comparator, so subtract 2 for a line already carrying the signal): segment groups 0 and 1 of each digit rise at +20 and fall at +24 gt, groups 2 and 3 rise at +18 and fall at +22, the same in all four digits and in every context tried. From the line itself that is 16 gt (8 redstone ticks, the README speed) for the fastest rise and 22 gt (11 redstone ticks) for the slowest fall.'
traits:
- torch_based
- comparator_based
- container_based
- pistonless
- entityless
