name: seg_bulb_3x5
description: 'A 3x5 diamond digit of waxed copper bulbs driven by observers: the smallest display in the family (3x5x2, 22 blocks). A copper bulb toggles on each rising edge; an observer behind it watches the segment''s input cell and pulses on every change, rising or falling, so the bulb flips on both edges and follows the input level. Bulbs give full light 15 with no 4-tick lamp tail: both edges take 2 game ticks (the observer), tested. The observers are placed already powered: a pasted observer (setblock) sees its neighbours and fires once, which would toggle every bulb on; placed powered it just turns itself off (ObserverBlock.onPlace), so the digit starts dark, which the first test checks. Limit: the observer is busy for 4 ticks after each change, so an input pulse of 3 ticks or less flips the bulb once and leaves it out of step (tested); feed it clean levels. Interface: face at z=0 looking north, x=0 is the viewer''s right; inputs are the cells the observers watch at z=2: a (1,5),
  b (0,4), c (0,2), d (1,1), e (2,2), f (2,4), g (1,3). Trade-off: brightest, smallest and symmetric in delay, but copper bulbs click and it trusts the input to change slower than every 4 ticks.'
traits:
- observer_based
- entityless
- pistonless
- vertical
- ultracompact
- survival_friendly
- tileable
- stackable
- reset_safe
- tick_accurate
palette:
  .: air
  A: black_concrete
  B: waxed_copper_bulb[lit=false,powered=false]
  d: {name: d_obs, block: 'observer[facing=south,powered=true]'}
  C: {input: d}
  c: {name: c_obs, block: 'observer[facing=south,powered=true]'}
  e: {name: e_obs, block: 'observer[facing=south,powered=true]'}
  D: {input: c}
  E: {input: e}
  g: {name: g_obs, block: 'observer[facing=south,powered=true]'}
  F: {input: g}
  b: {name: b_obs, block: 'observer[facing=south,powered=true]'}
  f: {name: f_obs, block: 'observer[facing=south,powered=true]'}
  G: {input: b}
  H: {input: f}
  a: {name: a_obs, block: 'observer[facing=south,powered=true]'}
  I: {input: a}
layers:
  1: |
    ABA
    .d.
    .C.
  2: |
    BAB
    c.e
    D.E
  3: |
    ABA
    .g.
    .F.
  4: |
    BAB
    b.f
    G.H
  5: |
    ABA
    .a.
    .I.
