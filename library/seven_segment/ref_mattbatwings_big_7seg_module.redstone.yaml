name: ref_mattbatwings_big_7seg_module
description: 'Rebuild of mattbatwings'' Big 7seg Display Module, Logical Redstone Archive DISMODULE002 (README SOURCED: ''Wiring to display 7 segments on a larger display'', endorsed by mattbatwings, tagged Recommended and Tested & Functional; https://discord.com/channels/1361854816837435433/1472417204971765944). Size 5 wide x 10 tall x 2 deep (59 blocks: 21 lamps, 7 dust, 31 gray wool); a vertical wall, lamps in the z=1 plane (lamp side faces +z; seen from +z, x grows to the viewer''s right). Each of the seven segments is three lamps in a row (a top, b upper right, c lower right, d bottom, e lower left, f upper left, g middle), 3x3 for the side segments, with wool between segments; one dust per segment sits on the wool plane at z=0 behind the middle lamp. How (MEASURED unless marked): the dust takes a redstone driver from the north (z=-1) and becomes a north-south line, so it points into the lamp in front of it; dust pointing into a lamp powers it as a conductor and a conducting lamp lights the two lamps touching it, so one dust lights the whole segment; lamps lit that way pass nothing on and the wool between segments stops the bleed (the 128-row truth table over every combination of segments has no stray lamp). Harness changes: the .schem has no inputs, so each dust gets a redstone block behind it at z=-1 as its driver (a (2,9,0), b (4,7,0), c (4,3,0), d (2,1,0), e (0,3,0), f (0,7,0), g (2,5,0), in the layer for z=-1, which the size leaves out). Feeding from the side instead lights only the lamp over the wool block under the dust (a test below): the dust becomes an east-west line and points at no lamp, its power reaches the wool below, and that wool touches one lamp. So the module has to be fed from behind (INFERRED: from the README picture, which shows dust leading away on the far side). The dust is kept in its cross state from the schematic; the harness''s placement pass leaves it alone. Timing: a lamp lights in the same tick as its power (rise 0) and goes dark 4 game ticks after (fall 4, the lamp''s own turn-off delay).'
