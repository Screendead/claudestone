name: seg_floor_rail
description: 'A floor digit of powered rails, read from above: a powered rail''s texture lights up without emitting light, and rails make no sound. A powered rail passes power along its own axis to up to 8 more rails in the same tick, but never to a rail laid across it, so segments may meet end to side: a, d and g run east-west, b, c, e and f north-south. g runs the full width and out through the west gap to a lead-in rail, which makes it edge-fed like the others and 0 ticks. The lead-in rail matters: rails re-pick their shape from their neighbours when placed, and without it g''s west rail turns north-south and joins b and c (found in testing). Viewer at the north edge looking south: a is the south row, d the north row, +x is the viewer''s left. Inputs: a power source beside the end rail (tested with redstone blocks): a (4,1,8), d (4,1,0), b (1,1,6), c (1,1,2), g (0,1,4), e (7,1,2), f (7,1,6). 6 wide x 2 tall x 7 deep, 56 blocks. Delay: 0 game ticks on both edges, checked in the tick of
  the input change for every digit and lone segment. Trade-off: the fastest display here and lightless and silent, but read from above, needs gold, and rails are not a probeable cell, so it is tested with block-state checks.'
traits:
- flat
- horizontal
- lightless
- silent
- pistonless
- entityless
- ultrafast
- compact
- rail_based
- reset_safe
- survival_friendly
- tick_accurate
palette:
  .: air
  A: black_concrete
  d: {input: d}
  B: powered_rail[shape=east_west,powered=false]
  c: {input: c}
  C: powered_rail[shape=north_south,powered=false]
  e: {input: e}
  g: {input: g}
  b: {input: b}
  f: {input: f}
  a: {input: a}
layers:
  0: |
    ........
    ..AAAAA.
    ..AAAAA.
    ..AAAAA.
    .AAAAAA.
    ..AAAAA.
    ..AAAAA.
    ..AAAAA.
    ........
  1: |
    ....d...
    ...BBB..
    .cC...Ce
    ..C...C.
    gBBBBBB.
    ..C...C.
    .bC...Cf
    ...BBB..
    ....a...
