name: seg_piston_3x5
description: 'A 3x5 diamond digit of sticky pistons: each segment''s white concrete pixel sits recessed at z=1 behind a hole in the black frame (z=0) and is pushed flush into the hole when the segment is on. The pistons (z=2) are driven by repeaters at z=3 set to 2 redstone ticks: a sticky piston given a 1 or 2 game tick pulse spits its block and strands it (see mechanics/sticky_piston_short_pulse_drops_block), and a delay-2 repeater stretches any short input pulse to 4 game ticks, so glitches from a decoder never strand a pixel (tested with 1 and 2 tick pulses). Repeaters rather than dust feed the pistons because dust would power its support block, which quasi-connectively powers the piston below and to the side. Interface: face at z=0 looking north, x=0 is the viewer''s right; inputs at z=4 behind each repeater: a (1,5), b (0,4), c (0,2), d (1,1), e (2,2), f (2,4), g (1,3). 3 wide x 6 tall x 4 deep, 38 blocks. Delay: 6 game ticks on both edges (repeater 4 + piston 2). Trade-off: readable
  in the dark without emitting light (the frame shows the shape), but slow, noisy and it lights nothing; seg_trapdoor_3x5 is the silent-ish, instant, same-size alternative.'
traits:
- piston_based
- entityless
- vertical
- compact
- reset_safe
- survival_friendly
- tileable
- tick_accurate
palette:
  .: air
  A: black_concrete
  '#': white_concrete
  B: sticky_piston[facing=north,extended=false]
  d: {name: d_feed, block: 'repeater[facing=south,delay=2]'}
  C: {input: d}
  c: {name: c_feed, block: 'repeater[facing=south,delay=2]'}
  e: {name: e_feed, block: 'repeater[facing=south,delay=2]'}
  D: {input: c}
  E: {input: e}
  g: {name: g_feed, block: 'repeater[facing=south,delay=2]'}
  F: {input: g}
  b: {name: b_feed, block: 'repeater[facing=south,delay=2]'}
  f: {name: f_feed, block: 'repeater[facing=south,delay=2]'}
  G: {input: b}
  H: {input: f}
  a: {name: a_feed, block: 'repeater[facing=south,delay=2]'}
  I: {input: a}
layers:
  0: |
    ...
    ...
    ...
    .A.
    ...
  1: |
    A.A
    .#.
    .B.
    AdA
    .C.
  2: |
    .A.
    #.#
    B.B
    cAe
    D.E
  3: |
    A.A
    .#.
    .B.
    AgA
    .F.
  4: |
    .A.
    #.#
    B.B
    bAf
    G.H
  5: |
    A.A
    .#.
    .B.
    AaA
    .I.
