name: ref_aminotreal_hlp_hex_display
description: "Rebuild of NUMDISPLAY005 Hex Layer Problem (HLP) Displays (authors Aminotreal and Powsi, endorsed by mattbatwings; Recommended, Tested & Functional; https://discord.com/channels/1361854816837435433/1472416236989317202). SOURCED: README says three HLP displays, all stackable every 4x6 blocks: one hex, one BCD, one unordered BCD; no speed given. The .schem holds all three side by side; this file is the hex one (the largest, z 0..12 of the schem), cut out at its own origin; the other two are ref_aminotreal_hlp_bcd_display and ref_aminotreal_hlp_ubcd_display. How it works (INFERRED from the blocks, partly MEASURED in traces): 15 levers k1..k15 sit in a row at y=4 on white wool, with a dust line on top of the wool; lever kN is at x=36-N, so it feeds the dust at strength 15 and the line's west end (x=21) reads N (k15 -> 15, k1 -> 1; MEASURED: the end dust reads 15 with k15 on and 1 at x=35). No lever = 0, and the highest lever wins (MEASURED, highest_lever_wins). A comparator reads that strength and comparator/dust layers, one per pixel row y=2..6, turns the 0-15 value into the 3 pixels of that row by subtract/compare against container constants (115 barrels of 1-27 totems of undying, 117 comparators in all, signal strength = their count; the totems come from the .schem block entities, not the block states). Output is a 5x7 lamp wall at x=0, z=1..5, y=1..7, showing a 3x5 pixel glyph at z=2..4, y=2..6 (the outer ring never lights); the viewer stands at -x looking east, so z=1 is on the viewer's left. MEASURED: all 16 hex glyphs 0-9, A, b, C, d, E, F render as a 3x5 font (1 and the others checked against the lever labels the schem's signs carried); worst case lever click to last lamp change 28 game ticks (latency_slowest asserts the slowest click lamp by lamp). Size 36x8x13, 621 blocks. Harness changes: the 16 lever labels (signs at y=6) dropped and listed here; the wool under the levers is white_wool, not cyan, because scripts.try emulates a lever only on plain supports (same behaviour: a wool block); levers are named cells clicked with use, not redstone-block drivers. The build settles ~25 ticks after placement (a read at tick 20 shows a transient glyph), so tests settle 60."
traits: ["analog", "comparator_based", "container_based", "pistonless", "entityless", "compact"]
