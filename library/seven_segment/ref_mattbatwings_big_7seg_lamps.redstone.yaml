name: ref_mattbatwings_big_7seg_lamps
description: 'Big 7-segment display module on a full lamp screen, from mattbatwings'' Logical Redstone Archive (entry DISMODULE001 Big_7seg_Display_Module_Full_lamps, tagged Tested & Functional and Recommended, endorsed by mattbatwings, no author listed; https://discord.com/channels/1361854816837435433/1472417008925671672). README SOURCED: wiring to display 7 segments on a larger display, on a fully lamp screen. Size 5x10x5 as in the source plus one input row, 5x10x6 here. Screen: 5 wide x 9 tall lamps on the south face (z=5), viewer south of it looking north so x=0 is the viewer''s left; a (y=9), g (y=5) and d (y=1) are three lamps wide (x=1..3), f/b (y=6..8) and e/c (y=2..4) are three lamps tall at x=0/x=4. Inputs a b c d e f g are one cell each at z=0. Harness changes: the .schem has no inputs, so a redstone block is placed at each driver cell one cell north of the source''s first dust (a redstone block does not power an adjacent solid block, so the vertical inputs need that dust); the torches and dust that the .schem saved in their all-inputs-off state keep it (torches lit=false, dust power=15 where the schem has them), which the skeleton had stripped. How it works (INFERRED from the blocks, behaviour MEASURED): a horizontal input is a dust line that crosses to three dust cells, each pointing into a target block (dust connects sideways to a target, so it points into it and powers it as a conductor; plain wool would not take the connection) that weakly powers the lamp south of it; no torches, so lit at once. A vertical input is a dust cell on a wool block; it powers the wool, which turns off torch 1; torch 1 sits above the dust feeding wool 2 and powers it, so wool 2 loses power and torch 2 lights its lamp and, being under wool 3, powers wool 3, which lights the middle lamp and turns off torch 3 (which was lit and powering wool 4 above it), so wool 4 loses power and torch 4 lights the top lamp. Three torch stages stacked in a 5x4 column behind the lamps, each wool block both an inverter input and a strong-power source for the next stage, no repeaters. MEASURED on laptop satellites sat1-sat6 and dsat1-dsat3: all 128 combinations of the seven inputs pass, every row checking all 45 lamps (21 segment lamps lit as the table says, 24 others dark); worst delay 12 gt. Per lamp: horizontal segments rise 0 / fall 4; vertical lamps from the bottom up rise 4, 4, 8 and fall 8, 8, 12 (x0y2 x0y3 x0y4, the same at x4 and for y6 y7 y8), so a vertical segment fills in unevenly over 4 gt. Caveat MEASURED: on 3 of 8 unpinned  runs of a single-input f test (and both unpinned runs of the full table in one session) two dark lamps beside the f segment, x0y9 and x1y8, stayed lit (stuck lit, no power) after f rose; every run pinned with REDSTONE_SERVER to sat1-sat6, dsat1-dsat3 or main passed (about 40 runs). The cause is not established; unpinned runs may have started a fresh dsat, but that was not checked.'
