  - {check: 'if block ~0 ~4 ~0 iron_trapdoor[open=false]'}
  - {check: 'if block ~0 ~2 ~0 iron_trapdoor[open=false]'}
  - {check: 'if block ~1 ~1 ~0 iron_trapdoor[open=false]'}
  - {check: 'if block ~2 ~2 ~0 iron_trapdoor[open=false]'}
  - {check: 'if block ~2 ~4 ~0 iron_trapdoor[open=false]'}
  - {check: 'if block ~1 ~3 ~0 iron_trapdoor[open=false]'}
  - drive:
      a: 1
      b: 1
      c: 1
      d: 1
      e: 1
      f: 1
      g: 1
  - {wait: 2}
  - {check: 'if block ~1 ~5 ~0 iron_trapdoor[open=true]'}
