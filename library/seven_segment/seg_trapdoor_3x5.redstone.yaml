name: seg_trapdoor_3x5
description: 'A 3x5 digit of iron trapdoors, one pixel per segment in a diamond (a top-middle, f/b upper left/right, g centre, e/c lower left/right, d bottom-middle; corners empty). No light source and no light change. An open trapdoor facing north stands flat against its south side and shows its iron face to the viewer; closed, it drops to a thin slab and the cell looks empty. Each trapdoor is opened by one dust straight behind it at z=1 pointing into it; the other z=1 cells are black concrete, holding the dust up and cutting diagonal dust links. Interface: face at z=0 looking north, x=0 is the viewer''s right; inputs are the z=2 cells behind each dust (tested with a redstone block): a (1,5), b (0,4), c (0,2), d (1,1), e (2,2), f (2,4), g (1,3). 3 wide x 6 tall x 2 deep, 23 blocks. Delay: 0 game ticks on both edges, checked in the tick of the input change for every digit and lone segment. Trade-off: the fastest vertical display and lightless, but iron trapdoors click (not silent), it is
  readable only in light, and one pixel per segment is less legible than seg_lamp_3x5''s full font.'
traits:
- lightless
- pistonless
- entityless
- vertical
- ultrafast
- compact
- reset_safe
- survival_friendly
- tick_accurate
- tileable
- stackable
palette:
  .: air
  A: black_concrete
  B: iron_trapdoor[facing=north,half=bottom,open=false]
  d: {name: d_feed, block: redstone_wire}
  C: {input: d}
  c: {name: c_feed, block: redstone_wire}
  e: {name: e_feed, block: redstone_wire}
  D: {input: c}
  E: {input: e}
  g: {name: g_feed, block: redstone_wire}
  F: {input: g}
  b: {name: b_feed, block: redstone_wire}
  f: {name: f_feed, block: redstone_wire}
  G: {input: b}
  H: {input: f}
  a: {name: a_feed, block: redstone_wire}
  I: {input: a}
layers:
  0: |
    ...
    .A.
    ...
  1: |
    .B.
    AdA
    .C.
  2: |
    B.B
    cAe
    D.E
  3: |
    .B.
    AgA
    .F.
  4: |
    B.B
    bAf
    G.H
  5: |
    .B.
    AaA
    .I.
