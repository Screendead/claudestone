name: ref_rt_rom_display
description: 'Rebuild of PIXDISPLAY003 ROM Display (RT, endorsed by mattbatwings; Recommended, Tested & Functional; https://discord.com/channels/1361854816837435433/1472413858030162005). SOURCED: README says only "A display that can show custom images. Change where the target blocks are to change the image." Size 15x20x18 (try), 2,659 blocks with the fixture. What it is (MEASURED): an 8x8 pixel display (2x2 redstone lamps per pixel, a 16x16 lamp wall at x=0, y=4..19, z=0..15, pixel row r = lamps y=4+2r,5+2r, pixel column k = lamps z=2k,2k+1, row 0 at the bottom, column 0 at the north) read from a 3-word ROM: three inputs lv0..lv2 (the levers at x=8,11,14) each select one 8x8 image, and several on show the OR of their images. The image is stored in the wall of ''slots'' at (x=7+3c, y=4+2r, z=2k) for lever c: a target block there is a 1 bit, the light gray wool that fills the other slots is a 0 (the .schem has 10 targets per image, so the three images are a 10-pixel pattern each, with the same four pixels at rows 5 and 6 in all three). Change one wool to a target (setblock, no other update) and that pixel joins the image of that lever; the edit_targets_edits_image test does it four times and checks all 7 lever combinations. How (INFERRED from the layers, with the timing below confirming it): each lever''s torch inverts it onto a dust line along z at y=1 that powers four target blocks under torches; a lever turning on lights those four torches, each strongly powers a wool block, and the dust on top of that block climbs a stair of dust on glass through the 8 pixel layers (a tap at z=1,5,9,13 per layer, each serving the two slots at z+-1). A tap''s dust powers the target in a slot and a target conducts dust power sideways, while wool does not, so the slot is the data bit. Each pixel row (z even) is then a west-running bus of repeaters, dust and slots from x=14 to x=2: slot c passes its signal to dust, repeaters read through the next slots (a slot with no tap power is dark, a slot''s target relays), ending in a wool block and a torch pair (x=4, x=1) that double-inverts into a torch at x=1 under a wool block above it; that torch lights the lamp beside it and its wool block lights the lamp above, which is the 2x2 pixel. Harness change: the three levers hang on lamps (x=8,11,14 at z=17 lean on a redstone lamp) and the harness only emulates levers on plain full blocks, so each lever became a fixture repeater[facing=south] on a stone block (y=0, z=17) fed by an input redstone block at z=18; a redstone block next to the lamp would not do, since a torch reads only strong power from the lamp''s neighbours and a block weakly powers it. The inputs therefore carry 2 gt that a lever does not. MEASURED on sat1 and sat2, all six tests pass: rest_dark (placement lights all 256 lamps and they are all dark by tick 18, so the default settle of 20 is just enough), images_all_levers (every lever combination 1..7 shows exactly the OR of the single images on all 256 lamps, and goes dark again after), one_tick_across_the_wall (every lamp of an image changes in the same tick, none a tick earlier), delay_per_lever (exact waves), edit_targets_edits_image, switch_directly. Delays counted from the input redstone block (including the fixture repeater): rise 14, 16, 18 gt for lv0, lv1, lv2 and fall always rise + 4 (the lamp''s own off delay: 18, 20, 22); each further lever east crosses one more repeater of the row bus (+2 gt), which INFERRED explains it; every lamp of a lever''s image switches in one tick, whatever row or column. Not a design fault but worth knowing: on dsat2 the test fails because a comparator (and stone) from an earlier build is left at x=-1 beside the lamp wall in the references plot (the harness clear does not reach it) and lights lamps; the six tests pass on sat1 (twice) and sat2 (a dsat1 run hung and was killed, not a failure).'
