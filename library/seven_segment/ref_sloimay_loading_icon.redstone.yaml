name: ref_sloimay_loading_icon
description: 'Loading icon: a lamp wall that draws a spinning circle of plus-shaped blobs while a signal is held, and goes dark when it is released. Source: sloimay''s OTHERDISPLAY002 Loading Icon in mattbatwings''
  Logical Redstone Archive (endorsed by mattbatwings; tags Recommended, Tested and Functional; Discord https://discord.com/channels/1361854816837435433/1472412026872528961); the README says only ''a stylish
  and compact circle loading icon'' and states no speed or input (SOURCED). Size 11x10x4 as built (lamp wall 11x10 in the z=0 plane, circuit in z=1..3), plus the ''run'' input cell one block south of the
  repeater at (4,1,3), outside that size. Harness changes: the .schem has no input at all and no torch, so the input was found by experiment (INFERRED that it is the intended one): the one repeater facing
  south whose rear is open, (4,1,3); a redstone block there held on starts the animation, off stops it. All blocks are the schematic''s, with power/lit/powered state reset so the game recomputes it; the
  51 lamps that ever light are named l_<x>_<y> (the other 59 never light in any test). MEASURED on 26.3: with run held the first lamp lights 4 gt after the drive, up to 38 of the 51 lamps are lit at once,
  and the whole pattern repeats every 46 gt (23 redstone ticks), checked as the exact lamp pattern repeating from tick 100 on; released, the last lamp goes out 26 gt later; a 4 gt pulse plays one 28 gt
  burst (lit ticks 24 to 51) and ends dark; with no input every lamp stays off. The tests are golden recordings of this build''s own behaviour (waves of one lamp per distinct waveform, 16 of the 51, over
  150 gt from the drive and over 92 gt in steady state, and a full 51-lamp frame at each 30 gt), not a derivation from the circuit. Mechanism is INFERRED from the layout only: the input repeater feeds a
  subtract comparator whose side dust inputs come from the ring of dust and repeaters behind the wall, a comparator-and-dust delay line that clocks itself while the input is held; each iron block next to
  a lamp is hard-powered by a repeater or comparator and lights that lamp and (through dust-fed neighbours) the plus-shaped blob around it. It was not traced block by block.'
