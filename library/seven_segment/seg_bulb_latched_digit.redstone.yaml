name: seg_bulb_latched_digit
description: 'A 3x9 digit of waxed copper bulbs that keeps what it shows after its inputs drop, with a
  clear input: seven set/clear latches whose memory is the pixel bulb itself. Each segment is one bulb
  in a flat 3x3 ring at its own row: a comparator beside the bulb in the face reads it (15 when lit) and
  feeds five dust around the ring into a repeater behind the bulb, so a lit bulb keeps itself powered.
  A set pulse powers the ring dust: an unlit bulb sees a rising edge and toggles on, a lit one is already
  powered and ignores it, so set is idempotent. Clear is the comparator''s side (subtract mode): it cuts
  the ring, the repeater drops, and on release the ring re-powers the still-lit bulb, whose rising edge
  toggles it off; unlit bulbs have no ring power and stay dark. Tested: every lone segment and every digit
  held after the inputs drop and cleared; a second set of a lit segment leaves it lit; lit 2 game ticks
  after set rises; dark 4 ticks after clear is released (not on press); a set pulse needs 3 ticks (2 leaves
  it dark) and a clear pulse 2 ticks (1 does nothing). Don''t set while clear is held (untested). Why
  so big: in the 3x5 diamond every bulb has only one private neighbour (behind it), but a latch needs
  a reader and a power entry, whose loop must U-turn; flat rings in adjacent rows collide on their support
  blocks, so the bulbs sit two rows apart (a 3x9 face, rows 9/7/5/3/1) and the rings stick out two columns
  each side. Interface: face at z=1 looking north, low x is the viewer''s right; bulbs a (4,9) b (3,7) f
  (5,7) g (4,5) c (3,3) e (5,3) d (4,1); set inputs are the cells beside each ring''s middle dust at z=2:
  a (1,9) b (0,7) f (8,7) g (1,5) c (0,3) e (8,3) d (1,1); clear is seven driver cells in front of the
  reader comparators at z=0: (3,9) (2,7) (6,7) (3,5) (2,3) (6,3) (3,1), so a real build feeds them from
  a clear bus in front or re-routes it. Size 7x10x3 = 210, 120 blocks (driver cells excluded), well over
  the 40 the brief aimed for. Trade-off: the only display in the family that remembers; seg_bulb_3x5 (3x5x2,
  22 blocks) follows its input level and forgets.'
traits:
- entityless
- pistonless
- vertical
- survival_friendly
