name: seg_floor_dust
description: 'A digit drawn in redstone dust on the floor, read from above; no lamp, so no light update and no sound. The viewer stands at the north edge looking south: a (the top of the digit) is the south row, d the north row, +x is the viewer''s left. Segments are straight dust lines (a, d, g three long; b, c, e, f two long) that stop one cell short of each corner, so no two segments touch orthogonally, and dust never joins diagonally on one level. Inputs are the cells just outside each segment''s end: a (3,1,8), d (3,1,0), b (0,1,6), c (0,1,2), e (6,1,2), f (6,1,6). g is enclosed, so it is fed through the gap between b and c by a repeater facing west, whose sides ignore b and c; its input is (0,1,4). 5 wide x 2 tall x 7 deep on a black floor, 53 blocks. Delay: 0 game ticks on both edges for a-f, 2 for g (the repeater); the truth table''s worst case is 2. Trade-off: the only lightless, silent display the harness can read pixel by pixel, but dust reads poorly from afar and the viewer must
  look down; seg_floor_rail is the 0-tick, brighter version of the same layout.'
traits:
- flat
- horizontal
- lightless
- silent
- pistonless
- entityless
- fast
- compact
- reset_safe
- survival_friendly
- tick_accurate
