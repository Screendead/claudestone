  Q: {name: bl_l, block: redstone_lamp}
  S: {name: br_l, block: redstone_lamp}
  X: {name: bot_l, block: redstone_lamp}
  Y: {name: bot_c, block: redstone_lamp}
  Z: {name: bot_r, block: redstone_lamp}
