name: ref_mattbatwings_pixel_module_3x5
description: "Rebuild of DISMODULE004 3x5 Display Module (mattbatwings, endorsed; Recommended, Tested & Functional; https://discord.com/channels/1361854816837435433/1472417759399776308). SOURCED: README says only \"Wiring to display any pattern on a 1x1 density 3x5 display\", with a .schem. Size 5x10x11 (lamps in a 3-wide, 5-tall block at the south face z=10, y=2..6, x=1..3; the viewer stands south looking north, so x=1 is the viewer's left), 288 blocks. What it does (MEASURED): 15 independent inputs, one per pixel, so any of the 2^15 patterns of a 3x5 font can be shown; the inputs sit on the north face as 3 dust lines (x=0, 2, 4) in each of the 5 odd layers y=1,3,5,7,9, and input at (y, x) lights the lamp at (y+1, x/2+1), so the bottom input row drives the bottom lamp row and the left input the viewer's left pixel. No pixel depends on another, unlike seg_lamp_3x5 where 7 segment inputs share corner pixels. How (INFERRED from the layers, confirmed pixel by pixel by the test): the three lines of a layer are squeezed into columns x=1..3 (x=0 and x=4 dust bends in through targets at z=2, x=2 through a repeater and wool), and each layer is its own horizontal lane running south, with every even layer between lanes capped in gray wool so dust and repeaters in neighbouring lanes never link. The lowest lane (y=1) is repeaters and dust straight to a wool block under its lamp; the next ones end in a repeater into wool beside the lamp, so the lamp is hard-powered by the conductor. The upper rows (y=7, 9 and the lamp rows at y=5, 6) route down and invert with torches at z=9 that sit beside their lamps and are switched off by a power-1 dust from the comparator layer at y=6: two barrels at x=0 and x=4 hold 26 milk buckets each (unstackable, strength 14), comparators read them and subtract-mode comparators leave a constant signal 1 that the pixel's own signal cancels. The barrel contents are logic; without them the y=7 row lights only with all three inputs on (MEASURED while debugging this rebuild). Harness change: the inputs are redstone blocks at z=-1 (outside the 5x10x11 size) feeding the dust line starts, the original has bare dust ends; barrel contents are taken from the .schem block entities (the parsed archive JSON dropped them). MEASURED: one table of 98 rows (all off, each pixel alone, each pixel off with the rest on, all on, digits 0-9 of a 3x5 font, 40 seeded random patterns) gives exactly the matching lamps lit. Delays come from those rows and are worst cases over them, not over all 2^15 patterns: rise 4 gt (bottom row corners) to 10 gt (middle row), fall always rise + 4 (the lamp's own turn-off delay). Slowest row is the middle one, which crosses the comparator layer."
traits: [compact, vertical, entityless, pistonless, silent]
