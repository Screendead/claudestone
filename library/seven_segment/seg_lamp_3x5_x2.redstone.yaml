name: seg_lamp_3x5_x2
description: 'Two seg_lamp_3x5 digits side by side, proving the tile: tens digit (inputs ta-tg) on the viewer''s left at x=4-6, units (ua-ug) on the right at x=0-2, one black concrete column at x=3 between them. The column stops the lamp bleed from one digit''s b/c column reaching the other''s e/f column; the dust feeds are two apart and never touch. Inputs are the z=2 cells behind each digit''s driven lamps (same offsets as seg_lamp_3x5, tens shifted +4 in x). 7 x 6 x 2, 73 blocks. Delay 4 game ticks (0 on, 4 off), tested with digits and opposite side segments lit together so any bleed would show. Use it as the pattern for wider numbers: add a digit every 4 blocks.'
traits:
- tileable
- fast
- silent
- compact
- entityless
- pistonless
- vertical
- reset_safe
- survival_friendly
