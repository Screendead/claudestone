name: ref_aminotreal_hlp_ubcd_display
description: "Rebuild of NUMDISPLAY005 Hex Layer Problem (HLP) Displays (authors Aminotreal and Powsi, endorsed by mattbatwings; Recommended, Tested & Functional; https://discord.com/channels/1361854816837435433/1472416236989317202). SOURCED: README says three HLP displays, all stackable every 4x6 blocks: one hex, one BCD, one unordered BCD; no speed given. The .schem holds all three side by side; this file is the unordered BCD one (smallest, z 34..42 of the schem), cut out at its own origin; siblings ref_aminotreal_hlp_hex_display and ref_aminotreal_hlp_bcd_display. How it works (INFERRED from the blocks, MEASURED in traces): 10 levers at y=2, x=13..22, feed a dust line like the others, but the levers are not in digit order: the schem's signs label them blank, 1, 7, 3, 2, 0, 4, 8, 6, 5 from x=13 to x=22, and with no lever on the display shows 9 (sign x=23). The order is chosen so the comparator decoder needs fewer blocks, so strength is not the digit (INFERRED). Output is a 3x5 lamp glyph at x=0, z=38..40, y=2..6 with black wool in the two always-dark pixels (y=3 and y=5 at the middle column) and as a frame. MEASURED: all ten glyphs 0-9 and blank correct, delay worst case lever click to last lamp change 12 game ticks (latency_slowest), the smallest of the three. Size 23x7x9, 272 blocks. Harness changes: sign labels dropped, wool under the levers is white_wool for scripts.try's plain-support rule, levers are named cells clicked with use; its 37 barrels, 36 comparators, cauldrons and two redstone-filled hoppers keep their schem contents. Tests settle 60 ticks after placement. KNOWN (MEASURED): digits and latency_slowest pass on sat1, sat2, sat3, sat5, sat6 and dsat1 but fail every time on dsat2 and dsat3, where the dust at (1,3,6) reads 15 from placement and never changes, so the last lamp column stays lit; cause not found (not the hoppers, target blocks or cauldrons, and update_pass none changes nothing)."
traits: ["analog", "comparator_based", "container_based", "pistonless", "entityless", "compact"]
