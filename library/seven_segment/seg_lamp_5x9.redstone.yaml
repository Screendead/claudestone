name: seg_lamp_5x9
description: 'Full size 5x9 lamp digit (the face of the generated `digit`, three lamps per segment, black frame, corners dark) fed by dust instead of repeaters. The middle lamp of each segment has one dust behind it pointing in, which powers it as a conductor so both end lamps light by bleed; frame blocks between segments stop it spreading. Behind the face only the dust, a block under each dust and a block over each (cutting diagonal dust links) are needed, 65 blocks in all. Interface: face at z=0 looking north, x=0 is the viewer''s right; inputs are the z=2 cells behind the middle lamps: a (2,9), b (0,7), c (0,3), d (2,1), e (4,3), f (4,7), g (2,5). 5 wide x 10 tall x 2 deep. Delay: 0 game ticks on, 4 off (tested every digit and lone segment); the repeater-fed `digit` takes 2 and 6. Trade-off: the most legible lamp display in the family and 2 ticks faster than `digit` on both edges, but the feed must be dust or a source right behind the face, not any weak signal.'
traits:
- fast
- silent
- entityless
- pistonless
- vertical
- tileable
- stackable
- reset_safe
- survival_friendly
- tick_accurate
