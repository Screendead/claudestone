name: ref_mattbatwings_basic_pixel_display_8x8
description: 'Rebuild of PIXDISPLAY004 Basic Display (mattbatwings'' Logical Redstone Archive; endorsed by mattbatwings; tags Tested & Functional, Recommended; https://discord.com/channels/1361854816837435433/1472414086359810159). SOURCED: README says only "A basic 8x8 display out of 2x2 lamp pixels". Original 7x17x16, 1344 blocks. The viewer faces the lamp wall at x=0 (here x=1); it is 16 lamps tall (y=1..16) and 16 wide (z=0..15), 8x8 pixels of 2x2 lamps. Pixel (r,c) = lamps y=2r+1..2r+2, z=2c..2c+1, r=0 the bottom row, c=0 the north-most column; its one input is a dust line end at x=7, y=2r+1, z=2c (here a redstone block at x=8 beside it), input high = pixel lit. 64 independent inputs, 256 lamps, no memory. MEASURED (26.3, satellites): all 64 pixels alone, each pixel dark in a lit wall, a checker, rows, columns, a border, a smiley and 6 seeded random patterns light exactly the matching pixels; 5 of 5 full runs passed. Delays MEASURED: every lamp of a pixel rises 6 ticks and falls 10 ticks
  after the input (the four wave tests agree, wave strings are 1-based so char 7 is tick 6), all four lamps in the same tick. HOW (INFERRED from the layers, confirmed by the tests): the input dust powers wool at x=5; that wool feeds a torch at x=4 (wall torch on its west face), so the torch is the inverter. For the pixel''s north row (z even) the torch drives a repeater at x=3 facing east, whose output powers the wool at x=2, which switches the wall torch at x=1 (again an inverter) that lights the lamp at x=0: two inversions give input high = lamp lit. The south row (z odd) takes the same wool at x=5 with a second wall torch on its south face (facing south, mounted on the wool at z-1) into a repeater at x=4, dust at x=3 onto the wool at x=2: also two inversions. The two rows are 2 + 2 + 2 ticks to the lamp-side torch, so they switch in the same tick (the repeater is what pads each path to equal length). The lamp row above (y even) has no circuit: wool at x=1 sits on top of the y-odd torch
  and a torch hard-powers the block above it, so that wool lights the lamp beside it, on the same tick as the torch. Every layer holds one pixel row''s dust and torches, the even layers between are only wool and lamps, which is why the pitch is 2 and the whole display is 4 blocks deep behind the lamps. Harness changes: the input redstone blocks at x=8 (the original has bare dust ends); the schematic was shifted one block east with x=0 reserved air, because on a satellite a stray comparator was found at (-1,3,6) relative to the origin (left by another build in the shared references plot) and it kept a lamp of pixel (1,3) lit; without the margin most runs failed on a pixel of column 3 (the comparator was on the satellites tried). The checks read all four lamps of every pixel (check steps), the truth table reads the lamp at y=2r+1, z=2c of each.'
traits:
- torch_based
- pistonless
- entityless
