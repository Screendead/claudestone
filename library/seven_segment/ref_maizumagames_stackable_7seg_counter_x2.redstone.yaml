name: ref_maizumagames_stackable_7seg_counter_x2
description: 'Two ref_maizumagames_stackable_7seg_counter digits side by side, the tens digit at x=1..4 and the ones digit at x=5..8 (the second copy is the first shifted 4 blocks east; the one-block air margin at x=0 and the lever clk, with its stone support, at x=9 in front of the ones digit''s input observer are harness additions), proving the README''s ''Stack side by side for automatic multi-digit counting''. Source (SOURCED): NUMDISPLAY006 ''Stackable 7-segment Counter'' by MaizumaGames, endorsed by mattbatwings (https://discord.com/channels/1361854816837435433/1472416502064877579); see the single-digit spec for the design notes, the load mode (update_pass strict) and the harness changes. MEASURED: on sat1, sat2 and dsat1-3 the pair counts 00 .. 25 in order on lever flips (carry into the tens digit at 09 to 10 and 19 to 20), and 99 to 00 wraps with no third digit attached, then counts on to 01. The carry needs no extra wire: the ones digit''s last observer at its x=0 side is the tens digit''s input observer''s face (the tens'' observer at its x=3 side watches it). Timing MEASURED on sat1: the ones lamps settle by +48 gt after a flip, the tens lamps change +64..+68 gt after the flip that carries (about 22 gt after the ones digit settles); the test waits 100 gt per flip.'
traits:
- entityless
- pistonless
- container_based
- comparator_based
- observer_based
- analog
update_pass: strict
