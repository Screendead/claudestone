name: ref_mattbatwings_fast_hex_to_7seg
description: 'Source (SOURCED): mattbatwings'' Logical Redstone Archive NUMDISPLAY002 ''Fast Hex to 7seg'' (author and endorser mattbatwings, tags Tested & Functional and Recommended; https://discord.com/channels/1361854816837435433/1472415614969577495). README: ''A fast design to show a hex number. Synced, but very tall.'' Input 4b. Source 42x23x5 with four lever+lamp inputs and signs; here 40x23x5 (harness changes: each lever, the lamp it sits on and its sign are gone, and a redstone-block input d0..d3 (d0 = least significant, d0 at y=2 .. d3 at y=8) sits where the lamp was, one cell east of the dust, so the truth table can drive it; the glass that only mounted the signs is removed). Output: a 5 wide x 9 tall lamp screen on the x=0 face (viewer west of it looking east), 45 lamps all named zZyY: a, g, d are three lamps at y=19, 15, 11 (z=1..3), f/b are z=0/z=4 at y=16..18, e/c are z=0/z=4 at y=12..14. MEASURED on a satellite: all 16 inputs light exactly the standard 7-segment pattern on all 45 lamps (the six corner lamps stay dark); 9 has no bottom bar and 6 has a top bar (the design''s choice; 7 is a,b,c). Delay 22 gt worst (lamps rise 14 or 18, fall 18 or 22: the f/b/e/c lamps next to the middle row, y=14 and y=18, are one 4 gt step later); the second test re-runs the table with glitch_free and passes, so no lamp flickers on any input change, which backs the README''s ''synced''. How it works (INFERRED from the layout, then confirmed by the table): each input is a dust line on the bus at its own y (y=2,4,6,8) running west over wool; where it powers the wool below, a wall torch (inverted) or a repeater (direct) on the wool''s north side feeds a dust cell, in column pattern n/C alternating per column for bit 0, nnCC for bit 1, nnnnCCCC for bit 2 and 8+8 for bit 3, so column i of 16 collects the OR of ''this bit differs from i'' (a four-input NOR in dust, with the OR done by dust and the mismatch terms stepped up the column on glass); a torch on top of the column''s top wool inverts it, giving a one-hot line per hex value. Each one-hot line then climbs a vertical dust ladder through seven stacked bus layers (y=10..22), one per segment, and a repeater at the foot of that line on a segment''s layer pushes into the segment''s bus only where that segment is on for that digit, so a segment bus is the OR of its digits; the buses end in the lamp wall (a, g, d through target blocks into the horizontal lamps, f/b/e/c through torch stages up the vertical lamps). A bus at y=2,4,6,8 has one repeater (the H) in the same place on every input line to equalise the paths. Why tall: one layer per input bit and one per segment, each only 5 blocks deep, 23 layers in all.'
