name: ref_mattbatwings_4function_display
description: 'Rebuild of mattbatwings'' 4-function Display, Logical Redstone Archive PIXDISPLAY002, https://discord.com/channels/1361854816837435433/1472413607072497697 (README SOURCED: a pixel display with 4 functions, set one pixel to 0, set one pixel to 1, set all pixels to 0, set all pixels to 1; inputs 3b X, 3b Y, Data, Plot single, Plot all; tested and functional). 20x25x24, 3,875 blocks: an 8x8 display of 2x2 redstone lamps (x=2, y 9-24, z 1-16; pixel X is lamps z=1+2X..2+2X, pixel Y is lamps y=9+2Y..10+2Y, X=0 Y=0 bottom of the z=1 end) with the controls on the west face at x=0: column bits x0,x1,x2 are levers at (0,3,18), (0,5,18), (0,7,18); row bits y0,y1,y2 are levers at (0,3,20), (0,5,20), (0,7,20); Data is the lever at (0,5,15); Plot single is the stone button at (0,2,19); Plot all is the stone button at (0,5,23). Which lever is which was MEASURED (each address bit alone plots the pixel it should), the README does not say. Named cells lamp00 (pixel 0,0) and lamp77 (pixel 7,7)
  are lamps the tests time. Harness changes: the block each lever and button hangs on (x=1: an input-indicator redstone_lamp, or black_wool under the Plot single button) is white_wool, because the harness emulates a click only on plain blocks (the lamps only showed the lever state); the 75 barrels carry one redstone each, which the .schem has as block entities and a block-state parse drops (MEASURED: with them empty plot single fails, plot all still passes, so only single-pixel plots read them); nothing else changed. What the tests prove (MEASURED): every one of the 64 pixels plots to 1 from dark, taken in Gray-code order with all four lamps of the target and one lamp of each of the 64 pixels checked after each press, so no other pixel moves (plot_each_pixel_on), twelve pixels (corners, edges, centre) clear to 0 from an all-lit board, with the target''s four lamps and the board checked after each (every lamp of the board after three of them) (plot_pixel_off), plot all sets and clears every
  one of the 256 lamps whatever the address levers say (plot_all), and moving the address or Data levers without pressing a button changes nothing (idle_levers_change_nothing); writing the value a pixel already holds does not even flicker (rewrite_same_value). Timing (MEASURED, plot_timing): the pixel changes 30 gt after the click when it lights and 34 gt when it clears, and a plot all lights 24 gt and clears 28 gt after the click, the same for the first and last pixel; all four lamps of a pixel change in one tick. The write happens at the button''s release, not its press: a stone button is held 20 gt, the lamps stay as they were through gt 29 and change 10 gt after the release (MEASURED, from the trace: the dust ramp on x=8 drops at the press and comes back at the release, the lamp changes 3 gt after it); a clear takes 4 gt longer because the lamp itself turns off after 4 gt. Data and the address levers need a few ticks to settle before the press; the tests wait 4 gt after each change.
  How it works (INFERRED from traces of which cells change per address, not every block traced): each address bit has a lever, a repeater and a subtract comparator, and nothing downstream moves until the Plot button is pressed (the levers only move their own repeater, MEASURED). At the press each column bit sets a dust ramp on its own layer (y=2, 4, 6 at x=10) whose strength equals the cell''s z, so a column is a strength; per column a repeater or a torch in a row alternating every 1, 2 or 4 pixels (layers y=1, 3, 5) says whether the column''s bit is 0 or 1, and a dust staircase going up one layer at a time drops 2 strength per layer, so it reaches the top only for the column whose three bits all match (the select line, torch at x=15, dust at x=16 in (15,6,z), (16,7,z)). The row address does the same on a vertical ramp (strength 15 at y=10 down to 1 at y=24 on x=14) against repeater-or-torch rows in the display layers. A pixel''s memory is a comparator, repeater and torch cell beside its
  lamps, set and cleared where its column select and row select meet; a 1-strength barrel is the comparator constant of the single-plot path. Plot all bypasses the address and drives every pixel''s set or clear from the Data lever along the orange-wool bus at x=19 and the y=4 row. Why compact: the address is a strength and a block pattern rather than a decoder gate per pixel, so a pixel costs a few blocks in a 4-block z pitch for two pixels and 2 layers per pixel row; the 6 address bits decode to 64 pixels in the 20x25x24 box, lamps included.'
traits:
- entityless
- pistonless
- torch_based
