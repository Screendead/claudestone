name: ref_aminotreal_hlp_bcd_display
description: "Rebuild of NUMDISPLAY005 Hex Layer Problem (HLP) Displays (authors Aminotreal and Powsi, endorsed by mattbatwings; Recommended, Tested & Functional; https://discord.com/channels/1361854816837435433/1472416236989317202). SOURCED: README says three HLP displays, all stackable every 4x6 blocks: one hex, one BCD, one unordered BCD; no speed given. The .schem holds all three side by side; this file is the BCD one (middle size, z 19..27 of the schem), cut out at its own origin; siblings ref_aminotreal_hlp_hex_display and ref_aminotreal_hlp_ubcd_display. How it works (INFERRED from the blocks, MEASURED in traces): 9 levers k1..k9 at y=4 feed a dust line the same way as the hex display (lever kN at x=26-N, line end reads N, no lever = 0, highest wins by the same decay argument); a decoder of comparator layers, one per pixel row, built from 58 barrels of totems, 67 comparators, an end portal frame, two hoppers and a target block as constants, drives the lamp wall; plus a floor lever 'extra' at y=7 that blanks the display (MEASURED: extra on lights no lamp, whatever digit is selected; blank_overrides_digit). Output is a 5x7 lamp wall at x=0, z=0..4 (rel), y=1..7 with the 3x5 glyph at columns 1..3, rows y=2..6. MEASURED: decimal glyphs 0-9 all correct (digits test); worst case lever click to last lamp change 22 game ticks (latency_slowest). Size 26x7x9. Harness changes: sign labels dropped (they read 9..0 above the levers, x=17..26 with 0 = no lever), wool under the levers and the floor lever's support is white_wool instead of cyan for scripts.try's plain-support rule, levers are named cells clicked with use, not redstone-block drivers; barrel contents come from the .schem block entities (totems, 1-27 per barrel). Tests settle 60 ticks after placement."
traits: ["analog", "comparator_based", "container_based", "pistonless", "entityless", "compact"]
