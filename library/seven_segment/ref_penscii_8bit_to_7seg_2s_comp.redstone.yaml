name: ref_penscii_8bit_to_7seg_2s_comp
description: "Source (SOURCED): mattbatwings' Logical Redstone Archive NUMDISPLAY007 '8bit to 7seg (with 2s comp switch)' (author Penscii, endorsed by mattbatwings, tags Tested & Functional and Recommended; https://discord.com/channels/1361854816837435433/1472416778675163211). README: 'A display for showing any 8 bit number. Input 8b number, Lever. Use the switch on the side to flip between positive integer (0 - 255) and 2s comp (-128 - 127)'. Source 17x8x34 (130 barrels, 291 comparators, 1890 blocks as placed here), rebuilt block for block from the .schem including each barrel's totem count (INFERRED from item counts, all 14 constants 1..14 match the barrels' custom names: n totems read as 1 + floor(14 n / 27)). Harness changes: the 4 label signs are gone; the 8 indicator lamps the input levers sit on (z=32) and the pink wool under the switch lever are white_wool, because `use` only emulates levers on plain blocks, and white wool conducts like the lamp did (all 512 values below still read right). Inputs: 8 levers bit0..bit7 on the south face at z=33, x=0,2,..,14 (bit k = value 2^k, MEASURED over all 256 values), a switch lever `neg` at x=16 (off = 0..255, on = -128..127). Output: a 3 digit 7-segment screen plus a minus sign on the z=0 face, x=1..3 units, 5..7 tens, 9..11 hundreds, sign lamps x=13,14 at y=4 (the viewer north of it sees +x on the left), 3x5 lamps a digit named dN_yY_xK (K 0 = viewer's right column); a digit is drawn with shared corners (a corner lamp lights if either adjacent segment does; the mid-row corners follow the verticals only), leading zeros blank, 0 shows as a single 0. Measured (MEASURED, 26.3, laptop satellites): a sweep of all 256 values in order, once per switch position, gave the right display for every value and every lamp state in the tests below; the display changes first 40-44 gt after the lever click and is final at most 46 gt after it (distribution over the 256 single steps: last change at 44 in 187, 40 in 50, 46 in 18 steps for the unsigned sweep; 197/48/10 signed); wait 44 in the sweep test fails, 46 passes. The delay is the length of the build, not a delay line: with a full trace a click on bit0 moves down x=0 as a 2 gt per comparator wavefront from z=33 (tick 0) to z=22 (tick 16), through the digit stages to the lamps at z=0 (tick 44), hundreds before tens before units. INFERRED from the levels (MEASURED on 17 sample values): the units digit sits as a 0..9 signal strength at (2,3,17) and feeds a bank of subtract/compare comparators with barrel constants (one per segment pair), the hundreds digit is a 0..2 strength at (9,1,3) and the like, and the sign and magnitude (256 - v for v >= 128 in two's complement mode) come from the switch lever that gates a negate stage; the tens digit never sits as one strength. Tests: 57 values per switch position (0..11, every x9/x0 round number, 99/100/101, 127/128/129, 188/189, 254/255, shuffled), the switch flipped at 200/100/127/128/255/0, and the exact lamp timeline of 29 -> 30."
traits: [analog, comparator_based, container_based, vertical]
