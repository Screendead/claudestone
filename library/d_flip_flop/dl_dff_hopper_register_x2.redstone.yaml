  - drive: {d0: 1, d1: 0}
  - wait: 6
  - drive: {clk: 1}
  - wait: 3
  - expect: {q0: 0, q1: 0}
  - wait: 1
  - expect: {q0: 1, q1: 0}
  - drive: {d0: 0, d1: 1}
  - wait: 8
