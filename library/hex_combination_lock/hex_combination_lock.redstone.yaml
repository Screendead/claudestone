name: hex_combination_lock
description: 'Combination lock where signal strength is the data: three 4-lever hex digits are turned into strengths 0-15, compared with a secret code of three item counts by subtract comparators both ways (D - code and code - D), and a CHECK button latches the result into an UNLOCK lamp. The code is A, 3, C (10, 3, 12), stored as stone in two decorated pots a digit (one per comparator); change the code by changing the count (strength s needs 1,5,10,14,19,23,28,32,37,42,46,51,55,60,64 stone for s=1..15). USE: set digit 1/2/3 on its four levers (inputs d1b3..d1b0, d2b..., d3b..., most significant bit first; each is a power cell where a lever sits), press CHECK (stone button), the lamp stays lit until a wrong CHECK or RESET (lever; hold it on, then off). Order matters because digit i is compared only with code digit i. HOW IT WORKS: per digit a 4-bit DAC of three subtract comparators fed by hopper constants (library analog_dac, unchanged apart from moving its b1 and b0 inputs onto the side
  cells) puts the digit on a comparator (named d1, d2, d3, exact strength 0-15); a compare-mode comparator copies that strength onto a stone, where one subtract comparator reads it through the stone as rear against the pot''s strength (D - code) and a second reads the dust on top of the stone as side against the pot''s strength as rear (code - D); the two exact-difference dusts each go through a repeater, which turns any difference of 1 or more into 15, onto one mismatch bus shared by all three digits. A repeater reads the bus, a subtract comparator inverts it (15 - bus) and gates it into a data repeater locked by a second subtract comparator (library dl_subtract_lock''s gated latch): the latch follows the match only while CHECK is held (a stone button, 20 gt), so the digits can change after CHECK without relocking, and RESET opens the latch and forces the data to 0. SIMPLIFIED versus entry one digit at a time: the three digits are entered in parallel on 12 levers with one CHECK button,
  and the digits are live DAC strengths rather than latched copies (the comparator-loop latch from d_latch/dl_analog_ring would add 8x7 blocks a digit; the lock latch is one bit). Library parts: signal_strength/analog_dac, signal_strength/analog_const_container (pot constants), signal_strength/analog_abs_diff (difference both ways, rebuilt around a stone tap), d_latch/dl_subtract_lock. Size 19x3x22 (558 blocks, plot main). MEASURED: bit change to digit strength 8 gt (b2, the slowest DAC path; waved on d1); CHECK to q 4 gt and to the lamp 6 gt; RESET to q 4 gt and the lamp off 10 gt (a lamp adds 4 gt to every fall). Full digit-entry to mismatch bus latency was not measured; tests wait 40 gt after entering. INFERRED: the mismatch bus loses one strength per dust, 14 at worst from the far digit to the reading repeater at the middle digit''s row, so it reads 8 or more everywhere. Tests cover: all-zero fails, digit strengths exactly as entered (level on d1..d3), correct code unlocks only on CHECK
  and holds after the digits change, each digit one above / one below / zero fails, wrong order and reversed order fail, a wrong re-entry relocks, RESET clears and a second CHECK unlocks again. Gotcha found while building: q''s output lamp strongly powered dust on c1''s side, so it kept the latch open; q now drives the lamp through a repeater.'
traits:
- analog
- comparator_based
- container_based
- pistonless
- entityless
