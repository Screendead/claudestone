name: latch
description: 'One-bit latch. While e is on, q follows d; when e goes off, q holds. The latch is a repeater whose side is fed by a lock repeater; the torch makes the lock active when e is off.'
palette:
  .: air
  '=': smooth_stone
  '#': white_concrete
  '-': redstone_wire
  '>': repeater[facing=west]
  ^: repeater[facing=south]
  n: redstone_wall_torch[facing=north]
  d: {input: d}
  e: {input: e}
  l: {name: latch, block: 'repeater[facing=west]'}
  q: {output: q, block: redstone_wire}
layers:
  0: |
    .====
    ..=..
    .....
    .==..
  1: |
    d>l-q
    ..^..
    ..n..
    e>#..
tests:
- name: follows while enabled
  steps:
  - drive: {e: 1, d: 1}
  - {wait: 10}
  - expect: {q: 1}
  - drive: {d: 0}
  - {wait: 10}
  - expect: {q: 0}
- name: holds a 1 when locked
  steps:
  - drive: {e: 1, d: 1}
  - {wait: 10}
  - drive: {e: 0}
  - {wait: 10}
  - drive: {d: 0}
  - {wait: 10}
  - expect: {q: 1}
  - drive: {e: 1}
  - {wait: 10}
  - expect: {q: 0}
- name: holds a 0 when locked
  steps:
  - drive: {e: 1}
  - {wait: 10}
  - drive: {e: 0}
  - {wait: 10}
  - drive: {d: 1}
  - {wait: 10}
  - expect: {q: 0}
