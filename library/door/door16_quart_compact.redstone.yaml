name: door16_quart_compact
description: "door16_quart compacted (door_cycle pending): the same 16x16 QUART door, machines and logic, with the controller packed toward the machines' footprint. The spit ladder is split in two four-rung halves either side of its master bulb (clock_burst_split_ladder), so it no longer reaches 20 blocks past the odd bands; each ZA spit line's extra delay is a packed observer path beside its first tap (delay_observer_cube, observer_chain_pulse_merge: a 2 gt pulse stays one 2 gt pulse) instead of a 13-block hairpin; the hold taps are two-row folds level with the hold master (delay_serpentine's fold) instead of 14-block lines; the K_Z and even ZB spit lines are shorter (the K_Z lock is still tuned to open 4 gt before GZ), the odd arrival filter sits 6 blocks east, the second close pulse's snake is shorter and bulb B's parity pulse runs through a short snake of its own (both keep door16_quart's close windows), and the store and kick lines keep routes pinned from an earlier build. Every timing target of door16_quart is kept (spits R+56+10j, holds R+138..R+178, close kick 34/20 gt after the close spits). Nothing stands in the doorway's prism (the even ZB sensor line is folded west of x 13). Generator: scripts/door16/pairs_ctrlq.py --compact. The odd bands' spit and hold lines run south along z beside the band instead of out west, which takes the build from 96 to 74 blocks wide; the hold line's turn into its column is placed by hand, since the router never lays a block beside the spit line. The bottom routing row is gone: the close kick's and second close pulse's snakes sit in the rows above it, bulb B's pulse needs no snake of its own, the routes keep off the input feed, and every route that never used that row is kept (pin_v3.pkl). The input feed still needs its supports one below the lever cell, so this frees one layer, and the controller no longer reaches the outermost column on each side: 72x29x45. Open, store and hold timings and the close kick are unchanged, bulb B's second toggle too; the second close spit comes 6 gt earlier and the rebuild after the ZB arrival 2 gt earlier. Colour key (plain stone recoloured to concrete by circuit, traced by redstone.circuits from the generator's components; legend signs north of the input repeater): white: Input and centre feed; purple: Controller logic: gates, counter, fetch, store gate; magenta: Masters: ladder, timer taps, spit/hold bulbs, close pulses; pink: Home sensors and arrival filters; red: Kick lines (x-band, ZA, ZB, close kick, K_Z lock); yellow: Spit lines (x-band spits, ZA spits); orange: Store lines (ZB spits); blue: Hold lines (door pistons held shut); cyan: Observer towers (pair to pair); light blue: Delay lines (snakes, tuned repeaters); black: Shared (powered by two circuits); slime and honey are the band machines, quartz the door, stacks and front ring, and the stone left is support that carries no signal and holds up nothing."
traits: [piston_based, entityless]
update_pass: strict
