name: door16_band_pairs
description: "Two adjacent row pairs of the in-plane 16x16 door (rows 4-5 and 6-7, one half, 8 columns each) storing through their own z-stacks and rebuilding their wall queues, alone and in lockstep. Each pair is door16_band_open's machinery: an x-band that fetches columns into its slot, a ZB (home deep on side B) that pushes [spacer, slot block] into a stack on side A, and a ZA (home deep on side A) that pushes the stack back for the queue. A z-band takes rows b..t+1 plus a watched row at slot..slot+4, and same-side pairs are 2 rows apart, so adjacent pairs can't share a slot x: pairs alternate between slot x3 (x-band home x1..x2, z-bands x3..x7) and a slot pushed out into the wall at x-5 (x-band home x-7..x-6, z-bands x-5..x-1); x0 keeps the even x-bands' home obsidian and kick cells and a gap from their slime at x1. Spec x = logical x + 8. Rows 2-3 are an idle odd pair. Stand-ins for the controller: the kicks, the home spits (setblock on the cell B watches) and the held P (redstone blocks beside P), as in door16_band_open. Lockstep is proven; arbitrary timing is not: the even pair's ZB crosses the odd pair's bottom row in k1..k5 and the door plane, so an odd x-band must not fly while it does."
traits: [piston_based, entityless]
update_pass: strict
palette:
  '.': air
  A: note_block
  B: 'observer[facing=east]'
  C: 'observer[facing=north]'
  D: 'observer[facing=south]'
  E: 'observer[facing=up]'
  F: obsidian
  G: quartz_block
  H: slime_block
  I: 'sticky_piston[facing=east]'
