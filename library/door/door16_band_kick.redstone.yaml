name: door16_band_kick
description: "Three shuttle bands for an in-plane 16x16 door (door rows 2-7, columns x5-8), stacked by mirroring as in door16_band_stack (each side now 4 planes deep), that fetch a column, stop and come home with no input after the kick. Stop: the east half is 11 blocks, so once its pistons hold a column the next push would move 13 and fails. Return: the west half carries observer W (row t+1, plane k4, facing up) that sits on a note block N of the east half whenever the halves touch; observer E on the east half watches N and outputs into L. Every west landing W fires (with O) and powers N; E sees N change and fires 2 gt later. In flight R's push moves E and N away first, so E's tick is lost and it fires only with B on the next landing, as B already powers L then. When R's push fails, E fires into L at landing+4, after O's pulse has ended, so L spits the west half with O unlit, O fires again where it lands and R starts the flight home. The control tests replace W, or N, with a stone: the band parks and stays."
traits: [piston_based, entityless]
update_pass: strict
palette:
  '.': air
  O: 'observer[facing=north]'
  o: 'observer[facing=south]'
  S: slime_block
  R: 'sticky_piston[facing=east]'
  L: 'sticky_piston[facing=west]'
  B: 'observer[facing=up]'
  Z: stone
  X: obsidian
  Q: quartz_block
  N: note_block
  k: {input: kick0}
  K: {input: kick1}
  j: {input: kick2}
