name: door16_band_slice16
description: "A 16-row slice of the in-plane door: eight row pairs (door rows 4-19; even pairs at rows 4, 8, 12, 16, odd at 6, 10, 14, 18; each pair's machines use only its own rows and the two above, so no separate top or bottom row mechanism is needed) on one lever; each signal of a class climbs pair to pair through an observer tower standing on a repeater of the first pair's end chain (6 gt later, every event, so its phase is kept). Built from two adjacent row pairs of the in-plane 16x16 door (door16_band_pairs: rows 4-5 with slot x3, rows 6-7 with the slot pushed out to x-5, rows 2-3 idle), 5 columns per half, both halves, driven in lockstep from one lever by a controller per half and no stand-ins. The panel is door16_band_ctrl's; the actuators sit in each pair's own cells: the even x-band is kicked by a hopper in the cell its west half's O watches and held by powering its home-stop obsidian, the odd x-band from the open wall west of its home; spits are hoppers in the cells each B watches, driven by copper bulbs (one per pair) whose comparators carry each toggle; one ladder toggles a master bulb whose observers relay its toggles to both spit bulbs, and a second master relays two taps to both hold bulbs. Stores start on the odd x-band's arrival (the later one), fetches on the even ZB's. Long lines are routed around every machine's swept cells (scratchpad pc/router.py)."
traits: [piston_based, entityless]
update_pass: strict
