name: door16_band_same_side
description: "Two x-bands for an in-plane 16x16 door stacked on adjacent door rows (2-3 and 4-5) with BOTH engines on the same side of the door plane, so the other side's hallway plane and walls never see a machine (door16_band_stack had to mirror every other band to the far side, which is why door16_full can't be seamless). Adjacent bands must not glue, and all bands stop at the same column, so their glue cells beside the door plane line up: the lower band is slime and the upper one honey (slime and honey don't stick to each other). Honey does not conduct, so in both bands every observer faces straight into a piston: O into R, B into L, and an observer behind the upper door piston into it, the lower door piston firing by quasi-connectivity. Each band uses only its own two rows: the engine row (O, R and glue in the plane two from the door, glue, S, L and B in the plane three from it), glue for the door pistons beside the door plane, and the door pistons. East half 11 blocks, so after a grab the next push is 13 and fails: each band parks with the column against its pistons wherever that column is. Kick = a block placed in the cell O watches; back-kick = a block placed in the cell B watches at the parked position. Needs update_pass strict: placed with the clone pass, the observers fire on placement and the slime band starts by itself."
traits: [piston_based, entityless]
update_pass: strict
palette:
  '.': air
  O: 'observer[facing=west]'
  B: 'observer[facing=east]'
  R: 'sticky_piston[facing=east]'
  L: 'sticky_piston[facing=west]'
  S: 'slime_block'
  H: 'honey_block'
  X: 'obsidian'
  Q: 'quartz_block'
  k: {input: kick_s}
  K: {input: kick_h}
  b: {input: back_s}
  d: {input: back_h}
  e: {input: back_s3}
  f: {input: back_h2}
