name: door16_band_close
description: "The close of an in-plane 16x16 door, all at once, for one middle band per half (door rows 4-5; rows 2-3 and 6-7 closed and still; band stacks as in door16_band_kick, mirrored about the doorway centre). Each middle band starts at home with a spacer and 5 columns queued in the door plane in front of its pistons. A spit (B fires) moves the queue 1 cell and R's kick starts the flight; every landing B fires again and the band pistons spit the queue 1 more cell. The halves meet at the centre in the same step, so the next spit's chain is 2x6 quartz plus the other band's piston, over 12: both spits and both R pushes fail, the W/N/E relay kicks each band home, and the first home step pulls the spacer (the block touching the pistons) home, leaving every column on its cell."
traits: [piston_based, entityless]
update_pass: strict
