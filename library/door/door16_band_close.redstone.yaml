  - check: 'if block ~3 ~4 ~4 quartz_block if block ~3 ~5 ~4 quartz_block if block ~4 ~4 ~4 air if block ~4 ~5 ~4 air if block ~5 ~4 ~4 air if block ~5 ~5 ~4 air if block ~6 ~4 ~4 air if block ~6 ~5 ~4 air if block ~7 ~4 ~4 air if block ~7 ~5 ~4 air if block ~8 ~4 ~4 air if block ~8 ~5 ~4 air'
