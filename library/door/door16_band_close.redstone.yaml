- name: control, 4 columns per half, the meeting does not stop and a band piston is shoved off
  steps:
  - run: 'fill ~8 ~4 ~4 ~8 ~5 ~4 air'
  - run: 'fill ~19 ~4 ~4 ~19 ~5 ~4 air'
  - wait: 1
  - run: 'setblock ~2 ~7 ~5 stone'
  - run: 'setblock ~25 ~7 ~5 stone'
  - run: 'setblock ~2 ~7 ~5 air'
  - run: 'setblock ~25 ~7 ~5 air'
  - wait: 6
  - drive: {kickw: 1, kicke: 1}
  - wait: 2
  - drive: {kickw: 0, kicke: 0}
  - wait: 200
  - check: 'unless block ~25 ~5 ~4 sticky_piston[facing=west]'
  - check: 'unless block ~2 ~4 ~4 sticky_piston[facing=east]'
