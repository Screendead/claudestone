name: door16_band_kick2
description: "Two x-bands for an in-plane 16x16 door on adjacent door rows (2-3 slime, 4-5 honey), both engines on the same side of the door plane, each reversing by itself after its overflow stop, each inside its own two rows. As in door16_band_same_side every observer faces straight into a piston (honey does not conduct): O into R, an east-half observer E into L, and an observer behind the upper door piston into it (the lower one fires by quasi-connectivity). E replaces engine B's observer and is the end of door16_band_kick's W/N/E relay laid flat: E watches a note block N on the east half, and W, an observer on the west half reached through a chain of glue in the fifth plane, faces N when the halves touch. On every landing E fires into L as B did; at the stop (the next push would move the east half's 12 blocks plus the grabbed column, 14) W's pulse turns N, E fires into L 2 gt after O's pulse has ended, L pushes the west half home-ward and the band flies home with the column. Kick = a block placed in the cell O watches. Needs update_pass strict (the clone pass fires the observers)."
traits: [piston_based, entityless]
update_pass: strict
palette:
  '.': air
  O: 'observer[facing=west]'
  E: 'observer[facing=east]'
  W: 'observer[facing=north]'
  R: 'sticky_piston[facing=east]'
  L: 'sticky_piston[facing=west]'
  S: 'slime_block'
  H: 'honey_block'
  X: 'obsidian'
  Q: 'quartz_block'
  N: 'note_block'
  k: {input: kick_s}
  K: {input: kick_h}
