  '.': air
  O: 'observer[facing=north]'
  o: 'observer[facing=south]'
  S: slime_block
  R: 'sticky_piston[facing=east]'
  L: 'sticky_piston[facing=west]'
  B: 'observer[facing=up]'
  Z: stone
  X: obsidian
  Q: quartz_block
  k: {input: kick0}
  K: {input: kick1}
  b: {input: back0}
  d: {input: back1}
  e: {input: back1_col1}
