name: door16_band_stack
description: "Two shuttle bands for an in-plane 16x16 door, stacked on adjacent door rows (2-3 and 4-5) and mirrored, so band 0's engine runs in the planes on one side of the door and band 1's on the other, and no slime of one band ever touches the other (same-side stacking would need slime/honey alternation, and honey does not conduct). Each band is the engine-B shuttle of door16_shuttle_band with observer B above its east slime, carrying 2 sticky pistons in the door plane, but it stops by itself, with no trigger: its east half is ballasted to 11 blocks, so once its pistons have grabbed a column the next push would move 11 + 2 = 13 blocks and fails. It parks with the column against its pistons wherever that column is. A 2 gt pulse above its west-facing piston (a stand-in for the back-kick, which a middle band still needs from somewhere) sends it home with the column in the slot. The bands fetch independently, at the same time, staggered, and from different distances."
traits: [piston_based, entityless]
update_pass: strict
