name: door16_engine_b
description: The minecraft.wiki two-way flying engine B (2 observers, 2 slime, 2 sticky pistons in one layer) on 26.3, the candidate engine for a 16x16 door's in-plane shuttles. With the observers' faces pointing away from the slime they sit on (the reading of the wiki codes that works; read the other way only the east half moves once), a 2 gt kick to the east-facing piston sends it east 1 block per 10 gt, it parks against obsidian, and a 2 gt kick to the west-facing piston sends it back west at the same rate.
traits: [piston_based, entityless, flat]
update_pass: strict
palette:
  '.': air
  O: 'observer[facing=north]'
  B: 'observer[facing=south]'
  S: slime_block
  T: slime_block
  L: 'sticky_piston[facing=west]'
  R: 'sticky_piston[facing=east]'
  k: {input: kick}
  b: {input: back}
  X: obsidian
layers:
  0: |
    ..........................
    ..........................
    ..........................
    ..........................
  1: |
    ....O..........b..........
    ....SL....................
    ...kRT..........X.........
    .....B....................
tests:
- name: flies east one block per 10 gt
  steps:
  - drive: {kick: 1}
  - wait: 2
  - drive: {kick: 0}
  - wait: 40
  - check: 'unless block ~8 ~1 ~0 air'
  - check: 'unless block ~8 ~1 ~1 air'
  - check: 'unless block ~8 ~1 ~2 air'
  - check: 'unless block ~9 ~1 ~2 air'
  - check: 'unless block ~10 ~1 ~1 air'
