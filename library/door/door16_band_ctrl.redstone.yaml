name: door16_band_ctrl
description: "door16_band_open's door (rows 4-5, 5 columns per half, both halves) with a redstone controller per half in place of every stand-in, driven by one lever. Actuators: hoppers in the cells each band's B observer watches (spits; immovable, so no slime drags them), repeaters into each band's R (kicks) and into P1 from the door plane (the hold, P2 by quasi-connectivity). Sensors: observers on the x-band's and ZB's note block N home cells; each fires on departure and on arrival, and a repeater lock fed from the kick line (K_X, K_Z) hides the departure. Sequence, chained on arrivals: lever on -> store (ZB spit, kick 10 gt later); ZB home -> fetch (x-band kick) while the counter dropper still holds shovels (it gives one to a hopper on every ZB arrival), else rebuild; x-band home and lever on -> store. Rebuild: ZA spit and kick; a repeater ladder (rungs 10 gt apart) toggles a copper bulb whose comparator drives the x-band's spit hopper, one spit per toggle, in phase with ZA's steps; a second bulb toggled twice 40 gt apart holds P1 for the last block. Lever off -> close: x-band spit (bulb toggle) and kick; the counter hopper unlocks and returns the shovels."
traits: [piston_based, entityless]
update_pass: strict
