name: ref_legden_fastest_10x10
description: 'Our rebuild of a published door: LegDen''s fastest 10x10 seamless piston door (video https://youtu.be/bZtwoJV967k, finished 02.06.2026; layout inspiration credited by LegDen to JensundLars, parkertoo and FPSL), block for block from LegDen''s downloadable world (Java 1.21.11), saved open: 8,516 blocks in 44x22x14, of which 1843 observers, 1055 sticky pistons, 629 pistons. Kept: every block state and the container contents (shovels in barrels and chests, redstone in the droppers'' chests), comparator outputs and the credit signs. Changed for the harness only: the red concrete the lever hangs on is white concrete (a lever is emulated only on a plain block). Placed at the same x and z modulo 16 and the same y as in LegDen''s world; on 26.3 two other placements (x and z off that chunk phase; and also 5 lower) ran tick for tick the same. Input: the lever under the north entrance (named lever): on closes, off opens (tested on, off, on). Doorway: x23..32 y11..20 at z13 (named d<col>_<row>, west to east, bottom to top); hallway lining quartz at z12 and z14. Reference: a 10x10 quartz fixture plane at z23 and the cleared air at z26, compared with execute if blocks. Needs strict placement: placed by the usual setblock-with-updates pass the observers see their neighbours being placed and the whole machine fires (thousands of changes per tick, the door ends wrecked); placed with setblock strict and no update pass it stands still and works. MEASURED here, counted in game ticks after the lever flip: closes (doorway all quartz) in 15 (first motion on tick 1, so 14 from first motion; LegDen: 0.7 s, sign 0.75 s), opens (doorway all air) in 28 (LegDen: 1.45 s, sign 1.5 s), seamless open (hallway lining back to quartz) in 33 (LegDen: 1.6 s, sign 1.65 s); quiet again 83 ticks after a close and 45 after an open. During a close only quartz, moving or still, shows in the doorway and the lining; during an open the slime/honey pull lines show in the north walls and sticky pistons then air in the south walls. door_cycle (lever input, tick 0 = the first tick after the flip, so one less than the counts above): close 14 under R, H1 and R1; open 29 under R (the last pull out of the doorway lands), 27 under H1 and R1 (doorway air); visible 32 open, 14 close; FULL, since the slime and honey in the north lining during the open grade the opening column as circuitry; volume 44x22x14 = 13552 counting the signs (LegDen signs 13x44x22).'
traits:
- piston_based
- observer_based
- entityless
update_pass: strict
