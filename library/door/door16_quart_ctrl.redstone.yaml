name: door16_quart_ctrl
description: "QUART-seamless in-plane piston door slice: 2 row pairs (rows 4-7), 5 columns per half, both halves, one input. Every x-band runs on the back side of the door plane (door16_band_kick2's self-reversing bands, slime and honey alternating by pair), so the front hallway plane and its walls, floor and ceiling never see a machine; the front ring is quartz and never moves. Storage as door16_quart_pairs (ZB, ZA); controller after door16_full's (logic core, counter, ladder, master bulbs, routed lines) with new x-band ends: kick hopper in the cell O watches, spit hopper in the cell the door-plane observer watches, hold repeater into the upper door piston from the front side inside the wall, and the odd band's home sensor watching its O through an arrival filter (merge repeater, bulb, torch, bulb, relay). Generator: scratchpad quart/pairs_ctrlq.py."
traits: [piston_based, entityless]
update_pass: strict
