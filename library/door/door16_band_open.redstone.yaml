name: door16_band_open
description: "The open of an in-plane 16x16 door through a z-stack at the slot, and the way back, for the middle band of each half (door rows 4-5, 5 columns per half; rows 2-3 and 6-7 closed and still; x-bands as in door16_band_close). In-plane storage is impossible (nothing in a band row passes anything, and a band pulls only the first block), so each column leaves the plane at the slot x3 only. Two z-bands per half, each the x-band turned to fly along z (P at x3, body x4-x7): ZB (home deep on side B) keeps a spacer at its slot and in spit mode pushes [spacer, slot block] through the door plane into side A until the chain meets the stack, ZA's spacer and ZA's P, backed by obsidian: immovable, so the spit and R's push fail, the W/N/E relay sends it home and it pulls back only its spacer. Open: store the x-band's spacer, then per column fetch (x-band) and store (ZB). Rebuild: ZA pushes the stack back one cell per 10 gt and the x-band spits each block arriving at the slot into the wall queue; for the last one P is held out, so its head on the slot cell stops ZA's spacer and ZA goes home with it; releasing P pulls that block back to the slot. The close is then door16_band_close's (spit, kick). Stand-ins for the controller: the kicks, the home spits (setblock on the cell B watches) and the held P (redstone blocks beside P at x1; the one beside P1 also powers R, whose push fails against the held head, so a real controller should hold P through B's lane instead). Control: spitting the last block in 2 gt lets ZA step onto plane k1, where its slime front glues to the queue and the pull home fails."
traits: [piston_based, entityless]
update_pass: strict
palette:
  '.': air
  A: note_block
  B: 'observer[facing=east]'
  C: 'observer[facing=north]'
