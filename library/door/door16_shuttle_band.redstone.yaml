name: door16_shuttle_band
description: One shuttle band for an in-plane 16x16 door. The minecraft.wiki two-way engine B flies along the door in the planes behind it and carries a 2-row column of sticky pistons in the door plane (one on the engine's east slime, fired by its observer; one on a slime under it, fired by quasi-connectivity), so every engine step fires the band once. Flying west, each step pulls the door column 1 cell after the shuttle; flying east, the pistons fire into the empty gap and grab the column when they arrive beside it. The shuttle stops at a column when a trigger piston above the ceiling drops its head into the observer's lane (arm inputs), turns back on a pulse to the west-facing piston from above (back inputs), and parks at home against obsidian with the column in the storage slot, where two wall pistons pull it out of the lane (store) so the shuttle can fetch the next one. Closing runs it backwards. With a column against the band, each step's 2 gt observer pulse makes the pistons spit it one cell east, and the same trigger parks the shuttle with the column on its door cell. Unarmed, the shuttle does not stop at a column, since each piston's spit pushes its whole row (up to 12), so it shoves the rest of the band away. Inputs stand in for the controller.
traits: [piston_based, entityless]
update_pass: strict
palette:
  '.': air
  O: 'observer[facing=north]'
  S: slime_block
  R: 'sticky_piston[facing=east]'
  L: 'sticky_piston[facing=west]'
  B: 'observer[facing=up]'
  X: obsidian
  Q: quartz_block
  D: 'piston[facing=down]'
  N: 'sticky_piston[facing=north]'
  k: {input: kick_east}
  a: {input: arm0}
  c: {input: arm1}
  b: {input: back0}
  d: {input: back1}
  s: {input: store}
