name: door16_quart_pairs
description: "Two adjacent row pairs of the in-plane 16x16 door for a QUART-seamless build (rows 4-5 and 6-7, one half, 8 columns each): every x-band runs on the same side of the door plane (side A), so the other side's hallway plane and walls never see a machine. The x-bands are door16_band_kick2's self-reversing bands, each inside its own two rows: rows 4-5 slime, rows 6-7 honey, so their glue beside the door plane never sticks across the pair boundary. Storage is door16_band_pairs': per pair a ZB (home deep on side B, crossing the door plane only at its slot, inside the wall) pushes [spacer, slot block] into a stack on side A, and a ZA pushes the stack back for the queue. ZA's home is one plane deeper than in door16_band_pairs (HA = 9 + N), because the x-bands now use a fifth plane and the stack's front must stay out of it. Slots alternate between pairs: even pair slot x8 (x-band x2..x7), odd pair slot x-3 pushed out into the wall (x-band x-9..x-4); the first door column is x18, past the even z-corridor. Spec x = logical x + 9. Stand-ins for the controller: the kicks (a block in the cell O watches), the home spits (a block flicked in the cell the observer behind the upper door piston watches), and the held door pistons (redstone blocks beside them on side B, inside the wall). Lockstep is proven; arbitrary timing is not (an odd x-band must not fly while the even ZB crosses its rows)."
traits: [piston_based, entityless]
update_pass: strict
palette:
  '.': air
  A: honey_block
  B: note_block
  C: 'observer[facing=east]'
