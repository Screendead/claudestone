name: ref_mixel_cle_adder_8bit_3t
description: "8-bit 3-tick Carry Look Everywhere (CLE) adder by Mixel and zPippo, endorsed by Mixel. Source: Logical Redstone Archive ADD014_3_Tick_Carry_Look_Everywhere_Adder (ADD014_3tCLE_5.schem), https://discord.com/channels/1361854816837435433/1542465205219360820 (README SOURCED: tagged Tested & Functional and Recommended; two 8b values plus carry in, one 8b sum plus carry out, speed 3 ticks). Size 20x19x8 as tested ; one bit per two layers: b_k input at y=2k+2, z=0 and a_k at y=2k+3, z=2, cin at (0,2,6), sum lamp s_k at y=2k and s8 (carry out) at y=16, z=6, east face (all x one column east of the .schem). Harness changes: the .schem has no inputs and its 17 levers sit on lamps (a lever strongly powers its lamp, the lamp powers the dust beside it). Each a/b lever plus lamp became one input cell holding a redstone block at the lamp's place (it powers the same neighbouring dust directly). That does not work for cin: the cin lamp carries a wall torch, and a redstone block powers only components and dust next to it, never the block between (MEASURED: with a redstone block at the lever the torch stayed lit and cin had no effect on any sum), so cin keeps its lamp, driven through a fixture repeater[delay=1] on a fixture block (a strongly powered feed, like the lever) from a new input cell one column west of the original footprint. The fixture repeater adds 2 gt to cin-to-sum delays only. Input lamps and the sign are dropped; the 9 output lamps are kept as the named outputs. The 40 barrels carry their redstone stacks from the .schem block entities (comparator constants, strengths 15 down to 4). MEASURED: all four tests pass on 26.3: sums match for edge cases and wrap, every carry ripple length 1-8 with and without cin, 60 random sums; with cin held still the delay is 6 gt (3 redstone ticks) rise and 10 gt fall on every sum bit (the 4 gt lamp on each fall, as in the other lamp-output specs), so the README's 3 ticks holds; a change of cin adds the fixture's 2 gt (8/12). How it works (INFERRED, not traced cell by cell): each bit is a 2-layer cell stacked in y at pitch 2 with dust buses along z=7 and x=18-19; a_k and b_k are compared against redstone-filled barrels by subtract comparators, whose strengths (15, 13, 11, 9, 7 across the bit columns) act as per-bit thresholds, and the carry into every bit is derived from all lower a, b and cin in the same 3 ticks rather than rippled, which is why the latency does not depend on the ripple length (MEASURED: 6/10 for 1-bit and 8-bit ripples alike)."
traits: [pistonless, entityless, comparator_based, tick_accurate]
