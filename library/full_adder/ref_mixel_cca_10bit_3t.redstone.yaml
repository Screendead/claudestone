name: ref_mixel_cca_10bit_3t
description: '10-bit 3-tick Carry Cancel Adder (CCA) with carry-in by Mixel (Don''s 3t CCA, inspired by Pippo''s 10-bit CCA without carry-in). Source: Logical Redstone Archive ADD011 (ADD011_Mixel10bCCA.schem),
  https://discord.com/channels/1361854816837435433/1483545446176784434 (README, SOURCED: 2 10-bit inputs and carry-in, 10-bit output and carry-out, speed 3 ticks, tested and functional). Size 9x24x8 (x,
  y = 2 layers per bit, z). Harness changes: the schem has no inputs, so a<k> (z=3) and b<k> (z=6) on layer y=3+2k, and cin at (9,5,1), are redstone blocks placed where the schem had the input-indicator
  lamp beside each lever (the lever hard-powered that lamp, the block powers the adjacent dust the same, INFERRED); levers and the sign are dropped; the lamps at x=7, z=8 on layers y=2+2k are the named
  outputs s<k> and the lamp on layer 23 is cout. Barrels and the hopper carry their redstone Items from the schem block entities (constant analog strengths 15, 13, 12, 14, 11, 4, 1 are logic here). MEASURED
  on a satellite: 86 rows (every single-bit a+b pair, all-ones plus one at each bit, carry-in ripples, alternating patterns, wrap, 40 random) all pass; every sum bit rises in 6 game ticks (3 redstone ticks
  = the README) and falls in 10 (INFERRED: 6 plus the lamp''s 4-tick turn-off), cout rises in 8 and falls in 12. Same slice structure as ref_don_cca_8bit_3t (INFERRED from the layout, not mutant-tested):
  one repeated 2-layer slice per bit, subtract comparators on the operand dust lines and constant-strength barrels give propagate/generate/kill levels, the carry cancels upward through glass and wool, so
  every bit sees its nearest generate/kill in the same time.'
traits:
- pistonless
- entityless
- comparator_based
- tick_accurate
