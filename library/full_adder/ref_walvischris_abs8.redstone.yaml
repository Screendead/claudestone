name: ref_walvischris_abs8
description: '8-bit two''s-complement absolute value, out = |in| mod 256 (-128 stays 128), one two-layer slice per bit stacked at pitch 2 in y (lever k at y=2k+3 with output lamp k directly beside it, bit
  7 / sign on top), from subtract comparators, repeaters, dust and wool. No pistons, no containers. Source (SOURCED): mattbatwings'' Logical Redstone Archive OTHERARITH006 "8 bit absolute value" by WalvisChris
  (endorsed by Waffle), tagged Tested & Functional, https://discord.com/channels/1361854816837435433/1474739638450126929. README claims: 8-bit signed input, 8-bit output, 6 ticks, "I just added a inverted
  adder and a toggle based on the signed bit", not made fast or small, the sign (MSB) must feed the staircase at the bottom. Harness changes: none to the circuit; the 8 levers and 8 lamps are named cells,
  and the stripped light and power states are rebuilt by the update pass. The wool and glass are kept white. Tests drive the levers with `use` (a truth_table input would be a redstone block, not the lever,
  so the hard-power path is the original) and walk all 256 inputs in Gray code order, one lever per step, each followed by 24 gt before the lamps are read (the first version waited 8 gt and failed 96 of
  256 rows, which is the 12 gt delay and not a logic error). Measured (MEASURED, one satellite): all 256 inputs give |in| mod 256; a per-tick trace of the whole walk shows every output lamp settling 2 to
  12 gt after a lever click (rise 2 to 6 gt, fall 6 to 10 gt, lamp turn-off included). The slowest edge, 12 gt = 6 redstone ticks, is a glitch: going from 0x40 to 0xC0 (64 to -64) out7 spikes on at +2 and
  off at +12 while the sign is still travelling to the bottom torch, so a consumer must sample the outputs 12 gt after the input changes (INFERRED cause); the final value after 12 gt matches the README''s
  6 ticks (12 gt). Wave tests pin 0 to 0x80 (out7 rises at +2), 0x80 to 0x81 (out0-6 rise at +6, out7 falls at +10), 0x80 to 0 (out7 falls at +10) and that glitch. Size 13x19x7. Mechanism (INFERRED from
  a trace of signals at rest, not traced comparator by comparator): the MSB lever drives dust down a diagonal staircase on the far (south) side to the wall torch at the bottom (4,1,2); with the sign clear
  that torch is lit and feeds a second dust ladder up the west side whose strength steps down by 1 per layer (15 at y=3 to 1 at y=17), and with the sign set the torch is off and the ladder is 0. Each slice''s
  subtract comparator sees that ladder and its own bit, so the ladder is the sign-controlled invert enable and the strength gradient stands in for per-bit gating, giving out_k = in_k xor (sign and any lower
  bit set), the same function as the invert-and-increment adder the README describes.'
