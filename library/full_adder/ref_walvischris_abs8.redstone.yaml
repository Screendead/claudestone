  - wait: 24
  - use: in7
  - wave:
      out7: '001111111111111111111111'
      out0: '000000000000000000000000'
      out6: '000000000000000000000000'
- name: 'delay, 0x80 (-128) to 0x81 (-127): out0-6 rise 6 gt after the click, out7 falls 10 gt after'
  steps:
  - wait: 24
  - use: in7
  - wait: 24
  - use: in0
  - wave:
      out0: '000000111111111111111111'
      out6: '000000111111111111111111'
      out7: '111111111100000000000000'
- name: 'delay, 0x80 (-128) back to 0: out7 falls 10 gt after the click'
  steps:
  - wait: 24
  - use: in7
  - wait: 24
  - use: in7
  - wave:
      out7: '111111111100000000000000'
- name: 'glitch, 0x40 to 0xC0 (64 to -64): out7 pulses on from 2 to 12 gt after the click, a 10 gt spike while the sign is still reaching the bottom torch, then settles to 64 (slowest edge, 12 gt)'
  steps:
  - wait: 24
  - use: in6
  - wait: 24
  - use: in7
  - wave:
      out7: '001111111111000000000000'
      out6: '111111111111111111111111'
