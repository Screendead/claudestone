name: ref_walvischris_signum_5bit
description: 'Source (SOURCED): mattbatwings'' Logical Redstone Archive OTHERARITH004 "5 bit instant signum" (author WalvisChris, endorsed by Waffle [Wueffi], Tested & Functional; https://discord.com/channels/1361854816837435433/1474464251015069737).
  README claims: 5-bit two''s-complement signum (0 -> 0, positive -> 1, negative -> -1 = 11111), 5 bits in and out, speed 0 ticks. Built 11x10x3 as rebuilt. Inputs are five levers in0..in4 on the east face
  at y=1,3,5,7,9 (in0 least significant, in4 the sign bit at the top), outputs the lamps lamp0..lamp4 on the west face at the same heights (lamp0 = bit 0 of the result). Harness changes: the lever-bearing
  redstone lamps (x=9) are white_concrete because the harness only emulates lever clicks on plain full blocks (the concrete hard-powers the dust beside it exactly as the lamp did; the lamps there only showed
  the input); two dust ends are named (or_dust, sign_dust) so the 0-tick fall can be read, because a redstone lamp takes 4 gt to go out; the targets are kept (they carry the dust power to the lamps). How
  it works (INFERRED from the blocks, confirmed by the tests): out0 = nonzero = b0|b1|b2|b3|b4 and out1..out4 = b4. Two diagonal dust staircases climb the x axis with the levers, each step one block up
  (glass under the up-links is non-conducting, so dust climbs and descends it, wool under the rest). The z=0 staircase is a wired OR: each of in0..in3''s hard-powered block feeds a dust link that zigzags
  up through glass to a junction at (8,6,0)/(7,7,0), then the line steps down-west one block per step to (1,1,0), which points into the target in front of lamp0. The z=2 staircase carries in4: it starts
  at (9,9,2), drops to (8,8,2), splits to the y=9 row (west along y=9 into lamp4''s target) and down-west one step per layer; at each odd y the staircase links up-west onto a row that runs west into that
  lamp''s target, and its last step (1,1,2) also points into lamp0''s target, so the sign lights lamp0 as well. No repeater, torch or comparator: dust and lamps only, so the signal is instant and the cost
  is dust decay (the weakest input path still reaches the lamps above 0). MEASURED (trace and tests): all 32 inputs by Gray code and 22 multi-lever jumps give out = signum; every lamp comes on in the tick
  of the lever click (0 gt) and the dust ends go out in that tick too; a lamp itself goes out 4 gt after its feed drops, which is the lamp''s own off delay, not the circuit''s.

  MEASURED dust strengths at the far ends: or_dust reads 3 with in0 alone (the longest OR path, 12 dust steps), sign_dust reads 7 with in4 alone.'
