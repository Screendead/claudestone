- name: 'zero tick: in0 alone lights lamp0 and its dust on the tick of the click; dust drops at once, lamp 4 gt later'
  steps:
  - wait: 8
  - use: in0
  - wave:
      or_dust: '11111'
      lamp0: '11111'
      sign_dust: '00000'
      lamp1: '00000'
      lamp4: '00000'
  - use: in0
  - wave:
      or_dust: '00000'
      lamp0: '1111000'
- name: 'zero tick: the sign lever lights all five lamps and both dust ends on the tick of the click, both edges'
  steps:
  - wait: 8
  - use: in4
  - wave:
      lamp0: '11111'
      lamp1: '11111'
      lamp2: '11111'
      lamp3: '11111'
      lamp4: '11111'
      sign_dust: '11111'
      or_dust: '00000'
  - use: in4
  - wave:
      or_dust: '00000'
      sign_dust: '00000'
      lamp0: '1111000'
      lamp1: '1111000'
      lamp2: '1111000'
      lamp3: '1111000'
      lamp4: '1111000'
- name: 'dust strength at the far ends: in0 (longest OR path) and in4 (longest sign path)'
