- name: 'rise 6 gt on every bit: 1111 -> 1110 (out 0000 -> 1111)'
  settle: 20
  steps:
  - use: in0
  - use: in1
  - use: in2
  - use: in3
  - wait: 20
  - use: in0
  - wave:
      out0: '00000011111111'
      out1: '00000011111111'
      out2: '00000011111111'
      out3: '00000011111111'
- name: 'carry wrap: 0111 -> 1111 (out 1000 -> 0000), fall 10 gt, no glitch'
  settle: 20
  steps:
  - use: in0
  - use: in1
  - use: in2
  - wait: 20
  - use: in3
  - wave:
      out0: '00000000000000'
      out1: '00000000000000'
      out2: '00000000000000'
      out3: '11111111110000'
- name: '0000 -> 0001 (out 0001 -> 0010): out1 rises 6, out0 falls 10'
  settle: 20
  steps:
  - wait: 20
  - use: in0
  - wave:
      out0: '11111111110000'
      out1: '00000011111111'
      out2: '00000000000000'
      out3: '00000000000000'
