name: ref_aminotreal_incrementor_4bit
description: '4-bit incrementer, out = in + 1 mod 16, a XOR per bit from two subtract comparators with the carry on a one-way dust staircase. Source (SOURCED): mattbatwings'' Logical Redstone Archive OTHERCOMB004 Incrementor by Aminotreal, tagged Tested & Functional and Recommended, https://discord.com/channels/1361854816837435433/1472424450497446065; claims 4-bit in, 4-bit out, 3 ticks. Size 4x10x8. Harness changes: the four wall levers stay as named levers in0..in3 (in0 lowest, the bottom stage) but the quartz block each hangs on is white_concrete, because the harness only emulates levers on its plain supports; the four lamps are out0..out3; the two light-blue glass corner markers are dropped. Mechanism (INFERRED from the build, then checked against dust powers in the trace): stage k is two layers. A torch on the lever''s block gives T = NOT in_k and powers a dust that is on the stage''s own repeater line (repeater into quartz, then dust into the west comparator''s side). A second dust, on a top slab, reads only the dust diagonally below it, so the staircase of T dusts carries power upward only (library/mechanics/dust_transparent_step_one_way): stage k sees E = OR of T_j for j<k = NOT(carry into bit k), at 2 strength lost per stage (10 left at stage 3 in the trace); stage 0 reads an always-dead dust, so E=0. A repeater turns E back into 15. The two repeater outputs hard-power quartz that powers the shared rear dust, so the rear level is T OR E (14-15). Comparator 1 = rear minus T (E and not T), comparator 2 = rear minus E (T and not E); their outputs merge on the dust and quartz that feed the lamp, so out_k = T xor E = in_k xor carry. The two comparators also read each other as side inputs, which the four cases below do not need (INFERRED redundant, not tested). Measured on a laptop satellite: all 16 inputs through a Gray walk, the 15 to 0 wrap and 34 random jumps give in+1 mod 16 on every output; after a lever click every rising output lights 6 gt later (torch 2 + repeater 2 + comparator 2, matching the README''s 3 redstone ticks), every falling output goes dark 10 gt later (the lamp adds its own 4); no output glitches in the 0111 to 1111 carry wrap. The staircase loses 2 per stage, so INFERRED reach is about 8 bits; only 4 bits were built.'
