name: ref_q2ck_ica_8bit
description: |-
  8-bit Instant Carry Adder (ICA) by Q2CK, endorsed by mattbatwings. Source: Logical Redstone Archive ADD004 (ADD004_8bit_ica.schem), https://discord.com/channels/1361854816837435433/1472430068696616990 (README SOURCED: tagged Tested & Functional, 2 8-bit numbers in, 8-bit sum out, speed 4 ticks, "uses pistons to handle carries"). Size 13x7x20 as tested (x west-east, bit 0 at the south end z=17, bit 7 at z=3, cin at z=20, cout at z=0); harness cells not counted. Harness changes: the .schem has no inputs and its 17 levers sit on lamps (a lever strongly powers its lamp, the lamp powers the dust or repeater beside it). Each lever plus lamp became one input cell (a0..a7 at x=1,y=4; b0..b7 at x=3,y=6; cin at (8,1,20)) holding a redstone block, which powers the same neighbouring dust or repeater; input lamps and all signs are dropped; the sum lamps s0..s7 (x=14,y=4) and the cout lamp (8,1,0) are kept as the named outputs. Which operand row is a and which b is arbitrary (addition commutes). Pistons are kept extended=true as saved in the schem. How it works (INFERRED from the traces and the mutant below): the carry runs on one dust line down the middle (x=8) that zigzags between y=1 at each bit (odd z) and y=2 between bits (even z). At each bit the diagonal dust step is cut by a lime wool block in the corner cell, which is the block a sticky piston pulls back (docs/MECHANICS.md, the corner and sticky-piston entries; library add_full_piston_instant uses the same idea with a pushed stone). At rest the pistons are extended (MEASURED in the full trace: the pistons at (8,4,odd z) read extended at rest and retract for a bit with a xor b = 1); when a xor b = 1 the piston retracts, the wool comes up with the head, the corner opens and the carry crosses that bit in the same tick (dust has no delay). Generate (a and b both 1) and kill (both 0) are handled by the torches, repeaters and target blocks beside the line, which restart the line at a fresh strength or leave it at 0, so a carry only ever travels through the propagating bits above its source. Dust loses 2 strength per bit (15 to 1 after eight), so an unbroken cin-to-cout run of propagating bits just reaches the cout repeater at strength 1; INFERRED to be why 8 bits is the limit. Sum bits come from torches off the same line. MEASURED on a laptop satellite: passes edge cases (0+0, all-ones, 255+1 with and without cin, 127+1, 128+128, 85+170), a carry started at each bit position and carried through to cout, generate and propagate cases at every bit, and 80 random sums, all with exact outputs. Delays: every rise 8 game ticks (4 redstone ticks, equal to the README's 4); falls 12 (the output lamp adds about 4 to a fall, INFERRED from other specs); the random sums reach rise 12 (s4) and fall 14, worst row 16 game ticks, so max_delay 16 is asserted and the README's 4 ticks holds only for the plain rise. Mutant (a temp copy, run then deleted): removing bit 3's piston and head fails all four tests (the carry is cut at that bit when it should propagate). Not tested: other tick orders, a nonzero input at placement.
traits: [piston_based, torch_based, entityless, vertical, fast]
