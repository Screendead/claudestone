name: ref_aminotreal_negator
description: 'Source (SOURCED): mattbatwings'' Logical Redstone Archive OTHERCOMB003 ''Negator'' (author Aminotreal, endorsed by mattbatwings, Tested & Functional, Recommended; Discord https://discord.com/channels/1361854816837435433/1472424141519982806).
  README claims: 4-bit two''s-complement negation (inverted, +1), speed 2 ticks. Built 4x10x7 as rebuilt (a 4-slice stack, one slice per bit; inputs are four levers in0..in3 on the north face, in0 = LSB,
  outputs are the lamps lamp0..lamp3 on the south and the out0..out3 dust feeding them). Harness changes: the quartz blocks are white_concrete (the harness only emulates lever clicks on plain full blocks;
  same shape, INFERRED no behavioural difference), the two glass corner markers are dropped and the layer-0 slab under the first chain dust is kept; the out0..out3 dust and the lamps are named cells; inputs
  stay real levers, so the tests are steps rather than a truth table. How it works (MEASURED in the traces, reasoning INFERRED): out = -in mod 16 means out_k = in_k XOR (in_0 OR ... OR in_(k-1)). Lever
  k powers the block behind it, which powers a dust that sits on the next slice''s chain and a dust over a block that feeds a repeater. The chain is a dust zigzag up the stack on top-slabs (dust on a slab
  steps up a block diagonally, one decay per block): lever k''s signal enters it at its own level and runs only upward (traces show in0 reaching slices 1..3 at 14/12/10 and no signal in slice 0''s side),
  so each slice sees L = OR of the lower bits; a repeater per slice restores it to 15. In a slice, a repeater turns in_k into a hard-powered block that feeds the north dust G and the west side dust of subtract
  comparator H1; L feeds the east side of subtract comparator H2 and, through a hard-powered block, the dust E. G and E both carry (in_k OR L). H1 gives G - in_k = L AND NOT in_k, H2 gives E - L = in_k
  AND NOT L, and the two comparators'' outputs meet on the out dust (via a block for H2): XOR. Bit 0 has no L, so out0 = in0 straight through H2. The out dust powers the block under it, which lights the
  lamp beside it. Out dust reads 14 when on (the comparators subtract from a decayed 14/15). MEASURED: all 16 inputs one lever at a time (Gray code) and every value 1..15 set with all its levers flipped
  in one tick and cleared again give out = -in mod 16 on both the dust and the lamps; the dust outputs settle exactly 4 gt (2 redstone ticks, repeater + comparator) after the lever click on every rise and
  fall tried (0->1, 1->0, 7->8, 8->7, 7->0, 0->15, 15->0, 5->6, 6->0), matching the README''s 2 ticks. The lamps add their own 4 gt turn-off delay. The 7->8 wave also shows out1 and out2 staying off. Not
  measured: wider words (INFERRED: the chain loses 1 strength per dust and 2 dust per slice, so a longer stack would need repeaters in the chain). Unexplained: the chain''s bottom dust (3,2,2) in slice
  0 never reads powered although it looks connected to the first chain dust; the tests pass regardless.'
traits:
- pistonless
- entityless
- comparator_based
- vertical
- tick_accurate
- compact
