name: ref_sloimay_cca_8bit_5hz
description: '8-bit 5hz Carry Cancel Adder (CCA) by sloimay, endorsed by mattbatwings. Source: Logical
  Redstone Archive ADD006, https://discord.com/channels/1361854816837435433/1472430859339436032 (README,
  SOURCED: 2 8-bit inputs, 8-bit sum, speed 6 ticks, pipelinable at 5 Hz). Size 11x17x5 (x west-east,
  y = 2 layers per bit with bit 0 at y=1, z), one 11x5 slice per bit; the harness column west of x=1 and
  the sum cells are not counted. Harness changes: the .schem has no inputs, so the two operand inputs
  a<k>, b<k> are redstone blocks placed in air at x=0 beside the two west dust ends of each bit''s slice,
  a at z=0 and b at z=3 (INFERRED from the slice''s symmetry, and it adds correctly), the sum bit s<k>
  is the dust at the slice''s east end (it carries strength 2 when the bit is 1, so a named dust reads
  1), bit 0''s carry-in end stays open and the top bit''s carry-out is unused (sum mod 256). The barrels
  hold 27, 4 and 1 milk buckets (unstackable), read from the schem''s block-entity NBT: constants of strength
  15, 3 and 1. How it works (INFERRED, mutants below SOURCE nothing but back it): the west dust column
  carries a at one end and b at the other; decay makes the two comparators (1,1) and (1,2) each output
  2 only when exactly one of a, b is on, so dust (2,1) = P = a xor b; P goes through a repeater to a subtract
  comparator (4,1) reading the 15 barrel, so the target block (4,2) is hard-powered 15 exactly when P
  is 0 (a and b equal). Below the barrel (1,4) subtracts the dust from a 1 constant, so a delayed 15 reaches
  dust (3,3) only when a and b are both 0 (kill). Comparator (4,3) = target minus kill, which is 15 only
  for generate (a and b both 1); repeater (5,4) sends that to the next bit up. Dust staircases through
  glass and wool (kill at x=3, generate/target at x=5, carry at x=6-8) join all eight slices so the target
  and kill levels fall by 2 per layer and the nearest non-propagating bit decides whether a carry arrives,
  in the same time for any ripple length. P also goes through repeater, barrel (used as a conductor),
  repeater, and a comparator that subtracts the barrel-of-3, giving 12 on the right-hand dust column;
  the carry arrives at its other end at 12 and two comparators on that column, with the unequal decay
  along it, output 2 only when P xor carry-in = sum. MEASURED on a laptop satellite: passes 30 hand-picked
  and 5000 random sums plus 448 patterns that put a generate or kill bit on each side of a propagating
  bit; every output changes 12 game ticks (6 redstone ticks, equal to the README''s 6) after the inputs,
  rise and fall, for 1 bit and for a 7-bit ripple alike. Mutants (a tmp copy, run then deleted): removing
  one dust of the kill staircase, of the target staircase, or of the carry link between layers 4 and 5
  each fails the sums tests. Not measured: the 5 Hz pipelining claim.'
traits:
- pistonless
- entityless
- lightless
- silent
- comparator_based
- tick_accurate
