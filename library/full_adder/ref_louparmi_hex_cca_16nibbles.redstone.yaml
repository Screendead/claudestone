name: ref_louparmi_hex_cca_16nibbles
description: 'Rebuild of mattbatwings'' Logical Redstone Archive ADD012 ''Hexadecimal Carry Cancel Adder (hex_cca_16nibbles)'' (author LouParmi, endorsed by Mixel, Tested & Functional; https://discord.com/channels/1361854816837435433/1502358261431799818). SOURCED from the README: 16 nibbles (64 bits),
  6 ticks, 5 Hz pipelineable, 10x12 footprint, 19 high, carry in and out, double density, Java only. Placed with update_pass strict from the .schem with its saved block states, power levels and comparator OutputSignal (the default update pass recomputes dust shapes and changes the saved ones); the baseline
  then holds still for 30 ticks (MEASURED). Lever at (6,2,6) is the carry in, lamp (7,18,7) the carry out. INCOMPLETE: the second operand''s port was not found, so the addition is NOT demonstrated. MEASURED with composter-fed comparators as drivers outside the box: nibble i (layer y=i+3) takes an analog
  strength on dust (0,y,5) (z=6 on odd y) and its result is the dust at (6,y,0) (z=11 on odd y), the corner dust (9,y-1,.) of the layer below reads (a_y + 1) mod 16 and the result dust is that minus one by dust decay (a for a 0-8, 0 for a 15), independent of every other layer (tests result_is_a_and_corner_is_next_nibble_plus_1_*,
  6 of 6 runs identical); a strong source on the neighbouring target (0,y,4) merges with the dust (max, not sum) and no other face cell tried (every wall cell of layer 8 driven at strength 5 together with a=3) gave a sum. The lever starts a dust stair at x=8, z=5/6 that decays one per layer (15 at y=3
  down to 1 at y=17), but it did not change any sum, even with a=15 on layers 3-5 (observed_lever_leaves_sums_unchanged). Latency from the input dust (0,8,5): 8 gt to the result dust, 10 gt to the corner dust (MEASURED, latency_probe); the README''s 6 ticks is not checked since no two-operand sum could
  be driven. INFERRED: layer y-1 computes nibble y''s result from a_y read through the dust-over-quartz link at (0,y,6) and the 15 - a inversion (2,y,.), constants from redstone blocks and a cake (signal 2), and the decay stair carries the carry as a distance code.'
traits: []
update_pass: strict
