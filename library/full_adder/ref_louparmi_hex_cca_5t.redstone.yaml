name: ref_louparmi_hex_cca_5t
description: 'Hexadecimal Carry Cancel Adder (5t, 5hz) by LouParmi and Uni, endorsed by Waffle [Wueffi]; the 32-bit adder as 8 hex nibbles in analog signal strength. DOES NOT ADD IN 26.3: it only gets nibble
  0 and carry-through-propagate right, see FAILS below. Source: Logical Redstone Archive ADD013 (ADD013_5t_5hz_hex_cca.schem, WorldEdit 7.3.16, data version 4440), https://discord.com/channels/1361854816837435433/1503801589033599138.
  README (SOURCED): tag Tested & Functional, 8x9 footprint, 18 blocks high, input 8 nibbles (32 bits) plus carry in, output 8 nibbles plus carry out, 5 ticks, 5 Hz, a Bedrock variant at 10 Hz with two extra
  levers (not in the schem). Size 9x18x8 (x west-east, y layers, z north-south), 760 blocks. Layout (SOURCED from the schem): quartz, 36 light-blue glass, 30 target blocks, 115 comparators, 33 repeaters,
  189 dust, 11 redstone blocks, one cake and two composters as constants, one lever, one iron trapdoor; no pistons or entities. Harness changes: (1) the schem has no inputs, so nibble j''s two operands
  are analog strengths 0-15 on the two sourceless dust cells at layer 2j+3 on the north face, A_j at (4,2j+3,0) and B_j at (7,2j+3,1) (INFERRED from the picture, where Input A and Input B are black dust
  beside a target block, and MEASURED: the only other dust cells with no source are the two the carry-in lever''s quartz feeds); each is fed by a fixture comparator and a fixture hopper whose redstone count
  sets the strength, written by `data merge` (hopper of k redstone: strength 1 + floor(14 * items / 320)); the hopper cells are fixtures outside the design and the build sits at z=1..8 of this file. (2)
  The carry-in lever (3,1,0) hard-powers the quartz at (3,1,1); it is replaced by a fixture repeater facing north behind a redstone-block driver `cin` that hard-powers the same quartz. (3) Outputs: sum
  nibble s_j is the dust at (0,2j+1,7) on the south face (j=0 at the bottom, layer 1), cout the free-standing dust at (1,17,7) (the picture''s Output label). MEASURED on satellites: nibble 0 is a correct
  hex adder with carry-in (32 pairs: s0 = (a+b+cin) mod 16), and the lever adds 1; a carry runs through any number of propagate nibbles and out of cout (15s plus 1, 15s plus carry-in 1, giving all zeros
  and cout 1; 15s plus 0 gives 15s); 16 random sums in which a carry enters every upper nibble pass with cout. Timing: every output changes 12 game ticks after the hopper write, that is 10 gt = 5 redstone
  ticks after the port dust (the fixture comparator takes 2 gt, MEASURED from the dust port cell), equal to the README''s 5 ticks, rise and fall alike and the same for nibble 0, a 7-nibble ripple and cout;
  carry-in to s0 takes 8 gt from the driver (2 gt of that is the fixture repeater). Not measured: the 5 Hz pipelining. FAILS (MEASURED): the other half of a carry cancel adder is missing. With every input
  at 0 and carry-in 0 the sum nibbles read s = 0,1,1,1,1,1,1,1 instead of 0; 2+3 in nibble 0 gives s = 5,1,1,1,1,1,1,1 instead of 5,0,0,...; 9+9 in nibble 0 gives 2,1,1,... instead of 2,1,0,...: every nibble
  above 0 outputs (A+B+1) mod 16, that is the sum with the carry assumed present, and nothing ever cancels it, so any sum whose carry into a nibble is 0 is wrong (the offline model gets 195 of 200 random
  32-bit sums with carry-in wrong). It does not depend on input history (gen, prop, kill, zero in all orders gave the same). Why (INFERRED from an offline model of the dust, comparator and repeater rules
  that reproduces every one of these server runs and the schem''s saved dust, comparator and repeater states with zero mismatches over 189 dust, 115 comparators and 33 repeaters, then read cell by cell):
  each nibble is a 3-layer slice. Its comparators make 15-B in a target block, then 15-A-B on dust (3,2,L), a repeater turns A+B<15 into a kill flag V, a second repeater sets V when A+B>=16, and a compare
  comparator passes the overflow remainder to dust (3,7,L-1), so the sum dust is max(remainder, (A+B+1)) minus a correction dust (2,6,L-2). The only dust that crosses between slices is two staircases that
  fall 1 per layer: the x=0..2 ladder, fed once by redstone blocks under layer 2 (15, 14, 13, ... 1 at the top), and a V/d staircase at (3,4) and (3,5) that kill and generate slices both raise to 15 and
  propagate slices leave to the decayed neighbour value. The correction is max(0, ladder - d) in a subtract comparator (D at (2,5,odd)); with both staircases falling at the same rate it is nonzero only
  in nibble 0 (15 - 14 = 1, where the cake''s 14 plays the V of the slice below), and kill and generate stages inject the same 15 into d, so nothing tells a kill from a generate and no upper nibble is ever
  corrected. The schem''s own saved state (the author''s world at rest, all inputs 0) already reads 1 on every s_j with j>=1, so the published file itself does not add zero to zero. The README''s tag, the
  Bedrock modification and the two extra levers suggest the working version differs from this file. Aside (MEASURED): on some loads the ladder''s U dust at (0,2m,4) came up at 15 instead of its decayed
  value (dust update order is locational, see docs/MECHANICS.md dust_update_order_locational); it changed no output.'
