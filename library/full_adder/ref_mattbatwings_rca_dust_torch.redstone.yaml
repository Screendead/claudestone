name: ref_mattbatwings_rca_dust_torch
description: 'Basic ripple-carry full adder (inputs a, b, cin; outputs sum, cout) from dust, torches and wool only. Source (SOURCED): mattbatwings'' Logical Redstone Archive ADD008 "Basic Ripple Carry Adder (RCA)", endorsed by mattbatwings, tagged Tested & Functional, https://discord.com/channels/1361854816837435433/1472430932274446438; the README says the cell can be stacked to any width, inputs A, B, Cin, outputs Sum, Cout. Size 12x4x6 as built, 70 blocks. Harness changes: the archive''s three levers become input cells (a and b: the lamp each lever stood on is replaced by the input block, which hard-powers the same dust; cin: the lever itself was beside the dust, so the input block takes the lever''s cell and its lamp is dropped); the two lamps are the outputs (cout the north one, sum the east one; found by running, the schematic has no labels). Measured (MEASURED, one satellite, all 8 inputs): passes the full-adder truth table; worst case 10 gt, sum rise 6 fall 10, cout rise 4 fall 8,
  which includes the output lamp''s own 4 gt turn-off. Not tested: stacking into a wider adder (the carry-out lamp would have to be replaced by dust into the next cin). Component mechanism not traced in detail (not claimed).'
palette:
  .: air
  A: lime_wool
  B: orange_wool
  C: magenta_wool
  D: light_blue_wool
  E: light_gray_wool
  F: redstone_wire[east=side,north=none,south=none,west=side]
  ): redstone_wall_torch[facing=east]
  G: redstone_wire[east=side,north=none,south=side,west=side]
  H: redstone_wire[east=side,north=side,south=side,west=none]
  I: redstone_wire[east=none,north=side,south=none,west=side]
  J: redstone_wire[east=side,north=none,south=none,west=up]
  K: red_wool
  M: redstone_wire[east=none,north=side,south=up,west=none]
  '*': redstone_torch
  O: redstone_wire[east=none,north=none,south=side,west=side]
  P: redstone_wire[east=side,north=none,south=side,west=none]
  Q: redstone_wire[east=none,north=side,south=side,west=none]
  n: redstone_wall_torch[facing=north]
  (: redstone_wall_torch[facing=west]
  T: redstone_wire[east=side,north=side,south=side,west=side]
  u: redstone_wall_torch[facing=south]
  '1':
    input: a
  '2':
    input: b
  '3':
    input: cin
  X:
    output: cout
    block: redstone_lamp
  Y:
    output: sum
    block: redstone_lamp
