    1FFBB)GFBB)..

    .....HI...HFY

    2FFBB)BJBB)..

    ......K......

    .............

    '
  2: '.............

    ......M......

    ...*F.B.*O...

    ...B..B.B)...

    ...*F.P.*I...

    ......Q......

    ......3......

    '
  3: '.............

    .............

    ...Bn.H(B....

    ...TB)I.T....

    ...Bu.B.B....

    .............

