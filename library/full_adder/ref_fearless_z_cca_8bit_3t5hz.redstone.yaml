name: ref_fearless_z_cca_8bit_3t5hz
description: "8-bit 3-tick (5 Hz pipelinable) Carry Cancel Adder (CCA) by FEARLESS_Z, endorsed by mattbatwings. Source: Logical Redstone Archive ADD010 (ADD010_8bit_cca_3t5hz.schem), https://discord.com/channels/1361854816837435433/1472432840980562147 (README, SOURCED: 2 8-bit inputs, 8-bit sum, speed 3 ticks, Tested & Functional). Size 8x19x9 as rebuilt (the schem is 18x22x12 with a margin). Harness changes: the schem has no input blocks, so the input-indicator lamps beside each wall lever become the driver cells (a<k> at x=3 on even layers y=2k+2, b<k> at x=1 on odd layers y=2k+3; a redstone block in the lamp's cell powers the adjacent dust as the lamp hard-powered by its lever did, INFERRED), the floor lever of the carry-in becomes cin (it feeds the bottom stage's repeater from behind; the README names no carry-in), signs and the light blocks are dropped, the sum lamps (x=8, odd layers) are s0..s7 and the lamp on the top layer is cout. Barrel and hopper contents are taken from the schem's block entities (redstone stacks, counts of 64 with a few short slots in the upper hoppers), since the containers are logic constants. MEASURED on a satellite: 20 edge pairs (zero, all ones, 255+1, 127+1, 85+170, wraps), 11 ripple cases through every bit, 40 random pairs and 8 with cin=1 all give the right 8-bit sum and carry out; every sum bit rises in 6 game ticks (3 redstone ticks = the README), falls in 10 (INFERRED: 6 plus the lamp's 4-tick turn-off), cout rises in 8 and falls in 12 (cin=1 can make s7 fall in 8). How it works (INFERRED from the layout, not mutant-tested): one slice is a vertical pair of layers per bit, stacked 2 high; subtract comparators on the two operand dust lines yield propagate/generate levels, the carry travels up the stack as a signal strength stepping through comparators and hoppers holding fixed redstone counts (the comparator outputs read 13, 14, 13..8 up the ladder), dust climbs glass and wool between layers, and a compare comparator plus dust gates the sum bit into the lamp, so every bit sees the nearest generate or kill in the same 6 game ticks. Same family as ref_sloimay_cca_8bit_5hz and ref_don_cca_8bit_3t."
traits: [comparator_based, container_based, pistonless, entityless, silent, tick_accurate]
