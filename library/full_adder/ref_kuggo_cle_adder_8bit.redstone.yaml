name: ref_kuggo_cle_adder_8bit
description: '8-bit adder, s = a + b + cin (9-bit result with cout) by Kuggo, a look-everywhere carry design stacked as eight two-layer slices on a 2-high pitch, dust, repeaters, wall torches and a target block, no pistons or comparators. Source (SOURCED): mattbatwings'' Logical Redstone Archive ADD005 8-bit Carry Look-Everywhere Adder (CLE), author Kuggo, endorsed by mattbatwings, tagged Tested & Functional, https://discord.com/channels/1361854816837435433/1472430273793884273; README claims 2 8-bit inputs, 8-bit sum, speed 4 ticks. Size 11x21x20 (1166 blocks). Harness changes: each of the 16 operand levers (hard-powering the lamp it hangs on, which feeds the dust beside it) is replaced by an input redstone block in that lamp''s own cell (a_k at the higher-z lever of slice k, b_k at the other; the sum is symmetric); the schematic''s extra lever at layer 1 (carry in) keeps its lamp, which a torch sits on, so it is driven by a fixture repeater on a fixture stone fed by the cin redstone block one cell west; signs are dropped; the 8 sum lamps (layers 1,3,..15, s_j) and the lamp on layer 18 (cout) are the named outputs. Nothing else is changed. Measured (MEASURED, 26.3): the sample truth table of 38 pairs incl. all-ones, carries through every bit, wrap and cin passes first time with the bit order guessed from the layout (a_k, b_k at y=4+2k, s_j at y=1+2j), worst-case delay 14 gt (cout rise 6 fall 8, s0-s2 rise 10 fall 14, s3-s7 rise 8 fall 14). 255+0+cin 0->1 flips every sum bit at 14 gt and cout at 6, so latency is flat across bits (no ripple), but the README''s 4 ticks is not reproduced: sums need 14 gt (7 redstone ticks), only cout is near it. Mechanism (INFERRED, not traced in detail): each slice computes generate/propagate locally and the carries to all bits are formed in parallel by look-everywhere logic instead of a rippling chain, which is why the latency does not grow with the carry length.'
traits:
- pistonless
- entityless
