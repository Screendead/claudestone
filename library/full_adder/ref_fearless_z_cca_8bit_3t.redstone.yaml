name: ref_fearless_z_cca_8bit_3t
description: '8-bit 3-redstone-tick Carry Cancel Adder (CCA), pipelinable at 5 Hz, by FEARLESS_Z and Aminotreal (endorsed by mattbatwings; sign in the schem: ''Amino + Fear, 3t torchless CCA''). Source:
  Logical Redstone Archive ADD002 (ADD002_5HzCCA.schem), https://discord.com/channels/1361854816837435433/1472429390234386484 (README, SOURCED: two 8-bit inputs, 8-bit sum, 3 ticks, tags Tested & Functional,
  Recommended). Size 8x18x6 here; the 10x18x6 schem also holds the input cells at x=7..9 and the carry-in driver at x=0. Layout (read from the schem, SOURCED): one 2-layer slice per bit stacked in y, one
  lamp-topped dust column at x=1 for the sum, a dust/glass/wool staircase joining the slices, and subtract comparators over analog constants whose strength falls by 1 per bit (barrel strengths from the
  schem NBT: 15 redstone block, 14 cake, 13..8 in the even layers 2..16; 15 down to 9 in the odd layers 3..15 at x=7; two barrels of 1 on the top layer). Bit k: b_k enters at layer 2k+2 (x=8,z=4), a_k at
  layer 2k+3 (x=7,z=1), sum lamp s_k at layer 2k+1 (x=1,z=1), whose dust (cell w_k) sits on the lamp one layer up; the carry out is the comparator c8 and lamp s8 on layer 17. The carry-in is an inverted
  lever at layer 0 (lever on = carry-in 0, MEASURED: all-zero inputs with the lever on sum to 0, with it off to 1) next to a wall torch on its wool. Harness changes: (1) the 16 input levers sit on redstone
  lamps, which the harness cannot click, so each lamp+lever pair became one input cell (a redstone block placed in the lamp''s cell, which feeds the dust beside it with 15 like the lever-powered lamp; the
  cells are inside the footprint); (2) the layer-0 lever sits on wool with a torch on it, so the driver is a redstone block at x=0 behind a fixture repeater (delay 1) that hard-powers the same wool, named
  input ncin (1 = no carry-in) and adding 2 gt to that path only; (3) the sign was dropped; (4) the barrels carry the schem''s totem_of_undying stacks (27, 26, 24, 24, 23, 23, 21, 21, 18, 18, 16, 16, 14
  and redstone 64+59, which the parsed blocks lack). How it works (INFERRED from the layout and the single-input probes, nothing below was traced cell by cell): like ref_sloimay_cca_8bit_5hz, dust decay
  and analog constants replace gates, so the nearest generate or kill bit below decides each carry through the staircase in the same time for any ripple length; the comparator-over-constant stages make
  the carry-in and propagate signals saturate to a per-bit level, and the falling constants keep each bit''s level above the stair''s decay. MEASURED on a laptop satellite (inputs a_k = weight 2^k: a0..a7
  and b0..b7, ncin, outputs s0..s8 as lamps): passes edge cases (0+0, 255+1 wrap to 256, 255+255+1, 127+1, 128+128, alternating bits), 120 random sums with carry-in 0 and 120 with carry-in 1, all 72 single-generate
  and propagate-run patterns, ripple 0+0 <-> 127+1 and single-bit flips. Delays in game ticks: every sum bit rises 6 gt (3 redstone ticks, equal to the README) after the inputs for 1-bit and 7-bit ripples
  alike; its dust falls in 6 gt, its lamp in 10 (a lamp adds 4 to every fall); the carry out rises and falls in 8 gt (12 at the lamp). The carry-in path measured 8 gt at the carry out through the fixture
  repeater, so about 6 without it (INFERRED). Mutants (a tmp copy each, run then deleted): replacing the barrel at (7,7,0) with air, or the cake at (2,4,5), each fails the random sums. Not measured: the
  5 Hz pipelining claim, or a changing input during the settle.'
traits:
- pistonless
- entityless
- silent
- comparator_based
- tick_accurate
