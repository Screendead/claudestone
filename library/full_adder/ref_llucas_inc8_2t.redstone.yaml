name: ref_llucas_inc8_2t
description: '8-bit incrementer, out = in + 1 mod 256, built from comparators, dust and container-fed barrels. Source (SOURCED): mattbatwings'' Logical Redstone Archive OTHERCOMB009 "2t torchless incrementor (8 bit, FAST)" by LLucas, tagged Tested & Functional, https://discord.com/channels/1361854816837435433/1472681878611034265. Claims 2 ticks, 5 Hz pipeline. Size 4x18x8. Harness changes: the archive''s per-bit lever and lamp (lever on a lamp, which hard-powers the dust beside it) become an input redstone block in the lamp''s cell, touching the same dust; signs dropped; barrel contents were not in the parsed schematic, so each barrel is filled with stone stacks to the signal strength INFERRED from the measured dust powers (see below). Mechanism (INFERRED, then tested): bit k at y=2k+2 has barrel T_k (strength 16-2k) read by a subtract comparator whose output hard-powers barrel W_k (strength 17-2k) read by a second comparator; both subtract the input dust, so a 0 bit gives 16-2k on a dust staircase down the x=0 side and 17-2k on the east side, and a 1 gives 0. The staircase loses 2 per bit, so a lower 0 bit arrives at bit k at exactly 17-2k, stronger than bit k''s own 15-2k. Two subtract comparators on the layer above out_k compare those levels and light out_k only for in_k xor (all lower bits 1). Bit 0 is NOT: a comparator with a constant torch (the schematic does contain one redstone torch despite the name) and a compare-mode comparator on a strength-1 barrel. Outputs are the lamps. Measured (all 256 inputs, one laptop satellite): every output rises 4 gt (2 redstone ticks) and falls 8 gt (the same 4 plus the lamp''s own 4 gt turn-off), matching the 2-tick claim; size as built 4x17x7. Not tested: the 5 Hz pipelining claim. The README''s ''torchless'' is false for the schematic as parsed (one constant torch in bit 0).'
traits:
- analog
- comparator_based
- container_based
- vertical
- fast
