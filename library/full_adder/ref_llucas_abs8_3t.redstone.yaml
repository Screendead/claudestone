name: ref_llucas_abs8_3t
description: '8-bit signed absolute value, out = |in| mod 256 (-128 stays 128), bit k on its own two-layer slice stacked at pitch 2 (input k at y=2k+2, output lamp k at y=2k+1, sign on top), from subtract/compare comparators, dust and container-fed barrels. Source (SOURCED): mattbatwings'' Logical Redstone Archive OTHERCOMB015 "3-tick absolute value" by LLucas (endorsed by Mixel), tagged Tested & Functional, https://discord.com/channels/1361854816837435433/1474809511306067978. README claims: 3 ticks, compact, input 8-bit signed with HARD POWER, output 15ss, a 2-tick version is possible. Harness changes: the per-bit lever (which hard-powers the lamp it hangs on) is replaced by a fixture repeater[facing=east] on a fixture stone, fed by an input redstone block one cell east, because the harness cannot click a lever on a lamp and the top slice has a wall torch hanging on its input lamp (a bare redstone block there would let the torch fall off); the repeater hard-powers the same lamp, so every delay below includes its 1 redstone tick (2 gt). Signs dropped. Barrel contents were not in the parsed blocks; the schem BlockEntities hold 21 stacks of 64 redstone in each of the 7 barrels (SOURCED from the .schem NBT), so they are filled the same (strength floor(1+14*21/27)=11, INFERRED from the comparator formula, not read back). Measured (all 256 inputs, one satellite, MEASURED): every row passes; every output rises 8 gt and falls 12 gt after its input row changes. Net of the fixture repeater that is 6 gt = 3 redstone ticks, matching the 3-tick claim (INFERRED subtraction); the fall adds the output lamp''s own 4 gt turn-off. Size as built 9x18x9 (498 blocks incl. fixtures). Mechanism (partly INFERRED): a trace with the sign bit alone set shows a dust line whose strength grows by 1 per slice (3,4,5,6 at slices 1-4) that each slice compares against the strength 15 a set lower bit injects; out_k = in_k xor (sign and any lower bit set). Not traced comparator by comparator.'
traits:
- analog
- comparator_based
- container_based
- vertical
