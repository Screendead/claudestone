- name: carry in lever
  steps:
  - drive: {a0: 1, a1: 1, a2: 1, a3: 1, a4: 1, a5: 1, a6: 1, a7: 1}
  - wait: 40
  - expect: {s0: 0, s1: 0, s2: 0, s7: 0, cout: 0}
  - use: cin
  - wait: 40
  - expect: {s0: 0, s1: 0, s2: 0, s3: 0, s4: 0, s5: 0, s6: 0, s7: 0, cout: 1}
  - use: cin
  - wait: 40
  - expect: {s0: 1, s7: 1, cout: 0}
  - drive: {a0: 0, b0: 1}
  - wait: 40
  - expect: {s0: 1, s1: 1, s7: 1, cout: 0}
  - use: cin
  - wait: 40
  - expect: {s0: 0, s7: 0, cout: 1}
