name: ref_mattbatwings_cca_8bit_add007
description: "8-bit Carry Cancel Adder by mattbatwings (ADD007, mattbatwings' Logical Redstone Archive, https://discord.com/channels/1361854816837435433/1472430895419101369, file ADD007_8bit_cca_matt.schem). README (SOURCED): \"a basic, unoptimized carry cancel adder\", two 8-bit inputs, 8-bit sum, speed 5 ticks. Size 15x19x4 as built (x, y = 2 layers per bit with bit k at y=3+2k, z). Harness changes: the 16 operand levers (x=0) each sat on a lamp (x=1); the lever is dropped and the lamp replaced by a redstone-block input cell a<k> (z=0) / b<k> (z=3) at x=1, which feeds the dust at x=2 the same strength 15 (INFERRED: the lever hard-powered the lamp, which powered the dust). The sum lamps s<k> and cout lamp are outputs, and the dust beside each sum lamp is d<k> to read timing without the lamp. The carry-in lever and its lamp/torch at the bottom are unchanged (named cin, used with `use`; lamp and cout lamp are design blocks); the carry-in torches ride the same carry staircase as the generate/kill levels. How it works (INFERRED from the layout, backed by the tests): per bit a dust column at x=2-3 carries a at one end and b at the other and two subtract comparators (3,y,1)/(3,y,2) with the unequal decay along it produce P=a xor b and the generate/kill levels; a staircase of dust through wool and glass at x=4-10 (alternating layers) cancels carries: the nearest bit that is not propagating (generate or kill) decides the carry, so every bit sees its carry-in in the same time, not rippled. MEASURED on a satellite: all 64 truth-table rows pass (the corners 0+0, 255+1 wrap, 255+255, carries from each single bit to the top, 25 random sums), every bit's sum rises 10 gt after the inputs on the dust and falls 10 gt on the dust (5 redstone ticks, equal to the README's 5), 14 gt on the lamps (a lamp adds 4 gt to every fall); and the carry-in lever adds into the sum and carries out."
traits: [pistonless, entityless, comparator_based, tick_accurate]
