name: ref_don_cca_8bit_3t
description: '8-bit 3-tick Carry Cancel Adder (CCA) by Don, endorsed by mattbatwings. Source: Logical Redstone Archive ADD003 (ADD003_8bit_cca_3t.schem), https://discord.com/channels/1361854816837435433/1472429810520162406
  (README, SOURCED: 2 8-bit inputs, 8-bit sum, speed 3 ticks). Size 8x19x6 (x, y = 2 layers per bit, z); the schem has no inputs, so a<k> and b<k> are redstone blocks placed in the cell where the schem
  had the input-indicator lamp at x=1 beside its lever (a at z=2, b at z=5, on layer y=2k+2 counting the crop; the lever hard-powered the lamp, the block powers the adjacent dust the same, INFERRED), the
  signs and levers are dropped, the sum lamps at x=7 on the odd layers are the named outputs s<k> (s0 at the bottom), and the lamp on layer 18 is cout (MEASURED: it is the 8-bit carry out). A carry-in lever
  (layer 1) is left off. MEASURED on a laptop satellite: 80 sums (single bits, a+a, ripples to the top, carries and wraps, 40 random) with cout all pass; every sum bit rises in 6 game ticks (3 redstone
  ticks = the README) and falls in 10 (INFERRED: 6 plus the lamp''s 4-tick turn-off), cout takes up to 12. How it works (INFERRED from the layout, not mutant-tested): each bit''s slice is a vertical pair
  of layers; subtract comparators on the two operand dust lines yield propagate/generate/kill levels, the carry is carried upward through dust climbing glass and wool between layers (as in the 5 Hz CCA
  ref_sloimay_cca_8bit_5hz), and the sum comes from a compare comparator and a torch/dust stage into the lamp, so every bit sees the nearest generate/kill in the same time.'
traits:
- pistonless
- entityless
- comparator_based
- tick_accurate
