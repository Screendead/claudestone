name: cpu_fetch
description: 'CPU4 fetch loop: the two-phase clock drives the program counter, whose value addresses the 16x8 lever ROM (Fibonacci program); the ROM''s n field goes back to the PC''s jump input. jt, hlt and rst are driven by the test, since the control decoder, ALU and registers are not built yet.'
