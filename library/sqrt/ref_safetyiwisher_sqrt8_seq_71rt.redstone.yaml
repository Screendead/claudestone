name: ref_safetyiwisher_sqrt8_seq_71rt
description: |
  Source: SQRT002 8bit Square Rooter by SafetyIWisher, endorsed by mattbatwings, mattbatwings'
  Logical Redstone Archive (SQRT002_8bit_seq_sqrt_71rt.schem; Discord
  https://discord.com/channels/1361854816837435433/1472462338887258315). SOURCED: 8-bit
  sequential square-root extractor, input an 8-bit number and a button, output a 4-bit root and
  a 5-bit remainder, 71 rTicks after the press, non-restoring digit-by-digit algorithm, 4 clock
  cycles of 13 rTicks after 8 rTicks of init. Size 21x23x15 as built; here 22x23x15 because of
  the reserved air column at x=0 (below). One slice per input bit: even layers y=6..20 hold
  the eight input bits (in0 = y6 is the LSB), odd layers y=7..19 the seven compare/subtract
  stages; root lamps root0..root3 are at x=0, y=6..12 (LSB first), remainder lamps rem0..rem4
  at x=20, y=6..14 (LSB first). INFERRED from the layers, not traced block by block: the
  perimeter ring of dust and repeaters on the even layers is the shared clock/bus, the
  subtract-mode comparators and the compare-mode comparators at (11,odd,5) do the trial
  subtraction, and the wool columns at x=0 hold the input and root registers.
  Harness changes: the eight input levers and the button hung on redstone lamps that also
  hard-power the dust beside them; the harness cannot emulate a lever on a lamp, so each lamp
  cell is a driver cell (a redstone block powers the dust directly) named in0..in7 and start,
  and the levers, button and echo lamps are gone. Block states are the saved ones (torch lit,
  repeater/comparator powered, dust power); stripping the lit states made the first runs
  garbage (MEASURED), and the saved result for input 50 (root 7, remainder 1) is still on the
  lamps at load, so tests that must see a change run 0 first. The build is shifted one cell
  east behind a reserved air column: placed at x=0 the dust at (0,y,6) kept stale power in
  about a third of loads and the run then failed (MEASURED: sqrt of 0 failed 2 of 6 traced loads);
  with the column 16 of 16 loads passed (INFERRED cause: the plot edge).
  MEASURED on a satellite: all 256 inputs give floor(sqrt) and the remainder, run back to back
  with a 250 gt gap; the remainder lamps light 128 gt (64 rTicks) after the press and the root
  lamps 136 gt (68 rTicks) after it (falls are 4 gt later, the lamp); outputs hold until the
  next run. Not in the README, MEASURED: the start pulse must last at least 16 gt (3 to 8 gt
  gave no result, 10 gt only the remainder; 16, 20 and 30 gt pass, so a stone or wood button
  works); a second press 180 gt after the first was lost for 64 then 65 (it passed for
  63 then 64), 250 gt always worked.
traits: [torch_based, pistonless, entityless]
