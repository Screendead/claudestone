name: ref_mattbatwings_sqrt8_sequential
description: 'Rebuild of SQRT001 8-bit Sequential Square Root Extractor (mattbatwings, endorsed; Tested & Functional, Recommended; Discord https://discord.com/channels/1361854816837435433/1472426720521883769, Logical Redstone Archive; schematic SQRT001_8bit_sqrt.schem).
  SOURCED: README says an 8-bit sequential square root extractor; input one 8-bit number and a Start button, output a 4b.2b square root (4 integer bits, 2 fraction bits). Schematic 15x20x36, 1975 blocks (plus one empty column on the west here). PORTS:
  levers b0..b7 (weights 1..128; b0 at z=0, b7 at z=14, x=14 on layer 6), button start (layer 10), output lamps r3 r2 r1 r0 (integer 8,4,2,1) and f1 f0 (1/2, 1/4) at x=6 on layer y=19,17,..,9, and the lever arm (layer 0), which must stay ON as saved. HARNESS
  CHANGES: (1) the lamp each input lever hangs on and the lamp behind the start button are white wool, the magenta wool under arm is white wool (the harness only emulates levers and buttons on plain blocks; a lamp conducts like wool); signs dropped. (2)
  The build is placed from the schematic''s saved block states (dust power, torch lit, repeater locked, comparator and lamp states) with update_pass: strict. Reason, MEASURED: the stripped skeleton (no power or lit, default clone pass) settled differently
  on satellite dsat2, where redstone blocks left by other runs stood outside the plot 1-2 cells west of the build (x=368-369, y=65-67): a dust column at x=0 kept a stale 3-4-5-6-5-4-3-2-1 charge and conversions of some inputs (31 for one) never produced
  a result there, but did elsewhere. With the saved states and strict placement the build is quiet from tick 0 on every satellite. The empty column on the west keeps the dust column off the plot edge. The saved states include the author''s last result
  in the lamps (r1 r0 f0 lit, 001101 = 3.25) until the first conversion replaces it. MEASURED (26.3, references plot): all 256 inputs convert to floor(sqrt(v)*4) = isqrt(16 v) (a test per input, each from a fresh load, 150 gt after the press); one 281-test
  run passes. TIMING (MEASURED, input independent): after the press the lamps keep the old result until +140 gt, at +140 the new ones are lit on top of the old (old OR new), at +144 the old-only lamps go out; the result is final 144 gt after the press
  (timeline test, input 31). The machine goes on switching after that: for 223 inputs it halts 163 to 550 gt after the press (most at 163-284, then 369, 449-501, 550), for 33 inputs (v = 8, 15, 23, 28, 34, 46, 47, 77, 78, 87, 97, 129, 139, 140, 141, 143,
  155, 163, 164, 165, 167, 168, 191, 192, 194, 195, 218, 219, 220, 221, 222, 223, 224) a torch loop with a period of about 20 gt never stops (no stop in 800 gt for all of them, in 3000 gt for 15, 140, 155, 165, 195, 220); releasing the levers, pressing
  start again or cycling arm does not stop it, and the lamps stay correct. INPUT IS NOT LATCHED (MEASURED, as in the library''s ref_mattbatwings_seq_bin_to_bcd8): the levers are read in pairs as the run proceeds, MSB pair first, 20 gt per pair; releasing
  lever b_k at or after this many gt after the press leaves the answer alone: b7 8, b6 10, b5 28, b4 30, b3 48, b2 50, b1 68, b0 70; one gt earlier the bit reads wrong (the tests release each bit at its limit and one gt before). Keep the number on the
  levers for 70 gt. ARM (MEASURED): arm off before the press or 50 gt after it corrupts the result (input 31 gives 001111 or 010101). BACK TO BACK IS NOT RELIABLE (MEASURED, a design flaw or a flaw of this rebuild; not resolved): there is no reset input
  and sequences of conversions, even 600 gt apart, can go wrong depending on the earlier inputs; 177 then 178 is right but 176, 177, 178 gives 111000 for 178 (right is 110101), on three satellites, while 178 alone is right. All 280 tests start from a fresh
  load and a long chain of presses was not made to work. HOW (INFERRED from the layout, the picture and the measured timing; not proven): a stack of near-identical two-layer slices (layers 4-19, 66 comparators in subtract mode in the build, dust risers
  between slices, the picture shows eight slices) with one output lamp per result bit on the east edge (layer y=19-2k for r3..f0). The hold times show the levers being read two at a time, MSB pair first, 20 gt apart, for the four integer bits; the two
  fraction bits then need no input, which is how one machine gets 4b.2b out of an 8-bit number. That is the digit-by-digit (bit-pair) square root: try a trial bit, subtract the trial from the remainder with a comparator, keep the bit if it does not go
  negative. About 6 steps of 20 gt plus an output stage fits the +140. No stage-by-stage trace was made, so the slice-to-step mapping and the restoring-subtract reading are inferred only from the hold times and the six lamps.'
traits: [torch_based, pistonless, entityless]
