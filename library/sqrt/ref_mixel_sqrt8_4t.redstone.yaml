name: ref_mixel_sqrt8_4t
description: '8-bit to 4-bit floored square root as a 4-tick combinational lookup table (a sum-of-products PLA) by Mixel, Uni and Hahahahah5 (endorsed by Mixel; Hahahahah5 gave the concept and the PLA mapping). Source: Logical Redstone Archive SQRT004_4_Tick_Square_Root_Lookup_Table (SQRT004_4tsqrt.schem), https://discord.com/channels/1361854816837435433/1473618906676596758 (README SOURCED: tagged Tested & Functional and Recommended; 8 bit input, 4 bit floored square root, 4 redstone ticks). Size 19x28x11 as tested (the schem is 19x28x12). Input bit k is at (7,2k+1,1), LSB at y=1 (MEASURED by a single-bit probe), outputs q0..q3 are the lamps at (7,18/20/22/24,1). Harness changes: the .schem has no inputs and its 8 levers sit on lamps (a lever strongly powers its lamp and the lamp powers the dust beside it); each lever and lamp became one input cell where a redstone block powers the same neighbouring dust directly, as in ref_mixel_cle_adder_8bit_3t. The four output lamps are kept as the named outputs; nothing else changed (stone, wool, glass, dust, torches, comparators, targets and repeaters are the skeleton''s blocks). MEASURED on 26.3: all three tests pass: the perfect squares and their neighbours, and all 256 inputs in Gray-code order and in descending order, so every output matches floor(sqrt(n)) for every n; every output edge is 8 gt rise and 12 gt fall (the 4 gt lamp on each fall, as in the other lamp-output specs), so the README''s 4 redstone ticks holds to the diode and the same for every input and output. How it works (INFERRED from the layers, not traced cell by cell): each input bit has a 2-layer cell stacked in y at pitch 2 (lamp, dust, target and a comparator on a column at x=7..10) that fans the bit out to true and complement dust lines; the 12 columns at x=2..18 are the PLA product terms, running up from y=3 to y=25 as torch-and-wool stacks (the ''NOR plane''), and the four z=6 rows OR them into the outputs. Because every term sees the bit in the same tick, latency does not depend on the input value. Also observed once (MEASURED): after one failed test in the same run the next test failed on its first row, and passed alone and on two clean reruns; probably left-over state from the failed test, not the design.'
traits:
- pistonless
- entityless
- torch_based
