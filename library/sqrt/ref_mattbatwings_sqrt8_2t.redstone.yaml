name: ref_mattbatwings_sqrt8_2t
description: '8-bit to 4-bit floored square root in 2 redstone ticks (4 gt) by mattbatwings ("the fastest possible 8 bit square root extractor", endorsed by mattbatwings). Source: Logical Redstone Archive SQRT005_2_tick_square_root (SQRT005_2tsqrt.schem), https://discord.com/channels/1361854816837435433/1473915703101755433 (README SOURCED: tagged Tested & Functional and Recommended; input 8b, output 4b, speed 2 ticks). Size 29x18x17 as tested (schem 29x18x18; the 18th row held only the input lamps). Input bit k is the lever column at (14,2k+1,17), LSB at y=1; output q0..q3 are the lamps at (14,3/5/7/9,0), LSB at y=3 (MEASURED: the first guessed order passed). Harness changes: each of the 8 levers stood on a wool block at (14,y,16) that it strongly powers, which feeds the dust rows either side; a redstone block does not hard-power a block, so each lever became a fixture repeater[delay=1,facing=south] on a fixture stone block at (14,y,17) with the input cell at (14,y,18) behind it (the repeater hard-powers the same wool). The 8 indicator lamps beside the levers (15,y,17) were dropped (nothing reads them). Everything else is the skeleton''s blocks. MEASURED on 26.3, all three tests pass: perfect squares and their neighbours, all 256 inputs in Gray-code order and in descending order, so every output equals floor(sqrt(n)) for every n. Measured edges include the fixture repeater (2 gt) and the output lamp (4 gt on a fall, none on a rise): q rise 6 and fall 10 gt, so the circuit alone is 4 gt (rise 6-2, fall 10-2-4), the README''s 2 ticks, the same for every input and output (INFERRED subtraction). How it works (INFERRED from the layers, not traced cell by cell): each input bit''s 2-layer cell stacked in y at pitch 2 carries its true and complement as dust rows along z=16 west and east of the wool at x=14; the columns at x=2..26 are the product terms as torch-and-wool stacks with targets and repeaters, and the z=1 rows at the top OR them into the four lamps; every term sees the bit in the same tick, so latency is flat.'
traits:
- pistonless
- entityless
- torch_based
