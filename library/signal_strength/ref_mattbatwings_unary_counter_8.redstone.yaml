name: ref_mattbatwings_unary_counter_8
description: 'Source (SOURCED): mattbatwings'' Logical Redstone Archive HEX003 ''8-bit Unary Counter'' (endorsed by mattbatwings, Tested & Functional, Recommended; Discord https://discord.com/channels/1361854816837435433/1472410359854792815). README: counts how many bits are on, input 8b (inverted), output a hex number, 4 ticks. 7x2x17 as rebuilt (8x2x17 with the levers). MEASURED: the output dust count (0,1,9) holds the number of levers that are OFF (0..8), all 256 lever combinations (Gray-code order, so every step flips one lever; ''inverted'' = a lever on is a 0 bit); each combination settles within 8 gt (4 redstone ticks = the README''s 4 ticks) and 7 gt is too few (the sweep fails at wait 7 for nearly every step); latency tests: 1 -> 0 and 0 -> 1 at the output edge take exactly 8 gt, and 0 -> 8 and 8 -> 0 settle in 8 gt. Changed for the harness: the author''s lamp + lever pair per input (lamp at x=6, lever on its east face) is replaced by a driver redstone block at the lamp''s cell, named lv0..lv7 (lv0 at z=1, lv7 at z=15; lv=1 is the lever on); a redstone block powers the dust at x=5 at 15 just as the strongly powered lamp does, so the dust, comparators and constants are unchanged, but the lamps'' indicator light is gone. The input cells therefore sit inside the footprint. The author''s barrels are taken from the .schem block entities: a stack of totems or redstone sets each constant (strengths 1, 2, 4, 9, 10 and two big ones; the 8 is 13.5 stacks of redstone, exactly half full), so a rebuild without the contents does not count. INFERRED mechanism: each lever''s dust (15 at x=5, 14 at x=4) is the side input of a subtract comparator whose rear is a constant barrel, so a lever on zeroes that branch (14 is more than any constant it meets) and a lever off lets the constant through; the passing constants are merged by wool and dust (a block takes the strongest of its feeders, dust adds nothing but decay), and later compare/subtract stages keep a running value that ends as the count at the west edge. The saved all-off dust strengths 10, 10, 9, 8, 8 in the schem (SOURCED) are consistent with a value of 8 + c after the first lever pair (c = off levers in it) falling to the final 8 at the output, but I did not decode every stage. Compactness: no torches, repeaters or clock, all of it is strength as data (compare with ref_mattbatwings_unary_counter_15).'
traits:
- analog
- silent
- pistonless
- entityless
