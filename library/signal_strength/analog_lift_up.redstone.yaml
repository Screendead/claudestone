name: analog_lift_up
description: 'Lossless analog lift going up one level per comparator: a comparator''s output block (stone at x=2, y=1) powers the dust lying on it (x=2, y=2) at full strength, and the next comparator (x=3, y=2, facing west, standing on stone) reads that dust from behind and powers the next block (x=4, y=2), whose dust (y=3) feeds the third comparator. Every 2 game ticks the strength rises one block with no decay; one wide (z=0), each step 2 blocks along x and 1 up. The comparator at x=1 reading the hopper is the fixture setting the input; the lift is the two steps x=2..5 and the output dust (x=6, y=3) carries the input strength exactly. 7x4x1. Tests: all 16 strengths arrive unchanged, 6 ticks after the hopper changes (2 fixture, 4 lift). Trade-off: going up costs a comparator per level where analog_lift_down covers two; a dust staircase is instant but loses 1 per step.'
traits:
- analog
- comparator_based
- vertical
- one_wide
- stackable
- silent
- lightless
- pistonless
- entityless
- tick_accurate
- reset_safe
- survival_friendly
- compact
palette:
  .: air
  '=': smooth_stone
  a: hopper[facing=down]
  b: comparator[facing=west]
  S: stone
  c: {name: step1, block: redstone_wire}
  d: {name: step2, block: redstone_wire}
  e: {output: out, block: redstone_wire}
layers:
  0: |
    ===....
  1: |
    abSS...
  2: |
    ..cbSSS
  3: |
    ....dbe
tests:
