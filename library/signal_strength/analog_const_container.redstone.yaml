name: analog_const_container
description: 'Constant strength source: a comparator (x=1) reading a container behind it (x=0) outputs a fixed 0-15 set by how full the container is, floor(1 + 14 * fullness) for any non-empty container, where fullness sums count / max stack over the slots divided by the slot count. Here the container is a decorated pot, a one-slot container, so the strength is set by one stack of stone (count: strength) 1:1, 2:5, 3:10, 4:14, 5:19, 6:23, 7:28, 8:32, 9:37, 10:42, 11:46, 12:51, 13:55, 14:60, 15:64; one unstackable item (a sword) gives 15. The pot is the finest-grained and cheapest container: no ticking, not a hopper that pulls items, players insert one item per click, and hoppers can fill or drain it. Output: the comparator, facing east into the dust at x=2. 3x2x1 (pot, comparator, output dust), one wide. For other containers use the same formula with their slot count (hopper 5, dropper and dispenser 9, chest and barrel 27; a hopper needs 1, 23, 46, 69, ... redstone per level), or a block-state
  source (cake 14 - 2 * bites, composter level, cauldron level, respawn anchor 0/3/7/11/15, end portal frame with eye 15) when no block entity is wanted. A comparator also reads the container through one solid block when that block carries less than 15, so the pot can sit behind a wall. Tests: all 16 strengths (the pot emptied for 0), each appearing on the comparator exactly 2 ticks after the contents change. Trade-off versus analog_const_lectern (player-selectable 1..15 by page) and analog_const_item_frame (1..8 dial, no block cell of its own): this one is fixed at build time and needs no entity.'
traits:
- analog
- comparator_based
- silent
- lightless
- pistonless
- tick_accurate
- reset_safe
- survival_friendly
- flat
- horizontal
- one_wide
- ultracompact
- container_based
- entityless
palette:
  .: air
  '=': smooth_stone
  P: decorated_pot[facing=north]{item:{id:"minecraft:stone",count:37}}
  C: {name: reader, block: 'comparator[facing=west]'}
  o: {output: out, block: redstone_wire}
layers:
  0: |
    ===
  1: |
    PCo
