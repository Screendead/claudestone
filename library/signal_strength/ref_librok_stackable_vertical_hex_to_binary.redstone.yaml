name: ref_librok_stackable_vertical_hex_to_binary
description: 'LiBRoK, HEXTOBIN003 stackable vertical hex to binary (mattbatwings Logical Redstone Archive; discord.com/channels/1361854816837435433/1479218672601010196). Strength 0-15 in at (5,8,2) from the east, four lamps out: b8 y=7, b4 y=5, b2 y=3, b1 y=1 (x=0,z=3). Each stage: a barrel of wooden axes (3, 7, 14 of 27 slots = strength 2, 4, 8) feeds a constant by a comparator; compare mode against the constant gives the bit (a repeater to a lamp), a subtract comparator gives H-c, and a repeater-driven subtract comparator (side 15) passes H unchanged when H<c; the two paths meet at one wool block and the dust below carries the remainder to the next stage. Size 6x9x5 plus the fixture barrel src at x=6 (harness: a 27-slot barrel of stone read by the input comparator, set by data merge; the .schem has no input source). Changes: schem lamp glyphs named b1..b8, the three barrels kept with their wooden_axe contents from the schem block entities. MEASURED: all 16 values correct up, down and in jumps; rise b8 6 gt, b4 10, b2 14, b1 18 (each stage +4 gt); fall b8 10 ... b1 22; worst 5 to 10: b1 falls at 34 gt (lamp fall includes 4 gt); the README claim of 6t is not reproduced as total latency (INFERRED: it is the first-bit latency, 6 gt).'
traits: [analog, compact, vertical]
