  I: note_block[instrument=harp,note=2]
  J: note_block[instrument=harp,note=0]
  K: note_block[instrument=harp,note=4]
  M: note_block[instrument=harp,note=8]
  N: note_block[instrument=harp,note=5]
  O: note_block[instrument=harp,note=7]
  P: redstone_wire[east=side,north=none,south=side,west=none]
  Q: comparator[facing=north,mode=subtract]
  T: repeater[delay=1,facing=south]
  U: redstone_wire[east=side,north=none,south=none,west=side]
  V: comparator[facing=east,mode=compare]
  W: redstone_wire[east=side,north=side,south=side,west=side]
  X: comparator[facing=west,mode=subtract]
  Y: comparator[facing=east,mode=subtract]
  Z: redstone_wire[east=none,north=side,south=side,west=none]
  b:
    name: clk
    block: lever[face=floor,facing=east]
  r:
    name: line0
    block: redstone_wire[east=side,north=none,south=none,west=side]
  s:
    name: line1
    block: redstone_wire[east=side,north=none,south=none,west=side]
  t:
    name: line2
    block: redstone_wire[east=side,north=none,south=none,west=side]
  u:
    name: line3
    block: redstone_wire[east=side,north=none,south=none,west=side]
  w: white_wool
