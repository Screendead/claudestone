name: analog_add
description: 'Saturating analog adder sum = min(a + b, 15) from three subtract-mode comparators in a row, using a + b = 15 - ((15 - a) - b): I (x=1, z=3) inverts a (redstone block behind it at x=0, a on its north side at x=1, z=2), C (x=2, z=3) subtracts b (on its south side, x=2, z=4) from that, and S (x=3, z=3, facing north, redstone block behind it at x=3, z=2) inverts again with C facing into its side. If a + b > 15 the middle stage bottoms out at 0 and S gives 15, so it clamps instead of wrapping. Output: S, leaving south (x=3, z=4, kept empty beside the b dust; put a diode there). Core 4x2x2 (x=0..3, z=2..3). Delay 6 game ticks from a, 4 from b, measured on both edges. Fixtures: hopper and comparator per input, drivers above the input dusts. Tested for all a against b = 0, 1, 3, 6, 8, 9, 15. Trade-off: exact and lightless but 6 ticks; to add a constant k put a container of strength 15 - k behind C''s side instead of b, and a chain of k extra C stages adds more inputs at +2 ticks each.'
traits:
- analog
- comparator_based
- silent
- lightless
- pistonless
- entityless
- tick_accurate
- reset_safe
- survival_friendly
- compact
- flat
- horizontal
palette:
  .: air
  '=': smooth_stone
  P: redstone_block
  Q: redstone_block
  H: hopper[facing=down]
  h: hopper[facing=down]
  F: comparator[facing=north]
  g: comparator[facing=south]
  A: {name: a, block: redstone_wire}
  B: {name: b, block: redstone_wire}
  I: comparator[facing=west,mode=subtract]
  C: comparator[facing=west,mode=subtract]
  S: {output: sum, block: 'comparator[facing=north,mode=subtract]'}
  a: {input: a_max}
  b: {input: b_max}
layers:
  0: |
    .....
    .=...
    .=...
    .===.
    ..=..
    ..=..
    .....
  1: |
    .H...
    .F...
    .A.Q.
    PICS.
    ..B..
    ..g..
    ..h..
  2: |
    .....
    .....
    .a...
    .....
    ..b..
    .....
    .....
tests:
- name: either input saturates
  truth_table: |
    a_max b_max | sum
    0 0 | 0
    1 0 | 1
    0 1 | 1
    1 1 | 1
  delay: 6
- name: 5 + 3, a path 6 ticks, b path 4
  steps:
  - {run: 'data merge block ~1 ~1 ~0 {Items:[{Slot:0b,id:"minecraft:redstone",count:64},{Slot:1b,id:"minecraft:redstone",count:28}]}'}
  - {run: 'data merge block ~2 ~1 ~6 {Items:[{Slot:0b,id:"minecraft:redstone",count:46}]}'}
  - {wait: 12}
  - {check: 'if data block ~3 ~1 ~3 {OutputSignal:8}'}
  - drive: {a_max: 1}
  - {wait: 5}
  - {check: 'if data block ~3 ~1 ~3 {OutputSignal:8}'}
  - {wait: 1}
  - {check: 'if data block ~3 ~1 ~3 {OutputSignal:15}'}
  - {wait: 10}
  - {check: 'if data block ~3 ~1 ~3 {OutputSignal:15}'}
  - drive: {a_max: 0}
  - {wait: 5}
  - {check: 'if data block ~3 ~1 ~3 {OutputSignal:15}'}
  - {wait: 1}
  - {check: 'if data block ~3 ~1 ~3 {OutputSignal:8}'}
  - {wait: 10}
  - {check: 'if data block ~3 ~1 ~3 {OutputSignal:8}'}
  - drive: {b_max: 1}
  - {wait: 3}
  - {check: 'if data block ~3 ~1 ~3 {OutputSignal:8}'}
  - {wait: 1}
  - {check: 'if data block ~3 ~1 ~3 {OutputSignal:15}'}
  - {wait: 10}
  - {check: 'if data block ~3 ~1 ~3 {OutputSignal:15}'}
  - drive: {b_max: 0}
