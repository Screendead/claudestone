name: ref_mattbatwings_line_subtract
description: 'Source (SOURCED): mattbatwings'' ''How To Wire Like a Redstone Pro!'' world (Java 1.18.2), demo cluster W81 at world origin [94,56,-98]. A hex-line transmission with a subtraction at its end (3x2x15 as rebuilt): barrel b (x=0,z=14) -> subtract comparator (z=13, no side input so it passes b) -> dust column x=0 -> 11 delay-1 repeaters (x=1, facing west) -> dust column x=2 -> subtract comparator (x=2,z=1, back input the dust at z=2) whose side input is a compare comparator (x=1,z=1) reading a second barrel a (x=0,z=1). MEASURED: out = max(0, min(15, b+4) if b else 0) - a) for all 256 pairs a,b in 0..15. INFERRED: the line is 11 repeaters long, not 15, so unlike hex_line_flat it does not return b: with b lit repeaters the second dust line is 15 at the b-th block and decays over the remaining 11-b blocks to b+4 at the end (capped at 15 once b>=11, 0 when b=0), and the end comparator subtracts a. See ref_mattbatwings_hex_line_flat for the full-length line. Changed for the harness (INFERRED that the author''s lever/lamp demo is replaced by this): the two containers are fixtures named a and b, filled with data merge to every strength 0-15 (a redstone stack count chosen from floor(1+14*fullness)), and the end of the line is a named dust cell read with level; the lime/orange marker wool and magenta decoration wool are kept as plain support. Whether the author intended the +4 offset is unknown; the cluster is a demo of subtracting at a distance.'
traits: [analog, silent, pistonless, entityless]
palette:
  .: air
  A: lime_wool
  B: magenta_wool
  C: orange_wool
  D: redstone_wire[east=none,north=side,south=side,west=none]
  E: barrel[facing=up,open=false]
  F: comparator[facing=west,mode=compare]
  G: comparator[facing=south,mode=subtract]
  H: redstone_wire[east=side,north=none,south=side,west=none]
  I: repeater[delay=1,facing=west]
  J: redstone_wire[east=none,north=side,south=side,west=side]
  K: redstone_wire[east=side,north=side,south=side,west=none]
  M: redstone_wire[east=none,north=side,south=none,west=side]
  q: {name: b, block: 'barrel[facing=up,open=false]', fixture: true}
  r: {name: a, block: 'barrel[facing=up,open=false]', fixture: true}
  s: {name: out, block: 'redstone_wire[east=none,north=side,south=side,west=none]'}
layers: {0: '..A

    BBB

    BBB

    BBB

    BBB

    BBB

    BBB

    BBB

    BBB

    BBB

    BBB

    BBB

    BBB

    B..

    C..

    ', 1: '..s

    rFG

    HIJ

    KIJ

    KIJ

    KIJ

    KIJ

    KIJ

    KIJ

    KIJ

    KIJ

    KIJ

    KIM

    G..

    q..

    '}
