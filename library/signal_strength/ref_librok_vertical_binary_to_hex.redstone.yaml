name: ref_librok_vertical_binary_to_hex
description: "LiBRoK, BINTOHEX003 5t vertical binary to hex (mattbatwings Logical Redstone Archive, endorsed by Waffle [Wueffi]; discord.com/channels/1361854816837435433/1479948792416571565). Four levers b8 (top, y=8), b4 (y=6), b2 (y=4), b1 (y=2) become the hex digit as a signal strength 0-15: the output is the output of the comparator `out` at (2,1,3), which powers the wool at x=3 (a user puts dust or a reader there). README speed 5t (SOURCED). Size 4x9x5, 68 blocks. Harness changes: the four redstone lamps the levers hang on (the schem's input indicators; they still conduct) became white concrete, because the lever driver only emulates plain full blocks (a lit lamp beside each lever is lost); blue wool kept; the six barrels' wooden_axe contents read from the schem block entities (27, 26, 24, 20, 13, 27 axes; axes stack to 1 so strength = 1 + floor(14n/27) = 15, 14, 13, 11, 7, 15); the schem has no output cell, so `out` names the last comparator. How it works (INFERRED, checked against the traces): a subtract chain with an accumulator that starts at 15. Per bit k of weight w, a compare comparator turns a barrel into the constant 15-w (onto wool, read by a dust on top), a subtract comparator takes that constant off the lever's 15 (the lever hard-powers the block behind the comparator) giving w*bit as dust strength, and a second subtract comparator takes w*bit off the accumulator, which arrives through a wool block and leaves through the wool beside it into dust above or below. The accumulator zig-zags east/west down the stack, two layers per bit, 15 - 8*b8 - 4*b4 - 2*b2 - b1 on the dust at (2,1,4); the final comparator `out` subtracts that from a 27-axe barrel (15), giving the digit. MEASURED: all 16 values right from a one-lever Gray walk, from a shuffled order that flips several levers in the same tick, and from complement/alternating jumps (14 more); the output settles within 12 game ticks (6 redstone ticks) of the click in every transition tested, never earlier than 6 gt; the longest path is b8 through six comparators, so this does not reproduce the README's 5t as lever-click-to-settled (the README may count from the first comparator's output, INFERRED)."
