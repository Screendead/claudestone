name: ref_mattbatwings_hex_to_bin
description: 'Source (SOURCED): mattbatwings'' Logical Redstone Archive HEXTOBIN002 ''Hex to Binary'' (fast_hex_to_bin.schem; authors mattbatwings and FEARLESS_Z, endorsed by mattbatwings, Tested & Functional, Recommended; Discord https://discord.com/channels/1361854816837435433/1472408343946596476): a hex digit (signal strength 0-15) to 4 bits, README speed 3 ticks. 5x9x17 as rebuilt; the 4 bit outputs are the lamps at x=0, z=1 (y=1,3,5,7 = bit 0..3), the schematic''s own display. Harness changes: the schematic has no input, only the comparator at x=4,y=3,z=1 reading north; a fixture barrel at x=4,y=3,z=0 (on the glass at y=2) is set with data merge to give strength n (stone stacks, mid-band counts). How it works (INFERRED from the layout, confirmed by the 0..15 sweep): the input comparator copies n onto a wool block, which feeds two dust lines, one below it (a zigzag over wool, y=1/y=0, x=4) and one on top (a straight line, y=4); the straight line also climbs a slab-and-dust riser (dust on top slabs, alternating z=0/1 per layer) to a third line (y=6) and a fourth (y=8). Dust loses 1 per block, so each line is a thermometer of n. At a tap a repeater turns ''dust >= 1'' into 15 and feeds the back of a subtract comparator whose side input is a second repeater k blocks further down the same line (k=1 zigzag, 2, 4, none), so the comparator is on exactly when the line is >= 1 at the tap and 0 k blocks later, a window of k values of n. Bit 0 has 8 one-value windows (n=1,3,..15, taps every second pair of dust), bit 1 four two-value windows (2-3, 6-7, 10-11, 14-15), bit 2 two four-value windows (4-7, 12-15), bit 3 one window (>=8, no side input). Each comparator powers a wool block that powers a collector dust line at x=0 (one per bit, stacked 2 apart in y, never touching another bit''s line), which strongly powers the wool under it and so lights the bit''s lamp. Compact because the 4 bit lines share one input and one stack and every tap is a single 2-diode cell; the riser spends
  the decay of the upper bits'' offset (the line is already 2, 3, 4 weaker where it arrives) in place of extra repeaters. MEASURED: all 16 values give the right 4 bits, 17 changes in a shuffled order too; lamps light 6 gt after the barrel changes (comparator 2, repeater 2, comparator 2 = 3 redstone ticks, matching the README) and go out 10 gt after (the lamp''s 4 gt off delay). Harness caveat (MEASURED): all tests pass on main and on laptop satellites sat2, sat3 and sat4, but on Docker satellites (dsat1..3) the same build fails intermittently, in the default in-container run and in the forwarded one (REDSTONE_REMOTE=0 passed once and failed once): a collector dust line keeps power with no source after load or after a transition (idle shows bit 3 lit, hex 4 lights bit 3, other runs light all four bits), the same cells every time, and the lamps follow the stale dust. The same commands pass on a laptop satellite, so this is a state or ordering difference of the Docker worlds that the design is sensitive to; the cause is not found.'
traits:
- analog
- comparator_based
- container_based
- silent
- pistonless
- entityless
