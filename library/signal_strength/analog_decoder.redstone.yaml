name: analog_decoder
description: 'One-hot signal-strength decoder: line e_k is on exactly when the input strength is k, for k = 1..15, 4 game ticks after the strength reaches the hub, lightless and silent, 19 wide, 4 tall, 5 deep. The strength s strongly powers the stone hub (x=3, z=2, here fed by the input comparator north of it, which reads the hopper at x=3, z=0). Bus A, dust on y=1 through z=2, runs 15 blocks east and 3 west of the hub, so its cell k blocks away is lit exactly when s >= k (a free thermometer). Each line is one subtract comparator E_k fed from behind by a repeater on bus A (15 when s >= k) and from its west side by 15 when s >= k+1, so it passes 15 only for s = k. Odd lines 3..15 sit in the north row (z=0, facing south, outputs going north), even lines 4..14 in the south row (z=4, facing north, outputs going south); their upper thresholds come from bus B, a second dust line on y=3 above bus A that runs 2 blocks behind it (fed from the hub''s south face through a climb and a detour), read
  by repeaters on y=2 that power the stone above each side dust, so every side dust gets exactly 15. A side dust shared by two lines of the same row is the upper of the east one and a higher (harmless) threshold for the west one, which is why the lines can sit 2 apart. Lines 1 (south, x=2) and 2 (north, x=1) are built on the west run with plain repeaters. Line 0 is not built: it is NOT e(s >= 1), a subtract comparator with a redstone block behind it and a repeater from any bus A cell next to the hub on its side. Named outputs e1..e15 are the line comparators themselves (strength 15 when on). Tests: every strength selects exactly its line, and on switching between strengths (0-1, 15-14, 6-7, 0-8 and back) the old line holds for 5 ticks after the hopper changes and the new one is on at 6 (2 of which are the fixture comparator). Trade-off: 4 ticks for 15 lines at about 3 blocks per line; analog_adc reuses the odd-line row as its low bit.'
traits:
- analog
- comparator_based
- silent
- lightless
- pistonless
- entityless
- fast
- compact
- tick_accurate
- reset_safe
- survival_friendly
