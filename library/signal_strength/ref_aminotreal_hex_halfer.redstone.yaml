name: ref_aminotreal_hex_halfer
description: 'Source (SOURCED): mattbatwings'' Logical Redstone Archive HEX004 ''Hex Halfer'' (author Aminotreal, endorsed by mattbatwings, Tested & Functional; Discord https://discord.com/channels/1361854816837435433/1472410595163639808): divides a hex number (signal strength 0-15) by 2, README speed 3 ticks. 18x3x4 as rebuilt (levels y=0..2). Input is the dust at x=15,z=2 (north-south, fed from the south); the output is the dust at x=0,z=3. The block-entity contents were read from the .schem, not the parsed JSON: one totem in the input-side barrel and 2, 4, 10, 16, 23, 27 unstackable totems in the barrels at x=2,6,8,10,12,14 (z=2), which read strengths 1, 2, 3, 6, 9, 12, 15 (a 27-slot barrel gives floor(1 + 14 n / 27) for n one-item stacks); the cake (bites=0, strength 14) sits at x=16. How it works (INFERRED from the layout and the schematic''s saved dust levels, spot-checked by the tests, not traced block by block): the subtract comparator at x=15,z=1 outputs 14 - n, the cake behind it and the input dust n on its side. That feeds a thermometer, a dust line zigzagging over quartz (y=1/y=2) along z=1 that loses 1 per dust, so the dust at column x holds x + 1 - n (floored at 0). Five subtract comparators at x=5,7,9,11,13 (z=2) each read a constant barrel on their east (strengths 3, 6, 9, 12, 15) and have the thermometer dust on their north as side input, so comparator x outputs max(0, R_x - (x + 1 - n)); the barrel strengths are the thresholds of a lookup table. Each comparator powers the block on its west (a barrel or quartz), which strongly powers a dust of a second zigzag along z=3; that line decays westward to x=4, from where a compare comparator relays it to the output dust. The comparators at x=0 (z=1, z=2) and x=3 and the barrel at x=2 were not traced; the saved snapshot has them at 0 for n=14. Net result MEASURED: output = floor(n / 2) for every input n = 0..15. Changed for the harness: a fixture compare comparator at x=15,z=3 reads a fixture barrel (z=4) set with data merge to give the input strength n. MEASURED delay: the output edge appears exactly 8 gt after the fixture barrel changes in both directions (0->1 and 1->0 tested), 2 gt of it the fixture comparator, so 6 gt = 3 redstone ticks from the input dust, matching the README.'
traits: [analog, comparator_based, container_based, silent, pistonless, entityless]
