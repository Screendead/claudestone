name: ref_mattbatwings_comparator_relay
description: 'Source (SOURCED): mattbatwings'' ''How To Wire Like a Redstone Pro!'' world (Java 1.18.2), demo cluster W80 at world origin [76,56,-99]. A lossless dust relay with no repeaters (1x2x16 as rebuilt): barrel at z=15, then four stages of compare comparator -> wool -> dust, three blocks apart: comparator (z=14) outputs strength s into the wool in front of it, that wool powers the dust beside it at full s (not s-1), the dust powers the next wool, and the next comparator (z=10) reads that wool at s again; so the strength s is held at every dust (z=12, 8, 4, 0) however far it goes (a plain dust run would lose 1 per block, a repeater would turn it into 15). Changed for the harness (INFERRED that the author''s lever/lamp demo is replaced by this): the container is a fixture named in, filled with data merge to every strength 0-15 (a redstone stack count chosen from floor(1+14*fullness)), and the end of the line is a named dust cell read with level; the lime/orange marker wool and magenta decoration wool are kept as plain support. MEASURED: all four named dust cells equal the container''s strength for s 0..15; the first dust changes 2 ticks after the container edit and each later stage 2 ticks later (comparator delay), so the end is 8 ticks (wave, strengths 1 and 15). (INFERRED mechanism: a comparator''s output powers the block in front of it strongly at its output level, and dust next to a powered block takes that block''s level, and a comparator reading a block reads the highest power into it.)'
traits: [analog, silent, pistonless, entityless]
palette:
  .: air
  A: lime_wool
  B: magenta_wool
  C: orange_wool
  D: redstone_wire[east=side,north=side,south=side,west=side]
  E: comparator[facing=south,mode=compare]
  F: barrel[facing=up,open=false]
  q: {name: in, block: 'barrel[facing=up,open=false]', fixture: true}
  r: {name: d12, block: 'redstone_wire[east=side,north=side,south=side,west=side]'}
  s: {name: d8, block: 'redstone_wire[east=side,north=side,south=side,west=side]'}
  t: {name: d4, block: 'redstone_wire[east=side,north=side,south=side,west=side]'}
  u: {name: out, block: 'redstone_wire[east=side,north=side,south=side,west=side]'}
layers: {0: 'A

