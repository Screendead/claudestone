name: ref_mattbatwings_bin_to_hex_targets
description: "Fast Binary to Hex by mattbatwings (LRA BINTOHEX002, endorsed by mattbatwings, Discord https://discord.com/channels/1361854816837435433/1472409017987891384; the entry holds one schematic with two versions side by side): four levers b3 b2 b1 b0 (b3 most significant) become the hex digit as the signal strength 0-15 of the dust `out`, README speed 2 ticks (SOURCED). This is the version whose levers lie in a row (x=6,8,10,12 along z=1, b0 at x=6). 13x7x16 including the levers and their supports. Harness changes: the lamps the levers hang on became white concrete (the lever tests only emulate plain supports), the other version cut away, and the output dust named. How it works (INFERRED, checked against one trace): the same thresholds-on-a-strength-line idea as the other version: each bit runs down a dust bus along z; in each of eight even rows three wall torches on iron blocks put strength 15 on a 10-long dust line at three positions, so the strength reaching the west end encodes the row's partial result; that dust powers a target block (any strength above 0 counts as powered, so it works as a threshold), and the torch on the target's north face (y=4, odd rows) or on its west face (y=6, rows 2-14) is lit when the target is not; the 15 torches drive a zigzag dust line at x=0 that alternates between y=4 and y=5, one dust per row, ending at `out`; the nearest lit torch sets the output to 15 minus its distance in rows (at value 6 the 15 is in the dust at row 10, 9 dust from the output, giving 6). MEASURED: all 16 values correct from 0, Gray walk, set and cleared, and complement jumps with all four levers changing, on laptop satellites and dsat1 and dsat2; the output changes exactly 4 game ticks (2 redstone ticks, matching the README) after the click, rise and fall."
