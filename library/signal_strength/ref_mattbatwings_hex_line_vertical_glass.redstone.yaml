name: ref_mattbatwings_hex_line_vertical_glass
description: 'Source (SOURCED): mattbatwings'' ''How To Wire Like a Redstone Pro!'' world (Java 1.18.2), demo cluster W69 at world origin [81,56,-138]. The same hex line standing vertically (7x16x2 as rebuilt): comparator (x=5,y=1) reads a barrel at x=6 and drives a dust column that rises on glass pillars; delay-1 repeaters (facing east) between two stair columns of dust read the near column and put 15 on the far column, which feeds a comparator (x=1,y=15) at the top. Magenta stained glass holds the dust runs apart (glass is not a redstone conductor, so dust on one stair does not power the other). The core idea (INFERRED from the blocks, then MEASURED by the tests): dust loses 1 per block, so a strength-X signal on the near dust line (the comparator''s output) is still above 0 for exactly X blocks. A repeater beside each dust block reads that line and outputs a full 15 onto a second parallel dust line, so a repeater is lit iff the near line reaches it, and the lit repeaters are the X nearest the comparator. The second line decays 1 per block away from the first lit repeater, which put 15 at the X-th block, so after the 16 blocks of the line it is back at exactly X and a comparator reads it onto the far output: the strength X is re-created at the far end after travelling a 15-block line, with the repeaters all reading in parallel. Changed for the harness (INFERRED that the author''s lever/lamp demo is replaced by this): the container is a fixture named in, filled with data merge to every strength 0-15 (a redstone stack count chosen from floor(1+14*fullness)), and the end of the line is a named dust cell read with level; the lime/orange marker wool and magenta decoration wool are kept as plain support. MEASURED: out equals the container''s strength for every s 0..15; mid 2 ticks after the edit, out 4 ticks after mid (strengths 1 and 15). W52 and W62 are the downward / 11-long variants (INFERRED from block lists, not built).'
traits: [analog, silent, pistonless, entityless]
palette:
  .: air
  A: magenta_stained_glass
  B: magenta_wool
  C: orange_wool
  D: redstone_wire[east=side,north=up,south=none,west=none]
  E: repeater[delay=1,facing=east]
  F: redstone_wire[east=side,north=up,south=none,west=side]
  G: comparator[facing=east,mode=compare]
  H: barrel[facing=up,open=false]
  I: redstone_wire[east=side,north=none,south=up,west=none]
  J: redstone_wire[east=none,north=none,south=up,west=side]
  K: redstone_wire[east=none,north=up,south=none,west=side]
  M: lime_wool
  N: redstone_wire[east=side,north=none,south=none,west=side]
  O: redstone_wire[east=side,north=side,south=none,west=side]
  P: redstone_wire[east=none,north=side,south=none,west=side]
  q: {name: in, block: 'barrel[facing=up,open=false]', fixture: true}
  r: {name: out, block: 'comparator[facing=east,mode=compare]'}
  s: {name: mid, block: 'comparator[facing=east,mode=compare]'}
