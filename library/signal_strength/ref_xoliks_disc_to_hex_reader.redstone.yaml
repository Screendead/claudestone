name: ref_xoliks_disc_to_hex_reader
description: "Xoliks' DisctoHex Reader (HEX007_DiscReaderV3, mattbatwings' Logical Redstone Archive, https://discord.com/channels/1361854816837435433/1517282256497021058; endorsed by Mixel): a note block starts it, a hopper/dropper/dispenser chain places each shulker box from the top chest, empties it with a hopper, feeds discs to a jukebox and a comparator turns the disc into dust strength 1-15 at the south-west wire (named out); README claim (SOURCED): one strength pulse per disc every 8 gt, box repackaged into the bottom chest. 10x8x3, rebuilt block for block from the .schem including its container items (redstone in the dropper, a shulker in the hopper, shovels in the barrels); the only additions are the start input (a redstone block on the note block's east side) and cell names. MEASURED in 26.3: the front end works, a box of discs put in the top chest is placed and unpacked on its own, and 26 gt after start the first disc is in the jukebox and out reads its strength (13 -> 1, 11 -> 11, 5 -> 15; tests below). The rest of the claim FAILS here: the first disc stays in the jukebox playing (ticks_since_song_started kept counting to 577 with a 3-disc box; removing the redstone block that locks the hopper under the jukebox changed nothing), out never changes again, and the next discs are taken by the hopper under the first dropper into the repackaging shulker without being read. INFERRED, not tested: the design relied on emptying a playing jukebox early (docs/MECHANICS.md jukebox_disc_timer_and_id: in 26.3 the hopper below a playing jukebox is locked and takes the disc only when the song ends, 1420-3560 gt)."
