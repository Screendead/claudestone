tests:
- name: reads_disc_13
  steps:
  - insert: {cell: feed, items: [{id: shulker_box, count: 1}]}
  - run: 'data modify block ~5 ~7 ~1 Items[0].components set value {"minecraft:container":[{slot:0,item:{id:"minecraft:music_disc_13",count:1}},{slot:1,item:{id:"minecraft:stick",count:1}}]}'
  - wait: 30
  - expect: {out: 0}
  - drive: {start: 1}
  - wave: {out: '000000000000000000000000001'}
  - level: {out: 1}
  - wait: 40
  - level: {out: 1}
  - check: if data block ~3 ~4 ~2 RecordItem{id:"minecraft:music_disc_13"}
