name: ref_aminotreal_hex_to_binary
description: 'Source (SOURCED): mattbatwings'' Logical Redstone Archive HEXTOBIN001 ''Hex to Binary'' (author Aminotreal, endorsed by mattbatwings, Tested & Functional, Recommended; Discord https://discord.com/channels/1361854816837435433/1472408031865081948; the signs say ''based of LAM, More compact, 2t hex-bin, 2023/7/3''): a hex number (signal strength 0-15) in, 4-bit binary out, README speed 2 ticks. 9x4x18 as rebuilt. Input: a lectern at x=6,z=0 with a 15-page book read by a comparator, so page n+1 gives strength n+1 (1..15); strength 0 is the lectern without its book. Outputs are the dust ends on the south wall, one wire per bit, each lit (any strength > 0, the strength itself is a leftover of the decay) iff its bit is set: b0 at x=9,y=1,z=17, b1 at x=5,y=2,z=17, b2 at x=2,y=1,z=17, b3 at x=1,y=2,z=17. The barrel at x=1,y=2,z=0 holds 6 totems named ''4'' (read from the .schem; the parsed JSON lacks block entities): it is a constant strength-4 source, part of the design, not an input; with it empty b2 is wrong for 9..11. How it works (MEASURED in a trace of every dust and comparator, then INFERRED; the comparator pairs were not each traced): the lectern comparator puts n on a dust zigzag along x=6 that climbs a block every few cells and loses 1 per dust, so it reads n-k at depth k. Repeaters beside it (x=7 facing west, x=5 facing east) light iff the dust there is > 0, which makes a thermometer code of n. Subtract comparators that take two neighbouring thermometer taps (back minus side) fire a full-strength 15 for exactly one value or one pair of values: x=8 comparators fire for n = 1, 5, 9, 13 (y=1) and 3, 7, 11 (y=2), x=4 comparators for n in 2..3, 6..7, 10..11 and 14..15 (the last by a repeater at n >= 14). Those 15s enter the bit-0 wire (x=9 zigzag) and the bit-1 wire (x=3 zigzag) at different depths and every entry still reaches the end at strength >= 1 after decaying along it, so the wire is an OR of its detectors without any gate; bit 2 is a comparator at x=3,z=5 that fires for n in 4..7 OR-ed with a repeater that fires when the subtract comparator at x=2,z=3 (back n-7, side = the constant 4) is > 0, i.e. n >= 12; bit 3 is a back-minus-side comparator pair (target block x=1,y=3,z=1: back n-7, side n-8) that is 1 for n >= 8 and starts the x=1 wire. MEASURED: all 16 values give the right 4 bits 30 gt after the page turn; a count 1..15..0 (every adjacent step, up and down, with the no-book step) changes every output exactly 6 gt after the page turn with no glitch (wave on all four outputs), and 7<->8, 15<->0 flips (all four bits at once) are the same 6 gt: 2 gt for the lectern comparator, then 4 gt = 2 redstone ticks to the outputs, matching the README''s 2 ticks counted from the comparator. Changed for the harness: signs dropped (they only carry the text above); the lectern''s page is set with data modify block ... Page, which updates the comparator, and strength 0 by setblock of the lectern with has_book=false (back with the book to leave 0). The book''s 15 pages are plain strings in the 26.3 written_book_content component.'
traits: [analog, comparator_based, container_based, silent, pistonless, entityless]
