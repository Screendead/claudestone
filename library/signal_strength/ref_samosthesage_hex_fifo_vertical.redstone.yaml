name: ref_samosthesage_hex_fifo_vertical
description: 'Source (SOURCED): mattbatwings'' Logical Redstone Archive HEX006 ''Hex FIFO Register (Vertical, Dual-read)'' by SamosTheSage (endorsed by mattbatwings, Recommended, Tested & Functional; Discord https://discord.com/channels/1361854816837435433/1472411295847546881; README: ''A first in, first out register for hex numbers''). 40x17x22 as rebuilt, 967 blocks: eight stages stacked in y (y = 1,3,..15, each a 2-layer cell), each holding one signal strength 1-14 (MEASURED; 15 breaks, see below) and showing it as a bar of lit lamps on both sides. Interface (cell coordinates from the origin): data in = 15 stone buttons b1..b15 at x=21,y=15,z=0..14, button bN pushing strength N (they power a dust line on y=16 that decays toward z=0, so z=14 gives 15 and z=0 gives 1; INFERRED, confirmed by the round-trip test); pop = the floor button at (19,2,21) clears the oldest entry; clear_btn = the wall button at (16,1,17) clears every stage with a pulse; clear_lever = the lever at (20,0,20) holds every stage clear while on. Read ports: L0..L7 (dust at x=15, y=2k+1, z=16) and R0..R7 (x=24) carry the stored strength of stage k, stage 0 (bottom) the oldest; lamp rows at x=1..14 and x=25..38 on y=2k light a bar as long as the value (MEASURED for 6: x=9..14 and x=25..30). ''Dual-read'' is read as these two mirrored ports on every stage (INFERRED). How it works (INFERRED from the block layout, checked by the per-tick traces): each stage is a two-comparator compare-mode loop (dust 18,16 -> comparator 19,16 -> gray block 20,16 -> dust 20,17 -> comparator 19,17 -> gray block 18,17 -> back), which holds a strength with no decay, so storage is the comparator loop of ref_unknown_lra_hex_rs_horizontal''s kind; a repeater (17,15) makes a nonzero loop raise an occupied flag. A subtract comparator (20,15) copies the stage above (read through comparator 21,y+1,15 off a block the upper loop''s dust powers from above) into this loop only while the occupied flag is off, so a value falls to the lowest empty stage and an occupied stage refuses. Once the lower loop holds the value, a short pulse (cells c: loaded but flag not yet up, 2-4 gt) runs through a wall-torch pair (20,y,19)/(19,y+1,19) and powers dust (19,y+2,18) on the side of the upper loop''s comparator (19,17), which clears the donor stage; so the whole queue shifts down one stage per clear. Pop clears stage 0 the same way and the stack above ripples down. MEASURED: a push into an empty FIFO reaches stage 0 (L0) 34 gt after the click, 4 gt per stage fall (L7 at +6, L0 at +34; the right port R leads the left by 2 gt on the way down); a pop empties L0 at +6 gt and the next entry is on L0 at +14 gt; a pop ripples the rest at 14 gt per stage (full FIFO: 104 gt). Pushes need the stone button''s 20 gt apart (five distinct values 20 gt apart are stored in order); closer pushes overlap on the data line and merge to their maximum. A ninth push into a full FIFO is ignored and corrupts nothing. DEFECT (MEASURED): a stored 15 is stored twice. The clear is a compare-mode side signal of strength 15, and compare mode passes the rear when rear >= side, so a loop holding 15 cannot be cleared by it; the donor keeps its 15 as a ghost that behaves as a second entry (push 15: L0=15 and L1=15; after one pop L0=15 only). Values 1-14 round-trip alone (every_value_1_to_14_round_trip). Changed for the harness: the four sign blocks are dropped; the red concrete blocks (and the black block under the clear button) are white concrete so the harness can emulate clicks on the button and lever hanging on them (colour has no effect on redstone); the schematic''s saved power/lit states are dropped (the harness settles the build empty); the schematic was captured with values in flight, which is why saved dust powers differ from the settled empty state.'
