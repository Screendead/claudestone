name: ref_powsi_small_bin_to_hex
description: "Small Binary to Hex by Powsi and Aminotreal (LRA BINTOHEX001, endorsed by mattbatwings, Discord https://discord.com/channels/1361854816837435433/1472408772789145665): four levers b8 b4 b2 b1 become the hex digit as the signal strength 0-15 of the output dust `out`, README speed 3 ticks (SOURCED). 5x6x6 (51 blocks). Harness changes: lime concrete -> white concrete (the lever tests only emulate plain supports) and the labelling signs dropped; barrels are filled with 6, 12, 26 and 6 totems of undying (read from the schematic; one per slot, so 1+floor(14n/27) = 4, 7, 14, 4). How it works (INFERRED, checked against the traces): out = (4*m + 3) - (3 - n) with m = 2*b8+b4 and n = 2*b2+b1; each upper bit's constant (the 4 and 7 and 14 barrels, 2 for the cauldron) is passed or cancelled by a compare comparator whose side is the inverted lever, a powered b8 repeater drives a quartz block to 15 over the 7-barrel reading, and a subtract comparator takes the low-pair value off the high-pair value. MEASURED: all 16 values correct from 0, by Gray walk, set and clear with several levers flipped in one tick, and complement jumps with all four changing; every case settles within 6 game ticks (3 redstone ticks, matching the README), and 0 to 1 is exactly 6."
