name: ref_mattbatwings_hex_line_stair_targets
description: 'Source (SOURCED): mattbatwings'' ''How To Wire Like a Redstone Pro!'' world (Java 1.18.2), demo cluster W26 at world origin [93,56,-303]. The same strength-preserving ''hex line'' folded into a staircase that climbs 15 blocks (2x16x22 as rebuilt): the signal line (x=1) steps down one block per step from the input comparator (x=1,y=15,z=20), each step''s dust touches a target block at x=0; a delay-1 repeater (facing south) reads that target and outputs into a wool whose top dust is the next step of the second line (x=0), which climbs back up to the output comparator (x=0,z=1). The core idea (INFERRED from the blocks, then MEASURED by the tests): dust loses 1 per block, so a strength-X signal on the near dust line (the comparator''s output) is still above 0 for exactly X blocks. A repeater beside each dust block reads that line and outputs a full 15 onto a second parallel dust line, so a repeater is lit iff the near line reaches it, and the lit repeaters are the X nearest the comparator. The second line decays 1 per block away from the first lit repeater, which put 15 at the X-th block, so after the 16 blocks of the line it is back at exactly X and a comparator reads it onto the far output: the strength X is re-created at the far end after travelling a 15-block line, with the repeaters all reading in parallel. Here the second line is a stair rather than a flat run (dust climbs wool at the same cost of 1 per block), and the ''read'' is through a target block: the repeater reads the dust-powered target (INFERRED: a target block conducts dust power like a full block, so the repeater sees the line''s strength > 0). Changed for the harness (INFERRED that the author''s lever/lamp demo is replaced by this): the container is a fixture named in, filled with data merge to every strength 0-15 (a redstone stack count chosen from floor(1+14*fullness)), and the end of the line is a named dust cell read with level; the lime/orange marker wool and magenta decoration wool are kept as plain support. MEASURED: out equals the container''s strength for every s 0..15; mid is 2 ticks after the edit and out 4 ticks after mid for strengths 1 and 15 (waves, run as scratch tests). W25, W36, W43 are other orientations/supports of this stair (INFERRED from block lists, not built).'
traits: [analog, silent, pistonless, entityless]
palette:
  .: air
  A: lime_wool
  B: magenta_wool
  C: redstone_wire[east=none,north=side,south=side,west=none]
  D: comparator[facing=south,mode=compare]
  E: redstone_wire[east=none,north=side,south=up,west=none]
  F: repeater[delay=1,facing=south]
  G: target
  H: redstone_wire[east=none,north=none,south=up,west=side]
  I: redstone_wire[east=none,north=side,south=up,west=side]
  J: orange_wool
  K: redstone_wire[east=none,north=side,south=side,west=side]
  q: {name: in, block: 'barrel[facing=up,open=false]', fixture: true}
  r: {name: out, block: 'redstone_wire[east=none,north=side,south=side,west=none]'}
  s: {name: mid, block: 'redstone_wire[east=none,north=side,south=side,west=side]'}
