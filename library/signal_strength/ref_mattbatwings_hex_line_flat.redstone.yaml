name: ref_mattbatwings_hex_line_flat
description: 'Source (SOURCED): mattbatwings'' ''How To Wire Like a Redstone Pro!'' world (Java 1.18.2), demo cluster W79 at world origin [84,56,-102]. Flat ''hex line'' (3x2x19 as rebuilt): strength in from a container, same strength out 15 blocks away. Barrel (z=18) -> compare comparator (x=0,z=17) -> dust column x=0 going north -> a row of 15 delay-1 repeaters at x=1 (facing west: input x=0, output x=2) -> dust column x=2 -> compare comparator (x=2,z=1) -> out dust (x=2,z=0). The core idea (INFERRED from the blocks, then MEASURED by the tests): dust loses 1 per block, so a strength-X signal on the near dust line (the comparator''s output) is still above 0 for exactly X blocks. A repeater beside each dust block reads that line and outputs a full 15 onto a second parallel dust line, so a repeater is lit iff the near line reaches it, and the lit repeaters are the X nearest the comparator. The second line decays 1 per block away from the first lit repeater, which put 15 at the X-th block, so after the 16 blocks of the line it is back at exactly X and a comparator reads it onto the far output: the strength X is re-created at the far end after travelling a 15-block line, with the repeaters all reading in parallel. Changed for the harness (INFERRED that the author''s lever/lamp demo is replaced by this): the container is a fixture named in, filled with data merge to every strength 0-15 (a redstone stack count chosen from floor(1+14*fullness)), and the end of the line is a named dust cell read with level; the lime/orange marker wool and magenta decoration wool are kept as plain support. MEASURED on a laptop satellite: out equals the barrel''s strength for every s 0..15, and (waves, strengths 1 and 15 alike) mid changes 2 ticks after the container is edited and out 4 ticks after mid, so the delay is 4 ticks independent of the strength: the repeaters read in parallel, not in series (the dust line is one 15-block dust run read by repeaters; the dust itself has no delay). W25 and W43 are the same line without a barrel (INFERRED from their block lists, not built).'
traits: [analog, silent, pistonless, entityless]
palette:
  .: air
  A: lime_wool
  B: magenta_wool
  C: orange_wool
  D: redstone_wire[east=none,north=side,south=side,west=none]
  E: comparator[facing=south,mode=compare]
  F: redstone_wire[east=side,north=none,south=side,west=none]
  G: repeater[delay=1,facing=west]
  H: redstone_wire[east=none,north=side,south=side,west=side]
  I: redstone_wire[east=side,north=side,south=side,west=none]
  J: redstone_wire[east=none,north=side,south=none,west=side]
  K: barrel[facing=up,open=false]
  q: {name: in, block: 'barrel[facing=up,open=false]', fixture: true}
  r: {name: out, block: 'redstone_wire[east=none,north=side,south=side,west=none]'}
  s: {name: mid, block: 'redstone_wire[east=side,north=side,south=side,west=none]'}
