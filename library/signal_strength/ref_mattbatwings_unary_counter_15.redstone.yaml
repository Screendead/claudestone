name: ref_mattbatwings_unary_counter_15
description: 'Source (SOURCED): mattbatwings'' Logical Redstone Archive HEX002 ''15-bit Unary Counter'' (endorsed by mattbatwings, Tested & Functional, Recommended; Discord https://discord.com/channels/1361854816837435433/1472410027275980976; README: counts how many bits are on, input 15b inverted, output hex number, speed 7 ticks). Rebuilt block for block from the .schem, barrel contents included (strength-1 barrels hold 1 redstone or 1 totem; the 2, 3, 4, 8, 11 and 15 barrels hold the redstone counts that give those strengths). 32x2x10 as rebuilt (fixtures excluded), 247 blocks. The output is the signal strength of the dust at the far end (a hex digit on a comparator or dust line), not a lamp. Harness changes: the 15 wall levers on the input lamps (the lamps are the comparators'' signal source: a lever hard-powers its lamp, which the first comparator reads at 15) are replaced by fixture repeaters facing south, each fed by a driver cell and sitting on a fixture wool block; a repeater hard-powers the lamp as the lever did, so b_i = 1 is the lever ON. Input is inverted as the README says: out = 15 - (number of inputs driven), i.e. the number of levers OFF. MEASURED: out is exactly 15 - popcount for every popcount 0..15 (low-first, high-first), for each input alone and each input alone off, for alternating patterns and 40 seeded random patterns, in 6 tests; the delay from the driver is 16 gt for each of the 15 inputs, both directions, so 14 gt = 7 redstone ticks past the fixture repeater, matching the README''s 7 ticks. INFERRED from a per-cell trace (levels of every dust and comparator at each popcount): two saturating subtract chains split the work, because one dust or comparator line only carries 0-15 and each stage removes 1. With k inputs driven (low inputs first), the left chain''s dust sits at 15 - min(k, 7) and the right chain''s at max(0, k - 7); which physical input feeds which chain was not mapped; a final subtract comparator (rear: left chain, side: right chain) gives 15 - k. The staggered lamp/barrel/comparator pairs make each stage a 2-wide column, which is why the line is 32 wide for 15 bits.'
traits:
- analog
- comparator_based
- container_based
- silent
- pistonless
- entityless
