name: analog_abs_diff
description: 'Analog absolute difference out = |a - b| for strengths 0-15 from two subtract comparators whose outputs merge into one dust: S (x=3, y=2, z=4) outputs a - b into stone Q (x=4, y=2, z=4) and T (x=5, y=1, z=3) outputs b - a into stone Q (x=5, y=1, z=4); the output dust O (x=5, y=2, z=4) lies on the second Q beside the first, so it takes their max, which is |a - b| since one of them is 0. Inputs are the stones A (x=2, y=2, z=3) and B (x=4, y=2, z=2), each strongly powered at its strength by a comparator (here fixtures fed by hoppers, west of A and north of B). Each input must reach one comparator rear and the other comparator''s side at full strength, and a side reads only dust or diodes, so the fan-out is lossless dust around the strongly powered stone: dust a (south of A) is S''s rear, dust e (west of B) feeds the buffer comparator c into S''s side, dust b (east of B) powers the stone under it that is T''s rear, and the cross dust d under A powers the stone that the buffer C reads, whose output enters T''s side. Timing: a change to the larger input reaches out 2 game ticks after its stone (rear path), a change to the smaller one 4 (buffer then side). When the inputs cross, out is wrong for 2 ticks: it dips to 0 when the larger input falls below the other, and holds the old difference when the smaller one rises above it. The buffers cost the second 2 ticks: an offline model search of tap-and-merge layouts found no 2-tick one. Core 4x3x3; the hoppers, their comparators and one support each are fixtures.'
traits: [analog, comparator_based, silent, lightless, pistonless, entityless, tick_accurate, survival_friendly]
palette:
  .: air
  '=': smooth_stone
  f: {block: smooth_stone, fixture: true}
  H: {block: 'hopper[facing=down]', fixture: true}
  G: {block: 'comparator[facing=west]', fixture: true}
  g: {block: 'comparator[facing=north]', fixture: true}
  X: stone
  Y: stone
  Q: stone
  d: 'redstone_wire[north=side,south=side,east=side,west=side]'
  e: 'redstone_wire[north=side,south=side]'
  a: {name: a, block: 'redstone_wire[east=side,west=side]'}
  b: {name: b, block: 'redstone_wire[north=side,south=side,east=side,west=side]'}
  C: comparator[facing=west,mode=compare]
  c: comparator[facing=north,mode=compare]
  T: comparator[facing=north,mode=subtract]
  S: comparator[facing=west,mode=subtract]
  O: {output: out, block: 'redstone_wire[north=side,south=side,east=side,west=side]'}
layers:
  0: |
    ......
    ......
    ......
    ..=.==
    ......
  1: |
    ......
    ....f.
    ...=.=
    .fd=CT
    ..==.Q
  2: |
    ....H.
    ....g.
    ...eYb
    HGXc..
    ..aSQO
