name: ref_mattbatwings_redcoder_vertical
description: "Source (SOURCED): mattbatwings' Logical Redstone Archive REDCODE003, 'Vertical Redcoder' (authors mattbatwings, Tested & Functional, Recommended; Discord https://discord.com/channels/1361854816837435433/1472406695920799920): hex number in, 16b one-hot out. 2x17x6 as rebuilt, outputs stacked up a 2-wide column, one per level. How it works (MEASURED in the traces, then INFERRED): a comparator (x=1,y=1,z=4) puts strength s on a zigzag dust staircase (z=3) that climbs one level per block, so it decays 1 per level: level y has strength s-(y-1) from below. Each level has a target block (z=2, alternating x) that the dust points into, a wall torch on its north face (z=1, the output, lit iff its target is unpowered, with a lamp in front) and a second wall torch beside it that sits directly under the next level's target. So the target at level y is powered by the dust (if s >= y) OR by the side torch of level y-1 being lit. Levels up to s are powered by the dust; level s+1 has no dust, so its output torch lights (this is the one-hot bit) and its side torch lights, which strongly powers level s+2's target, and that target powers the dust there at 15, which decays up the remaining levels and keeps all of them powered (15 at level s+2 still leaves >= 1 at level 16 for any s >= 0): every level above s+1 stays off. Output o<s> is the torch at level s+1, so s = 0 is the bottom torch and all 16 values have a bit. Changed for the harness (the schematic has no input): a hopper at z=5 under the comparator's back, set with data merge (fixture, outside the size). The post gives no speed. MEASURED: each strength 0..15 lights exactly its torch 40 ticks after the hopper changes; the lower of two outputs always changes 4 ticks after the hopper change and the higher one 6, whatever the strengths (0 to 15 included), so going up there are 2 ticks with no line lit and going down 2 ticks with two lit."
traits: [analog, silent, pistonless, entityless]
