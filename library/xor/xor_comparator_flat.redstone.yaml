- name: simultaneous and staggered
  steps:
  - drive: {a: 1, b: 1}
  - wait: 16
  - expect: {out: 0}
  - drive: {a: 0, b: 0}
  - wait: 16
  - expect: {out: 0}
  - drive: {a: 1}
  - wait: 1
  - drive: {b: 1}
  - wait: 16
  - expect: {out: 0}
  - drive: {b: 0}
  - wait: 1
  - drive: {a: 0}
  - wait: 16
  - expect: {out: 0}
  - drive: {a: 1, b: 0}
