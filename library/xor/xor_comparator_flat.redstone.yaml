name: xor_comparator_flat
description: "The crosswise subtract pair of xor_comparator_bridge, laid flat. a dust at (3,1,1) is the rear of C1 (3,1,2, facing north) and the east side of C2 (2,1,1, facing south). b dust at (2,1,2) is the rear of C2 and the west side of C1. C2 and C1 fire into blocks at opposite corners, (2,1,0) and (3,1,3), and a dust ring round the west side joins them. The ring encloses b's only free face, which is why b must be fed from above. As in xor_comparator_bridge, the output strength is |a-b|, so for digital use both inputs must be at equal strength when on. Interface: a is fed from directly above (a hard-powered block or redstone block at (3,2,1)), or by dust that steps down onto it from the east on y2. b is fed from directly above, at (2,2,2). The output is dust at (3,1,4); take it east or south. Size 4x2x5 (40 blocks), flat. Delay 2 game ticks on every edge. Lightless and silent. The ring is 9 dust long, so output strength through C2 drops to 7. Trade-offs: the only flat 2-tick XOR in the library, at the price of top-fed inputs. If both inputs must arrive on the build layer, use xor_comparator_bridge (4 tall) or xor_torch_flat (4 ticks)."
traits: [compact, ultrafast, flat, comparator_based, silent, lightless, pistonless, tick_accurate, reset_safe, survival_friendly, entityless]
palette:
  .: air
  '=': smooth_stone
  '-': redstone_wire
  '#': white_concrete
  S: comparator[facing=south,mode=subtract]
  N: comparator[facing=north,mode=subtract]
  a: {input: a}
  b: {input: b}
  o: {output: out, block: redstone_wire}
layers:
  0: |
    ====
    ====
    ====
    ====
    .===
  1: |
    --#.
    -.S-
    -.-N
    --.#
    .--o
  2: |
    ....
    ...a
    ..b.
    ....
    ....
tests:
- name: logic
  truth_table: |
    a b | out
    0 0 | 0
    0 1 | 1
    1 1 | 0
    1 0 | 1
  delay: 2
- name: edges
  steps:
  - expect: {out: 0}
  - drive: {a: 1}
  - wait: 1
  - expect: {out: 0}
  - wait: 1
  - expect: {out: 1}
  - wait: 10
  - expect: {out: 1}
  - drive: {b: 1}
  - wait: 1
  - expect: {out: 1}
  - wait: 1
  - expect: {out: 0}
  - wait: 10
  - expect: {out: 0}
  - drive: {a: 0}
  - wait: 1
  - expect: {out: 0}
  - wait: 1
  - expect: {out: 1}
  - wait: 10
  - expect: {out: 1}
  - drive: {b: 0}
  - wait: 1
  - expect: {out: 1}
  - wait: 1
  - expect: {out: 0}
  - wait: 10
  - expect: {out: 0}
  - drive: {b: 1}
  - wait: 1
  - expect: {out: 0}
  - wait: 1
  - expect: {out: 1}
  - wait: 10
  - expect: {out: 1}
  - drive: {a: 1}
  - wait: 1
  - expect: {out: 1}
  - wait: 1
  - expect: {out: 0}
  - wait: 10
  - expect: {out: 0}
  - drive: {b: 0}
  - wait: 1
  - expect: {out: 0}
  - wait: 1
  - expect: {out: 1}
  - wait: 10
  - expect: {out: 1}
  - drive: {a: 0}
