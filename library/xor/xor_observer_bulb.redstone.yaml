  - wait: 2
  - drive: {b: 1}
  - wait: 12
  - expect: {out: 0}
  - drive: {b: 0}
  - wait: 2
  - drive: {a: 0}
  - wait: 12
  - expect: {out: 0}
- name: hazard, edges 0 or 1 tick apart
