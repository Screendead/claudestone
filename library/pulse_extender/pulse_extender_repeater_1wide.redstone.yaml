name: pulse_extender_repeater_1wide
description: 'One-wide pulse stretcher from a repeater chain with overlapping taps. Input a (x=0, y=3) feeds three delay-4 repeaters facing west (x=1, 3, 5, y=3) with concrete blocks between them (x=2, 4, 6); each block, while the repeater before it powers it, powers the dust directly under it. The output line zigzags under the blocks and dips under the glass that the repeaters stand on (dust at y=2 under the blocks, y=1 under the glass), so dust never points into a block and cannot feed back into the chain. Out is the dust under the last block (x=6, y=2). Out rises 8 ticks after a and falls 24 ticks after a falls; any input shorter than 8 ticks (even 1 tick) gives exactly 24 ticks, with no gap, because the first repeater stretches it to 8 before the taps overlap. Add a repeater and block per 8 more ticks. 6x4x1. Trade-off versus delay_fall_only (in the delay folder, the flat 2-row version with an instant rise but a gap for inputs under 8 ticks): one wide and gapless, but rises 8 ticks late; versus the comparator rings: plain on/off parts, no decay, but longer.'
traits: [one_wide, silent, lightless, pistonless, entityless, tick_accurate, reset_safe, survival_friendly]
palette:
  .: air
  '=': smooth_stone
  '#': white_concrete
  g: glass
  a: {input: a}
  '-': redstone_wire
  r: repeater[facing=west,delay=4]
  o: {output: out, block: redstone_wire}
layers:
  0: |
    ...=.=.
  1: |
    ..=-=-=
  2: |
    .g-g-go
  3: |
    ar#r#r#
