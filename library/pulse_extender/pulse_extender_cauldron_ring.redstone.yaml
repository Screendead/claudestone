name: pulse_extender_cauldron_ring
description: 'Long (about 6 second) pulse extender: a lossless ring of four comparators and four concrete corner blocks, rows z=2..4, where each comparator strong-powers a corner block that the next one reads through its back, so the signal circulates every 8 ticks with no dust loss. One of them, out (x=1, z=2, facing west), is in subtract mode and gets 1 on its north side from a comparator (x=1, z=1, facing north) reading a water cauldron at level 1 (x=1, z=0), so the stored strength drops by 1 per lap: from 15 to 0 in about 14 laps. Input a (x=0, z=0) drives a delay-4 repeater (x=0, z=1, facing north) into the corner block at x=0, z=2, which fills the whole ring with an input of any width (the repeater stretches it to 8 ticks, one full lap). Out rises 10 ticks after a and falls 114 ticks after a falls (122 ticks after the rise for inputs under 8 ticks); a new input restarts the count. The cauldron sets the decrement: level 2 or 3 would give roughly a half or a third of the hold (not tested). Without the cauldron comparator the ring should hold its value indefinitely, as a memory (not tested). 3x2x5, flat, silent, lightless. Trade-off: holds almost 4 times longer than pulse_extender_comparator_ring for the same kind of parts, but rises 10 ticks late and is 5 deep.'
traits: [compact, flat, comparator_based, silent, lightless, pistonless, entityless, tick_accurate, reset_safe, survival_friendly]
palette:
  .: air
  '=': smooth_stone
  '#': white_concrete
  a: {input: a}
  r: 'repeater[facing=north,delay=4]'
  W: 'water_cauldron[level=1]'
  s: 'comparator[facing=north]'
  d: {output: out, block: 'comparator[facing=west,mode=subtract]'}
  w: 'comparator[facing=east]'
  n: 'comparator[facing=south]'
  e: 'comparator[facing=north]'
layers:
  0: |
    ...
    ==.
    .=.
    =.=
    .=.
  1: |
    aW.
    rs.
    #d#
    n.e
    #w#
