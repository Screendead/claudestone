name: pulse_extender_comparator_ring
description: 'Retriggerable pulse extender from a decaying comparator loop, no torches. Two comparators face each other in a 3x2 ring: out (x=1, z=1, facing west) feeds dust x=2 z=1 and z=2 into comparator back (x=1, z=2, facing east), which feeds dust x=0 z=2 and z=1 back into out. Each lap takes 4 ticks and loses 2 signal strength to the dust, so the loop runs down from 15 in about 7 laps. Input a (x=0, z=0) holds the dust at x=0, z=1 at 15. Out rises 2 ticks after a and falls 30 ticks after a falls; inputs of 2 ticks and longer are stretched, a new input restarts the 30 ticks, a 1 tick input is ignored. Longer dust paths should shorten the tail (not tested); out outputs east into x=2 z=1, so take the output from that dust. 3x2x2 with its base (plus the input cell). Trade-off: the smallest extender here and lightless; versus pulse_extender_cauldron_ring it holds 30 ticks instead of 114, versus pulse_extender_repeater_1wide it rises at once but is 2 wide.'
traits: [ultracompact, fast, flat, horizontal, comparator_based, silent, lightless, pistonless, entityless, tick_accurate, reset_safe, survival_friendly]
palette:
  .: air
  '=': smooth_stone
  a: {input: a}
  '-': redstone_wire
  K: {name: back, block: 'comparator[facing=east]'}
  o: {output: out, block: 'comparator[facing=west]'}
layers:
  0: |
    ...
    ===
    ===
  1: |
    a..
    -o-
    -K-
