name: ref_llucas_dorito_rsh8
description: |-
  Source (SOURCED): mattbatwings' Logical Redstone Archive OTHERARITH007 '8b Dorito Logical RSH' (author LLucas, endorsed by Mixel, Tested & Functional; Discord https://discord.com/channels/1361854816837435433/1528869041261903872), the _Fix litematic (MC 1.20.4, 6x24x18): an 8-bit logical right shift by a 3-bit amount, bits shifted out are dropped; README claims 2t value latency, 3t shift latency, 6 wide. Rebuilt block for block from the litematic's blocks (target blocks, purple wool/glass and all), without the gold corner markers and signs. v0 (y=8, LSB) to v7 (y=22) and shift bits s0 (y=2, weight 1), s1, s2 (y=6, weight 4) were levers on lamps; out = v >> shift, o0..o7 are the output lamps (x=0, one row in from the north edge) on the same layers as v0..v7. Harness changes: a lever hard-powers its lamp and the torch on that lamp turns off, but a driver redstone block beside the lamp powers it only weakly, so each lever is replaced by a fixture repeater facing south on a fixture stone, fed by the input cell one row north (adds one row to z and 2 gt to every input). 
  MEASURED: a walking one and 7 patterns at all 8 shifts, all 256 values at shift 5, shift-only and value-only changes all match v >> shift; worst case value change rise 6 / fall 10 gt, shift change rise 8 / fall 12 gt at the lamps. Less the fixture repeater (2 gt) and the lamp's 4 gt off delay that is 4 gt (2 redstone ticks) from value and 6 gt (3 redstone ticks) from shift, matching the README (INFERRED, lamp delay not isolated by a probe). Placement artefact (MEASURED, 4 of 15 runs): straight after the harness places it, some output lamps (o0..o5) can stay lit with every input off, until the first input change, so each test opens with a priming row whose outputs are x (INFERRED: a lit lamp whose off tick the placement passes lost; every later row passes). Size 6x24x17 excludes the fixture row (z=0).
  INFERRED from the layout: each value bit enters at x=2 on its own two-layer slice (y=8+2k), a lamp and wall torch invert it, the shift bits' dust columns at x=3 run through the stack, and the stairstep of repeaters, torches and dust moves a bit across slices by 1, 2 or 4 per shift stage, so latency does not depend on the amount shifted.
traits: [compact, vertical, torch_based, pistonless, entityless]
