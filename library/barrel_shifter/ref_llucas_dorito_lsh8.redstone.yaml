name: ref_llucas_dorito_lsh8
description: 'Source (SOURCED): mattbatwings'' Logical Redstone Archive OTHERARITH008 ''8b Dorito LSH'' (author LLucas, endorsed by Mixel, Tested & Functional; https://discord.com/channels/1361854816837435433/1528888032910905531): 8-bit left shift by 0-7 (out = in << s mod 256), README ''value 2t latency,
  shift 3t latency''. Rebuilt block for block from the .schem (6x24x17 with gold corner markers dropped, 817 blocks incl. 11 fixtures). Harness changes: the original''s levers are missing, so each of the 8 value lamps (x=2, layers 8..22) and 3 shift lamps (x=4, layers 1,3,5) is fed by a fixture repeater
  (on a fixture stone) driven from a redstone block two rows north of the lamp, which hard-powers the lamp like a lever on it; the extra two rows are inside the 17-row size. Output o_k is the lamp at x=0 behind target k. MEASURED: truth tables over 8 shifts of 0xff, 0x01, 0x80, 0xa5 plus extras and 24
  random pairs pass; counting the 2 gt fixture repeater, value change reaches the output in 6 gt rise (4 gt = 2 rt without it, matches README), shift change in 8 gt (6 gt = 3 rt, matches); each lamp fall adds 4 gt (10 and 12 gt). INFERRED: layers 8+2k hold bit k''s input lamp and output lamp; the shift
  lamps feed a decoder staircase along z that selects which target row k+s fires.'
traits:
- compact
- vertical
- torch_based
- pistonless
- entityless
