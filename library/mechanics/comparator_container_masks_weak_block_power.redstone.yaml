name: comparator_container_masks_weak_block_power
description: A comparator reading through a block with a chest behind it outputs the chest's level instead of the block's power when that power is under 15 (even if lower); at 15 the chest is ignored.
traits: [horizontal, analog, comparator_based, container_based]
palette:
  .: air
  '=': smooth_stone
  S: stone
  '-': redstone_wire
  '>': repeater[facing=west]
  C: comparator[facing=north]
  e: chest[facing=south]
  k: 'chest[facing=south]{Items:[{Slot:0b,id:"minecraft:stick",count:1}]}'
  a: {input: a}
  b: {input: b}
  c: {input: c}
  d: {input: d}
  f: {input: f}
  o: {name: out_empty, block: redstone_wire}
  p: {name: out_one, block: redstone_wire}
  q: {name: out_none, block: redstone_wire}
  r: {name: out_hard, block: redstone_wire}
  s: {name: out_dust15, block: redstone_wire}
