tests:
- name: chest reading replaces weak block power
  steps:
  - check: if block ~7 ~1 ~3 redstone_wire[power=0]
  - check: if block ~7 ~1 ~7 redstone_wire[power=1]
  - check: if block ~7 ~1 ~11 redstone_wire[power=0]
  - drive: {a: 1, b: 1, c: 1, d: 1, f: 1}
  - wait: 8
  - check: if block ~6 ~1 ~1 redstone_wire[power=10]
  - check: if block ~6 ~1 ~5 redstone_wire[power=10]
  - check: if block ~6 ~1 ~9 redstone_wire[power=10]
  - check: if block ~7 ~1 ~3 redstone_wire[power=0]
  - check: if block ~7 ~1 ~7 redstone_wire[power=1]
  - check: if block ~7 ~1 ~11 redstone_wire[power=10]
  - check: if block ~7 ~1 ~15 redstone_wire[power=15]
  - check: if block ~6 ~1 ~17 redstone_wire[power=15]
  - check: if block ~7 ~1 ~19 redstone_wire[power=15]
