name: dust_update_order_locational
description: 'Two pistons on an equal dust fork (redstone_experiments off) fire in an order set by position, not design: an identical copy 12 blocks away picks the other side; tie-break with repeaters.'
traits:
- piston_based
- flat
- entityless
palette:
  .: air
  '=': smooth_stone
  s: stone
  c: cobblestone
  '-': redstone_wire
  A: piston[facing=east]
  B: piston[facing=west]
  '2':
    input: d180
  C: piston[facing=south]
  '0':
    input: d0
  '1':
    input: d90
  '3':
    input: d270
  D: piston[facing=north]
  E: repeater[facing=west,delay=1]
  F: repeater[facing=east,delay=2]
  '6':
    input: rep180
  '4':
    input: far0
  '5':
    input: rep0
  G: repeater[facing=west,delay=2]
  H: repeater[facing=east,delay=1]
layers:
  '0': |
    =====================================
    =====================================
    =====================================
    =====================================
    =====================================
    =====================================
    =====================================
    =====================================
    =====================================
    =====================================
    =====================================
    =====================================
    =====================================
    =====================================
    =====================================
    =====================================
  '1': |
    --As.cB--...---...........2......---.
    -.......-...-.-.......---------..-.-.
    ---------...-.C.......-.......-..C.-.
    ....0.......-.s.......--Ac.sB--..c.-.
    ...........1-......................-3
    ............-.c..................s.-.
    ............-.D..................D.-.
    ............-.-..................-.-.
    ............---..................---.
    .....................................
    .....................................
    .....................................
    --As.cB--..-EAs.cBF-......6..........
    -.......-..-.......-..---------......
    ---------..---------..-.......-......
    ....4..........5......-GAc.sBH-......
tests:
- name: 'd0: right-hand piston (seen from the input) wins'
  steps:
  - drive:
      d0: 1
  - wait: 6
  - check: if block ~6 ~1 ~0 piston[extended=true]
  - check: if block ~2 ~1 ~0 piston[extended=false]
  - check: if block ~4 ~1 ~0 cobblestone
- name: 'd90: right-hand piston (seen from the input) wins'
  steps:
  - drive:
      d90: 1
  - wait: 6
  - check: if block ~14 ~1 ~6 piston[extended=true]
  - check: if block ~14 ~1 ~2 piston[extended=false]
  - check: if block ~14 ~1 ~4 cobblestone
- name: 'd180: right-hand piston (seen from the input) wins'
  steps:
  - drive:
      d180: 1
  - wait: 6
  - check: if block ~24 ~1 ~3 piston[extended=true]
  - check: if block ~28 ~1 ~3 piston[extended=false]
  - check: if block ~26 ~1 ~3 cobblestone
- name: 'd270: right-hand piston (seen from the input) wins'
  steps:
  - drive:
      d270: 1
  - wait: 6
  - check: if block ~33 ~1 ~2 piston[extended=true]
  - check: if block ~33 ~1 ~6 piston[extended=false]
  - check: if block ~33 ~1 ~4 cobblestone
- name: 'far0: identical copy 12 blocks south, left-hand piston wins'
  steps:
  - drive:
      far0: 1
  - wait: 6
  - check: if block ~2 ~1 ~12 piston[extended=true]
  - check: if block ~6 ~1 ~12 piston[extended=false]
  - check: if block ~4 ~1 ~12 stone
- name: 'rep0: 1-tick repeater side wins (control)'
  steps:
  - drive:
      rep0: 1
  - wait: 6
  - check: if block ~13 ~1 ~12 piston[extended=true]
  - check: if block ~17 ~1 ~12 piston[extended=false]
  - check: if block ~15 ~1 ~12 stone
- name: 'rep180: 1-tick repeater side wins (control)'
  steps:
  - drive:
      rep180: 1
  - wait: 6
  - check: if block ~28 ~1 ~15 piston[extended=true]
  - check: if block ~24 ~1 ~15 piston[extended=false]
  - check: if block ~26 ~1 ~15 stone
