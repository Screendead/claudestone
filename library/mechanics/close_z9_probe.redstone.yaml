name: close_z9_probe
description: 'Scratch probe for Z9''s re-arm in place after the close, D9''s source made of blocks (door2/close_layout/z9.py). Not a design yet: ARM_Z9''s mover is a stand-in, two commands after the input.
  Written and replayed in the simulator; not yet run on a server. The design_c door with Y12 made a sticky piston, every close step''s blocks, the two returns, Y12''s re-arm and Z11''s return (with its
  stand-in for H11''s pull: a redstone block set at (-3,6,0) before c56 and taken out before c61, setblock strict) are fixture; the design is 25 blocks, here in door coordinates (door + (6,3,8) = spec).
  After the close Z9 (4,2,1), an up relay, is out, held by ARM_Z9 (5,3,1) beside the cell above it (QC) and by RB9 at (4,4,1). ARM_Z9 is taken out by setblock before c13; RB9''s departure at c16 (A_9''s
  push) updates Z9 and it retracts. A_9 brings RB9 back over it at the end of c22, which powers Z9 without an update. D9, a piston at (4,5,1) facing down, is powered from c20 by its line: R9_1, a 1-tick
  repeater at (2,8,3) facing north, reads the S feed''s dust (2,8,2) (lit c10 to c42, from RB_ST at (2,8,0)); dust W9_1 to W9_3 along z 4 at y 8; R9_2 and R9_3, 1-tick repeaters facing west at (5,8,4) and
  (6,8,4), past the timer''s dust; dust W9_4 (7,8,4); R9_4, a 1-tick repeater facing south at (7,8,3); dust W9_5 (7,8,2), W9_6 (7,7,1) and W9_7 (6,6,1) stepping down, the first two on stone; R9_5, a 1-tick
  repeater at (5,6,1) facing east, pointing into (4,6,1), the cell above D9; ten glass blocks under the rest. RB9''s landing updates D9: it pushes RB9 down at c23, so RB9 is moving when P9''s base lands
  beside Z9 at the end of c24, and lands on Z9''s head cell at the end of c25. ARM_Z9 is set back by setblock before c27; its landing does not update Z9. R9_5 turns off at c52 and D9 retracts. Z9 is then
  in, powered and not updated, RB9 at (4,3,1), ARM_Z9 at (5,3,1), as the closed state has them; a glass block set under Z9 and taken out fires it. Controls: with R9_1 taken out with setblock air strict
  before the opening the line stays dark, D9 never moves and P9''s landing fires Z9 again at c25; with no command for ARM_Z9, Z9 stays out and D9''s pushes into RB9 over Z9''s head fail. Each test checks
  the frame 5 ticks into the opening and the open state, then Z9''s column, ARM_Z9, D9 and its line, A_9, P9 and RB9''s stroke, Z11''s and Y12''s corner and the dust levels against the simulator after the
  ticks that decide it, and after its last tick every cell the close and the returns move or must leave alone.'
