name: item_frame_rotation_through_block
description: A comparator reads an item frame hung on the far face of the solid block behind it as rotation+1 (1-8, 0 empty), max'd with a container in that cell; an 8-position dial, though an NBT-edited rotation needs a block update to show.
traits: [comparator_based, analog, uses_entities, lightless, silent, pistonless, flat, compact, survival_friendly]
palette:
  .: air
  '=': smooth_stone
  S: stone
  G: glass
  C: 'chest[facing=north]{Items:[{Slot:0b,id:"minecraft:stone",count:64},{Slot:1b,id:"minecraft:stone",count:64},{Slot:2b,id:"minecraft:stone",count:64},{Slot:3b,id:"minecraft:stone",count:64}]}'
  c: comparator[facing=north]
  a: {name: dial, block: redstone_wire}
  b: {name: side_face, block: redstone_wire}
  g: {name: on_glass, block: redstone_wire}
  h: {name: on_comparator, block: redstone_wire}
  e: {name: with_chest, block: redstone_wire}
layers:
  0: |
    =============
    =============
    =============
    =============
  1: |
    ............C
    S..S..G.....S
    c..c..c..c..c
    a..b..g..h..e
entities:
- {type: item_frame, pos: [0.0, 1.5, 0.0], nbt: '{Facing:2b,Item:{id:"minecraft:stick",count:1},ItemRotation:2b}'}
- {type: item_frame, pos: [4.5, 1.5, 1.5], nbt: '{Facing:5b,Item:{id:"minecraft:stick",count:1},ItemRotation:2b}'}
- {type: item_frame, pos: [6.0, 1.5, 0.0], nbt: '{Facing:2b,Item:{id:"minecraft:stick",count:1},ItemRotation:2b}'}
- {type: item_frame, pos: [9.0, 1.5, 1.0], nbt: '{Facing:2b,Item:{id:"minecraft:stick",count:1},ItemRotation:2b}'}
- {type: item_frame, pos: [12.0, 1.5, 0.0], nbt: '{Facing:2b,Item:{id:"minecraft:stick",count:1},ItemRotation:0b}'}
tests:
- name: rotation k reads k+1
  steps:
  - check: if block ~0 ~1 ~3 redstone_wire[power=3]
  - run: execute positioned ~0.5 ~1.5 ~0.5 as @e[type=item_frame,distance=..0.8] run data merge entity @s {ItemRotation:0b}
  - run: setblock ~1 ~1 ~2 stone
  - wait: 4
  - check: if block ~0 ~1 ~3 redstone_wire[power=1]
  - run: execute positioned ~0.5 ~1.5 ~0.5 as @e[type=item_frame,distance=..0.8] run data merge entity @s {ItemRotation:1b}
  - run: setblock ~1 ~1 ~2 air
  - wait: 4
  - check: if block ~0 ~1 ~3 redstone_wire[power=2]
  - run: execute positioned ~0.5 ~1.5 ~0.5 as @e[type=item_frame,distance=..0.8] run data merge entity @s {ItemRotation:2b}
  - run: setblock ~1 ~1 ~2 stone
  - wait: 4
  - check: if block ~0 ~1 ~3 redstone_wire[power=3]
  - run: execute positioned ~0.5 ~1.5 ~0.5 as @e[type=item_frame,distance=..0.8] run data merge entity @s {ItemRotation:3b}
  - run: setblock ~1 ~1 ~2 air
  - wait: 4
  - check: if block ~0 ~1 ~3 redstone_wire[power=4]
  - run: execute positioned ~0.5 ~1.5 ~0.5 as @e[type=item_frame,distance=..0.8] run data merge entity @s {ItemRotation:4b}
  - run: setblock ~1 ~1 ~2 stone
  - wait: 4
  - check: if block ~0 ~1 ~3 redstone_wire[power=5]
  - run: execute positioned ~0.5 ~1.5 ~0.5 as @e[type=item_frame,distance=..0.8] run data merge entity @s {ItemRotation:5b}
  - run: setblock ~1 ~1 ~2 air
  - wait: 4
  - check: if block ~0 ~1 ~3 redstone_wire[power=6]
  - run: execute positioned ~0.5 ~1.5 ~0.5 as @e[type=item_frame,distance=..0.8] run data merge entity @s {ItemRotation:6b}
  - run: setblock ~1 ~1 ~2 stone
  - wait: 4
  - check: if block ~0 ~1 ~3 redstone_wire[power=7]
  - run: execute positioned ~0.5 ~1.5 ~0.5 as @e[type=item_frame,distance=..0.8] run data merge entity @s {ItemRotation:7b}
  - run: setblock ~1 ~1 ~2 air
  - wait: 4
  - check: if block ~0 ~1 ~3 redstone_wire[power=8]
  - run: execute positioned ~0.5 ~1.5 ~0.5 as @e[type=item_frame,distance=..0.8] run data remove entity @s Item
  - run: setblock ~1 ~1 ~2 stone
  - wait: 4
  - check: if block ~0 ~1 ~3 redstone_wire[power=0]
  - check: positioned ~0.5 ~1.5 ~0.5 if entity @e[type=item_frame,distance=..0.8]
- name: nbt rotation stays stale until a block update
  steps:
  - check: if block ~0 ~1 ~3 redstone_wire[power=3]
  - run: execute positioned ~0.5 ~1.5 ~0.5 as @e[type=item_frame,distance=..0.8] run data merge entity @s {ItemRotation:6b}
  - wait: 20
  - check: positioned ~0.5 ~1.5 ~0.5 if entity @e[type=item_frame,distance=..0.8,nbt={ItemRotation:6b}]
  - check: if block ~0 ~1 ~3 redstone_wire[power=3]
  - run: setblock ~1 ~1 ~2 stone
  - wait: 4
  - check: if block ~0 ~1 ~3 redstone_wire[power=7]
- name: controls read nothing
  steps:
  - run: setblock ~4 ~1 ~2 stone
  - run: setblock ~7 ~1 ~2 stone
  - run: setblock ~10 ~1 ~2 stone
  - wait: 4
  - check: positioned ~4.5 ~1.5 ~1.5 if entity @e[type=item_frame,distance=..0.8,nbt={Facing:5b}]
  - check: positioned ~6.5 ~1.5 ~0.5 if entity @e[type=item_frame,distance=..0.8]
  - check: positioned ~9.5 ~1.5 ~1.5 if entity @e[type=item_frame,distance=..0.8]
  - check: if block ~3 ~1 ~3 redstone_wire[power=0]
  - check: if block ~6 ~1 ~3 redstone_wire[power=0]
  - check: if block ~9 ~1 ~3 redstone_wire[power=0]
- name: chest and frame in one cell give the max
  steps:
  - check: if block ~12 ~1 ~3 redstone_wire[power=3]
  - run: execute positioned ~12.5 ~1.5 ~0.5 as @e[type=item_frame,distance=..0.8] run data merge entity @s {ItemRotation:6b}
  - run: setblock ~13 ~1 ~2 stone
  - wait: 4
  - check: if block ~12 ~1 ~3 redstone_wire[power=7]
  - run: execute positioned ~12.5 ~1.5 ~0.5 as @e[type=item_frame,distance=..0.8] run data merge entity @s {ItemRotation:1b}
  - run: setblock ~13 ~1 ~2 air
  - wait: 4
  - check: if block ~12 ~1 ~3 redstone_wire[power=3]
