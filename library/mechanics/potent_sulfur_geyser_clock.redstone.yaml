name: potent_sulfur_geyser_clock
description: 'Potent sulfur over magma with 1-4 water sources above (air on top) alternates dormant and erupting on a 20-tick grid: 4 water gives 80-100 tick eruptions every 900-1200 ticks, 1 water 20-40 every 300-600, the same lengths each cycle for a given block, with a block_activate (10) vibration at the start and block_deactivate (9) at the end; lava below makes it erupt continuously and lift items, no magma leaves it wet; use: a redstone-free slow clock read by a sculk sensor, or an item elevator.'
traits: [pistonless]
palette:
  .: air
  '=': smooth_stone
  M: magma_block
  P: potent_sulfur[potent_sulfur_state=dormant]
  G: glass
  W: water
  X: sculk_sensor
layers:
  0: |
    =====
    =M===
    =====
  1: |
    .....
    .P..X
    .....
  2: |
    .G...
    GWG..
    .G...
  3: |
    .G...
    GWG..
    .G...
  4: |
    .G...
    GWG..
    .G...
  5: |
    .G...
    GWG..
    .G...
  6: |
    .....
    .....
    .....
tests:
- name: four water blocks erupt 80-100 ticks, then rest 900-1200, activate 10 and deactivate 9
  settle: 40
  steps:
  - run: scoreboard objectives add m7g dummy
  - check: if block ~1 ~1 ~1 potent_sulfur[potent_sulfur_state=dormant]
  - check: if data block ~4 ~1 ~1 {last_vibration_frequency:0}
  - run: data merge block ~1 ~1 ~1 {countdown:1}
  - wait: 20
  - check: if block ~1 ~1 ~1 potent_sulfur[potent_sulfur_state=erupting]
  - wait: 5
  - check: if data block ~4 ~1 ~1 {last_vibration_frequency:10}
  - wait: 55
  - check: if block ~1 ~1 ~1 potent_sulfur[potent_sulfur_state=erupting]
  - wait: 40
  - check: if block ~1 ~1 ~1 potent_sulfur[potent_sulfur_state=dormant]
  - wait: 5
  - check: if data block ~4 ~1 ~1 {last_vibration_frequency:9}
  - wait: 15
  - run: execute store result score m7a m7g run data get block ~1 ~1 ~1 countdown
  - check: if score m7a m7g matches 44..59
  - run: data merge block ~1 ~1 ~1 {countdown:1}
  - wait: 20
  - check: if block ~1 ~1 ~1 potent_sulfur[potent_sulfur_state=erupting]
  - wait: 100
  - check: if block ~1 ~1 ~1 potent_sulfur[potent_sulfur_state=dormant]
  - wait: 20
  - run: execute store result score m7b m7g run data get block ~1 ~1 ~1 countdown
  - check: if score m7a m7g = m7b m7g
- name: one water block erupts only 20-40 ticks and rests 300-600
  settle: 40
  steps:
  - run: scoreboard objectives add m7g dummy
  - run: fill ~1 ~3 ~1 ~1 ~5 ~1 air
  - wait: 5
  - check: if block ~1 ~1 ~1 potent_sulfur[potent_sulfur_state=dormant]
  - run: data merge block ~1 ~1 ~1 {countdown:1}
  - wait: 20
  - check: if block ~1 ~1 ~1 potent_sulfur[potent_sulfur_state=erupting]
  - wait: 40
  - check: if block ~1 ~1 ~1 potent_sulfur[potent_sulfur_state=dormant]
  - wait: 20
  - run: execute store result score m7a m7g run data get block ~1 ~1 ~1 countdown
  - check: if score m7a m7g matches 12..29
- name: control without magma it is only wet and never erupts
  settle: 40
  steps:
  - run: setblock ~1 ~0 ~1 stone
  - wait: 5
  - check: if block ~1 ~1 ~1 potent_sulfur[potent_sulfur_state=wet]
  - run: data merge block ~1 ~1 ~1 {countdown:1}
  - wait: 1300
  - check: if block ~1 ~1 ~1 potent_sulfur[potent_sulfur_state=wet]
  - check: if data block ~4 ~1 ~1 {last_vibration_frequency:0}
- name: lava below erupts continuously with an activate vibration and lifts an item
  settle: 40
  steps:
  - run: scoreboard objectives add m7g dummy
  - run: setblock ~1 ~0 ~1 lava
  - wait: 5
  - check: if block ~1 ~1 ~1 potent_sulfur[potent_sulfur_state=continuous]
  - check: if data block ~4 ~1 ~1 {last_vibration_frequency:10}
  - run: 'summon item ~1 ~6.1 ~1 {Item:{id:"minecraft:stone",count:1},PickupDelay:32767}'
  - wait: 20
  - run: execute store success score m7up m7g positioned ~0.5 ~9 ~0.5 if entity @e[type=item,dx=0,dy=30,dz=0]
  - run: execute positioned ~1 ~10 ~1 run kill @e[type=item,distance=..30]
  - run: setblock ~1 ~0 ~1 magma_block
  - check: if score m7up m7g matches 1
- name: control dormant geyser does not lift the item
  settle: 40
  steps:
  - run: scoreboard objectives add m7g dummy
  - run: 'summon item ~1 ~6.1 ~1 {Item:{id:"minecraft:stone",count:1},PickupDelay:32767}'
  - wait: 20
  - check: if block ~1 ~1 ~1 potent_sulfur[potent_sulfur_state=dormant]
  - run: execute store success score m7up m7g positioned ~0.5 ~9 ~0.5 if entity @e[type=item,dx=0,dy=30,dz=0]
  - run: execute positioned ~1 ~10 ~1 run kill @e[type=item,distance=..30]
  - check: if score m7up m7g matches 0
