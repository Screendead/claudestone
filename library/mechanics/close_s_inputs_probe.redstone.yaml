name: close_s_inputs_probe
description: 'Scratch probe for the S feed''s inputs, stage 5 of the 3x3 door''s close (door2/close_layout/s_inputs.py). The close runs from one falling input, no command after it. Written and replayed
  in the simulator; not yet run on a server. The design_c door, the close feeds, P_R, the S feed''s F_S and RB_F (G_S and its hold are taken out), the trigger chain, DP''s seven blocks and the two of P10
  and V are fixture; the design is 13 blocks, here in door coordinates (door + (4,3,8) = spec). The trigger chain''s redstone block RB_ST is pushed up to (2,8,0) at c0 and lands there at the end of c2.
  R_F, a 4-tick repeater at (2,8,1) facing north on glass, reads it and turns on at c10. Dust D_1 (2,8,2) on glass and D_2 (1,8,2) on a stone carry the signal to D_F (1,7,3), one step down on the stone
  (1,6,3) above F_S: 15, 14, 13. F_S (1,5,3) extends at c10 and stays out; RB_F lands at (1,5,1) at the end of c12 and lights DS, while S is moving in. S lands on the lit cell at the end of c13 and extends
  at c14, pushing C to (1,1). R_C, a 1-tick repeater at (0,8,2) facing east on glass, reads D_2 and powers the stone (-1,8,2) at c12; A_C, a sticky piston at (-1,8,3) facing east, pushes the stone C_F from
  (0,8,3) to (1,8,3), above D_F and beside D_2, where it lands at the end of c14 and cuts the step: D_F reads 0. At c15 F_S retracts and pulls RB_F, DS reads 0 and S is spat: S retracted at (1,3), C real
  at (1,1), (1,2) air. RB_F is home at (1,5,2) at the end of c17. R_F and R_C stay on and A_C out while RB_ST is at (2,8,0); RB_ST''s return is not designed. Each test checks the frame 5 ticks into the
  opening and the open state, then the cells the close moves or must leave alone and the levels of DT, DS, DP, the tap, D_V, NV at (-1,4,-4), (-1,3,-1), (5,5,0) and (4,5,0), D_1, D_2 and D_F against the
  simulator after c0, c3, c4, c8, c10, c11, c12, c13, c14, c15, c17 and c20 (after c10: R_F on, D_F 13, F_S out, its head and RB_F moving; after c12: RB_F at (1,5,1), DS 15, A_C out, its head and C_F moving;
  after c13: S at (1,3), W_T out; after c14: S out, C moving, C_F at (1,8,3), D_F 0; after c15: F_S, RB_F, S and W_T moving, DS 0; after c17: RB_F at (1,5,2), F_S in). Controls remove one block with setblock
  air strict before the opening: R_F (the feed stays dark, F_S never moves, S lands at (1,3) and stays in, C stays at (1,2)) or C_F (A_C pushes nothing, D_F stays 13, F_S and S stay out).'
