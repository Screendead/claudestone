name: piston_moved_source_zero_tick_depower
description: 'A piston that extends is depowered later in the same block-event phase when another piston moves its power source: a lit observer (its removal updates its output as off) or a redstone block; the victim then 0-tick pulls from 2 cells away. The second mover is a QC-armed BUD piston, woken by the first piston''s base update (observer case) or by the cell whose vacating unblocks it (redstone-block case).'
traits: [piston_based, observer_based, entityless, tick_accurate]
palette:
  .: air
  '=': smooth_stone
  a: {input: a}
  b: {input: b}
  O: 'observer[facing=west,powered=true]'
  F: stone
  Z: piston[facing=north]
  z: piston[facing=west]
  X: sticky_piston[facing=east]
  K: stone
  R: redstone_block
  o: obsidian
  A: sticky_piston[facing=north]
layers:
  0: |
    =======
    =======
    =======
    =======
    =======
    =======
    =======
    =======
    =======
    =======
    =======
    =======
    =======
  1: |
    .......
    .......
    .aOF...
    ..ZX.K.
    .......
