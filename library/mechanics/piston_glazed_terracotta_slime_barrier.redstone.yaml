name: piston_glazed_terracotta_slime_barrier
description: Glazed terracotta is push-only (never stuck to slime, never pulled by a sticky piston) and honey does not stick to slime, so both can sit against a slime structure with no gap; heavy core is NOT push-only in 26.3.
traits: [piston_based]
palette:
  .: air
  P: 'sticky_piston[facing=east]'
  S: slime_block
  G: 'white_glazed_terracotta[facing=north]'
  s: stone
  Y: honey_block
  c: heavy_core
layers:
  1: |
    .PS..
    ..G..
    .....
    .PS..
    ..s..
    .....
    .PS..
    ..Y..
    .....
    .PG..
    .....
    .Ps..
    .....
    .Pc..
    .....
    .PS..
    ..c..
tests:
- name: glazed terracotta beside slime stays put
  settle: 6
  steps:
  - run: setblock ~0 ~1 ~0 redstone_block
  - wait: 6
  - check: if block ~1 ~1 ~0 sticky_piston[extended=true]
  - check: if block ~3 ~1 ~0 slime_block
  - check: if block ~2 ~1 ~1 white_glazed_terracotta
  - check: if block ~3 ~1 ~1 air
- name: control, stone beside slime moves with it
  settle: 6
  steps:
  - run: setblock ~0 ~1 ~3 redstone_block
  - wait: 6
  - check: if block ~3 ~1 ~3 slime_block
  - check: if block ~3 ~1 ~4 stone
  - check: if block ~2 ~1 ~4 air
- name: honey beside slime stays put
  settle: 6
  steps:
  - run: setblock ~0 ~1 ~6 redstone_block
  - wait: 6
  - check: if block ~3 ~1 ~6 slime_block
  - check: if block ~2 ~1 ~7 honey_block
  - check: if block ~3 ~1 ~7 air
- name: sticky piston pushes glazed terracotta but does not pull it back
  settle: 6
  steps:
  - run: setblock ~0 ~1 ~9 redstone_block
  - wait: 6
  - check: if block ~3 ~1 ~9 white_glazed_terracotta
  - run: setblock ~0 ~1 ~9 air
  - wait: 6
  - check: if block ~1 ~1 ~9 sticky_piston[extended=false]
  - check: if block ~2 ~1 ~9 air
  - check: if block ~3 ~1 ~9 white_glazed_terracotta
- name: control, sticky piston pulls stone back
  settle: 6
  steps:
  - run: setblock ~0 ~1 ~11 redstone_block
  - wait: 6
  - check: if block ~3 ~1 ~11 stone
  - run: setblock ~0 ~1 ~11 air
  - wait: 6
  - check: if block ~2 ~1 ~11 stone
  - check: if block ~3 ~1 ~11 air
- name: heavy core is not push-only, a sticky piston pulls it back
  settle: 6
  steps:
  - run: setblock ~0 ~1 ~13 redstone_block
  - wait: 6
  - check: if block ~3 ~1 ~13 heavy_core
  - run: setblock ~0 ~1 ~13 air
  - wait: 6
  - check: if block ~1 ~1 ~13 sticky_piston[extended=false]
  - check: if block ~2 ~1 ~13 heavy_core
  - check: if block ~3 ~1 ~13 air
- name: heavy core beside slime is carried along with it
  settle: 6
  steps:
  - run: setblock ~0 ~1 ~15 redstone_block
  - wait: 6
  - check: if block ~3 ~1 ~15 slime_block
  - check: if block ~3 ~1 ~16 heavy_core
  - check: if block ~2 ~1 ~16 air
