name: tripwire_retrigger_and_chunk_order
description: 26.3 tripwire timing - a touch gives a 10 tick pulse re-checked every 10 ticks, and a string that just switched off ignores entities for that tick, so the shortest off gap is 1 tick.
traits: [flat, pistonless, lightless, survival_friendly, tick_accurate]
palette:
  .: air
  '=': smooth_stone
  S: stone
  E: tripwire_hook[facing=east]
  W: tripwire_hook[facing=west]
  T: tripwire[east=true,west=true]
  o: {output: out, block: redstone_wire}
layers:
  0: |
    =======
    =......
  1: |
    SETTTWS
    o......
tests:
- name: one tick on the string gives a 10 tick pulse
  steps:
  - run: summon item ~3.5 ~1.0 ~0.5 {Item:{id:"minecraft:stone",count:1},PickupDelay:32767,NoGravity:1b,Motion:[0.0d,0.0d,0.0d]}
  - check: if block ~1 ~1 ~0 tripwire_hook[attached=true,powered=false]
  - wait: 1
  - check: if block ~1 ~1 ~0 tripwire_hook[attached=true,powered=true]
  - check: if block ~0 ~1 ~1 redstone_wire[power=15]
  - run: kill @e[type=item]
  - wait: 1
  - check: if block ~1 ~1 ~0 tripwire_hook[attached=true,powered=true]
  - wait: 1
