name: sulfur_cube_tnt_priming
description: 'A sulfur cube holding TNT stops moving and primes with a 120 tick fuse (fire damage too; explosion damage 15-44) when the block containing its feet gets any redstone signal from a neighbour or is itself an outputting component (powered comparator, the stone plate it presses), so it cannot rest on a stone plate as a weight, but a cube holding stone can; with its block it shrugs off 100 damage, and tnt_explodes false stops it priming; use: a movable, blast-proof charge fired like TNT with a fixed 120 tick fuse.'
traits: [pistonless, flat]
palette:
  .: air
  '=': smooth_stone
  C: comparator[facing=west]
  k: cake
  p: stone_pressure_plate
  G: glass
  a: {input: a}
  b: {input: b}
layers:
  0: |
    =========
    =========
    =========
    =========
    =========
    =========
    =========
  1: |
    .........
    ...ab....
    .GGG.....
    .kCG.....
    .GGG.....
    .GpG.....
    .GGG.....
tests:
- name: a redstone block beside its feet block primes it with a 120 tick fuse
  settle: 20
  steps:
  - run: scoreboard objectives add m7s dummy
  - run: scoreboard players reset * m7s
  - run: 'summon sulfur_cube ~2 ~1.2 ~1 {equipment:{body:{id:"minecraft:tnt",count:1}},PersistenceRequired:1b,Size:0}'
  - wait: 10
  - run: execute positioned ~2 ~1 ~1 store result score f0 m7s run data get entity @e[type=sulfur_cube,distance=..1.5,limit=1] fuse
  - drive: {a: 1}
  - wait: 1
  - run: execute positioned ~2 ~1 ~1 store result score f1 m7s run data get entity @e[type=sulfur_cube,distance=..1.5,limit=1] fuse
  - wait: 10
  - run: execute positioned ~2 ~1 ~1 store result score f2 m7s run data get entity @e[type=sulfur_cube,distance=..1.5,limit=1] fuse
  - run: gamerule tnt_explodes false
  - run: execute positioned ~2 ~1 ~3 run kill @e[type=sulfur_cube,distance=..8]
  - run: gamerule tnt_explodes true
  - drive: {a: 0}
  - check: if score f0 m7s matches -1
  - check: if score f1 m7s matches 118..120
  - run: scoreboard players add f2 m7s 10
  - check: if score f2 m7s = f1 m7s
  finally:
  - gamerule tnt_explodes true
- name: control the same block one block further does nothing
  settle: 20
  steps:
  - run: scoreboard objectives add m7s dummy
  - run: scoreboard players reset * m7s
  - run: 'summon sulfur_cube ~2 ~1.2 ~1 {equipment:{body:{id:"minecraft:tnt",count:1}},PersistenceRequired:1b,Size:0}'
  - wait: 10
  - drive: {b: 1}
  - wait: 10
  - run: execute positioned ~2 ~1 ~1 store result score f1 m7s run data get entity @e[type=sulfur_cube,distance=..1.5,limit=1] fuse
  - run: 'execute positioned ~2 ~1 ~1 store success score w m7s if entity @e[type=sulfur_cube,distance=..1.5,nbt={equipment:{body:{id:"minecraft:tnt"}}}]'
  - run: gamerule tnt_explodes false
  - run: execute positioned ~2 ~1 ~3 run kill @e[type=sulfur_cube,distance=..8]
  - run: gamerule tnt_explodes true
  - drive: {b: 0}
  - check: if score w m7s matches 1
  - check: if score f1 m7s matches -1
  finally:
  - gamerule tnt_explodes true
- name: standing on a comparator that outputs primes it
  settle: 20
  steps:
  - run: scoreboard objectives add m7s dummy
  - run: scoreboard players reset * m7s
  - check: if block ~2 ~1 ~3 comparator[powered=true]
  - run: 'summon sulfur_cube ~2 ~1.2 ~3 {equipment:{body:{id:"minecraft:tnt",count:1}},PersistenceRequired:1b,Size:0}'
  - wait: 10
  - check: positioned ~2 ~1.125 ~3 if entity @e[type=sulfur_cube,distance=..0.3]
  - run: execute positioned ~2 ~1 ~3 store result score f1 m7s run data get entity @e[type=sulfur_cube,distance=..1.5,limit=1] fuse
  - run: gamerule tnt_explodes false
  - run: execute positioned ~2 ~1 ~3 run kill @e[type=sulfur_cube,distance=..8]
  - run: gamerule tnt_explodes true
  - check: if score f1 m7s matches 100..119
  finally:
  - gamerule tnt_explodes true
- name: control on the same comparator with no output it stays unprimed
  settle: 20
  steps:
  - run: scoreboard objectives add m7s dummy
  - run: scoreboard players reset * m7s
  - run: setblock ~1 ~1 ~3 air
  - wait: 4
  - check: if block ~2 ~1 ~3 comparator[powered=false]
  - run: 'summon sulfur_cube ~2 ~1.2 ~3 {equipment:{body:{id:"minecraft:tnt",count:1}},PersistenceRequired:1b,Size:0}'
  - wait: 10
  - run: execute positioned ~2 ~1 ~3 store result score f1 m7s run data get entity @e[type=sulfur_cube,distance=..1.5,limit=1] fuse
  - run: 'execute positioned ~2 ~1 ~3 store success score w m7s if entity @e[type=sulfur_cube,distance=..1.5,nbt={equipment:{body:{id:"minecraft:tnt"}}}]'
  - run: gamerule tnt_explodes false
  - run: execute positioned ~2 ~1 ~3 run kill @e[type=sulfur_cube,distance=..8]
  - run: gamerule tnt_explodes true
  - check: if score w m7s matches 1
  - check: if score f1 m7s matches -1
  finally:
  - gamerule tnt_explodes true
- name: a TNT cube primes itself on the stone pressure plate it presses
  settle: 20
  steps:
  - run: scoreboard objectives add m7s dummy
  - run: scoreboard players reset * m7s
  - run: 'summon sulfur_cube ~2 ~1.2 ~5 {equipment:{body:{id:"minecraft:tnt",count:1}},PersistenceRequired:1b,Size:0}'
  - wait: 10
  - run: execute positioned ~2 ~1 ~5 store result score f1 m7s run data get entity @e[type=sulfur_cube,distance=..1.5,limit=1] fuse
  - run: gamerule tnt_explodes false
  - run: execute positioned ~2 ~1 ~3 run kill @e[type=sulfur_cube,distance=..8]
  - run: gamerule tnt_explodes true
  - check: if score f1 m7s matches 100..119
  finally:
  - gamerule tnt_explodes true
- name: a cube holding stone holds a stone plate down and stays put
  settle: 20
  steps:
  - run: scoreboard objectives add m7s dummy
  - run: scoreboard players reset * m7s
  - run: 'summon sulfur_cube ~2 ~1.2 ~5 {equipment:{body:{id:"minecraft:stone",count:1}},PersistenceRequired:1b,Size:0}'
  - wait: 200
  - check: if block ~2 ~1 ~5 stone_pressure_plate[powered=true]
  - check: positioned ~2 ~1 ~5 if entity @e[type=sulfur_cube,distance=..0.5]
  - run: gamerule tnt_explodes false
  - run: execute positioned ~2 ~1 ~3 run kill @e[type=sulfur_cube,distance=..8]
  - run: gamerule tnt_explodes true
  finally:
  - gamerule tnt_explodes true
- name: with the block it ignores a 100 damage player attack, fire primes it at 120, a blast at 15-44
  settle: 20
  steps:
  - run: scoreboard objectives add m7s dummy
  - run: scoreboard players reset * m7s
  - run: 'summon sulfur_cube ~2 ~1.2 ~1 {equipment:{body:{id:"minecraft:tnt",count:1}},PersistenceRequired:1b,Size:0}'
  - wait: 10
  - run: execute positioned ~2 ~1 ~1 store result score h0 m7s run data get entity @e[type=sulfur_cube,distance=..1.5,limit=1] Health
  - run: execute positioned ~2 ~1 ~1 as @e[type=sulfur_cube,distance=..1.5,limit=1] store success score hit m7s run damage @s 100 minecraft:player_attack
  - check: if score hit m7s matches 1
  - wait: 1
  - run: execute positioned ~2 ~1 ~1 store result score h1 m7s run data get entity @e[type=sulfur_cube,distance=..1.5,limit=1] Health
  - run: execute positioned ~2 ~1 ~1 store result score f0 m7s run data get entity @e[type=sulfur_cube,distance=..1.5,limit=1] fuse
  - run: execute positioned ~2 ~1 ~1 as @e[type=sulfur_cube,distance=..1.5,limit=1] store success score burn m7s run damage @s 1 minecraft:in_fire
  - check: if score burn m7s matches 0
  - run: execute positioned ~2 ~1 ~1 store result score f1 m7s run data get entity @e[type=sulfur_cube,distance=..1.5,limit=1] fuse
  - run: gamerule tnt_explodes false
  - run: execute positioned ~2 ~1 ~3 run kill @e[type=sulfur_cube,distance=..8]
  - run: gamerule tnt_explodes true
  - run: 'summon sulfur_cube ~2 ~1.2 ~1 {equipment:{body:{id:"minecraft:tnt",count:1}},PersistenceRequired:1b,Size:0}'
  - wait: 10
  - run: execute positioned ~2 ~1 ~1 run damage @e[type=sulfur_cube,distance=..1.5,limit=1] 1 minecraft:explosion
  - run: execute positioned ~2 ~1 ~1 store result score f2 m7s run data get entity @e[type=sulfur_cube,distance=..1.5,limit=1] fuse
  - run: gamerule tnt_explodes false
  - run: execute positioned ~2 ~1 ~3 run kill @e[type=sulfur_cube,distance=..8]
  - run: gamerule tnt_explodes true
  - check: if score h1 m7s = h0 m7s
  - check: if score h0 m7s matches 1..
  - check: if score f0 m7s matches -1
  - check: if score f1 m7s matches 120
  - check: if score f2 m7s matches 15..44
  finally:
  - gamerule tnt_explodes true
- name: control without a block the same attack kills it
  settle: 20
  steps:
  - run: scoreboard objectives add m7s dummy
  - run: scoreboard players reset * m7s
  - run: 'summon sulfur_cube ~2 ~1.2 ~1 {PersistenceRequired:1b,Size:0,NoAI:1b}'
  - wait: 5
  - run: execute positioned ~2 ~1 ~1 run damage @e[type=sulfur_cube,distance=..1.5,limit=1] 100 minecraft:player_attack
  - wait: 1
  - run: execute positioned ~2 ~1 ~1 store result score n m7s if entity @e[type=sulfur_cube,distance=..1.5]
  - run: gamerule tnt_explodes false
  - run: execute positioned ~2 ~1 ~3 run kill @e[type=sulfur_cube,distance=..8]
  - run: gamerule tnt_explodes true
  - check: if score n m7s matches 0
  finally:
  - gamerule tnt_explodes true
- name: with tnt_explodes false redstone cannot prime it
  settle: 20
  steps:
  - run: scoreboard objectives add m7s dummy
  - run: scoreboard players reset * m7s
  - run: 'summon sulfur_cube ~2 ~1.2 ~1 {equipment:{body:{id:"minecraft:tnt",count:1}},PersistenceRequired:1b,Size:0}'
  - wait: 10
  - run: gamerule tnt_explodes false
  - drive: {a: 1}
  - wait: 10
  - run: execute positioned ~2 ~1 ~1 store result score f1 m7s run data get entity @e[type=sulfur_cube,distance=..1.5,limit=1] fuse
  - drive: {a: 0}
  - wait: 1
  - run: gamerule tnt_explodes false
  - run: execute positioned ~2 ~1 ~3 run kill @e[type=sulfur_cube,distance=..8]
  - run: gamerule tnt_explodes true
  - check: if score f1 m7s matches -1
  finally:
  - gamerule tnt_explodes true
- name: a large cube primes from a redstone block put under its feet
  settle: 20
  steps:
  - run: scoreboard objectives add m7s dummy
  - run: scoreboard players reset * m7s
  - run: 'summon sulfur_cube ~6 ~1.2 ~1 {equipment:{body:{id:"minecraft:tnt",count:1}},PersistenceRequired:1b,Size:3}'
  - wait: 10
  - run: execute positioned ~6 ~1 ~1 store result score f0 m7s run data get entity @e[type=sulfur_cube,distance=..1.5,limit=1] fuse
  - run: setblock ~6 ~0 ~1 redstone_block
  - wait: 1
  - run: execute positioned ~6 ~1 ~1 store result score f1 m7s run data get entity @e[type=sulfur_cube,distance=..1.5,limit=1] fuse
  - run: gamerule tnt_explodes false
  - run: execute positioned ~6 ~1 ~1 run kill @e[type=sulfur_cube,distance=..4]
  - run: gamerule tnt_explodes true
  - run: setblock ~6 ~0 ~1 smooth_stone
  - check: if score f0 m7s matches -1
  - check: if score f1 m7s matches 118..120
  finally:
  - gamerule tnt_explodes true
