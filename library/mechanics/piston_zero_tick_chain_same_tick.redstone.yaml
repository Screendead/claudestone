name: piston_zero_tick_chain_same_tick
description: 'In-tick 0-tick chain: Q extends and loses power in one block-event phase (Z pushes Q''s powered block away after Q''s event), so Q pulls K from 2 cells away in that tick; the vacated cell unblocks Y, which fires in the same tick.'
traits: [piston_based, flat, entityless, tick_accurate]
palette:
  .: air
  '=': smooth_stone
  a: {input: a}
  b: {input: b}
  r: {block: 'repeater[facing=north]', fixture: true}
  c: {block: 'comparator[facing=west]', fixture: true}
  Z: piston[facing=east]
  B: stone
  Q: sticky_piston[facing=east]
  K: stone
  O: obsidian
  Y: piston[facing=north]
  R: redstone_block
layers:
  0: |
    =======
    =======
    =======
    =======
    =======
    =======
  1: |
    ...a...
    ...r...
    bcZB.O.
    ...Q.K.
    .....Y.
    .....R.
tests:
- name: Q 0-ticks off Z and Y fires off Q's pull in the same tick
  steps:
  - check: if block ~5 ~1 ~3 stone
  - check: if block ~5 ~1 ~4 piston[extended=false]
  - drive: {a: 1, b: 1}
  - wait: 1
  - check: if block ~3 ~1 ~3 sticky_piston[extended=false]
  - check: if block ~3 ~1 ~2 stone
  - check: if block ~5 ~1 ~3 stone
  - wait: 1
  - check: if block ~3 ~1 ~1 repeater[powered=true]
  - check: if block ~2 ~1 ~2 piston[extended=true]
  - check: if block ~3 ~1 ~2 moving_piston
  - check: if block ~4 ~1 ~2 moving_piston
  - check: if block ~3 ~1 ~3 moving_piston
  - check: if block ~4 ~1 ~3 moving_piston
  - check: if block ~5 ~1 ~3 moving_piston
  - check: if block ~5 ~1 ~4 piston[extended=true]
  - wait: 2
  - check: if block ~3 ~1 ~3 sticky_piston[extended=false]
  - check: if block ~4 ~1 ~3 stone
  - check: if block ~5 ~1 ~3 piston_head[facing=north]
  - check: if block ~4 ~1 ~2 stone
  - wait: 4
  - check: if block ~3 ~1 ~3 sticky_piston[extended=false]
  - check: if block ~4 ~1 ~3 stone
- name: without Z Q extends and stays (control)
  steps:
  - drive: {a: 1}
  - wait: 1
  - check: if block ~3 ~1 ~3 sticky_piston[extended=false]
  - wait: 1
  - check: if block ~3 ~1 ~3 sticky_piston[extended=true]
  - check: if block ~4 ~1 ~3 moving_piston
  - check: if block ~5 ~1 ~3 stone
  - check: if block ~5 ~1 ~4 piston[extended=false]
  - wait: 2
  - check: if block ~4 ~1 ~3 piston_head[facing=east,type=sticky]
  - check: if block ~5 ~1 ~3 stone
  - check: if block ~5 ~1 ~4 piston[extended=false]
