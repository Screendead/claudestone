name: tnt_explodes_false_vanishes
description: 'Gamerule tnt_explodes false does not make powered TNT vanish: it stays a TNT block, unprimed, with no entity and no prime_fuse vibration (rule true: air plus a TNT entity at fuse 79 a tick later); a TNT minecart on a powered activator rail stays unlit (fuse -1), but a burning one still gets its 0-38 tick fuse and then vanishes harmlessly, as does TNT primed before the rule went false (80 ticks, no blast); use: test TNT firing circuits by priming with the rule on, then switching it off.'
traits: [pistonless, uses_entities, flat]
palette:
  .: air
  '=': smooth_stone
  T: tnt
  X: sculk_sensor
  R: rail[shape=east_west]
  a: {input: a}
layers:
  0: |
    =====
    =====
    =====
    =====
  1: |
    aT...
    ....X
    .....
    .R...
entities:
- {type: tnt_minecart, pos: [1.5, 1.0, 3.5]}
tests:
- name: rule false leaves powered TNT a block, unprimed and silent
  settle: 20
  steps:
  - run: data remove storage m7:tnt r
  - run: gamerule tnt_explodes false
  - drive: {a: 1}
  - wait: 5
  - drive: {a: 0}
  - wait: 1
  - run: gamerule tnt_explodes true
  - check: if block ~1 ~1 ~0 tnt[unstable=false]
  - check: positioned ~1 ~1 ~0 unless entity @e[type=tnt,distance=..8]
  - check: if data block ~4 ~1 ~1 {last_vibration_frequency:0}
- name: control rule true primes it, fuse 79 one tick later, and a prime_fuse vibration
  settle: 20
  steps:
  - run: data remove storage m7:tnt r
  - drive: {a: 1}
  - wait: 1
  - run: execute positioned ~1 ~1 ~0 store result storage m7:tnt r.fuse int 1 run data get entity @e[type=tnt,distance=..2,limit=1] fuse
  - run: execute store success storage m7:tnt r.block byte 1 if block ~1 ~1 ~0 air
  - wait: 3
  - run: execute store result storage m7:tnt r.freq int 1 run data get block ~4 ~1 ~1 last_vibration_frequency
  - run: execute positioned ~1 ~1 ~0 run kill @e[type=tnt,distance=..8]
  - drive: {a: 0}
  - check: if data storage m7:tnt {r:{block:1b,fuse:79,freq:10}}
- name: primed TNT burns out without exploding once the rule is false
  settle: 20
  steps:
  - run: data remove storage m7:tnt r
  - drive: {a: 1}
  - wait: 1
  - drive: {a: 0}
  - run: gamerule tnt_explodes false
  - wait: 78
  - run: execute store success storage m7:tnt r.alive byte 1 positioned ~1 ~1 ~0 if entity @e[type=tnt,distance=..2]
  - wait: 1
  - run: execute store success storage m7:tnt r.gone byte 1 positioned ~1 ~1 ~0 unless entity @e[type=tnt,distance=..8]
  - wait: 5
  - run: gamerule tnt_explodes true
  - run: execute positioned ~1 ~1 ~0 run kill @e[type=tnt,distance=..8]
  - check: if data storage m7:tnt {r:{alive:1b,gone:1b}}
  - check: if block ~1 ~0 ~0 smooth_stone
  - check: if block ~0 ~0 ~0 smooth_stone
  - check: if data block ~4 ~1 ~1 {last_vibration_frequency:10}
- name: rule false still lights a burning TNT minecart, which then vanishes without exploding
  settle: 20
  steps:
  - run: scoreboard objectives add m7 dummy
  - run: gamerule tnt_explodes false
  - run: execute positioned ~0 ~1 ~3 run damage @e[limit=1,type=tnt_minecart,dx=2,dy=1,dz=0] 100 minecraft:in_fire
  - wait: 1
  - run: execute positioned ~0 ~1 ~3 store result score m7c1 m7 run data get entity @e[limit=1,type=tnt_minecart,dx=2,dy=1,dz=0] fuse
  - wait: 45
  - run: execute positioned ~0 ~1 ~3 store result score m7c2 m7 if entity @e[type=tnt_minecart,dx=2,dy=1,dz=0]
  - run: gamerule tnt_explodes false
  - run: execute positioned ~0 ~1 ~3 run kill @e[type=tnt_minecart,dx=2,dy=1,dz=0]
  - run: gamerule tnt_explodes true
  - check: if score m7c1 m7 matches 0..38
  - check: if score m7c2 m7 matches 0
  - check: if block ~1 ~1 ~3 rail
  - check: if block ~1 ~0 ~3 smooth_stone
- name: control rule true a burning TNT minecart gets a 0-38 tick fuse
  settle: 20
  steps:
  - run: scoreboard objectives add m7 dummy
  - run: execute positioned ~0 ~1 ~3 run damage @e[limit=1,type=tnt_minecart,dx=2,dy=1,dz=0] 100 minecraft:in_fire
  - run: execute positioned ~0 ~1 ~3 store result score m7c1 m7 run data get entity @e[limit=1,type=tnt_minecart,dx=2,dy=1,dz=0] fuse
  - run: execute positioned ~0 ~1 ~3 store result score m7c2 m7 if entity @e[type=tnt_minecart,dx=2,dy=1,dz=0]
  - run: gamerule tnt_explodes false
  - run: execute positioned ~0 ~1 ~3 run kill @e[type=tnt_minecart,dx=2,dy=1,dz=0]
  - run: gamerule tnt_explodes true
  - check: if score m7c1 m7 matches 0..38
- name: rule false leaves a TNT minecart on a powered activator rail unlit
  settle: 20
  steps:
  - run: scoreboard objectives add m7 dummy
  - run: setblock ~1 ~1 ~2 activator_rail[shape=east_west]
  - run: setblock ~0 ~1 ~2 redstone_block
  - wait: 2
  - check: if block ~1 ~1 ~2 activator_rail[powered=true]
  - run: gamerule tnt_explodes false
  - run: summon tnt_minecart ~1 ~1 ~2
  - wait: 2
  - run: execute positioned ~1 ~1 ~2 store result score m7r m7 run data get entity @e[type=tnt_minecart,distance=..0.5,limit=1] fuse
  - run: gamerule tnt_explodes false
  - run: execute positioned ~1 ~1 ~2 run kill @e[type=tnt_minecart,distance=..2]
  - run: execute positioned ~1 ~1 ~2 run kill @e[type=item,distance=..3]
  - run: gamerule tnt_explodes true
  - run: setblock ~0 ~1 ~2 air
  - check: if score m7r m7 matches -1
- name: control rule true the powered activator rail lights it, fuse 78 two ticks after it appears
  settle: 20
  steps:
  - run: scoreboard objectives add m7 dummy
  - run: setblock ~1 ~1 ~2 activator_rail[shape=east_west]
  - run: setblock ~0 ~1 ~2 redstone_block
  - wait: 2
  - check: if block ~1 ~1 ~2 activator_rail[powered=true]
  - run: summon tnt_minecart ~1 ~1 ~2
  - wait: 2
  - run: execute positioned ~1 ~1 ~2 store result score m7r m7 run data get entity @e[type=tnt_minecart,distance=..0.5,limit=1] fuse
  - run: gamerule tnt_explodes false
  - run: execute positioned ~1 ~1 ~2 run kill @e[type=tnt_minecart,distance=..2]
  - run: execute positioned ~1 ~1 ~2 run kill @e[type=item,distance=..3]
  - run: gamerule tnt_explodes true
  - run: setblock ~0 ~1 ~2 air
  - check: if score m7r m7 matches 78
