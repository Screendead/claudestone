name: light_checks_torch_not_dust
description: 'Counts the light checks the server queues, with perf, while each of three lever-driven lines switches on and off. A redstone torch turned off and on queues at least one; a 15-long dust line and a 4-repeater line queue none, though every dust cell changes power and every repeater turns on. Levers are clicked, so the harness adds no block changes of its own. This is the check behind the lightless trait: dust, repeaters and comparators carry a signal without light updates; torches, lamps and the rest of redstone/traits.LIGHT do not.'
traits: [pistonless, entityless]
palette:
  .: air
  S: stone
  L: {name: torch_lever, block: 'lever[face=floor,facing=east]'}
  T: {name: torch, block: 'redstone_wall_torch[facing=east]'}
  l: {name: dust_lever, block: 'lever[face=floor,facing=east]'}
  D: {name: d1, block: 'redstone_wire[east=side,west=side]'}
  d: redstone_wire[east=side,west=side]
  E: {name: d15, block: 'redstone_wire[east=side,west=side]'}
  m: {name: rep_lever, block: 'lever[face=floor,facing=east]'}
  r: repeater[facing=west]
  R: {name: r4, block: 'repeater[facing=west]'}
layers:
  0: |
    SS..............
    ................
    SSSSSSSSSSSSSSSS
    ................
    SSSSS...........
  1: |
    ST..............
    ................
    lDdddddddddddddE
    ................
    mrrrR...........
  2: |
    L...............
    ................
    ................
    ................
    ................
tests:
- name: a torch turned off and on queues light checks
  steps:
  - expect: {torch: 1}
  - light_checks:
      min: 1
      steps:
      - use: torch_lever
      - wait: 4
      - expect: {torch: 0}
      - use: torch_lever
      - wait: 4
      - expect: {torch: 1}
- name: a dust line switched on and off queues none
  steps:
  - light_checks:
      max: 0
      steps:
      - use: dust_lever
      - wait: 2
      - level: {d1: 15, d15: 1}
      - use: dust_lever
      - wait: 2
      - level: {d1: 0, d15: 0}
- name: a repeater line switched on and off queues none
  steps:
  - light_checks:
      max: 0
      steps:
      - use: rep_lever
      - wait: 10
      - expect: {r4: 1}
      - use: rep_lever
      - wait: 10
      - expect: {r4: 0}
