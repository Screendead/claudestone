name: close_trigger_probe
description: 'Scratch probe for the close''s trigger chain (door2/close_layout/trigger.py). The design_c door with I_A sticky, the close feeds, P_R and the S feed are fixture; the design is 36 blocks, here
  in door coordinates (door + (4,3,8) = spec). A dust bus fed by K_in (1,8,-2) is lit while the input is on. East branch (2,8,-2), (3,8,-2), (3,8,-1) on stone (3,7,-1) above P_R: P_R''s hold. (4,8,-2) on
  stone (4,7,-2) feeds a 4-tick repeater (4,7,-1) into piston AP (4,7,0) facing west, which pushes redstone block RB_ST from (3,7,0) to (2,7,0) beside T''s feed dust DT (1,7,0); it lands at t10 j, after
  T''s last update of the opening, so T waits powered and not updated. West branch from K_in''s top, (1,9,-2), (0,10,-2), (0,9,-1), (-1,9,-1), (-2,8,-1), (-3,7,-1), (-4,6,-1), (-4,5,0), (-4,5,1) on stone
  (-4,4,1) above sticky piston M_K (-4,3,1) facing down, which holds glass WK (-4,1,1) beside K (-4,1,2), a piston facing up under RB12, QC-powered by NP12''s first dust and armed from the load behind design_c''s
  blocker at (-4,3,2). A stone cut (-3,5,0) over DP. W_T (1,5,0), a piston facing north above T, is powered by T''s feed stone and blocked by Z_T''s head. K_T (2,5,0), a sticky piston facing up, glass (2,6,0)
  and RB_ST above it: K_T is QC-powered by RB_ST. The input falls; two ticks later (c0) the repeater R_in turns off and in that tick''s block-event phase: I_A pulls RB_A home, P_R pulls RB_T, M_K pulls
  WK; Z_T retracts and K pushes RB12 and gate stone G up (NP12 dies; P12 stays out, QC-powered by the feed stone); T extends, W_T extends and updates K_T; K_T pushes the glass and RB_ST up, DT dies and
  K_T, unpowered inside its own extension, is released at once: the glass is real at (2,7,0), RB_ST moves on to (2,8,0); W_T retracts and updates T and P12; P12 retracts and pulls the spare, T is spat.
  After c0 C is real at (1,2), T and P12 are moving pistons, (1,3) and (0,3) are air and DT reads 0. Stage 2 and on are commands between ticks: c1 a redstone block at (-3,4,1) (P11 and P6 extend), c2 removed
  (spat, S real at (0,3)); c3 a redstone block at (-1,5,1) (P10); c4 removed, blocks at (-1,3,1) (V) and (1,6,3) (F_S); c5 both removed (RB_F spat to (1,5,1), V spat, S fires at (1,3)); c6 G_S''s hold (3,6,1)
  removed (S spat, C real at (1,1)). NA relights when RB_A lands (c2 j): P7 is out from c3, P1 to P6 from c4. Each test checks the frame 5 ticks into the opening and the open state, then the cells the chain
  moves or must leave alone and the levels of DT and DS against the simulator. Controls remove one block with setblock air strict before the opening: the glass under RB_ST (the feed stays lit, T and P12
  stay out), W_T (T and P12 get no update), WK (K is not woken, P12 stays out and P11 shoves the top row).'
