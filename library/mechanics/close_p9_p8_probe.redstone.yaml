name: close_p9_p8_probe
description: 'Scratch probe for the last stages of the 3x3 door''s close, P9''s 0-tick and P8 (door2/close_layout/p9_p8.py). The close runs from one falling input to the closed door''s plane, no command
  after it. Written and replayed in the simulator; not yet run on a server. The design_c door, the close feeds, P_R, the S feed and its inputs, the trigger chain, DP''s seven blocks and the two of P10 and
  V are fixture; the design is nine blocks and a stone in place of one of the door''s glass blocks, here in door coordinates (door + (4,3,8) = spec). P7 has no block: it fires at c3 on NA and TR lands at
  (2,2) at the end of c5. So P9 fires after stage 5 and pushes two blocks, TM from (3,2) to (2,2) and TR on to (1,2), then P8 pushes Q down to (3,2); Q never fires. R_X, a 2-tick repeater at (2,5,1) facing
  west on glass (2,4,1), reads (1,5,1), where the S feed''s redstone block RB_F stands from the end of c12 to c15: on at c16, off at c20. A_9, a sticky piston at (3,4,1) facing east under the cell R_X points
  into, pushes RB9, the door''s own redstone block at (4,4,1) in the open state, to (5,4,1), beside the dust LY at (5,4,2) and (6,4,1): it lands at the end of c18. The stone at (6,3,1) under LY''s dust
  (6,4,1) passes the level down to LY''s dust (6,3,0): 15 and 14. R_9, a 1-tick repeater at (5,3,0) facing east on glass (5,2,0), reads that dust and points into the cell above P9: on at c20, when A_9 pulls
  RB9 back, off at c22. P9 extends at c20 and is spat at c22: TM real at (2,2), TR at (1,2) at the end of c22. R_8, a 1-tick repeater at (3,5,-1) facing north on the door''s stone (3,4,-1), reads D_8, a
  dust at (3,5,-2) on glass (3,4,-2) that reads NA''s dust (2,4,-2) up the step, and points into the cell above P8: on in the closed state, off in the opening, on from c4. The obsidian at (3,-1,0) under
  the static block (3,0,0) keeps P8 from pushing Q, TM and R down until P9 has taken TM away. A_9 lands at (3,4,1), south of P8, at the end of c22 and that update fires P8 at c23: Q is at (3,2) at the end
  of c25 and the door plane is the closed door''s (TM and TR in each other''s cells). The returns of the opening''s relays and of the trigger chain''s blocks are not designed. Each test checks the frame
  5 ticks into the opening and the open state, then the cells the close moves or must leave alone and the levels of DT, DS, DP, the tap, D_V, NV''s four dusts, D_1, D_2, D_F, LY at (6,4,1) and (6,3,0) and
  D_8 against the simulator after c0, c4, c10, c12, c14, c15, c16, c18, c20, c22, c23, c25 and c30 (after c16: R_X on, A_9 out, its head and RB9 moving; after c18: RB9 at (5,4,1), LY 15 and 14, R_9 off;
  after c20: R_X off, R_9 on, A_9 and RB9 moving back, P9 out, its head, TM and TR moving, LY 0; after c22: R_9 off, P9 moving in, TM at (2,2), TR at (1,2), (3,2) air, A_9 at (3,4,1), RB9 at (4,4,1); after
  c23: P8 out, its head and Q moving; after c25: Q at (3,2), P9 in). Controls remove one block with setblock air strict before the opening: R_9 (A_9 still moves RB9 out and back and LY is lit after c18,
  but P9 never moves, TM stays at (3,2) and P8 stays in) or R_8 (P9''s 0-tick runs, P8 has no power when A_9 lands and stays in, Q stays at (3,3)).'
traits:
- piston_based
