  - &id004
    run: setblock ~8 ~7 ~9 air strict
  - &id005
    run: setblock ~2 ~8 ~9 air strict
  - &id006
    run: setblock ~0 ~6 ~10 air strict
  - &id007
    run: setblock ~5 ~11 ~4 redstone_block strict
  - &id008
