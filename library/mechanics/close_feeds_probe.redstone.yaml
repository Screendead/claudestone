name: close_feeds_probe
description: 'Scratch probe for the door close (door2/close_layout/feeds.py). The whole design_c door is fixture; the design is 9 blocks: T''s feed (stone (1,6,0), a QC cell of T and P12; dust DT (1,7,0)
  on it; stone cut (0,7,0) keeping DT off G12 (0,6,0)) and the P6+P11 feed (stone (-3,3,0): P11 direct, P6 by QC through P11''s cell; dust DP (-3,4,0); stone cut (-3,4,-1) keeping DP off NA (-3,3,-1)).
  After the opening, the close''s c0 events are emulated by commands between ticks: RB_A (1,5,-2) removed (E0), RB12 removed (NP12 kill), redstone blocks at (1,7,1) and (-4,4,0) light DT and DP, RB_T (1,6,-1)
  removed (Z_T''s wake), or instead the hold (4,6,-1) of sticky puller P_R (3,6,-1, facing west, head (2,6,-1)) removed, so P_R pulls RB_T to (2,6,-1) and Z_T retracts. Door coords + (4,3,8) = spec coords.'
traits:
- piston_based
