name: close_returns_probe
description: 'Scratch probe for the returns of the 3x3 door''s close (door2/close_layout/returns.py): Z9, one of design_c''s four relays that face up, re-armed in place, and RB_T pushed home down a column.
  The drives are stood in for by commands after the input, so this measures the mechanisms and is not a design. Written and replayed in the simulator; not yet run on a server with these blocks. The design_c
  door and every close step''s blocks (the close feeds, P_R, the S feed and its inputs, the trigger chain, DP''s seven, P10 and V''s two, p9_p8''s nine and stone) are fixture; the blocks added are D9, a
  piston at (4,5,1) facing down, H_T, a piston at (1,9,-1) facing down, glass GA (1,7,-1) and GB (1,6,-1) under it, and N_T, a sticky piston at (2,6,-3) facing south, here in door coordinates (door + (4,3,8)
  = spec). Z9: after the close Z9 is out, held by its arm ARM_Z9 at (5,3,1) and by RB9 at (4,4,1), above its head, both by QC. ARM_Z9 is taken out by command before c13: when A_9 pushes RB9 east at c16,
  Z9 is updated with no power and retracts. A_9 pulls RB9 back over it, RB9 lands at (4,4,1) at the end of c22 and powers Z9 without updating it. A redstone block set above D9 by command before c21 (D9''s
  stand-in source) has D9 updated by RB9''s landing: it pushes RB9 down at c23, so RB9 is moving when P9''s base lands beside Z9 at the end of c24, and RB9 lands on Z9 at the end of c25. ARM_Z9 is set back
  by command before c27 (its landing does not update Z9) and the source taken out before c29 (D9 retracts). Z9 is then in, powered and not updated, RB9 at (4,3,1) and ARM_Z9 at (5,3,1), as the closed state
  has them; a glass block set under Z9 and taken out fires it. The second test sets ARM_Z9 back before c23: Z9 is powered when P9''s base lands and when RB9 lands, and its push fails, first on RB9 moving,
  then on D9''s head in (4,4,1), the cell where the load puts an obsidian blocker. The third has no source for D9: RB9 stays over Z9 and P9''s landing fires Z9 again at c25. RB_T: Z_T lifts RB_T, GB and
  GA together at t3, so after the close GB is at (1,7,-1), GA at (1,8,-1) and RB_T at (2,6,-1), where P_R''s pull left it and where it holds K_T out by QC. A redstone block beside N_T (its stand-in source,
  (3,6,-3)) before c32 and out before c34: N_T goes out and in and pulls RB_T north to (2,6,-2); K_T, a sticky piston since rbt_drives.py, retracts and pulls SPC home to (2,6,0). RB_ST is taken out of (2,8,0)
  and set at (3,7,0), its closed cell, before c37: it powers P_R by QC without updating it. The source again before c38: N_T pushes RB_T back, its landing at the end of c40 updates P_R, and P_R pushes it
  to (1,6,-1) at c41; the source out before c43. A redstone block above H_T ((1,10,-1)) before c45: H_T pushes GA, GB and RB_T down one cell and RB_T lands at (1,5,-1) at the end of c47; the block out before
  c48, H_T retracts. RB_T, GA, GB, P_R, K_T, SPC, Z_T, W_T and the S feed''s cut are then as the closed state has them. The fifth test leaves the kick out (RB_ST home before c31, a glass block set and cleared
  beside P_R before c32): K_T''s base lands in the same tick as RB_T, behind it, and wakes W_T, which RB_T at (1,6,-1) powers by QC; W_T''s head takes (1,5,-1) and H_T''s push at c40 stops on it. The sixth
  has no source for H_T: RB_T stays at (1,6,-1). Each test checks the frame 5 ticks into the opening and the open state, then the cells the close moves or must leave alone, the what-ifs'' cells and the
  levels of DT, DS, DP, the tap, D_V, NV''s four dusts, D_1, D_2, D_F, LY and D_8 against the simulator after the ticks that decide it, and in the Z9 tests Z9, RB9''s two cells and D9 four ticks after the
  update.'
