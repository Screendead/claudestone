name: close_returns_probe
description: 'Scratch probe for the returns of the 3x3 door''s close (door2/close_layout/returns.py): Z9, one of design_c''s four relays that face up, re-armed in place. Its two drives are stood in for
  by commands after the input, so this measures the mechanism and is not a design. Written and replayed in the simulator; not yet run on a server. The design_c door and every close step''s blocks (the close
  feeds, P_R, the S feed and its inputs, the trigger chain, DP''s seven, P10 and V''s two, p9_p8''s nine and stone) are fixture; the only block added is D9, a piston at (4,5,1) facing down, here in door
  coordinates (door + (4,3,8) = spec). After the close Z9 is out, held by its arm ARM_Z9 at (5,3,1) and by RB9 at (4,4,1), above its head, both by QC. ARM_Z9 is taken out by command before c13: when A_9
  pushes RB9 east at c16, Z9 is updated with no power and retracts. A_9 pulls RB9 back over it, RB9 lands at (4,4,1) at the end of c22 and powers Z9 without updating it. A redstone block set above D9 by
  command before c21 (D9''s stand-in source) has D9 updated by RB9''s landing: it pushes RB9 down at c23, so RB9 is moving when P9''s base lands beside Z9 at the end of c24, and RB9 lands on Z9 at the end
  of c25. ARM_Z9 is set back by command before c27 (its landing does not update Z9) and the source taken out before c29 (D9 retracts). Z9 is then in, powered and not updated, RB9 at (4,3,1) and ARM_Z9 at
  (5,3,1), as the closed state has them; a glass block set under Z9 and taken out fires it. The second test sets ARM_Z9 back before c23: Z9 is powered when P9''s base lands and when RB9 lands, and its push
  fails, first on RB9 moving, then on D9''s head in (4,4,1), the cell where the load puts an obsidian blocker. The control has no source for D9: RB9 stays over Z9 and P9''s landing fires Z9 again at c25.
  Each test checks the frame 5 ticks into the opening and the open state, then the cells the close moves or must leave alone, Z9''s cells and the levels of DT, DS, DP, the tap, D_V, NV''s four dusts, D_1,
  D_2, D_F, LY and D_8 against the simulator after c0 and the ticks around Z9''s return, and Z9, RB9''s two cells and D9 four ticks after the update.'
