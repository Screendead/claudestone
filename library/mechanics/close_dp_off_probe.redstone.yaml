name: close_dp_off_probe
description: 'Scratch probe for DP''s on and off, stage 2 of the 3x3 door''s close (door2/close_layout/dp_off.py). Written and replayed in the simulator; not yet run on a server. The design_c door, the
  close feeds, P_R, the S feed and the trigger chain are fixture; the design is 7 blocks, here in door coordinates (door + (4,3,8) = spec). Redstone block RB_D rests at (-3,4,2), south of the source cell
  (-3,4,1) of DP (-3,4,0), the dust on the stone that powers P11 (-2,3,0); sticky piston A_D (-3,4,3) faces north behind it. A_D''s only power is stone Q_D (-3,6,3), two above it (quasi-connectivity), strongly
  powered by a 1-tick repeater R_D (-2,6,3) facing east on glass (-2,5,3). R_D reads the tap, a dust at (-1,6,3) on glass (-1,5,3), which reads NP12''s dust (0,5,3) down the step; the glass passes nothing
  back. In the opening NP12 lights at t6 and R_D turns on at t8, updating Q_D''s neighbours but not A_D, which waits powered and not updated. The input falls; two ticks later (c0) the trigger chain runs
  stages 0 and 1 in one block-event phase, and K''s event kills NP12: the dust under A_D dies and updates it, R_D is still on, A_D extends. R_D turns off at c2 with no update of A_D. At the end of c2 RB_D
  lands at (-3,4,1) and lights DP, whose change updates P11; then A_D''s head lands, which updates A_D, now unpowered. In c3''s block-event phase P11 extends, A_D pulls RB_D (a moving block at once, DP
  0), and DP''s change updates P11, which is spat: S real at (0,3). P6''s extension, queued by P11''s, finds its feed dark and is dropped; P6 extends at c4 on NA''s repeater with P1 to P5 and stays out.
  RB_D and A_D are home after c5. Stages 3 to 5 are commands between ticks, one tick later than in close_trigger_probe: c4 a redstone block at (-1,5,1) (P10); c5 removed, blocks at (-1,3,1) (V) and (1,6,3)
  (F_S); c6 both removed (RB_F spat to (1,5,1), V spat, S fires at (1,3)); c7 G_S''s hold (3,6,1) removed (S spat, C real at (1,1)). Each test checks the frame 5 ticks into the opening and the open state,
  then the cells the close moves or must leave alone and the levels of DT, DS, DP and the tap against the simulator after c0, c2, c3 and later ticks (after c2: RB_D at (-3,4,1), A_D out, DP 15, R_D off;
  after c3: RB_D and P11 moving, S at (0,3), DP 0). Controls remove one block with setblock air strict before the opening: RB_D (DP stays dark, P11 stays in), the repeater (A_D is never powered), the tap
  dust (the repeater never turns on).'
traits:
- piston_based
