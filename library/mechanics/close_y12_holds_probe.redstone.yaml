name: close_y12_holds_probe
description: 'Scratch probe for the re-arm of Y12, the gate relay of the 3x3 door, after the close, from blocks (door2/close_layout/y12_holds.py): nothing is set by command after the input. Written and
  replayed in the simulator; not yet run on a server. The design_c door with Y12 made a sticky piston, every close step''s blocks and the two returns are fixture; the design is y12.py''s 8 blocks and y12_holds.py''s
  14, here in door coordinates (door + (6,3,8) = spec). U_Y, a sticky piston at (-2,6,2) facing down, built out on ARM_Z11 (-2,4,2), is held by redstone block RB_U (-1,7,2), beside the cell above it. H_U,
  a sticky piston at (-1,7,3) facing north, under A_C, pushes RB_U to (-1,7,1) and pulls it back: from c12 to c44, while Q_C powers A_C''s cell, and from c52 to c60, while stone S_U (-2,7,3) is powered
  by dust D_U on it, which dust D_S on S_W lights with S_W (dust D_Z at (-2,8,4) on glass keeps D_U from pointing into A_C). S_U powers U_Y too, so W_Y''s extension at c58 finds it powered; from c60 to
  c62 nothing does, and NP12''s relight at the end of c60 makes U_Y pull ARM_Z11 up at c61 while W_Y pulls RB_D: Y12 retracts and pulls G home to (-3,3,2) (end of c63). RB_U is home at the end of c62 and
  U_Y pushes ARM_Z11 back at c64. R_B, a 3-tick repeater at (-4,6,4) facing north, reads Y_G and powers stone S_B (-4,6,5) from c64 to c72; dust D_B under it steps down to dust D_Y (-4,4,4), which points
  into the cell above B_Y: B_Y (-4,3,3) puts its head into (-4,3,2) at c64, so ARM_Z11''s landing on Y12 at the end of c66 cannot fire it, and goes in at c72. A_D never moves; NP12 and the tap end dark.
  Each test checks the frame 5 ticks into the opening and the open state, then the cells of Y12''s corner, of the west side and of the 22 blocks and the dust levels against the simulator after the ticks
  that decide it, and after its last tick every cell the close and the returns move or must leave alone. Controls: with H_U taken out with setblock air strict before the opening, U_Y stays out and so does
  Y12; with R_B taken out, Y12 fires again at c67.'
