name: torch_burnout_one_shot
description: A torch fed by a fast clock burns out on its 8th turn-off within 60 gt, ignores every update for exactly 160 gt, then relights by itself if unpowered, giving a self-limiting burst of 8 low pulses with no counter.
traits: [compact, flat, entityless, torch_based]
palette:
  .: air
  '=': smooth_stone
  S: stone
  '>': repeater[facing=west]
  a: {input: fast}
  b: {input: slow}
  T: {name: tf, block: 'redstone_wall_torch[facing=east]'}
  U: {name: ts, block: 'redstone_wall_torch[facing=east]'}
  '1': {output: of, block: redstone_wire}
  '2': {output: os, block: redstone_wire}
layers:
  0: |
    =====
    .....
    =====
  1: |
    a>ST1
    .....
    b>SU2
tests:
- name: eighth turn-off in 60 gt burns it out; it relights itself 160 gt later
  steps:
  - drive: {fast: 1}
  - wait: 3
  - drive: {fast: 0}
  - wait: 1
  - check: if block ~3 ~1 ~0 redstone_wall_torch[lit=false]
  - wait: 2
  - drive: {fast: 1}
  - wait: 1
  - check: if block ~3 ~1 ~0 redstone_wall_torch[lit=true]
