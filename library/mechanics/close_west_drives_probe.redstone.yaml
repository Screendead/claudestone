name: close_west_drives_probe
description: 'Scratch probe for the return of the west side of the 3x3 door''s trigger chain after the close, from the one input with no command (door2/close_layout/west_drives.py). RB12, K, M_K and WK
  go back to the closed state; G ends at (-4,3,2), where the opening puts it (its closed cell holds Y12''s head). Written and replayed in the simulator; not yet run on a server. The design_c door, every
  close step''s blocks and the 49 blocks of the east side''s return are fixture; the design is 34 blocks, here in door coordinates (door + (6,3,8) = spec). After the close RB12 is at (-4,3,2) on the head
  of K (-4,1,2), which it holds out by QC, G is above it at (-4,4,2), and M_K (-4,3,1) is out, held by RB12, with glass WK at (-4,1,1) beside K. The kick: P_W, a sticky piston at (-6,3,2) facing east, is
  built out, its head at (-5,3,2), held by RB_W, a redstone block at (-6,3,1); A_W, a sticky piston at (-6,4,1) facing down, pushes RB_W down to (-6,2,1) and pulls it back. The push down: P_G, a sticky
  piston at (-4,6,2) facing down, over glass SPG (-4,5,2). The timer is one pulse from the east return''s line: R_W, a 4-tick repeater at (1,10,2), reads its dust (2,10,2), lit from c26 to c34; R_M (-1,10,2),
  4 ticks, is on from c42 to c50; seven dusts run west at y 10 and down four stone steps to D_A (-6,6,1), on glass two above A_W. R_X (-6,6,2), 4 ticks, reads D_A and powers stone Y_X (-6,6,3); R_G (-5,6,3),
  4 ticks, reads Y_X and powers stone Y_G (-4,6,3) beside P_G from c58 to c66. The run: at c42 A_W goes out; inside that event P_W, released, pulls RB12 west, and K and M_K, released by RB12, retract, M_K
  pulling WK up. At the end of c44 RB12 is at (-5,3,2) and WK at (-4,2,1). At c50 A_W pulls RB_W back; it lands beside P_W at the end of c52 and P_W goes out at c53, pushing RB12 back to (-4,3,2), where
  it lands at the end of c55 and powers M_K, which pushes WK down at c56. At c58 P_G pushes SPG, G and RB12 down; RB12''s leaving releases M_K two ticks after its push, so M_K leaves WK at (-4,1,1) and
  retracts. At the end of c60 RB12 lands on K at (-4,2,2) and lights L (-3,2,2), which powers K by QC and updates it: K stays in, G being in (-4,3,2) above RB12, under SPG and P_G''s head. P_G pulls SPG
  back at c66; it is home at the end of c68. From the end of c60 the dust H (-3,3,3) reads L, G being off the step: NP12 is lit as in the open state (G12 on P12 at 8), the DP tap''s repeater (-2,6,3) is
  on from c62, P12 stays in (V''s head is under the spare block) and A_D stays in. Each test checks the frame 5 ticks into the opening and the open state, then the west side''s cells and the dust levels
  against the simulator after the ticks that decide it, and after its last tick every cell the close and the two returns move or must leave alone. Controls remove one block with setblock air strict before
  the opening: R_M (the line stays dark and nothing moves in the west) or R_G (RB12 is kicked and comes back, P_G stays in, WK lands beside K at the end of c58 with RB12 two above K, and K goes out again
  at c59).'
