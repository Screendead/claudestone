name: piston_landed_powered_extends_next_tick
description: A retracted piston pushed or pulled onto a powered cell lands unextended at event+2 and extends exactly 1 gt later (event+3); one landing unpowered stays retracted. Extender stage cost is 3 gt.
traits: [piston_based, flat, entityless, tick_accurate]
palette:
  .: air
  '=': smooth_stone
  a: {input: a}
  b: {input: b}
  c: {input: c}
  P: sticky_piston[facing=east]
  W: piston[facing=north]
  R: redstone_block
layers:
  0: |
    =======
    =======
    =======
    =======
    =======
    =======
    =======
    =======
    =======
  1: |
    .......
    aPW....
    ...R...
    .......
    bPW....
    .......
    .......
    cP.W...
    ..R....
tests:
- name: pushed onto power, extends 1 gt after landing
  steps:
  - drive: {a: 1}
  - wait: 1
  - check: if block ~3 ~1 ~1 moving_piston
  - wait: 1
  - check: if block ~3 ~1 ~1 moving_piston
  - wait: 1
  - check: if block ~3 ~1 ~1 piston[facing=north,extended=false]
  - check: if block ~3 ~1 ~0 air
  - wait: 1
  - check: if block ~3 ~1 ~1 piston[facing=north,extended=true]
  - check: if block ~3 ~1 ~0 moving_piston
  - wait: 2
  - check: if block ~3 ~1 ~0 piston_head[facing=north]
- name: pushed onto an unpowered cell, stays retracted (control)
  steps:
  - drive: {b: 1}
  - wait: 3
  - check: if block ~3 ~1 ~4 piston[facing=north,extended=false]
  - wait: 10
  - check: if block ~3 ~1 ~4 piston[facing=north,extended=false]
  - check: if block ~3 ~1 ~3 air
- name: pulled onto power, extends 1 gt after landing
  steps:
  - drive: {c: 1}
  - wait: 4
  - check: if block ~2 ~1 ~7 piston_head[facing=east,type=sticky]
  - check: if block ~3 ~1 ~7 piston[extended=false]
  - drive: {c: 0}
  - wait: 1
  - check: if block ~2 ~1 ~7 moving_piston
  - check: if block ~3 ~1 ~7 air
  - wait: 1
  - check: if block ~2 ~1 ~7 moving_piston
  - wait: 1
  - check: if block ~2 ~1 ~7 piston[facing=north,extended=false]
  - check: if block ~2 ~1 ~6 air
  - wait: 1
  - check: if block ~2 ~1 ~7 piston[facing=north,extended=true]
  - check: if block ~2 ~1 ~6 moving_piston
