- name: cake constant subtracted from a 15 rear
  steps:
  - check: if block ~4 ~1 ~2 redstone_wire[power=0]
  - drive: {a: 1}
  - wait: 4
  - check: if block ~4 ~1 ~2 redstone_wire[power=7]
  - run: setblock ~6 ~1 ~1 stone
  - wait: 4
  - check: if block ~4 ~1 ~2 redstone_wire[power=15]
  - run: setblock ~6 ~1 ~1 cake[bites=0]
  - wait: 4
  - check: if block ~4 ~1 ~2 redstone_wire[power=1]
- name: bookshelf, crafter and creaking heart need block-entity data
  steps:
  - run: setblock ~0 ~1 ~0 chiseled_bookshelf[facing=south,slot_0_occupied=true,slot_1_occupied=true,slot_2_occupied=true]
  - wait: 4
  - check: if block ~0 ~1 ~0 chiseled_bookshelf[slot_2_occupied=true]
  - check: if block ~0 ~1 ~2 redstone_wire[power=0]
  - run: setblock ~0 ~1 ~0 chiseled_bookshelf[facing=south,slot_0_occupied=true,slot_1_occupied=true]{Items:[{Slot:0b,id:"minecraft:book",count:1},{Slot:1b,id:"minecraft:book",count:1}],last_interacted_slot:1}
  - wait: 4
  - check: if block ~0 ~1 ~2 redstone_wire[power=2]
  - run: setblock ~0 ~1 ~0 chiseled_bookshelf[facing=north,slot_0_occupied=true,slot_1_occupied=true]{Items:[{Slot:0b,id:"minecraft:book",count:1},{Slot:1b,id:"minecraft:book",count:1}],last_interacted_slot:4}
  - wait: 4
  - check: if block ~0 ~1 ~2 redstone_wire[power=5]
  - run: setblock ~0 ~1 ~0 crafter
  - wait: 4
  - check: if block ~0 ~1 ~2 redstone_wire[power=0]
  - run: setblock ~0 ~1 ~0 crafter{disabled_slots:[I;0,1,2]}
  - wait: 4
  - check: if block ~0 ~1 ~2 redstone_wire[power=3]
  - run: setblock ~0 ~1 ~0 creaking_heart[creaking_heart_state=awake]
  - wait: 4
  - check: if block ~0 ~1 ~0 creaking_heart[creaking_heart_state=uprooted]
  - check: if block ~0 ~1 ~2 redstone_wire[power=0]
