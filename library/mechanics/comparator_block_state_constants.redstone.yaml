name: comparator_block_state_constants
description: Comparators read fixed 0-15 constants from block state alone (cake, end portal frame, beehive, composter, cauldrons, respawn anchor), directly or through a solid block, for item-free subtract-side constants; chiseled bookshelf and crafter need block-entity NBT, and a lone creaking heart reads 0.
traits: [comparator_based, analog, lightless, silent, pistonless, entityless, flat, compact, survival_friendly]
palette:
  .: air
  '=': smooth_stone
  S: stone
  c: comparator[facing=north]
  m: {name: sub, block: 'comparator[facing=north,mode=subtract]'}
  k: comparator[facing=east]
  K: cake[bites=3]
  a: {input: a}
  d: {name: direct, block: redstone_wire}
  t: {name: through, block: redstone_wire}
  o: {output: out, block: redstone_wire}
layers:
  0: |
    =======
    =======
    =======
    =======
  1: |
    S...a..
    c.S.mkK
    d.c.o..
    ..t....
tests:
- name: read directly
  steps:
  - run: setblock ~0 ~1 ~0 stone
  - wait: 4
  - check: if block ~0 ~1 ~2 redstone_wire[power=0]
  - run: setblock ~0 ~1 ~0 cake[bites=0]
  - wait: 4
  - check: if block ~0 ~1 ~2 redstone_wire[power=14]
  - run: setblock ~0 ~1 ~0 cake[bites=1]
  - wait: 4
