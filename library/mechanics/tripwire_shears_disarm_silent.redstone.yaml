name: tripwire_shears_disarm_silent
description: A disarmed string can be removed with no pulse while a plain break pulses the hooks for 10 game ticks; hooks strongly power their block and span at most 40 strings.
traits: [flat, pistonless, lightless, survival_friendly]
palette:
  .: air
  '=': smooth_stone
  S: stone
  E: tripwire_hook[facing=east]
  W: tripwire_hook[facing=west]
  T: tripwire[east=true,west=true]
  o: {output: out, block: redstone_wire}
layers:
  0: |
    ==============================================
    ==============================================
    ==============================================
  1: |
    oSETTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTWS.
    ..............................................
    .SETTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTWS
tests:
- name: 40 strings connect and 41 do not
  steps:
  - check: if block ~2 ~1 ~0 tripwire_hook[attached=true,powered=false]
  - check: if block ~43 ~1 ~0 tripwire_hook[attached=true,powered=false]
  - check: if block ~22 ~1 ~0 tripwire[attached=true,disarmed=false]
  - check: if block ~2 ~1 ~2 tripwire_hook[attached=false]
  - check: if block ~44 ~1 ~2 tripwire_hook[attached=false]
  - check: if block ~22 ~1 ~2 tripwire[attached=false]
- name: an item anywhere on a 40 line strongly powers the hook blocks
  steps:
  - check: if block ~2 ~1 ~0 tripwire_hook[attached=true,powered=false]
  - check: if block ~43 ~1 ~0 tripwire_hook[attached=true,powered=false]
  - check: if block ~22 ~1 ~0 tripwire[attached=true,disarmed=false]
  - check: if block ~0 ~1 ~0 redstone_wire[power=0]
  - run: summon item ~30.5 ~1.0 ~0.5 {Item:{id:"minecraft:stone",count:1},PickupDelay:32767}
  - wait: 1
  - check: if block ~2 ~1 ~0 tripwire_hook[attached=true,powered=true]
  - check: if block ~43 ~1 ~0 tripwire_hook[attached=true,powered=true]
  - check: if block ~0 ~1 ~0 redstone_wire[power=15]
  - expect: {out: 1}
- name: break without disarm pulses the hooks
  steps:
  - check: if block ~2 ~1 ~0 tripwire_hook[attached=true,powered=false]
  - check: if block ~43 ~1 ~0 tripwire_hook[attached=true,powered=false]
  - check: if block ~22 ~1 ~0 tripwire[attached=true,disarmed=false]
  - run: setblock ~22 ~1 ~0 air
  - check: if block ~2 ~1 ~0 tripwire_hook[attached=true,powered=true]
  - check: if block ~0 ~1 ~0 redstone_wire[power=15]
  - wait: 9
  - check: if block ~2 ~1 ~0 tripwire_hook[attached=true,powered=true]
  - wait: 1
  - check: if block ~2 ~1 ~0 tripwire_hook[attached=false,powered=false]
  - check: if block ~43 ~1 ~0 tripwire_hook[attached=false,powered=false]
  - check: if block ~0 ~1 ~0 redstone_wire[power=0]
- name: disarm then break gives no pulse
  steps:
  - check: if block ~2 ~1 ~0 tripwire_hook[attached=true,powered=false]
  - check: if block ~43 ~1 ~0 tripwire_hook[attached=true,powered=false]
  - check: if block ~22 ~1 ~0 tripwire[attached=true,disarmed=false]
  - run: setblock ~22 ~1 ~0 tripwire[east=true,west=true,attached=true,disarmed=true]
  - check: if block ~2 ~1 ~0 tripwire_hook[attached=true,powered=false]
  - run: setblock ~22 ~1 ~0 air
  - check: if block ~2 ~1 ~0 tripwire_hook[attached=false,powered=false]
  - check: if block ~43 ~1 ~0 tripwire_hook[attached=false,powered=false]
  - check: if block ~0 ~1 ~0 redstone_wire[power=0]
  - wait: 1
  - check: if block ~0 ~1 ~0 redstone_wire[power=0]
  - wait: 1
  - check: if block ~0 ~1 ~0 redstone_wire[power=0]
  - wait: 1
  - check: if block ~0 ~1 ~0 redstone_wire[power=0]
  - wait: 1
  - check: if block ~0 ~1 ~0 redstone_wire[power=0]
  - wait: 1
  - check: if block ~0 ~1 ~0 redstone_wire[power=0]
  - wait: 1
  - check: if block ~0 ~1 ~0 redstone_wire[power=0]
  - wait: 1
  - check: if block ~0 ~1 ~0 redstone_wire[power=0]
  - wait: 1
  - check: if block ~0 ~1 ~0 redstone_wire[power=0]
  - wait: 1
  - check: if block ~0 ~1 ~0 redstone_wire[power=0]
  - wait: 1
  - check: if block ~0 ~1 ~0 redstone_wire[power=0]
  - wait: 1
  - check: if block ~0 ~1 ~0 redstone_wire[power=0]
  - wait: 1
  - check: if block ~0 ~1 ~0 redstone_wire[power=0]
