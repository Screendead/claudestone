  m: 'spawner'
  T: 'enchanting_table'
  O: 'obsidian'
  o: 'crying_obsidian'
  X: 'bedrock'
  r: 'reinforced_deepslate'
  f: 'end_portal_frame[facing=north]'
  x: 'piston[facing=up,extended=true]'
