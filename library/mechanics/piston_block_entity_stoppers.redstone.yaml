  - check: if block ~2 ~1 ~32 stone
  - check: if block ~3 ~1 ~32 bedrock
- name: reinforced_deepslate stops the push (immovable)
  settle: 6
  steps:
  - run: setblock ~0 ~1 ~34 redstone_block
  - wait: 6
  - check: if block ~1 ~1 ~34 piston[extended=false]
  - check: if block ~2 ~1 ~34 stone
  - check: if block ~3 ~1 ~34 reinforced_deepslate
- name: end_portal_frame stops the push (immovable)
  settle: 6
  steps:
  - run: setblock ~0 ~1 ~36 redstone_block
  - wait: 6
  - check: if block ~1 ~1 ~36 piston[extended=false]
  - check: if block ~2 ~1 ~36 stone
  - check: if block ~3 ~1 ~36 end_portal_frame
- name: extended piston stops the push (extended piston)
  settle: 6
  steps:
  - run: setblock ~0 ~1 ~38 redstone_block
  - wait: 6
  - check: if block ~1 ~1 ~38 piston[extended=false]
  - check: if block ~2 ~1 ~38 stone
  - check: if block ~3 ~1 ~38 piston
  - check: if block ~3 ~2 ~38 piston_head[facing=up]
- name: a retracted piston is pushed
  settle: 6
  steps:
  - run: setblock ~0 ~1 ~40 redstone_block
  - wait: 6
  - check: if block ~1 ~1 ~40 piston[extended=true]
  - check: if block ~3 ~1 ~40 stone
  - check: if block ~4 ~1 ~40 piston[facing=north,extended=false]
- name: an iron door breaks and drops
  settle: 6
  steps:
  - check: unless entity @e[type=item,dx=6,dy=3,dz=44]
  - run: setblock ~0 ~1 ~42 redstone_block
  - wait: 6
  - check: if block ~1 ~1 ~42 piston[extended=true]
  - check: if block ~2 ~1 ~42 piston_head[facing=east]
  - check: if block ~2 ~2 ~42 air
  - check: if block ~3 ~1 ~42 air
  - check: if block ~3 ~2 ~42 air
  - check: if entity @e[type=item,dx=6,dy=3,dz=44,nbt={Item:{id:"minecraft:iron_door"}}]
- name: an open iron trapdoor moves and stays open
  settle: 6
  steps:
  - run: setblock ~0 ~1 ~44 redstone_block
  - wait: 6
  - check: if block ~1 ~1 ~44 piston[extended=true]
  - check: if block ~3 ~1 ~44 iron_trapdoor[open=true,powered=false]
  - check: unless entity @e[type=item,dx=6,dy=3,dz=46]
