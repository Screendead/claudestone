  s: stone
  R: redstone_block
  h: 'piston_head[facing=up,type=normal,short=false]'
  q: 'piston[facing=north]'
  l: 'iron_door[facing=east,half=lower,hinge=left,open=false,powered=false]'
  u: 'iron_door[facing=east,half=upper,hinge=left,open=false,powered=false]'
  t: 'iron_trapdoor[facing=north,half=bottom,open=true,powered=false]'
  H: 'hopper[facing=down]'
  C: 'chest[facing=north]'
