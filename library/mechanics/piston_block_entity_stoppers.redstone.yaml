  - wait: 6
  - check: if block ~1 ~1 ~28 piston[extended=false]
  - check: if block ~2 ~1 ~28 stone
  - check: if block ~3 ~1 ~28 obsidian
- name: crying_obsidian stops the push (immovable)
  settle: 6
  steps:
  - run: setblock ~0 ~1 ~30 redstone_block
  - wait: 6
