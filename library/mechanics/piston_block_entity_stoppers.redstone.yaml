tests:
- name: every block entity and immovable block stops the push, stone with air behind moves, a retracted piston is pushed
  settle: 6
  steps:
  - run: setblock ~0 ~1 ~0 redstone_block
  - run: setblock ~0 ~1 ~2 redstone_block
  - run: setblock ~0 ~1 ~4 redstone_block
  - run: setblock ~0 ~1 ~6 redstone_block
  - run: setblock ~0 ~1 ~8 redstone_block
  - run: setblock ~0 ~1 ~10 redstone_block
  - run: setblock ~0 ~1 ~12 redstone_block
  - run: setblock ~0 ~1 ~14 redstone_block
  - run: setblock ~0 ~1 ~16 redstone_block
  - run: setblock ~0 ~1 ~18 redstone_block
  - run: setblock ~0 ~1 ~20 redstone_block
  - run: setblock ~0 ~1 ~22 redstone_block
  - run: setblock ~0 ~1 ~24 redstone_block
  - run: setblock ~0 ~1 ~26 redstone_block
  - run: setblock ~0 ~1 ~28 redstone_block
  - run: setblock ~0 ~1 ~30 redstone_block
  - run: setblock ~0 ~1 ~32 redstone_block
  - run: setblock ~0 ~1 ~34 redstone_block
  - run: setblock ~0 ~1 ~36 redstone_block
  - run: setblock ~0 ~1 ~38 redstone_block
  - run: setblock ~0 ~1 ~40 redstone_block
  - wait: 6
  - check: if block ~1 ~1 ~0 piston[extended=true]
  - check: if block ~3 ~1 ~0 stone
  - check: if block ~1 ~1 ~2 piston[extended=false]
  - check: if block ~2 ~1 ~2 stone
  - check: if block ~3 ~1 ~2 hopper
  - check: if block ~1 ~1 ~4 piston[extended=false]
  - check: if block ~2 ~1 ~4 stone
  - check: if block ~3 ~1 ~4 chest
  - check: if block ~1 ~1 ~6 piston[extended=false]
  - check: if block ~2 ~1 ~6 stone
  - check: if block ~3 ~1 ~6 furnace
  - check: if block ~1 ~1 ~8 piston[extended=false]
  - check: if block ~2 ~1 ~8 stone
  - check: if block ~3 ~1 ~8 dispenser
  - check: if block ~1 ~1 ~10 piston[extended=false]
  - check: if block ~2 ~1 ~10 stone
  - check: if block ~3 ~1 ~10 dropper
  - check: if block ~1 ~1 ~12 piston[extended=false]
  - check: if block ~2 ~1 ~12 stone
  - check: if block ~3 ~1 ~12 jukebox
  - check: if block ~1 ~1 ~14 piston[extended=false]
  - check: if block ~2 ~1 ~14 stone
  - check: if block ~3 ~1 ~14 beacon
  - check: if block ~1 ~1 ~16 piston[extended=false]
  - check: if block ~2 ~1 ~16 stone
  - check: if block ~3 ~1 ~16 ender_chest
  - check: if block ~1 ~1 ~18 piston[extended=false]
  - check: if block ~2 ~1 ~18 stone
  - check: if block ~3 ~1 ~18 crafter
  - check: if block ~1 ~1 ~20 piston[extended=false]
  - check: if block ~2 ~1 ~20 stone
  - check: if block ~3 ~1 ~20 oak_shelf
  - check: if block ~1 ~1 ~22 piston[extended=false]
  - check: if block ~2 ~1 ~22 stone
  - check: if block ~3 ~1 ~22 barrel
  - check: if block ~1 ~1 ~24 piston[extended=false]
  - check: if block ~2 ~1 ~24 stone
  - check: if block ~3 ~1 ~24 spawner
  - check: if block ~1 ~1 ~26 piston[extended=false]
  - check: if block ~2 ~1 ~26 stone
  - check: if block ~3 ~1 ~26 enchanting_table
  - check: if block ~1 ~1 ~28 piston[extended=false]
  - check: if block ~2 ~1 ~28 stone
  - check: if block ~3 ~1 ~28 obsidian
  - check: if block ~1 ~1 ~30 piston[extended=false]
  - check: if block ~2 ~1 ~30 stone
  - check: if block ~3 ~1 ~30 crying_obsidian
  - check: if block ~1 ~1 ~32 piston[extended=false]
  - check: if block ~2 ~1 ~32 stone
  - check: if block ~3 ~1 ~32 bedrock
  - check: if block ~1 ~1 ~34 piston[extended=false]
  - check: if block ~2 ~1 ~34 stone
  - check: if block ~3 ~1 ~34 reinforced_deepslate
  - check: if block ~1 ~1 ~36 piston[extended=false]
  - check: if block ~2 ~1 ~36 stone
  - check: if block ~3 ~1 ~36 end_portal_frame
  - check: if block ~1 ~1 ~38 piston[extended=false]
  - check: if block ~2 ~1 ~38 stone
  - check: if block ~3 ~1 ~38 piston
  - check: if block ~3 ~2 ~38 piston_head[facing=up]
  - check: if block ~1 ~1 ~40 piston[extended=true]
  - check: if block ~3 ~1 ~40 stone
  - check: if block ~4 ~1 ~40 piston[facing=north,extended=false]
- name: an iron door breaks and drops
  settle: 6
  steps:
  - check: unless entity @e[type=item,dx=6,dy=3,dz=44]
  - run: setblock ~0 ~1 ~42 redstone_block
  - wait: 6
  - check: if block ~1 ~1 ~42 piston[extended=true]
  - check: if block ~2 ~1 ~42 piston_head[facing=east]
  - check: if block ~2 ~2 ~42 air
  - check: if block ~3 ~1 ~42 air
  - check: if block ~3 ~2 ~42 air
  - check: if entity @e[type=item,dx=6,dy=3,dz=44,nbt={Item:{id:"minecraft:iron_door"}}]
- name: an open iron trapdoor moves and stays open
  settle: 6
  steps:
  - run: setblock ~0 ~1 ~44 redstone_block
  - wait: 6
  - check: if block ~1 ~1 ~44 piston[extended=true]
  - check: if block ~3 ~1 ~44 iron_trapdoor[open=true,powered=false]
  - check: unless entity @e[type=item,dx=6,dy=3,dz=46]
