name: close_z11_probe
description: 'Scratch probe for the return of Z11, the relay under P11''s power block, after the close (door2/close_layout/z11.py). Not a design yet: H11''s second drive is a stand-in, two commands after
  the input. Written and replayed in the simulator; not yet run on a server. The design_c door with Y12 made a sticky piston, every close step''s blocks, the two returns and Y12''s re-arm are fixture; the
  design is 3 blocks, here in door coordinates (door + (6,3,8) = spec). After the close Z11 (-2,3,1) is out, held by ARM_Z11 (-2,4,2) and by its payload RB11 at (-2,5,1) (QC). H11, a sticky piston at (-3,5,1)
  facing east, is fired by DP''s pulse: RB_D lands under it in DP''s source cell at the end of c2 and leaves at c3, so H11 pushes RB11 east at c3 and is spat: RB11 rests at (-1,5,1), beside P10, from c3;
  P11''s head is moving through (-1,3,0) then and P10 waits for c8 as before. Z11, held by ARM_Z11 alone, retracts at c61 when U_Y lifts ARM_Z11 (Y12''s re-arm). The stand-in, a redstone block at (-3,6,0)
  beside the cell above H11, is set before c56 and taken out before c61 with setblock strict: W_Y''s extension beside H11 at c58 updates it and it goes out into the empty (-2,5,1); Z11''s retract at c61
  updates it, unpowered, and it pulls RB11 back into (-2,5,1) (end of c63). D11, a piston at (-2,6,1) facing down, is powered from c60 to c68 by R11, a 4-tick repeater at (-2,7,2) on U_Y facing south that
  reads stone S_U (-2,7,3) and points into the cell above D11: RB11''s landing updates it and it pushes RB11 into (-2,4,1) at c64, while ARM_Z11 is moving; ARM_Z11 lands at the end of c66, RB11 right after
  it, and Z11, powered again, cannot push RB11 into D11''s head; D11 goes in at c68. At the end Z11 is in, powered by ARM_Z11 and not updated, RB11 at (-2,4,1), (-2,5,1) and (-1,5,1) empty, and Y12''s re-arm
  is as close_y12_holds_probe has it. Each test checks the frame 5 ticks into the opening and the open state, then the cells of Z11''s column, RB11''s park, P10 to V, Y12''s corner and the west side and
  the dust levels against the simulator after the ticks that decide it, and after its last tick every cell the close and the returns move or must leave alone. Controls: without the stand-in H11 stays in,
  R11 comes on at c60 with (-2,5,1) empty and D11''s head arrives beside U_Y''s, which retracts a tick early: Y12 stays out; with H11 taken out with setblock air strict before the opening, RB11 holds Z11
  out; with R11 taken out, RB11 comes back to (-2,5,1) and stays there.'
