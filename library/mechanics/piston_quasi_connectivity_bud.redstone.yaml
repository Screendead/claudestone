name: piston_quasi_connectivity_bud
description: A piston takes power two blocks above it (quasi-connectivity) but only on a block update, so it works as an observer-free BUD and holds its state as memory.
traits: [compact, piston_based]
palette:
  .: air
  '=': smooth_stone
  P: {name: piston, block: 'sticky_piston[facing=east]'}
  D: 'dropper[facing=east]{Items:[{Slot:0b,id:"minecraft:stick",count:1}]}'
layers:
  0: |
    ==
    ==
    ==
    ==
  1: |
    P.
    ..
    ..
    D.
  2: |
    ..
    ..
    ..
    ..
  3: |
    ..
    ..
    ..
    ..
tests:
- name: power two above waits for an update and then latches
  settle: 4
  steps:
  - check: if block ~0 ~1 ~0 sticky_piston[extended=false]
  # control: a neighbour update with no power does nothing
  - run: setblock ~0 ~1 ~1 stone
  - wait: 4
  - check: if block ~0 ~1 ~0 sticky_piston[extended=false]
  - run: setblock ~0 ~1 ~1 air
  # redstone block two above, air between: its updates reach only the air cell
  - run: setblock ~0 ~3 ~0 redstone_block
  - wait: 6
  - check: if block ~0 ~1 ~0 sticky_piston[extended=false]
  - check: if block ~1 ~1 ~0 air
  # any neighbour update makes it notice the power
  - run: setblock ~0 ~1 ~1 stone
  - wait: 1
  - check: if block ~0 ~1 ~0 sticky_piston[extended=true]
  - wait: 3
  - check: if block ~1 ~1 ~0 piston_head[facing=east,type=sticky]
  # power gone: still extended until the next update
  - run: setblock ~0 ~3 ~0 air
  - wait: 6
  - check: if block ~0 ~1 ~0 sticky_piston[extended=true]
  - run: setblock ~0 ~1 ~1 air
  - wait: 4
  - check: if block ~0 ~1 ~0 sticky_piston[extended=false]
  - check: if block ~1 ~1 ~0 air
- name: power directly above extends at once
  settle: 4
  steps:
  - check: if block ~0 ~1 ~0 sticky_piston[extended=false]
  - run: setblock ~0 ~2 ~0 redstone_block
  - wait: 1
  - check: if block ~0 ~1 ~0 sticky_piston[extended=true]
- name: a dropper takes the same power two above only on an update
  settle: 4
  steps:
  - check: if block ~0 ~1 ~3 dropper[triggered=false]
  - run: setblock ~0 ~3 ~3 redstone_block
  - wait: 8
  - check: if block ~0 ~1 ~3 dropper[triggered=false]
  - check: if data block ~0 ~1 ~3 Items[0]
  - run: setblock ~1 ~1 ~3 stone
  - wait: 8
  - check: if block ~0 ~1 ~3 dropper[triggered=true]
  - check: unless data block ~0 ~1 ~3 Items[0]
