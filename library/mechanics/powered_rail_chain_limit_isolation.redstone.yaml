  - check: if block ~6 ~1 ~1 powered_rail[powered=true]
  - check: if block ~7 ~1 ~1 powered_rail[powered=true]
  - check: if block ~8 ~1 ~1 powered_rail[powered=true]
  - check: if block ~9 ~1 ~1 powered_rail[powered=true]
  - check: if block ~10 ~1 ~1 powered_rail[powered=false]
  - check: if block ~11 ~1 ~1 powered_rail[powered=false]
  - check: if block ~1 ~1 ~0 powered_rail[powered=false]
  - check: if block ~2 ~1 ~0 powered_rail[powered=false]
  - check: if block ~3 ~1 ~0 powered_rail[powered=false]
  - check: if block ~4 ~1 ~0 powered_rail[powered=false]
  - check: if block ~5 ~1 ~0 powered_rail[powered=false]
  - check: if block ~6 ~1 ~0 powered_rail[powered=false]
  - check: if block ~7 ~1 ~0 powered_rail[powered=false]
  - check: if block ~8 ~1 ~0 powered_rail[powered=false]
  - check: if block ~9 ~1 ~0 powered_rail[powered=false]
  - check: if block ~10 ~1 ~0 powered_rail[powered=false]
  - check: if block ~11 ~1 ~0 powered_rail[powered=false]
  - expect: {dust: 0, lamp: 0}
  - wait: 10
  - check: if block ~1 ~1 ~1 powered_rail[powered=true]
  - check: if block ~9 ~1 ~1 powered_rail[powered=true]
  - check: if block ~10 ~1 ~1 powered_rail[powered=false]
  - check: if block ~11 ~1 ~1 powered_rail[powered=false]
  - expect: {dust: 0, lamp: 0}
  - drive: {a: 0}
  - check: if block ~1 ~1 ~1 powered_rail[powered=false]
  - check: if block ~2 ~1 ~1 powered_rail[powered=false]
  - check: if block ~3 ~1 ~1 powered_rail[powered=false]
  - check: if block ~4 ~1 ~1 powered_rail[powered=false]
  - check: if block ~5 ~1 ~1 powered_rail[powered=false]
  - check: if block ~6 ~1 ~1 powered_rail[powered=false]
