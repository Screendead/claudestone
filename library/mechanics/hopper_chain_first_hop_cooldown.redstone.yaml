name: hopper_chain_first_hop_cooldown
description: A lone item moves one hop down a hopper chain every 7 gt (not 8), in either build direction; a source hopper emits one item per 8 gt, so a stream arrives 8 gt apart. Exact silent delay lines.
traits: [container_based, tick_accurate, lightless, pistonless, entityless, flat, survival_friendly]
palette:
  .: air
  '=': smooth_stone
  E: hopper[facing=east]
  W: hopper[facing=west]
  D: hopper[facing=down]
layers:
  0: |
    ====
    ====
  1: |
    EEED
    DWWW
tests:
- name: one item hops every 7 gt both ways
  steps:
  - run: 'data merge block ~0 ~1 ~0 {Items:[{Slot:0b,id:"minecraft:stone",count:1}]}'
  - run: 'data merge block ~3 ~1 ~1 {Items:[{Slot:0b,id:"minecraft:stone",count:1}]}'
  - wait: 1
  - check: unless data block ~0 ~1 ~0 Items[0]
