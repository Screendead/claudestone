- name: a stream leaves the first hopper 8 gt apart
  steps:
  - run: 'data merge block ~0 ~1 ~0 {Items:[{Slot:0b,id:"minecraft:stone",count:3}]}'
  - wait: 14
  - check: unless data block ~3 ~1 ~0 Items[0]
  - wait: 1
  - check: if data block ~3 ~1 ~0 Items[{count:1}]
  - wait: 7
  - check: if data block ~3 ~1 ~0 Items[{count:1}]
  - wait: 1
  - check: if data block ~3 ~1 ~0 Items[{count:2}]
  - wait: 7
  - check: if data block ~3 ~1 ~0 Items[{count:2}]
  - wait: 1
  - check: if data block ~3 ~1 ~0 Items[{count:3}]
