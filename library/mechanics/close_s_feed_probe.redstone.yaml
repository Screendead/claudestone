name: close_s_feed_probe
description: 'Scratch probe for S''s H2 feed in the door close (door2/close_layout/s_feed.py). The whole design_c door and the nine close-feed blocks of close_feeds_probe are fixture; the design is 5 blocks,
  here in door coordinates (door + (4,3,8) = spec): sticky piston F_S (1,5,3) facing north; redstone block RB_F (1,5,2), which F_S pushes to (1,5,1), above the opening''s dust DS (1,4,1) on the wall block
  beside S''s firing cell (1,3,0); sticky piston G_S (3,5,1) facing west, extended, head (2,5,1), which pulls RB_F out to (2,5,1) when its hold, redstone block (3,6,1), goes. After the opening, the close''s
  events through stage 5 are emulated by commands between ticks, one stage per tick: k1 RB_A (1,5,-2) and RB12 removed (E0, NP12 kill: P12 retracts) and a redstone block at (-4,4,0) (P11 and P6 extend,
  S to (0,3)); k2 that block removed (P11, P6 spat), a redstone block at (1,7,1) and P_R''s hold (4,6,-1) removed (T extends); k3 the (1,7,1) block removed and glass set and cleared at (1,5,0) above T (T
  spat, C real at (1,2); T''s retract event is k3 g and T lands at k5 j), a redstone block at (-1,5,1) (P10 extends, V to (-1,3)); k4 a redstone block at (-1,3,1) and the (-1,5,1) block removed (P10 spat,
  V lands lit and pushes S to (1,3)); k5 the (-1,3,1) block removed (V spat: S real at (1,3,0)). F_S is driven by a redstone block at (1,6,3). Drive A: on k4, off k5 after V''s block (S real first, then
  RB_F spat), G_S''s hold removed k6: S extends at k5 and is spat at k6, C real at (1,1,0), RB_F parked at (2,5,1). Drive B: on k2, off k3 (RB_F spat right after T''s retract), on k6, off k7 (F_S pulls
  RB_F home): S extends at k5, spat at k7. Drive C: on k2 (RB_F lands at k4 j), off k6 (pulled home): S extends at k5, spat at k6. Each test checks the open state, then, after the ticks that decide it,
  the 18 cells the close moves or must leave alone and DS''s level against the simulator''s. T lands at k5 j under a lit DS and stays in because S is extended below it. Controls: no RB_F, S stays in; a
  pull 3 gt after S fires, S pulls C back; RB_F spat before T''s retract event, T stays out and S never arrives.'
