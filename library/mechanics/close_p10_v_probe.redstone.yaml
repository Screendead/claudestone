name: close_p10_v_probe
description: 'Scratch probe for P10 and V, stages 3 and 4 of the 3x3 door''s close (door2/close_layout/p10_v.py). Written and replayed in the simulator; not yet run on a server. The design_c door, the close
  feeds, P_R, the S feed, the trigger chain and DP''s seven blocks are fixture; the design is 2 blocks, here in door coordinates (door + (4,3,8) = spec). A dust D_V at (1,4,-4) stands on the hallway''s
  roof between NA''s dusts (2,4,-4) and (1,4,-3); a 1-tick repeater R_V at (0,4,-4) facing east, on the roof beside it, reads it and powers NV''s dust (-1,4,-4), four dusts up the line from (-1,3,-1), the
  dust that points south into V''s cell (-1,3,0). NV is the opening''s own feed of V, cut at t2 by the stone above (1,6,-6) and dark from then on; R_V feeds it west of the cut. In the opening NA dies at
  t0, R_V turns off at t2 ahead of the cut and V retracts at t3 as before. The input falls; two ticks later (c0) the trigger chain runs stages 0 and 1, and DP''s blocks stage 2 at c3 (S real at (0,3)).
  NA relights when RB_A lands at the end of c2. R_V turns on at c4: NV''s west branch is lit, 15 at (-1,4,-4) and 12 at (-1,3,-1), 1 at (5,5,0) and 0 at (4,5,0), the dust that points into P8''s quasi-connectivity
  cell, so P8 stays in. No command drives P10 or V. P10''s own 3-tick repeater (-1,5,-1) on NA turns on at c8: P10 extends, pushes V into (-1,3,0) and stays out. V lands on the lit cell at the end of c10
  and extends at c11, pushing S, which lands at (1,3) at the end of c13. V stays out, its head in (0,3), as in the closed door. Stage 5 is commands between ticks: c12 a redstone block at (1,6,3) (F_S);
  c13 removed (RB_F spat to (1,5,1) while S moves in; S lands lit and fires at c14); c15 G_S''s hold (3,6,1) removed (S spat, C real at (1,1)). Each test checks the frame 5 ticks into the opening and the
  open state, then the cells the close moves or must leave alone and the levels of DT, DS, DP, the tap, D_V and NV at (-1,4,-4), (-1,3,-1), (5,5,0) and (4,5,0) against the simulator after c0, c3, c4, c8,
  c10, c11, c13, c14, c15 and c17 (after c4: R_V on, (-1,3,0) air; after c8: P10''s head and V moving; after c10: V retracted at (-1,3,0), P10 out; after c11: V out, its head and S moving; after c13: S
  at (1,3)). Controls remove one block with setblock air strict before the opening: D_V (R_V never turns on) or R_V; in both NV stays dark, V lands at (-1,3,0) and stays in, and S stays at (0,3).'
