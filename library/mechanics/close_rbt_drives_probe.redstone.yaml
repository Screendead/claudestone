- name: 'one input and no command after it: U_T out at c3; P_U out at c26 and RB_ST pulled up at c34, U_T pulling RB_T up and K_T pulling SPC home in that tick; a redstone block in (3,7,0) and RB_T at (2,7,-1)
    after c36; RB_T back in front of P_R after c39, at (1,6,-1) after c42, under T after c50; the three redstone blocks a place on after c52; everything in after c60'
