name: close_rbt_drives_probe
description: 'Scratch probe for the return of the 3x3 door''s trigger chain after the close, from the one input with no command (door2/close_layout/rbt_drives.py). RB_T, P_R, K_T, SPC and the redstone block
  that P_R and the T feed start from go back to the closed state. Written and replayed in the simulator; not yet run on a server. The design_c door and every close step''s blocks are fixture, K_T (2,5,0)
  now a sticky piston; the design is 49 blocks, here in door coordinates (door + (4,3,8) = spec). After the close RB_T is at (2,6,-1), in front of the retracted P_R, and holds K_T out by QC; SPC is at (2,7,0)
  and RB_ST at (2,8,0). The kick: U_T, a sticky piston at (2,8,-1) facing down, beside RB_ST''s rest cell, is powered and updated by RB_ST''s landing at the end of c2 and goes out at c3, its head above
  RB_T. The loop: two more redstone blocks, RB_1 (3,7,1) and RB_2 (3,8,1), stand south of RB_ST''s closed cell (3,7,0); RB_1 goes north into it and RB_ST comes round on top of RB_2, so each of the three
  ends in the next one''s cell. P_U (2,10,0), sticky, facing down, pulls RB_ST up; P_E (4,9,0), sticky, facing west, pulls it east; P_S (3,9,-1) pushes it south; P_D (3,10,1) pushes it and RB_2 down; P_N
  (3,7,3), sticky, facing north, pushes glass G_N (3,7,2) and RB_1 north and pulls G_N back. The column: H_T (1,9,-1) facing down over glass GA and GB, which Z_T lifts with RB_T in the opening. The timer
  is one pulse: R_0, a 4-tick repeater at (2,6,3), reads the stone under the S feed''s dust D_F (lit c10 to c14) and is on from c18 to c26; R_1 (3,6,3), 4 ticks, powers stone Y_0 (4,6,3) from c26 to c34;
  eight dusts on glass climb from beside Y_0 to (2,10,1) and point into P_U. Two repeaters read that line, R_N (4,8,3) into the cell above P_N and R_E (5,9,1) into stone Y_E (5,9,0) beside P_E; R_S (4,10,-1)
  reads two dusts on and beside Y_E and points into stone Y_S (3,10,-1) above P_S; all three are 4 ticks. R_H (2,10,-1), 3 ticks, reads Y_S and points into the cell above H_T; R_D (3,11,0), 4 ticks, reads
  a dust on Y_S and points into the cell above P_D. The run: P_U goes out at c26. At c34 the line goes dark and P_U pulls RB_ST up; inside that event U_T, released, pulls RB_T up to (2,7,-1), and K_T, released
  by RB_T, pulls SPC home to (2,6,0); in the same tick P_N pushes RB_1 into (3,7,0) and P_E goes out. At the end of c36 RB_ST lands at (2,9,0), beside the cell above U_T, ahead of RB_T, whose landing in
  front of U_T updates it: U_T, powered by QC, goes out again at c37, pushing RB_T back down. RB_T lands in front of P_R at the end of c39; P_R, powered by the redstone block in (3,7,0) since the end of
  c36, goes out at c40 and RB_T lands at (1,6,-1) at the end of c42; U_T retracts at c43. At c42 P_N pulls G_N back and P_E pulls RB_ST east; R_S powers P_S, which cannot move until RB_ST lands at (3,9,0)
  at the end of c44; P_S pushes it south at c45. H_T goes out at c48 and RB_T lands at (1,5,-1), under T, at the end of c50. P_D pushes RB_ST and RB_2 down at c50: RB_2 lands at (3,7,1) and RB_ST at (3,8,1)
  at the end of c52. The S feed''s cut resets by itself (C_F home at the end of c46). The last piston, P_D, retracts at c58. Each test checks the frame 5 ticks into the opening and the open state, then
  the cells the close and the return move or must leave alone and the dust levels against the simulator after the ticks that decide it; the first test ends with every cell of the trigger chain''s east side,
  of the S feed''s cut and of the 49 blocks as loaded (the three redstone blocks one place on). Controls remove one block with setblock air strict before the opening: R_0 (nothing starts), U_T (no kick:
  the redstone blocks go round and RB_T stays where it was) or R_N (no redstone block comes into (3,7,0), P_R stays in, and U_T, updated by H_T''s push at c48, lifts RB_T again).'
