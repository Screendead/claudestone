name: close_y12_probe
description: 'Scratch probe for the re-arm of Y12, the gate relay of the 3x3 door, after the close (door2/close_layout/y12.py). Not a design yet: two sources are stand-in commands after the input. Written
  and replayed in the simulator; not yet run on a server. The design_c door with Y12 made a sticky piston, every close step''s blocks and the two returns are fixture, with U_Y''s stand-in hold; the design
  is 8 blocks, here in door coordinates (door + (6,3,8) = spec). After the west side''s return Y12 (-2,3,2) is out, held by ARM_Z11 on it at (-2,4,2) and by RB_D at (-3,4,2), and gate stone G is at (-4,3,2).
  U_Y, a sticky piston at (-2,6,2) facing down, is built out, its head on ARM_Z11, held by a redstone block two above it at (-2,8,2): the stand-in, taken out before c60 and set back before c63 with setblock
  strict. W_Y, a sticky piston at (-3,6,2) facing down above RB_D, is in at rest; stone S_W (-3,7,3) powers it from c52 to c60 through R_F, a 1-tick repeater at (-4,7,3) that reads stone S_F (-5,7,3) under
  dust D_X (-6,7,3) on Y_X. B_Y, a piston at (-4,3,3) facing north, is powered by the second stand-in, a redstone block set at (-5,3,3) before c62 and cleared before c70. The run: P_G''s extension at c58
  updates W_Y, which goes out; its head lands on RB_D at the end of c60 and updates it, unpowered since c60: at c61 it pulls RB_D up. RB12''s landing on K at the end of c60 relights NP12, which updates
  U_Y, unpowered: at c61 it pulls ARM_Z11 up. With both blocks moving Y12 retracts at c61 and pulls G, which lands at (-3,3,2) at the end of c63 and puts NP12 out. B_Y''s head is in (-4,3,2) from c62. ARM_Z11
  and RB_D land one cell up at the end of c63 and U_Y and W_Y push them down at c64; the DP tap''s repeater (-2,6,3), on from c62, turns off at c65 beside W_Y, which leaves RB_D at (-3,4,2) and retracts;
  ARM_Z11 lands on Y12 at the end of c66 and Y12, powered, cannot push G into B_Y''s head. A_D (-3,4,3), updated with the tap on when NP12 goes out, cannot push at c64: RB_D is moving into the cell in front
  of it. B_Y retracts at c70. At the end Y12 is in, powered by ARM_Z11 and RB_D, G is in its closed cell, NP12 and the tap are dark, A_D never moved and DP was never lit. In the open state the tap holds
  W_Y out and it retracts at c2 without pulling. Each test checks the frame 5 ticks into the opening and the open state, then the cells of Y12''s corner and of the west side and the dust levels against
  the simulator after the ticks that decide it, and after its last tick every cell the close and the returns move or must leave alone. Controls: without the second stand-in Y12 fires again at c67; with
  W_Y taken out with setblock air strict before the opening (and no second stand-in) U_Y lifts ARM_Z11 alone and Y12 stays out.'
traits:
- piston_based
