name: shulker_box_loader_mechanics
description: 'Box-loader parts in 26.3. A sticky piston above pushes a top slab down into a shulker box standing on a hopper and breaks it into one item that keeps its contents; if the hopper unlocks in that same tick it takes the item at once, and the slab comes back. A locked hopper leaves the item lying there. A dispenser places a box facing up when a block is under the target, else facing the way the dispenser faces. A hopper inserts from the side under a top slab. A comparator reads 15 only at 27 full stacks (14 at 1727 stone and at 431 pearls).'
traits: [container_based, comparator_based, piston_based, survival_friendly]
