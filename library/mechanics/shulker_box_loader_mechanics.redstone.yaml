tests:
- name: comparator reads 14 at 1727 stone and 15 at 27 full stacks
  initial: {lock: 1}
  steps:
  - level: {full: 14}
  - run: 'data merge block ~2 ~1 ~0 {Items:[{Slot:0b,id:"minecraft:stone",count:1}]}'
  - wait: 12
  - level: {full: 15}
  - check: if data block ~2 ~1 ~1 Items[{Slot:26b,count:64}]
  - check: unless data block ~2 ~1 ~0 Items[0]
- name: 16-stackables read 15 only at 27 x 16
  initial: {lock: 1}
  steps:
  - level: {pearl: 14}
  - run: 'data merge block ~6 ~1 ~1 {Items:[{Slot:0b,id:"minecraft:ender_pearl",count:1}]}'
  - wait: 12
  - level: {pearl: 15}
- name: a slab pushed down breaks the box and the hopper unlocked that tick takes it
  initial: {lock: 1}
  steps:
  - drive: {lock: 0}
  - wait: 1
  - drive: {brk: 1}
  - wait: 4
  - drive: {brk: 0}
  - wait: 12
  - drive: {lock: 1}
  - check: if block ~2 ~1 ~1 air
  - check: if block ~2 ~2 ~1 smooth_stone_slab[type=top]
  - log: data get block ~1 ~0 ~1 Items
  - check: 'if data block ~1 ~0 ~1 Items[{Slot:0b,id:"minecraft:shulker_box",count:1}]'
  - check: unless data block ~1 ~0 ~1 Items[1]
  - check: 'if data block ~1 ~0 ~1 Items[0].components."minecraft:container"[{slot:26}].item{id:"minecraft:stone",count:63}'
  - check: 'if data block ~1 ~0 ~1 Items[0].components."minecraft:container"[{slot:0}].item{count:64}'
  - check: positioned ~2 ~1.5 ~1 unless entity @e[type=item,distance=..6]
- name: a locked hopper leaves the box item lying until it unlocks
  initial: {lock: 1}
  steps:
  - drive: {brk: 1}
  - wait: 4
  - drive: {brk: 0}
  - wait: 20
  - check: positioned ~2 ~1.5 ~1 if entity @e[type=item,distance=..1]
  - check: unless data block ~1 ~0 ~1 Items[0]
  - drive: {lock: 0}
  - wait: 20
  - check: 'if data block ~1 ~0 ~1 Items[{Slot:0b,id:"minecraft:shulker_box",count:1}]'
  - check: positioned ~2 ~1.5 ~1 unless entity @e[type=item,distance=..6]
- name: a dispenser beside places the new box facing up onto the hopper
  initial: {lock: 1}
  steps:
  - drive: {lock: 0}
  - wait: 1
  - drive: {brk: 1}
  - wait: 4
  - drive: {brk: 0}
  - wait: 12
  - drive: {lock: 1}
  - drive: {place: 1}
  - wait: 3
  - check: if block ~2 ~1 ~1 air
  - wait: 1
  - check: if block ~2 ~1 ~1 shulker_box[facing=up]
  - drive: {place: 0}
- name: a dispenser over air places the box facing its own way
  initial: {lock: 1}
  steps:
  - drive: {place2: 1}
  - wait: 6
  - check: if block ~6 ~1 ~2 shulker_box[facing=north]
- name: 9 more place, fill and break cycles lose no box and leave no item entity
  initial: {lock: 1}
  steps:
  - drive: {lock: 0}
  - wait: 1
  - drive: {brk: 1}
  - wait: 4
  - drive: {brk: 0}
  - wait: 12
  - drive: {lock: 1}
  - repeat:
      times: 9
      steps:
      - drive: {place: 1}
      - wait: 6
      - drive: {place: 0}
      - check: if block ~2 ~1 ~1 shulker_box[facing=up]
      - run: 'data merge block ~2 ~1 ~0 {Items:[{Slot:0b,id:"minecraft:stone",count:1}]}'
      - wait: 12
      - drive: {lock: 0}
      - wait: 1
      - drive: {brk: 1}
      - wait: 4
      - drive: {brk: 0}
      - wait: 12
      - drive: {lock: 1}
      - wait: 4
      - check: if block ~2 ~1 ~1 air
      - check: positioned ~2 ~1.5 ~1 unless entity @e[type=item,distance=..6]
  - log: data get block ~1 ~0 ~1 Items
  - check: if data block ~1 ~0 ~1 Items[9]
  - check: unless data block ~1 ~0 ~1 Items[10]
  - check: 'if data block ~1 ~0 ~1 Items[9].components."minecraft:container"[{slot:0}].item{id:"minecraft:stone"}'
