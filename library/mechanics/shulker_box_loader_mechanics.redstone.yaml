  .: air
  '#': stone
  k: {input: lock}
  b: {input: brk}
  p: {input: place}
  q: {input: place2}
  L: 'repeater[facing=east,powered=true]'
  C: 'hopper[facing=west,enabled=false]{TransferCooldown:20}'
  O: chest[facing=north]
  X: 'shulker_box[facing=up]{Items:[{Slot:0b,id:"minecraft:stone",count:64},{Slot:1b,id:"minecraft:stone",count:64},{Slot:2b,id:"minecraft:stone",count:64},{Slot:3b,id:"minecraft:stone",count:64},{Slot:4b,id:"minecraft:stone",count:64},{Slot:5b,id:"minecraft:stone",count:64},{Slot:6b,id:"minecraft:stone",count:64},{Slot:7b,id:"minecraft:stone",count:64},{Slot:8b,id:"minecraft:stone",count:64},{Slot:9b,id:"minecraft:stone",count:64},{Slot:10b,id:"minecraft:stone",count:64},{Slot:11b,id:"minecraft:stone",count:64},{Slot:12b,id:"minecraft:stone",count:64},{Slot:13b,id:"minecraft:stone",count:64},{Slot:14b,id:"minecraft:stone",count:64},{Slot:15b,id:"minecraft:stone",count:64},{Slot:16b,id:"minecraft:stone",count:64},{Slot:17b,id:"minecraft:stone",count:64},{Slot:18b,id:"minecraft:stone",count:64},{Slot:19b,id:"minecraft:stone",count:64},{Slot:20b,id:"minecraft:stone",count:64},{Slot:21b,id:"minecraft:stone",count:64},{Slot:22b,id:"minecraft:stone",count:64},{Slot:23b,id:"minecraft:stone",count:64},{Slot:24b,id:"minecraft:stone",count:64},{Slot:25b,id:"minecraft:stone",count:64},{Slot:26b,id:"minecraft:stone",count:63}]}'
  F: hopper[facing=south]
  U: {block: 'barrel[facing=up]', fixture: true}
  B: {name: full, block: 'comparator[facing=north]'}
  D: 'dispenser[facing=east]{Items:[{Slot:0b,id:"minecraft:shulker_box",count:1},{Slot:1b,id:"minecraft:shulker_box",count:1},{Slot:2b,id:"minecraft:shulker_box",count:1},{Slot:3b,id:"minecraft:shulker_box",count:1},{Slot:4b,id:"minecraft:shulker_box",count:1},{Slot:5b,id:"minecraft:shulker_box",count:1},{Slot:6b,id:"minecraft:shulker_box",count:1},{Slot:7b,id:"minecraft:shulker_box",count:1},{Slot:8b,id:"minecraft:shulker_box",count:1}]}'
  T: smooth_stone_slab[type=top]
  G: sticky_piston[facing=down]
  H: hopper[facing=east]
  Y: 'shulker_box[facing=up]{Items:[{Slot:0b,id:"minecraft:ender_pearl",count:16},{Slot:1b,id:"minecraft:ender_pearl",count:16},{Slot:2b,id:"minecraft:ender_pearl",count:16},{Slot:3b,id:"minecraft:ender_pearl",count:16},{Slot:4b,id:"minecraft:ender_pearl",count:16},{Slot:5b,id:"minecraft:ender_pearl",count:16},{Slot:6b,id:"minecraft:ender_pearl",count:16},{Slot:7b,id:"minecraft:ender_pearl",count:16},{Slot:8b,id:"minecraft:ender_pearl",count:16},{Slot:9b,id:"minecraft:ender_pearl",count:16},{Slot:10b,id:"minecraft:ender_pearl",count:16},{Slot:11b,id:"minecraft:ender_pearl",count:16},{Slot:12b,id:"minecraft:ender_pearl",count:16},{Slot:13b,id:"minecraft:ender_pearl",count:16},{Slot:14b,id:"minecraft:ender_pearl",count:16},{Slot:15b,id:"minecraft:ender_pearl",count:16},{Slot:16b,id:"minecraft:ender_pearl",count:16},{Slot:17b,id:"minecraft:ender_pearl",count:16},{Slot:18b,id:"minecraft:ender_pearl",count:16},{Slot:19b,id:"minecraft:ender_pearl",count:16},{Slot:20b,id:"minecraft:ender_pearl",count:16},{Slot:21b,id:"minecraft:ender_pearl",count:16},{Slot:22b,id:"minecraft:ender_pearl",count:16},{Slot:23b,id:"minecraft:ender_pearl",count:16},{Slot:24b,id:"minecraft:ender_pearl",count:16},{Slot:25b,id:"minecraft:ender_pearl",count:16},{Slot:26b,id:"minecraft:ender_pearl",count:15}]}'
