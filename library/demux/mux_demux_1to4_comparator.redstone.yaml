name: mux_demux_1to4_comparator
description: |-
  Lightless, silent, analog 1:4 demultiplexer with every data path one comparator deep: out_k = d when (s1 s0) = k, else 0.
  The ring of mux_4to1_comparator turned inside out: d sits in the middle and feeds the backs of four subtract-mode comparators, each pointing out to its own output dust. Each gate subtracts the larger of its two corner neighbours, which carry s0 (north-west), s1 (north-east), not s0 (south-east) and not s1 (south-west) at full strength, so exactly the addressed gate passes d, strength preserved. The s0 pair is fed from the layer below (not_s0 strongly powers the block under the south-east corner; s0 runs round the south and west to rep_s0, which powers the block under the north-west corner), the s1 pair from the layer above (not_s1 powers the block over the south-west corner; s1 runs round the west and north to rep_s1 over the north-east corner). Concrete lids over the outputs and two cut blocks stop the output dust linking diagonally to that wiring.
  Interface (top view, north up; ring on the middle layer): d is the centre cell; out0 leaves north, out1 east, out2 west, out3 south (all dust on the middle layer); s0 enters on the bottom layer south-east of the ring, s1 on the top layer south-west of it (both at full strength).
  7x4x7 of blocks. Delay: d->outputs 2 ticks, selects 4 ticks (tested); strengths pass unchanged (tested). Half the data delay of a tree of 1:2 demuxes.
traits:
- ultrafast
- lightless
- silent
- pistonless
- entityless
- vertical
- comparator_based
- analog
- tick_accurate
- reset_safe
- survival_friendly
palette:
  .: air
  '=': smooth_stone
  '-': redstone_wire
  r: {name: rep_s0, block: 'repeater[facing=west]'}
  A: {name: not_s0, block: 'comparator[facing=east,mode=subtract]'}
  R: redstone_block
  s: {input: s0}
  o: {output: out0, block: redstone_wire}
  B: {name: sel_nw, block: redstone_wire}
  g: {name: gate0, block: 'comparator[facing=south,mode=subtract]'}
  C: {name: sel_ne, block: redstone_wire}
  '#': white_concrete
  D: {output: out2, block: redstone_wire}
  E: {name: gate2, block: 'comparator[facing=east,mode=subtract]'}
  d: {input: d}
  F: {name: gate1, block: 'comparator[facing=west,mode=subtract]'}
  G: {output: out1, block: redstone_wire}
  H: {name: sel_sw, block: redstone_wire}
  I: {name: gate3, block: 'comparator[facing=north,mode=subtract]'}
  J: {name: sel_se, block: redstone_wire}
  K: {output: out3, block: redstone_wire}
  M: {name: rep_s1, block: 'repeater[facing=north]'}
  N: {input: s1}
  O: {name: not_s1, block: 'comparator[facing=south,mode=subtract]'}
