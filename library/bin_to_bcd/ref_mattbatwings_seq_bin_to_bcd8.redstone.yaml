name: ref_mattbatwings_seq_bin_to_bcd8
description: 'Rebuild of BINTOBCD002 8-bit Sequential Binary to BCD (mattbatwings, endorsed; Tested & Functional, Recommended; Discord https://discord.com/channels/1361854816837435433/1472406231519068200, Logical Redstone Archive). SOURCED: README says
  it converts any 8 bit number to its BCD form; input an 8b number and a Start button, output 3 BCD digits. Size 34x12x33, 2730 blocks. HARNESS CHANGES: the lamp each of the 8 input levers hangs on (layer 5) and the lamp behind the start button (layer
  2) are white wool, because the harness only emulates levers and buttons on plain blocks (a lamp is as conductive as wool, so the circuit is the same; only the input display is lost); signs dropped; the 86 torches that were unlit in the schematic are
  placed lit=false (the stripped skeleton lit them all, which started the 12 output lamps lit; torch loops hold their state, so the schematic''s idle state is part of the design). PORTS: levers b7..b0 (named by weight, b7 the westmost, x=6) and button
  start; output lamps at x=0 on layer 10, z=2..24 in steps of 2, named h3..h0 (hundreds, bit 3 first), t3..t0 (tens), o3..o0 (ones), so z=2 is the hundreds'' 8 and z=24 the ones'' 1; hundreds only ever reaches 2. MEASURED (26.3, references plot, satellite):
  all 256 inputs convert correctly, one after another with no reset between conversions (the test checks the lamps are all dark 59 gt after the press and correct 60 gt after it, then still correct 20 gt later); the 16 spot values and an 11-conversion sequence
  pass as well. Latency is the same 60 gt from the press to the result for every input; the 12 lamps change together on that tick, and an old result is cleared 10-14 gt after the press (the ones lamps first), so the display is blank from about +14 to +60.
  INPUT IS NOT LATCHED: the levers are read in turn as the run proceeds, MSB first, one every 6 gt; releasing a lever early changes the answer. Measured hold times (releasing bit k at or after this many gt after the press leaves the answer alone, 3 gt
  resolution; one gt earlier is wrong): b7 6, b6 12, b5 18, b4 24, b3 30, b2 36, b1 42, b0 about 50 (48 fails, 50 passes), so keep the number on the levers for 50 gt (2.5 s); the tests release each bit at its limit (all pass) and check that releasing b7,
  b4 or b0 just before its limit reads that bit as 0. HOW (INFERRED from the layout and the per-tick trace; only the timings are measured): a start press sends a clear along the x=4 dust column on layer 11 to the output lamps, then a read steps along the
  row of dust at z=26 on layer 2 (cells x=6, 8, ..., 20 change 6 gt apart in the trace), one lever bit at a time, MSB first. Each step is followed by a wave through the digit grids: a 5-column grid on the left (x=4..16) and a 4-column grid on the right
  (x=23..33) per digit, torches on purple wool at hand-chosen cells, which looks like a per-digit add-3 lookup; the waves reach rows z=24, 22, 20, then 16, 14, 12, then 8, 6 in turn. That reads as shift-and-add-3 (double dabble) done as 8 sequential rounds,
  the working BCD kept in the comparator and dust latches on layers 7-10 behind the lamps, and copied to the lamps in one go at +60. The row-by-row wave and the 6 gt bit step are MEASURED; the double dabble reading is not proven.'
traits:
- torch_based
- pistonless
- entityless
- tick_accurate
