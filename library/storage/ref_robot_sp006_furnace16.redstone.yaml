name: ref_robot_sp006_furnace16
description: 'Rebuild of SP006 Simple Entityless 16 Furnace Array by Robot (Storage Catalog, MC 1.21.4; https://storagecatalog.org/archives/SP006-Simple-Entityless-16-Furnace-Array/), block for block from SP006_Simple_Entityless_16_Furnace_Array_by_Robot.litematic (its Author field says Ragdoll_Willy): 2x8x23, 206 blocks, 16 furnaces, 51 hoppers, 34 droppers. Nothing changed for the harness except names on cells (chests, furnaces) so tests can read them. How it works: an input and a fuel line of droppers facing north are fired through note blocks (quasi-connectivity) by observers watching one dust line whose level steps down by 1 every 12 gt from a comparator decay loop; a wave fires the droppers from the south end up to the current edge in the same tick, so one item travels from the stock dropper to the first unfired dropper. 16 waves per 200 gt cycle leave exactly one raw item and one fuel item over each of the 16 tap hoppers (a lamp gives the northmost observer the extra pulse). All hoppers
  are always unlocked; outputs go down a 16-hopper chain into the double chest.'
