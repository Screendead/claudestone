name: accessible_loader_2x_slice
description: 'Accessible 2x shulker box loader for a storage hall, tiled along the hall in 3-block periods that hold two boxes (lane A box opened from the west aisle, lane B box from the east aisle, a feed-only lane C between periods). Each box is filled by two hoppers from its neighbouring lanes at 5 items a second (MEASURED with both boxes of both copies running: 1000 stone into every box in 4000 gt), so the hall gets 3.33 items a second per block of length against 2.5 for AL003 (rebuilt here), and twice the rate per item type; AL001 also loads at 2.5 but its swap deadlocks in 26.3 (see its rebuild). Each box faces up under a top slab with a comparator and dust on its aisle side, as in box_loader_2x_accessible; a player click cannot be simulated, so the tests assert the block states (box facing up, top slab, comparator and dust, clear aisle cells), and the hall needs an aisle on each side. The comparator has 15 on both sides from a constant dust line along the hall, so it fires only at 27 full stacks; 8 gt later a sticky piston pushes the slab into the box and, in the same tick, a wall torch in the feed lane lets the collector hopper under the box unlock; the full box goes into the barrel under the dispenser, and an observer on the piston fires the dispenser when the slab is back, so the next box is in place about 24 gt after the box filled. Per period: 70 blocks, 8 hoppers. Inputs: a container above each feed hopper (fixture barrels in the tests); empties: the dispenser''s 9 plus a barrel feeding it through a hopper; draining the output barrel into a hall line is not built. The size covers two periods plus a closing feed lane.'
traits:
- container_based
- comparator_based
- piston_based
- survival_friendly
