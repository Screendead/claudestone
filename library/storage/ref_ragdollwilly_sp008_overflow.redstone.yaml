name: ref_ragdollwilly_sp008_overflow
description: 'Rebuild of SP008 4DC Overflow with Recycle Bin by Ragdoll Willy (https://storagecatalog.org/archives/SP008-4DC-Overflow-with-Recycle-Bin/, MC 1.21.4), block for block from SP008_RW_Overflow_v27.litematic (6x8x10, 208 blocks). Loose items enter the top hopper and fill an accessible box at hopper speed; full boxes and boxes from the Box Input hopper ride a bubble column to a hopper column over 4 double chests; boxes the column cannot take float on to a recycle chest, then a locked Recycle Bin that a lever empties into a lava cauldron, and a lamp shows the bin holds items. Changes for the harness: the whole build moved 1 block east to make room for test fixtures (a barrel over a hopper facing east into the Box Input, and a barrel over the Loose Item Input); dropped the test contents the author left (18 tridents in the displayed box, 17 boxes in the lowest overflow chest) and the custom names; kept the bell in the clock dropper and the 5 + 9 empty cyan boxes in the empties hopper and dispenser. Loading the build with commands makes its observers fire once (a pasted schematic would not), which runs one box cycle with nothing to catch the broken box, so each test first waits 40 gt, removes that box item and sets the displayed box back, then waits 20 gt.'
traits: [container_based, comparator_based, piston_based, survival_friendly]
