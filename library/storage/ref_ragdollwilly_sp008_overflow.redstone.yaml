tests:
- name: "loose stone into the box, measured over 1600 gt after 400 gt warm-up"
  steps:
  - run: scoreboard objectives add ovf dummy
  - wait: 40
  - run: 'execute positioned ~3 ~3.5 ~2 run kill @e[type=item,distance=..12]'
  - run: 'setblock ~3 ~3 ~2 cyan_shulker_box[facing=up]'
  - wait: 20
  - insert: {"cell": "loose_src", "items": [{"id": "stone", "count": 64}, {"id": "stone", "count": 64}, {"id": "stone", "count": 64}, {"id": "stone", "count": 64}, {"id": "stone", "count": 64}, {"id": "stone", "count": 64}, {"id": "stone", "count": 64}, {"id": "stone", "count": 64}, {"id": "stone", "count": 64}, {"id": "stone", "count": 64}, {"id": "stone", "count": 64}, {"id": "stone", "count": 64}, {"id": "stone", "count": 64}, {"id": "stone", "count": 32}]}
  - wait: 400
  - throughput: {"to": "box", "item": "stone", "ticks": 1600, "min": 1}
  - log: data get block ~3 ~3 ~2 Items[-1]
  finally: [scoreboard objectives remove ovf]
