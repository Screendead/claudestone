name: corner_cart_unloader_4x
description: Our rebuild of a published mechanism, not a new design (GiorgioJGZ's 4x Hopper Speed Shulker Box Unloader, youtube svv07jrkAEg, uses the same cart over four hoppers in volume 60 against this build's 180). Shulker box unloader for feeding a sorter or furnace array from boxes, measured at 10 items per second (4x one hopper, 36k items/h, a full box of 1728 in 173 s, no gap between boxes). One hopper minecart lies on four bottom slabs over four hoppers, off-centre where all four drain it, and pulls 1 item per game tick from the box two blocks up. An emptied box is broken by a piston and pushed into a return chest, empty (a box of 10 stacks or more; a nearly empty box can be caught by the cart and comes out with the items instead), and a dispenser places the next full box. Output that backs up stalls without spilling items.
traits: [survival_friendly, container_based, uses_entities, compact]
