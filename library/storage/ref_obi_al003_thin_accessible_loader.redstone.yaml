name: ref_obi_al003_thin_accessible_loader
description: 'Rebuild of AL003 5 Thin Composter Accessible Loader by Obi (https://storagecatalog.org/archives/AL003-5-Thin-Composter-Accessible-Loader/, MC 1.21.4, "A simple 5 block wide accessible loader with a zero ticked composter that buffers 16 stacks"), block for block from AL003_thin_accessible_loader.litematic including its stock of lime boxes in the dispenser and the two box hoppers, built as three slices along its 1-block tile axis; all three slices are fed and the middle one is measured. Harness changes: a fixture barrel + hopper above each input hopper and a barrel under each collection hopper. The harness load fires the observers, which breaks the first box and places the next; tests clear the output barrels after that. In 26.3 it works: it loads at hopper speed (M1) and two full boxes of 27 stacks reach the output in 40000 gt of continuous 2.5 items-a-second feed (M2, all three slices fed and each delivering 2); the first swap waits for the 16-stack buffer to fill.'
traits:
- container_based
- comparator_based
- piston_based
- survival_friendly
