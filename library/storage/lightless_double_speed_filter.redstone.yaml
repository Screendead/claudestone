name: lightless_double_speed_filter
description: |
  A torchless item-sorter module for a storage hall: four filter slices side by side, one item
  type per block of width, each draining its filter at 5 items per second (measured: 40 items
  in 160 game ticks per slice, and two slices at once across the seam of two tiled modules).
  Each slice is the wiki double-speed layout (filter hopper F facing down into a full-stack
  hopper M, a second hopper E under M) with the torch replaced by a comparator inverter, so no
  block changes light and nothing can burn out under a steady stream.
  How it works per slice: comparator `sense` reads F (41 target + 64/64/12/1 junk reads 8, the
  42nd target reads 9) and drives a stone block; dust on it carries the level to the `contact`
  dust beside `invert`, a compare-mode comparator whose rear reads a composter (level 3, or 2 on
  the longer variant). While the side is at most the composter level, invert outputs it, a
  repeater powers the block behind M and a lone cross dust under that block powers E: both
  locked. One extra target raises the side above the composter and unlocks M and E until F is
  back to 41. A drained filter reads lower, so it stays locked.
  Layout: period 4 along the line (x): A, B (A mirrored north-south), A2, B2 (A2 mirrored);
  A-types build north of the hopper column, B-types south, so every slice only borrows two dust
  cells of its east neighbour for the inverter's side input (a comparator's side is always a
  neighbour column in a 1-wide slice, so identical 1-wide slices cannot hold one). Column x=4
  is the next module's first column; tile modules at pitch 4. Storage: two barrels per slice
  (barrels, not chests: they never merge). probe_* are test inputs that force a slice open.
  Throughput is drain capacity, measured with a hopper feeding F from above; a hopper pipe
  delivers at most 2.5 items per second along the line.
traits: [container_based, comparator_based, analog, survival_friendly, pistonless, entityless, silent, lightless, tileable, reset_safe]
