  - wait: 10
  - expect: {full_a: 1, pull_a: 1, full_b: 1, pull_b: 1, full_c: 1, pull_c: 1, full_d: 1, pull_d: 1}
  - expect: {filter_a: 0, line_a: 0, filter_b: 0, line_b: 0, filter_c: 0, line_c: 0, filter_d: 0, line_d: 0}
  - level: {sense_a: 8, sense_b: 8, sense_c: 8, sense_d: 8}
  - level: {contact_a: 3, contact_b: 3, contact_c: 2, contact_d: 2}
  - level: {invert_a: 3, invert_b: 3, invert_c: 2, invert_d: 2}
