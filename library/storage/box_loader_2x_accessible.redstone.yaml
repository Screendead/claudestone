name: box_loader_2x_accessible
description: 'Shulker box loader for a sorter''s bulk output that stays open to the player. Two hoppers fill the box at 5 items a second (twice hopper speed, a full 27-stack box of stone reaches the chest about 6,930 game ticks, 5.8 minutes, after the first item), a comparator that fires only at 27 full stacks unlocks the hopper under the box and, in the same tick, has a sticky piston push a slab down that breaks the box into that hopper and on to the chest; and the dispenser (restocked by a hopper from an empties chest) puts the next one in when the lock torch relights. The box can be opened from the west over the comparator while it loads. Input: any containers above the two feed hoppers.'
traits: [container_based, comparator_based, piston_based, survival_friendly]
palette:
  .: air
  '#': stone
  g: glass
  R: redstone_block
  S: stone
  t: 'redstone_wall_torch[facing=south,lit=true]'
  w: 'repeater[facing=west,delay=3]'
  r: 'repeater[facing=west,delay=4]'
  C: 'hopper[facing=south,enabled=false]'
  O: chest[facing=south]
  a: 'redstone_wire[south=up,east=side]'
  b: 'redstone_wire[west=side,east=side]'
  d: 'redstone_wire[east=side,north=side,south=up]'
  e: 'redstone_wire[north=up,south=side]'
  f: 'redstone_wire[south=side,east=side]'
  s: 'redstone_wire[north=side,south=side]'
  F: hopper[facing=south]
  H: hopper[facing=north]
  B: {name: full, block: 'comparator[facing=east]'}
  X: shulker_box[facing=up]
  D: 'dispenser[facing=west]{Items:[{Slot:0b,id:"minecraft:shulker_box",count:1}]}'
  U: {block: 'barrel[facing=up]', fixture: true}
  T: smooth_stone_slab[type=top]
  E: hopper[facing=down]
  K: 'chest[facing=west]{Items:[{Slot:0b,id:"minecraft:shulker_box",count:1},{Slot:1b,id:"minecraft:shulker_box",count:1},{Slot:2b,id:"minecraft:shulker_box",count:1},{Slot:3b,id:"minecraft:shulker_box",count:1},{Slot:4b,id:"minecraft:shulker_box",count:1},{Slot:5b,id:"minecraft:shulker_box",count:1},{Slot:6b,id:"minecraft:shulker_box",count:1},{Slot:7b,id:"minecraft:shulker_box",count:1}]}'
  G: {name: piston, block: 'sticky_piston[facing=down]'}
layers:
  0: |
    ....
    abwS
    ##Ct
    .RO.
  1: |
    ....
    ..F.
    dBXD
    #sH.
  2: |
    ....
    ..U.
    g#TE
    e#U.
  3: |
    ....
    ....
    frGK
    ....
