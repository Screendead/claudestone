name: furnace_array_fhl
description: |-
  Entityless 16-furnace array whose 48 slice hoppers (input taps, fuel taps, output hoppers) stay locked except for 2 gt after each of the 16 item waves per 200 gt cycle and 2 flush pulses, built on SP006's wave distributor (Robot, Storage Catalog; rebuilt here as ref_robot_sp006_furnace16). Measured on 26.3 with the same tests as the rebuild: 320 ingots in 4000 gt (1.60 items/s, the 16-furnace ceiling, same as SP006); a 160-item batch spreads evenly (no furnace over 1 raw item at 1000 gt) and fully drains (every tap, furnace and output hopper empty), all 160 in the chest between 3220 and 3420 gt against 2220-2420 for SP006 (the slower tail is the flush clock's 2 pulses per cycle); slice hoppers unlocked 19% of hopper-ticks running and 1.8% idle, against 100% and 100% for SP006. The three feed hoppers under the input and fuel chests are SP006's and stay unlocked in both.
  What was added to SP006 (its dropper lines, note blocks, observers, lamp, comparator fader, feed and fuel chests are unchanged, one block higher): (1) one repeater per furnace pointing into its front (x=2), fed by a dust trunk (x=3); a powered furnace locks its input tap above, fuel tap beside and output hopper below. (2) The trunk is lit through a block over its middle by a repeater (4,3,9) driven by a subtract comparator (4,3,10) whose rear reads a level-1 composter; an observer (2,8,16) on the fader's y7 source dust fires on each of the 16 waves per 200 gt cycle and its dust pulse reaches the comparator's side, so the trunk drops for 2 gt and every slice hopper is unlocked from 6 to 8 gt after the wave (the item lands at 4; the lamp refires the z1 droppers at 8). A torch, or a comparator facing dust, misses a 2 gt observer pulse; a comparator facing a repeater catches it (library/mechanics/observer_pulse_torch_comparator_priority). (3) The 16-hopper output chain is split into two chains of 8 that meet over a double chest under furnaces 7 and 8 (y=0), so each chain end gets more unlocks than items. (4) A free-running copy of SP006's fader (x 3-4, z 16-22) with an observer on one comparator adds 2 unlocks per cycle at all times, so after a batch the taps push their last item, the furnaces are emptied and the chains drain; without it the end of every batch was stranded (127 of 160 at 2800 gt).
  Use: raw items into the double chest on top (feed), fuel into the double chest beside it (fuel), ingots from the chest under the middle. Fuel handling is SP006's: one fuel item per raw item reaches each furnace, so the surplus collects in the fuel slots and fuel taps. Size 6x9x23 (1242, against 2x8x23 = 368), 328 blocks against 206: +32 dust, +47 smooth stone, +19 repeaters, +7 comparators, +9 glass, +2 observers, +4 concrete, +1 wall torch, +1 composter; still 51 hoppers. Each furnace keeps the fuel surplus: from a 64-coal batch for 160 items every furnace burned 2 and kept 2, in both builds.
traits:
- container_based
- entityless
- survival_friendly
