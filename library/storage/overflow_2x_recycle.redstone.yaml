name: overflow_2x_recycle
description: 'Overflow stage for the end of a storage hall, with no item entities and no water. Loose items fill an open-able shulker box at 5 items a second through two feed hoppers (round 1''s box_loader_2x_accessible, unchanged except that its unlock hopper now drops the full box into the entry hopper instead of a chest; the 5 items a second needs the loose stream on two hopper lines, so the tests feed it from two barrels where the SP008 rebuild gets one), and the box is swapped at exactly 27 full stacks. Full boxes and boxes from the Box Input hopper go through the entry hopper into a hopper column over 4 double chests. A comparator reads the top column hopper with a redstone block on its side, so it outputs only when that hopper holds 5 boxes, which happens only once every chest and column hopper is full; then dust turns off the torch that locks the recycle hopper under the entry hopper, the recycle hopper takes the boxes the column cannot into 2 double chests (108 boxes), and the lamp lights. Freeing any space in the overflow locks the recycle hopper again and puts the lamp out. Unlike SP008 it has no lava trash for the recycle chests.'
traits: [container_based, comparator_based, piston_based, entityless, survival_friendly]
