name: ref_vktec_al001_accessible_loader
description: 'Rebuild of AL001 Bottom-Accessible Shulker Loader by vktec (https://storagecatalog.org/archives/AL001-Bottom-Accessible-Shulker-Loader/, MC 1.16.5, "Single hopper-speed loader", "One wide tileable"), block for block from AL001_accessible_shulker_loader.litematic, built as three slices with slime, honey, slime as the README says to tile it; tests measure the middle slice. Harness changes: fixture barrel + hopper above each input dropper and a barrel under each collection hopper; 9 empty boxes in each dispenser (the file has none) and 5 in the end of the box line; the harness load fires every observer, which flips the slime toggle into its swap state, so each test re-places each line hopper twice in one tick (one observer pulse toggles it back) and then clears the box that load broke. In 26.3 it loads at hopper speed (M1, about 2.5 items a second) but the first swap deadlocks: the dispenser fires about 6 gt before the breaker composter leaves the box cell, so no new box is placed and the input stays locked (M2, MEASURED); re-firing the dispenser by hand afterwards completes the swap (diagnostic test). The full box reached the collection hopper in 1 of 3 sampled swaps; in the other 2 it fell to the floor. Whether 1.16.5 timing differed is not shown.'
traits:
- container_based
- comparator_based
- piston_based
- survival_friendly
