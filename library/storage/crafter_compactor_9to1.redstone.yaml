- name: hold stops the feed and releasing it resumes
  steps:
  - drive: {hold: 1}
  - run: 'data merge block ~0 ~1 ~1 {Items:[{Slot:0b,id:"minecraft:iron_ingot",count:18}]}'
  - wait: 200
  - expect: {feed: 1, fire: 0}
  - check: unless data block ~0 ~1 ~2 Items[0]
  - check: if data block ~0 ~1 ~1 Items[{count:18}]
  - drive: {hold: 0}
  - wait: 200
  - check: if data block ~0 ~0 ~2 Items[{id:"minecraft:iron_block",count:2}]
  - check: unless data block ~0 ~1 ~2 Items[0]
- name: full output barrel
  steps:
  # a spill from an earlier run can lie just outside the harness clear
  - run: execute positioned ~0 ~0 ~2 run kill @e[type=item,distance=..8]
  - run: 'data merge block ~0 ~0 ~2 {Items:[{Slot:0b,id:"stone",count:64},{Slot:1b,id:"stone",count:64},{Slot:2b,id:"stone",count:64},{Slot:3b,id:"stone",count:64},{Slot:4b,id:"stone",count:64},{Slot:5b,id:"stone",count:64},{Slot:6b,id:"stone",count:64},{Slot:7b,id:"stone",count:64},{Slot:8b,id:"stone",count:64},{Slot:9b,id:"stone",count:64},{Slot:10b,id:"stone",count:64},{Slot:11b,id:"stone",count:64},{Slot:12b,id:"stone",count:64},{Slot:13b,id:"stone",count:64},{Slot:14b,id:"stone",count:64},{Slot:15b,id:"stone",count:64},{Slot:16b,id:"stone",count:64},{Slot:17b,id:"stone",count:64},{Slot:18b,id:"stone",count:64},{Slot:19b,id:"stone",count:64},{Slot:20b,id:"stone",count:64},{Slot:21b,id:"stone",count:64},{Slot:22b,id:"stone",count:64},{Slot:23b,id:"stone",count:64},{Slot:24b,id:"stone",count:64},{Slot:25b,id:"stone",count:64},{Slot:26b,id:"stone",count:64}]}'
  - run: 'data merge block ~0 ~1 ~1 {Items:[{Slot:0b,id:"minecraft:iron_ingot",count:9}]}'
  - wait: 150
  # the crafter does not wait for room: the block is thrown out as an item entity
  - check: unless data block ~0 ~1 ~2 Items[0]
  - check: if data block ~0 ~0 ~2 Items[{Slot:26b,id:"minecraft:stone",count:64}]
  - check: unless data block ~0 ~0 ~2 Items[{id:"minecraft:iron_block"}]
  - check: positioned ~0 ~0 ~2 if entity @e[type=item,distance=..4,nbt={Item:{id:"minecraft:iron_block",count:1}}]
  finally: ['execute positioned ~0 ~0 ~2 run kill @e[type=item,distance=..8]']

- name: side by side slices work independently
  tile: [1, 0, 0]
  truth_table: |
    hold | feed
    0    | 0
    1    | 1
  delay: 0
  steps:
  # a spill from an earlier run can lie just outside the harness clear
  - run: execute positioned ~0 ~0 ~2 run kill @e[type=item,distance=..8]
  # the two slices' dust joins sideways, as in a player-built row
  - check: if block ~0 ~1 ~4 redstone_wire[east=side]
  - check: if block ~0 ~3 ~6 redstone_wire[east=side]
  - check: if block ~0 ~2 ~2 redstone_wire[east=side]
  - check: if block ~1 ~2 ~2 redstone_wire[west=side]
  # the table ends with the second copy's hold still on
  - run: setblock ~1 ~1 ~0 air
  - wait: 4
  - check: if block ~1 ~1 ~1 hopper[enabled=true]
  - run: 'data merge block ~0 ~1 ~1 {Items:[{Slot:0b,id:"minecraft:iron_ingot",count:18}]}'
  - run: 'data merge block ~1 ~1 ~1 {Items:[{Slot:0b,id:"minecraft:bone_meal",count:13}]}'
  - wait: 400
  - log: data get block ~1 ~1 ~2 Items
  - check: if data block ~0 ~0 ~2 Items[{id:"minecraft:iron_block",count:2}]
  - check: unless data block ~0 ~0 ~2 Items[1]
  - check: unless data block ~0 ~1 ~2 Items[0]
  - check: if data block ~1 ~0 ~2 Items[{id:"minecraft:bone_block",count:1}]
  - check: unless data block ~1 ~0 ~2 Items[1]
  - check: if data block ~1 ~1 ~2 Items[3]
  - check: unless data block ~1 ~1 ~2 Items[4]
  - check: unless data block ~1 ~1 ~2 Items[{id:"minecraft:white_dye"}]
  - check: positioned ~0 ~0 ~2 unless entity @e[type=item,distance=..4]
  # a neighbour firing at 9 must not lift this slice's dust while it holds 8
  - run: 'data merge block ~0 ~1 ~2 {Items:[{Slot:0b,id:"minecraft:iron_ingot",count:1},{Slot:1b,id:"minecraft:iron_ingot",count:1},{Slot:2b,id:"minecraft:iron_ingot",count:1},{Slot:3b,id:"minecraft:iron_ingot",count:1},{Slot:4b,id:"minecraft:iron_ingot",count:1},{Slot:5b,id:"minecraft:iron_ingot",count:1},{Slot:6b,id:"minecraft:iron_ingot",count:1},{Slot:7b,id:"minecraft:iron_ingot",count:1}]}'
  - run: 'data merge block ~1 ~1 ~2 {Items:[{Slot:0b,id:"minecraft:iron_ingot",count:1},{Slot:1b,id:"minecraft:iron_ingot",count:1},{Slot:2b,id:"minecraft:iron_ingot",count:1},{Slot:3b,id:"minecraft:iron_ingot",count:1},{Slot:4b,id:"minecraft:iron_ingot",count:1},{Slot:5b,id:"minecraft:iron_ingot",count:1},{Slot:6b,id:"minecraft:iron_ingot",count:1},{Slot:7b,id:"minecraft:iron_ingot",count:1}]}'
  - run: 'data merge block ~1 ~1 ~1 {Items:[{Slot:0b,id:"minecraft:iron_ingot",count:1}]}'
  - wait: 40
  - check: if data block ~1 ~0 ~2 Items[{id:"minecraft:iron_block",count:1}]
  - check: unless data block ~1 ~1 ~2 Items[0]
  - check: if data block ~0 ~1 ~2 Items[7]
  - check: unless data block ~0 ~1 ~2 Items[8]
  - check: unless data block ~0 ~0 ~2 Items[1]
  - level: {cmp: 8, fire: 0}
