name: route_chain
description: Two NOT gates joined by a routed wire.
palette:
  .: air
  '=': smooth_stone
  '#': white_concrete
  A: {input: A.a}
  '>': repeater[facing=west]
  ): redstone_wall_torch[facing=east]
  '-': redstone_wire
  v: repeater[facing=north]
  B: {output: B.out, block: redstone_wire}
layers:
  0: |
    .................
    .................
    .====########....
    ............#....
    ............#....
    ............#....
    ............#....
    ............#....
    ............#====
  1: |
    .................
    .................
    A>#)->-------....
    ............-....
    ............-....
    ............-....
    ............-....
    ............v....
    ............->#)B
tests:
- name: logic
  truth_table: |
    A.a | B.out
    0 | 0
    1 | 1
  max_delay: 12
