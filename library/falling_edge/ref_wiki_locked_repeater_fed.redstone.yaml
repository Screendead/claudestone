name: ref_wiki_locked_repeater_fed
description: 'Reference rebuild of the Minecraft Wiki "Locked-repeater falling edge detector", credited to the wiki editors (Redstone circuits/Pulse, https://minecraft.wiki/w/Redstone_circuits/Pulse#locked-repeater_falling_edge_detector ; schematic from https://minecraft.wiki/w/Redstone_circuits/Pulse/fed, drawn there top-down with the input on). Wiki figures: 2x3x2 (12), flat, silent, delay 2 ticks, output pulse 1 tick. The wiki input line (dust at x=2, z=0) and output line (dust at x=5, z=2) are fixtures on fixture supports; driver a (x=1) powers the input dust (driver b at x=0 is used only by the repeater-fed test, which first sets a delay-1 repeater into the a cell). Two delay-1 repeaters (x=4) take the input: the z=1 one points into the side of repeater rep (x=5, z=1, pointing south), the z=0 one feeds rep through dust x=5, z=0.'
traits: [flat, silent, lightless, pistonless, entityless]
palette:
  .: air
  '=': smooth_stone
  '-': redstone_wire
  a: {input: a}
  b: {input: b}
  i: {block: redstone_wire, fixture: true}
  f: {block: smooth_stone, fixture: true}
  r: 'repeater[facing=west,delay=1]'
  R: {name: rep, block: 'repeater[facing=north,delay=1]'}
  o: {output: out, block: redstone_wire, fixture: true}
layers:
  0: |
    ..f===.
    ...===.
    .....f.
  1: |
    bai-r-.
    ...-rR.
    .....o.
