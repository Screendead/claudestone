name: ref_wiki_dust_cut_fed
description: 'Reference rebuild of the Minecraft Wiki "Dust-cut falling edge detector", credited to the wiki editors (Redstone circuits/Pulse, https://minecraft.wiki/w/Redstone_circuits/Pulse#dust-cut_falling_edge_detector ; schematic from https://minecraft.wiki/w/Redstone_circuits/Pulse/fed, drawn there with the input on). Wiki figures: 1x4x3 (12), 1-wide, instant, delay 0, output pulse 2 rt. Side view, one block wide, running east. The wiki input line (dust at x=2, y=1, on a support) and output line (dust at x=7, y=1, on a support) are fixtures, so the measured size counts the same four columns the wiki counts; driver a (x=1) powers the input dust at 15 (driver b at x=0 is used only by the repeater-fed test, which first sets a delay-1 repeater into the a cell). The input dust powers block x=3, y=1, which powers the sticky piston above it (facing east) and a delay-2 repeater (x=4, y=1) feeding the lower dust x=5, y=1; that dust climbs to x=6, y=2 and steps down to out. While the input is on, the piston holds the concrete block in x=5, y=2 (reserved), cutting the climb; when it falls the block is pulled back at once and the still-on repeater gets through.'
traits: [one_wide, piston_based, entityless]
palette:
  .: air
  '=': smooth_stone
  '#': white_concrete
  '-': redstone_wire
  _: {reserve: true}
  a: {input: a}
  b: {input: b}
  i: {block: redstone_wire, fixture: true}
  f: {block: smooth_stone, fixture: true}
  P: {name: piston, block: 'sticky_piston[facing=east]'}
  R: {name: rep, block: 'repeater[facing=west,delay=2]'}
  L: {name: low, block: redstone_wire}
  u: {name: up, block: redstone_wire}
  o: {output: out, block: redstone_wire, fixture: true}
layers:
  0: |
    ..f.==.f
  1: |
    bai=RL=o
  2: |
    ...P#_u.
