name: pulse_falling_comparator
description: 'Falling-edge detector with no torches: comparator out (x=2, z=0, subtract mode, facing west) has input a (x=2, z=1) directly on its south side (15) and on its back a delayed copy of a: a delay-2 repeater (x=1, z=1, facing east) takes a and feeds dust x=0 z=1, x=0 z=0, x=1 z=0 into the back. Out = delayed(a) - a: a fall gives a 4 tick pulse 2 ticks later (output east of out, x=3), a rise gives nothing because the side input arrives first. For inputs shorter than 4 ticks the pulse still comes, 6 ticks after the rise. Pulse = 2 x repeater delay (delay 1 gives nothing, the repeater wins the tie). 3x2x2 with its base, flat, silent. Trade-off: the smallest and fastest falling edge here; versus pulse_falling_observer_lock it has a longer pulse and handles every input width, versus pulse_falling_torch_1wide it is 2 wide but lightless.'
traits: [ultracompact, ultrafast, flat, horizontal, comparator_based, silent, lightless, pistonless, entityless, tick_accurate, reset_safe, survival_friendly]
palette:
  .: air
  '=': smooth_stone
  a: {input: a}
  '-': redstone_wire
  r: repeater[facing=east,delay=2]
  o: {output: out, block: 'comparator[facing=west,mode=subtract]'}
layers:
  0: |
    ===
    ===
  1: |
    --o
    -ra
