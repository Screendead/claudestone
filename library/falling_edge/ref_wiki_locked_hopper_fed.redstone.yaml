name: ref_wiki_locked_hopper_fed
description: 'Reference rebuild of the Minecraft Wiki "Locked-hopper falling edge detector", credited to the wiki editors (Redstone circuits/Pulse, https://minecraft.wiki/w/Redstone_circuits/Pulse#locked-hopper_falling_edge_detector ; schematic from https://minecraft.wiki/w/Redstone_circuits/Pulse/fed; earliest known publication shufflepower, r/redstone, 22 May 2013). Wiki figures: 1x4x2 (8), 1-wide, silent, delay 1 tick, output pulse 3.5 ticks (Java), output strength 1 (stackable item), fastest input clock a 4-clock. Side view, running east. The wiki input line (dust at x=2, y=1) and output line (dust at x=7, y=1) are fixtures on fixture supports; driver a (x=1) powers the input dust (driver b at x=0 is used only by the repeater-fed test). Dust x=3 locks hopper A (x=4, facing east, one stick) and turns off the wall torch under A; when the input falls the torch takes 2 ticks to relock A, which meanwhile pushes its stick into hopper B (x=5, facing west), read by comparator cmp (x=6) until B pushes it back.'
traits: [one_wide, flat, silent, pistonless, entityless, container_based]
palette:
  .: air
  '=': smooth_stone
  '-': redstone_wire
  a: {input: a}
  b: {input: b}
  i: {block: redstone_wire, fixture: true}
  f: {block: smooth_stone, fixture: true}
  t: 'redstone_wall_torch[facing=east]'
  A: {name: hopa, block: 'hopper[facing=east,enabled=false]{Items:[{Slot:0b,id:"minecraft:stick",count:1}]}'}
  B: {name: hopb, block: 'hopper[facing=west]'}
  C: {name: cmp, block: 'comparator[facing=west]'}
  o: {output: out, block: redstone_wire, fixture: true}
layers:
  0: |
    ..f=t.=f
  1: |
    bai-ABCo
