name: ref_wiki_moved_block_fed
description: 'Reference rebuild of the Minecraft Wiki "Moved-block falling edge detector", credited to the wiki editors (Redstone circuits/Pulse, https://minecraft.wiki/w/Redstone_circuits/Pulse#moved-block_falling_edge_detector ; schematic from https://minecraft.wiki/w/Redstone_circuits/Pulse/fed, drawn there with the input on; earliest known publication fennoman12, 27 May 2013). Wiki figures: 1x3x3 (9), 1-wide; the page says delay 1 rt and pulse 1 rt, the schematic gallery says 1.5 and 0.5. Side view, one block wide, running east. The wiki input line (dust at x=2, y=1) and output line (dust at x=6, y=1) are fixtures on fixture supports; driver a (x=1) powers the input dust (driver b at x=0 is used only by the repeater-fed test, which first sets a delay-1 repeater into the a cell). The input climbs onto x=3, y=2 and powers block x=4, y=2, which powers the sticky piston x=5, y=2 (facing down) that pushes the concrete block from x=5, y=1 into x=5, y=0 (reserved); the input also powers a delay-2 repeater (x=4, y=1) pointing at that block. When the input falls the piston pulls the block back while the repeater is still on, so the block is hard-powered and powers out.'
traits: [one_wide, piston_based, entityless]
palette:
  .: air
  '=': smooth_stone
  '#': white_concrete
  '-': redstone_wire
  _: {reserve: true}
  a: {input: a}
  b: {input: b}
  i: {block: redstone_wire, fixture: true}
  f: {block: smooth_stone, fixture: true}
  P: {name: piston, block: 'sticky_piston[facing=down]'}
  R: {name: rep, block: 'repeater[facing=west,delay=2]'}
  o: {output: out, block: redstone_wire, fixture: true}
layers:
  0: |
    ..f.=_f
  1: |
    bai=R#o
  2: |
    ...-=P.
