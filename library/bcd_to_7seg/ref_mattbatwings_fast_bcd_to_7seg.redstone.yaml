name: ref_mattbatwings_fast_bcd_to_7seg
description: 'Rebuild of NUMDISPLAY001 Fast BCD to 7seg (mattbatwings, endorsed; Tested & Functional, Recommended; Discord https://discord.com/channels/1361854816837435433/1472415095173681264, entry NUMDISPLAY001_Fast_BCD_to_7seg in the Logical Redstone Archive). SOURCED: README says "A fast design to show a BCD number. Synced, but very tall", input 4b. Size 29x23x5 (tall: 23 layers), 5x9 lamp seven-segment face at x=0 looking west (viewer west of it: z=0 is the viewer''s left, so the lamp names l<row><col> count rows from the top and cols from the viewer''s left), 1258 blocks. HARNESS CHANGE: the four levers (x=29) and the lamp each lit through (x=28) are replaced by one redstone-block driver cell at x=28, which powers the x=27 repeater facing east directly; signs dropped. INPUTS i2/i4/i6/i8 are bit 0/1/2/3 (named by the layer they enter on). HOW (INFERRED from the block layout, then confirmed by the tests): (1) y=1..8, four layers, one per bit: the bit''s dust line runs west along z=4 and powers the wool strip under/over it; at each of 10 columns (x=9..25 odd for digits 9..1, x=27 for 0) a torch (bit inverted) or repeater (bit as is) per bit feeds a dust ladder that zigzags up the column on lime/orange glass (glass is a non-conductor so dust steps up past it). The ladder is an OR of the four literals chosen per digit; a torch on top of the column (y=9, y=10 for the zero column) inverts it, so it is lit for exactly that digit (a one-hot decoder; 10-15 light none). (2) y=10..22, seven even layers, one per segment: the digit''s lime wool carries it up a second ladder; on each segment''s layer a repeater (P) at the column of every digit that lights that segment drops it onto the layer''s dust bus along z=4 (the zero column joins through a repeater on the bus end instead), so a bus is an OR of its digits: d bottom {0,2,3,5,6,8}, c {0,1,3,4,5,6,7,8,9}, e {0,2,6,8}, g {2,3,4,5,6,8,9} (no 0), b {0,1,2,3,4,7,8,9}, f {0,4,5,6,8,9}, a top {0,2,3,5,6,7,8,9} (layers 10,12,...,22 in that order); this 7-segment font has no tail on the 9. (3) each bus runs west through a repeater to the lamp wall, where dust, targets and wall torches light the three lamps of its segment. Every segment''s route has the same diode sequence (input repeater, per-bit torch or repeater, top torch, segment repeater, bus repeater), which is INFERRED to be the README''s "synced". MEASURED (26.3, references plot, satellite): digits 0-9 light exactly the expected lamps, all 45 checked (the 24 other lamps stay dark, glitch free through the settle and hold); every one of the 90 digit-to-digit changes (an Eulerian walk of the 10 digits) passes; inputs 10-15 give a blank display (not claimed by the README). Delay from input change to lamp: 14 gt to light, 18 gt to go dark (lamps go out 4 gt after their power), except l10, l14, l50 and l54 (the first lamp below the top bar of f and b, and below the middle bar of e and c), which light at 18 and go dark at 22: those four trail the rest of their segment by 4 gt (cause not traced). For comparison library/bcd_to_7seg/seg_dec_bcd is 17x6x23 and decodes to segment wires in 6 gt, with no lamps.'
traits:
- vertical
- torch_based
- silent
- pistonless
- entityless
- tick_accurate
