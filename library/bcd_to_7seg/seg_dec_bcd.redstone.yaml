name: seg_dec_bcd
description: '4-bit BCD (A = bit 0 ... D = bit 3) to seven segment outputs, as two stacked planes sharing one footprint. Top (y=5): the four input columns A, B, C, D running south. Middle (y=3): ten digit rows running east, one per digit, each powered unless the input is that digit: for every bit that is 1 in the digit, a wall torch on the input column''s block hangs over the row (lit while the bit is 0); for every bit that is 0, a diode tap (dust stub, block, repeater, block standing on the row) powers the row while the bit is 1. Bottom (y=1): seven segment columns running south; a wall torch on a digit row''s block hangs over each segment column the digit lights, so a column lights while its digit''s row is off. Codes 10-15 are don''t-cares (8 = A''D and 9 = AD use them) and are not tested. The digit row order (0 1 2 3 6 7 8 9 4 5) is the one a search found where no torch tap sits under a diode stub of the same column two rows later (the torch would power the stub and so the input column).
  Each input column is fed from above its middle so no input dust runs more than 11 blocks; each segment column has one repeater for the far rows. Interface: drive each input from above at y=6, z=11: A x=3, B x=6, C x=9, D x=12 (tested with a redstone block there; a block hard-powered by a repeater should act the same); outputs at the south end z=23, y=1: a x=0, b x=3, c x=6, d x=9, e x=12, f x=14, g x=16. The rows are the digit decoded active-low, if a one-hot output is wanted too. 17 wide x 6 tall x 23 deep, 941 blocks, 64 torches and 22 repeaters. Delay: 6 game ticks worst case (tap 2 + torch 2 + column repeater 2), tested on every digit. Trade-off: the library''s PLA generator (redstone/pla.py) run on this same function gives 61x4x59 with a 28-tick bound, so this is about a sixth of the volume and far faster, but torches make light and burn out if an input toggles 8 times within 60 ticks.'
traits:
- torch_based
- entityless
- pistonless
- fast
- compact
- reset_safe
- survival_friendly
- tick_accurate
palette:
  .: air
  '#': white_concrete
  '-': redstone_wire
  v: repeater[facing=north]
  a: {output: a, block: redstone_wire}
  b: {output: b, block: redstone_wire}
  c: {output: c, block: redstone_wire}
  d: {output: d, block: redstone_wire}
  e: {output: e, block: redstone_wire}
  f: {output: f, block: redstone_wire}
  g: {output: g, block: redstone_wire}
  u: redstone_wall_torch[facing=south]
  (: redstone_wall_torch[facing=west]
  ): redstone_wall_torch[facing=east]
  A: {input: A}
  B: {input: B}
  C: {input: C}
  D: {input: D}
