name: ref_mattbatwings_classic_bcd_to_7seg
description: 'mattbatwings NUMDISPLAY003 Classic BCD to 7seg (Logical Redstone Archive, Discord https://discord.com/channels/1361854816837435433/1472415651443376370; tags Tested & Functional, Recommended;
  README: classic BCD display, unsynced, nice form factor, input 4b). SOURCED: 4-bit input, one 5x9 lamp digit. Rebuilt from the schematic block states as saved (value 3 settled), update_pass strict. Harness
  change: the four levers and their indicator lamps (x=26..27, z=0,2,4,6) are replaced by input cells at x=26, i0..i3 = z 0,2,4,6 (i0 least significant); a redstone block beside the first repeater replaces
  a lever on a lamp. The digit is on the x=0 face, 5 wide (z=1..5) by 9 tall (y=1..9), read from the west with +z to the right. Size 26x10x7. MEASURED: 0-9 show standard segments (9 without a bottom bar,
  7 as a,b,c) and 10-15 blank, in counting order and in a 22-step shuffled order, each read once the display held; the segment lamps settle at different times, 12 gt (top bar a) to 32 gt (c3, lower right)
  counting up and up to 36 gt in any order, so it is unsynced as claimed. NOT SETTLED: the flag lamps (7,5), (8,5), (8,4), (9,5) beside the upper-right segment (k75, k85, k84, k95) are not tested. A separate
  run that waited 150 gt after each input showed them, and b1, lit for 5 and 6 and for 10-15, where the shorter holds above read them off, so the display may not stay at its first settled value; not explained.
  INFERRED only: lamp-to-lamp power relay, where a lamp state change sends no neighbour update, could leave a lamp lit.'
