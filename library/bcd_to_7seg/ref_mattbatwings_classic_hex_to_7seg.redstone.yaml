name: ref_mattbatwings_classic_hex_to_7seg
description: >-
  Rebuild of mattbatwings' Classic Hex to 7seg (Logical Redstone Archive NUMDISPLAY004, Tested and Functional, Recommended; Discord https://discord.com/channels/1361854816837435433/1472415883233202247). SOURCED: 4-bit hex input, unsynced, nice form factor. Size 39x10x7. Four input lines run west on y=8 as repeaters and wool, torch layers on y=1 to 7 invert and combine them into one line per segment, and each line ends at the 5x9 lamp wall on x=0: horizontals a, g, d are three lamps behind targets, verticals are two torches and a hard-powered wool. Harness changes: the four levers and the lamps they hung on become input cells i1 i2 i4 i8 at x=39 (a redstone block beside a lamp would not hard-power the repeater, beside the repeater it does); signs and the glass over them dropped. MEASURED on 26.3: all 16 values show the right segments on all 45 lamps, with 9 drawn without the bottom bar and 7 as a b c; 0 to F settles in 38 ticks and the lines glitch on the way (segment a goes 1 0 1 at ticks 12 to 16). hex_display_refreshed first re-evaluates every lamp (a glass fill beside the wall and back), which separates a lamp being powered from a lamp left lit; hex_display reads the wall as driven. An earlier draft of this file showed five lamps stuck lit with no power on the first runs; it did not recur after the file was rewritten and the cause is unknown.
