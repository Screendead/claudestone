name: door_reset_west
description: 'Door part 11 (west reset, lane 3): resets the opening relays Z_S, Z11 and Y12 after the close, undoes the NP12
  kill, and re-arms all three with no command. Door coordinates (design_c) = spec - (4,-1,0). The spec starts from the open
  state. Changes to design_c: Z_S (2,4,2), Z11 (-2,3,1) and Y12 (-2,3,2) become STICKY pistons. ARM_ZS (2,6,2) becomes stone
  A_S, strongly powered by dust (2,7,2), which is fed by line ls (3,7,2); A_S is a QC cell of Z_S that is not next to Z_S
  or its head, so it is silent. RB11 becomes a two-block column: slime F11 (home (-2,4,1)) and stone B11 (home (-2,5,1));
  repeater A11 (-3,4,1) on glass (-3,3,1) points into F11''s home and is fed by l11 (-4,4,1). Strongly powered, F11 QC-powers
  P11 and Y12 as RB11 did; A11 also holds Z11 through its head. ARM_Z11 (-2,4,2) is removed. Y12''s arm A12 is stone (-3,4,2),
  strongly powered by dust (-3,5,2), which is fed by l12 (-4,5,2); A12 is a QC cell of Y12 next to Y12''s head, so dropping
  it retracts Y12, and raising it while Y12 is retracted is silent. The NP12 kill is K: a sticky piston (-4,2,3) facing north,
  fed by lk (-4,1,3). It pushes RB12 (-4,2,2) to (-4,2,1) (L dies in that block event) and pulls it home. RB12 at (-4,2,1)
  powers the NA dust (-4,2,0). Cells moved through: (-2,4..6,1), (-4,3,2), (-3,3,2), (-4,2,1), (-4,2,2), (1,4,2), (0,4,2).
  Load blocker for a closed build: obsidian (-2,6,1), which replaces (-2,5,1). Fixtures: stand-ins S (DS on its ceiling; its
  line is a stone until the c4 obsidian), P11 (its line holds S at the corner until the NV-tick obsidian), P12 with the whole
  NP12 net and the spare, LY (Z_S''s wake), and the NA dust. Schedule (drive @kN = before tick kN): lk on @k0 (K kills NP12
  in k0 g, P12 retracts), ls off @k0, l12 off @k1 (Y12 pulls G home, lands k3 j), ly on @k2 (LY''s rise retracts Z_S, RB_S
  home k4 j), S blocker @k4, lk off @k4 (RB12 home k6 j), ls on @k6, l11 off @k7 and on @k9 (A11 off k8 d to k10 d; Z11 retracts
  k8 g, column lands k10 j), P11 blocker @k8, l12 on @k12. Measured: every tick matches, and all three relays are armed by
  k12 with no later update. P12, S and P11 do not move through k43. Then LY''s fall fires Z_S, and a freed, updated P11 runs
  the t6 0-tick: P11 out, Z11, P11 spat, Y12, NP12 live, P12 out. Three cycles. Controls: with no S blocker, S moves at k5;
  with A_S back at k3, Z_S fires at k5; with A11 off 3 gt, Z11 fires at k11; with A12 back at k10, Z11''s landing fires Y12;
  with RB12 home before G, P12 extends.'
traits:
- piston_based
- tick_accurate
