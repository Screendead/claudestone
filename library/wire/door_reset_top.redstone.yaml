name: door_reset_top
description: 'Door part 5 (top reset, lane 3), X2 half: resets the opening relay X2 and its payloads after the close edge
  E0, restores NV and NB, and re-arms X2 with no command. Door coordinates (design_c) = spec - (2,-2,9). The scene starts
  in the open state; E0 is the real input (I_A sticky, K_in, R_in, lever from part 1, as fixtures). Part blocks: X2 (1,7,-3)
  becomes a STICKY piston; its face block is a slime S1 (home (1,7,-4)) carrying C_cut (home (1,7,-5)) in line and RB_X (moved
  to (2,7,-4), where it feeds NB''s first dust (3,7,-4); NB''s dust at (2,7,-4) is gone) beside it, so X2''s retract brings
  all three home. ARM_X2 (1,8,-4) is removed (S1 would drag it). Hold: K_in -> dust (1,8,-1) on glass (1,7,-1) -> dust (2,8,-1)
  on stone (2,7,-1) -> repeater (2,7,-2) facing south (delay h=1) on glass (2,6,-2) -> stone (2,7,-3) beside X2, so X2 stays
  powered through E0 (c0 g) and is updated when the hold drops. Arm (silent): NB -> dust (4,8,-3) on glass (4,7,-3) -> repeater
  (3,8,-3) facing east (delay a=1) on glass (3,7,-3) -> stone (2,8,-3), a QC cell of X2 that is not next to X2, so its power
  changes never update X2. Cells moved through: (1,7,-4..-6), (2,7,-4..-5). Measured (tick numbers as plan_common: cN = drive
  in:0 + wait N+2; lever: use + wait N+1): R_in: X2 held at c0 and c1; hold off at c2 d, X2 retracts in c2 g, C_cut leaves
  the NV step, NV live at c2 and the V and P8 stand-ins extend at c2; X2, S1, C_cut and RB_X land at c4 j, NB live at c4;
  arm on at c6; nothing changes for 40 gt after. Lever: every reset tick one earlier (release c1, NB c3, arm c5), because
  K_in drops between ticks. Then the real input reopens it: X2 fires at t0 (NB 0), C_cut cuts NV at t2; three cycles each
  way. Controls: with the hold repeater removed, X2 resets at E0 and NV is live at c0; after the last close, one fixture update
  beside X2 fires it (NB 0). Load note: a closed-state build must load the arm repeater unpowered so it arms X2 silently after
  settle (loaded powered, the whole-door opening failed, most likely because X2 fired on the harness update pass). Not in
  this part: Z_T and RB_T (fixtures here) stay as the opening left them (Z_T extended, powered through QC by RB_T at (1,6,-1));
  returning RB_T needs a separate mover loop.'
traits:
- piston_based
- tick_accurate
