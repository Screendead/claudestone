name: ref_indy_serial_8b
description: "8-bit serial transmission line, 10x2x47. Parallel data is latched into a repeater chain with the clock, then each further clock pulse shifts one bit along a 15-block dust/repeater line and out to a row of 8 lamps. Source: mattbatwings' Logical Redstone Archive TRANSMIT006 'Serial transmission line basic' by Indy (endorsed by mattbatwings, Tested & Functional; discord.com/channels/1361854816837435433/1473594784076533846). README (SOURCED): 8b input plus CLK (press once to load, disable the inputs, press 8x to transmit), 8b output, '16RT (2RT per pulse) + 1RT every 15 blocks'. The clock input is a pulse shaper: a button powers a subtract-mode comparator whose side input is the same signal through a 3-tick repeater (6 gt), so each press makes one 6 gt pulse; the shift stages are repeaters locked by their side neighbours. That reading is INFERRED from the block layout; I did not trace each stage. Changed for the harness: the 8 input levers and the lamps under them are replaced by redstone blocks i0..i7 right behind the input repeaters; the button and the wool it sat on are replaced by a redstone block clk beside the clock dust, which `drive` holds high for the press length. MEASURED: load 8 bits with one clock press, clear the inputs, then 8 presses of 20 gt high / 30 low: lamp o_k shows input i_k for three patterns (10110010, 01101001, 11111111). Pulse rate: the same message with a 6 gt high / 6 gt low clock (12 gt per pulse) arrives; every faster rhythm tried fails with all lamps dark (5/6, 6/5, 4/4, 8/4, 9/3, 10/2, 6/2, 2/2, 1/1), so with this clock shaper the limit is 12 gt a pulse, 6 gt slower than the README's 2RT per pulse (4 gt), which may refer to the line itself and not to the clock input. The length-dependent speed (1RT per 15 blocks) was not measured."
traits: [pistonless, entityless, survival_friendly]
