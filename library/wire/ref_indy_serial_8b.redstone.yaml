tests:
- name: load 10110010
  settle: 20
  steps:
  - drive: {i0: 1, i1: 0, i2: 1, i3: 1, i4: 0, i5: 0, i6: 1, i7: 0}
  - wait: 10
  - drive: {clk: 1}
  - wait: 20
  - drive: {clk: 0}
  - wait: 20
  - drive: {i0: 0, i1: 0, i2: 0, i3: 0, i4: 0, i5: 0, i6: 0, i7: 0}
  - wait: 10
  - repeat:
      times: 8
      steps:
      - drive: {clk: 1}
      - wait: 20
      - drive: {clk: 0}
      - wait: 30
  - wait: 40
  - expect: {o0: 1, o1: 0, o2: 1, o3: 1, o4: 0, o5: 0, o6: 1, o7: 0}
