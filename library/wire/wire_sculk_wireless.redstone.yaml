tests:
- name: level follows the input
  settle: 60
  truth_table: |
    a | out
    0 | 0
    1 | 1
    0 | 0
    1 | 1
  delay: 17
- name: edge pulses
  settle: 60
  steps:
  - drive: {a: 1}
  - wait: 14
  - expect: {up: 0, down: 0}
  - wait: 1
  - expect: {up: 1, down: 0}
  - wait: 9
  - expect: {up: 1, down: 0}
  - wait: 1
  - expect: {up: 0, down: 0}
  - wait: 20
  - drive: {a: 0}
  - wait: 14
  - expect: {up: 0, down: 0}
  - wait: 1
  - expect: {up: 0, down: 1}
  - wait: 10
  - expect: {up: 0, down: 0}
- name: a 12-tick pulse survives
  settle: 60
  steps:
  - drive: {a: 1}
  - wait: 12
  - drive: {a: 0}
  - wait: 5
  - expect: {out: 1}
  - wait: 40
  - expect: {out: 0}
- name: a 5-tick pulse inverts the level
  settle: 60
  steps:
  - drive: {a: 1}
  - wait: 5
  - drive: {a: 0}
  - wait: 60
  - expect: {out: 1}
