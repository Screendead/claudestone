name: wire_diagonal
description: >-
  A 45-degree horizontal run. Dust steps east, south, east, south, so each dust is a corner
  and a diagonal step costs two dust. A repeater only fits where the path goes straight, so
  each 16-cell period is a repeater then 14 zigzag dust, and the repeaters alternate between
  facing east-out (after an east step) and south-out (after a south step). That puts one
  repeater every 7.5 diagonal blocks and keeps the run exactly on the diagonal.
  Interface: input driver a at the north-west corner (x=0, z=0, y=1), first repeater at x=1
  (input from the west); output dust at the south-east corner (x=17, z=15, y=1). Size 18x2x16,
  covering 15 blocks of diagonal in 6 ticks (3 repeaters, 2 ticks each). A zigzag has the same
  Manhattan length as an L-shaped route, so it saves no redstone; what it saves is area: the
  run is a 2-cell-wide band along the diagonal, leaving both corners of the box free. Tile
  along the diagonal by repeating the 15x15 period. Trade-off: about 2 cells of path per
  diagonal block. Parallel diagonals need an empty cell between them in every row, since touching dust joins (not tested here).
traits: [fast, flat, horizontal, lightless, silent, pistonless, entityless, survival_friendly, reset_safe, tick_accurate]
palette:
  .: air
  '=': smooth_stone
  '-': redstone_wire
  '>': repeater[facing=west]
  v: repeater[facing=north]
  a: {input: a}
  o: {output: out, block: redstone_wire}
layers:
  0: |
    .==...............
    ..==..............
    ...==.............
    ....==............
    .....==...........
    ......==..........
    .......==.........
    ........=.........
    ........=.........
    ........==........
    .........==.......
    ..........==......
    ...........==.....
    ............==....
    .............==...
    ..............====
  1: |
    a>-...............
    ..--..............
    ...--.............
    ....--............
    .....--...........
    ......--..........
    .......--.........
    ........-.........
    ........v.........
    ........--........
    .........--.......
    ..........--......
    ...........--.....
    ............--....
    .............--...
    ..............-->o
tests:
- name: logic
  truth_table: |
    a | out
    0 | 0
    1 | 1
    0 | 0
    1 | 1
  delay: 6
