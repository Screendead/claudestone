name: door_reset_east
description: 'Door part 8 (east reset, lane 3): resets the opening relays Z_Q, Y1 and Z9 after the close and re-arms them
  with no command. Door coordinates (design_c) = spec - (-1,-2,7). Not the interface as written: an up relay whose redstone-block
  payload sits at R+2 is QC-powered by it and can never retract (door_relay_rearm), so each relay is now a STICKY piston whose
  payload is a two-block column with a slime or honey face, and no redstone block sits in a relay''s line. Z_Q (6,3,-3): column
  slime F_Q (home (6,4,-3)) + slime B_Q (home (6,5,-3)); repeater A_Q (6,4,-2) facing south points into F_Q, so it powers
  DQ through the slime and QC-powers Z_Q (arm and hold); A_Q''s feed cell is lq (6,4,-1). Y1 (7,3,-3): column honey F_Y (7,4,-3)
  + honey B_Y (7,5,-3) with RB_Y (7,5,-2) stuck to B_Y; RB_Y feeds LY through a rerouted start (dust (7,5,-1) on stone (7,4,-1),
  dust (7,4,0) on glass (7,3,0), dust (7,4,1) on glass (7,3,1), into the unchanged (6,4,1)); LY dusts (7,4,-2), (6,3,-1),
  (6,3,0) are removed. Y1''s arm and hold is obsidian A_Y (8,4,-3), strongly powered by repeater (8,4,-2) facing south (feed
  la (8,4,-1)); F_Q, powered by A_Q, also QC-arms Y1. Z9 (4,2,1): column slime F9 (4,3,1) + stone B9 (4,4,1); repeater A9
  (4,3,2) facing south (feed l9 (4,3,3)) powers F9, which QC-powers P9. ARM_ZQ (6,4,-4), ARM_Y1 (7,4,-4), ARM_Z9 (5,3,1) are
  removed. Swaps so no slime or honey drags a net block: (5,5,-3) glass -> obsidian, (7,6,-4) stone -> obsidian, (4,4,2) stone
  -> obsidian, (4,4,0) glass -> hopper (dust does not survive on honey: measured). Cells moved through: (6,4..6,-3), (7,4..6,-3),
  (7,5..6,-2), (4,3..5,1). A fresh closed-state build loads obsidian blockers at (6,6,-3), (7,6,-3), (4,5,1), removed with
  setblock air strict after settle (they replace the old blockers at (6,5,-3), (7,5,-3), (4,4,1)). How it resets: a relay''s
  arm repeater drops, the change reaches the relay through its head, it retracts and pulls the column home (base, face, then
  the block behind land in that order at +2 j). For Z_Q and Z9 the arm repeater is off for exactly 2 gt, so it is back on
  before the landing: the face lands while the block behind is still moving and blocks the line, and the block behind lands
  away from the relay, so nothing fires; a 3 gt gap fires the relay when the repeater returns. Y1 resets first and stays unpowered
  (A_Y off) until Z_Q''s base has landed, because each relay''s base updates the other. Fixtures: drivers lq, la, l9 (the
  integrator''s arm lines), nbd (NB, Z_Q''s wake), nvd (NV on the hopper), stand-in Q and P9 with a P6-head obsidian placed
  by the test, dead NV and NB dusts on the swapped supports. Measured ticks (k = la drop; lq and l9 off at k1 for 2 gt; NB
  at k2; la back at k4): Y1 retracts k2, RB_Y home and LY live k4; Z_Q (and Z9) retract k3, land k5 with DQ live (P9 powered);
  armed by k5; R_Y on k6; quiet for 40 gt; NB''s fall fires Z_Q then Y1; three cycles. Controls: A_Y back on 1 tick earlier
  fires Y1 at Z_Q''s landing; lq off 3 gt fires Z_Q; NB rising after arming fires Z_Q; without the P6 stand-in DQ moves Q;
  after the reset a freed, updated P9 extends, fires Z9 and is spat back (the t3 0-tick); a 3 gt l9 gap fires Z9.'
traits:
- piston_based
- tick_accurate
