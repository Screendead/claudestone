name: ref_mattbatwings_stacked_flat_bus4_repeater
description: "Four-bit bus in 1 block of width and 8 of height: four 34-block dust lines stacked two apart in y (y=1,3,5,7) on cyan wool, each one with a single repeater mid-way (z=18) to restore strength, input at z=35, output lamps at z=1. Source: mattbatwings' 'How To Wire Like a Redstone Pro!' world (Java 1.18.2), cluster W77, world origin 33,56,-109 (SOURCED). Changed for the harness: the demo lever beside each input lamp is dropped and the input lamp cell (which hard-powers the dust beside it in the original) holds the input redstone block instead, directly next to the first dust. Size 1x8x37. MEASURED in 26.3: all 16 patterns arrive, delay 6 gt (rise 2 = the one repeater, fall 6 = repeater 2 + lamp turn-off 4). INFERRED: the wool rows between lines (the empty y=0,2,4,6 layers are wool, dust at odd y) keep the lines from linking; with 15 dust per half a single repeater is enough for 34 blocks."
