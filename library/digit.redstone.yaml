name: digit
description: Seven-segment digit showing segments abcdefg; input per segment.
palette:
  .: air
  '#': white_concrete
  A: black_concrete
  d: {name: d2, block: redstone_lamp}
  B: {name: d0, block: redstone_lamp}
  C: {name: d1, block: redstone_lamp}
  ^: repeater[facing=south]
  D: {input: d}
  c: {name: c2, block: redstone_lamp}
  e: {name: e2, block: redstone_lamp}
  E: {name: c0, block: redstone_lamp}
  F: {name: e0, block: redstone_lamp}
  G: {input: c}
  H: {input: e}
  I: {name: c1, block: redstone_lamp}
  J: {name: e1, block: redstone_lamp}
  g: {name: g2, block: redstone_lamp}
  K: {name: g0, block: redstone_lamp}
  M: {name: g1, block: redstone_lamp}
  N: {input: g}
  b: {name: b2, block: redstone_lamp}
  f: {name: f2, block: redstone_lamp}
  O: {name: b0, block: redstone_lamp}
  P: {name: f0, block: redstone_lamp}
  Q: {input: b}
  T: {input: f}
  U: {name: b1, block: redstone_lamp}
  V: {name: f1, block: redstone_lamp}
  a: {name: a2, block: redstone_lamp}
  W: {name: a0, block: redstone_lamp}
  X: {name: a1, block: redstone_lamp}
  Y: {input: a}
layers:
  0: |
    .....
    ..#..
    .....
  1: |
    AdBCA
    ..^..
    ..D..
  2: |
    cAAAe
    #...#
    .....
  3: |
    EAAAF
    ^...^
    G...H
  4: |
    IAAAJ
    ..#..
    .....
  5: |
    AgKMA
    ..^..
    ..N..
  6: |
    bAAAf
    #...#
    .....
  7: |
    OAAAP
    ^...^
    Q...T
  8: |
    UAAAV
    ..#..
    .....
  9: |
    AaWXA
    ..^..
    ..Y..
