name: ref_sloimay_swapper_8bit
description: 'Reference rebuild of FLIPSWAP002 "8-bit swapper" by sloimay (endorsed by mattbatwings; tags Tested & Functional, Recommended; README: swaps 2 columns of 8 bits, 2 ticks; https://discord.com/channels/1361854816837435433/1472406963361939589). 3x17x5: eight identical 2-layer slices (bit k at y=2k+1..2k+2), inputs l_k (x=0) and r_k (x=2) on wires at the north face, outputs lo_k (x=0) and ro_k (x=2) on wires at the south face; lo_k=r_k and ro_k=l_k, a crossover per bit. INFERRED from the blocks and confirmed by trace: l goes wire, repeater west, iron, repeater north, wire up to the output at x=2 (2 repeaters); r goes repeater north into an iron block whose neighbour is a lone dust that powers the iron blocks on both its sides, the far one feeding a repeater north to the output at x=0 (2 repeaters); the two paths cross in one layer pair with no shared cells. Harness changes: update_pass strict, because the middle dust is saved as a four-way cross beside iron blocks and only that stale shape powers both neighbours (a normal update pass turns it into a dot, which does not power them, and r never reaches lo); inputs are redstone blocks in a row north of the north wires (the original is fed by wires); the build is padded by one air column west and one row north so no dust touches the origin (observed: with the wire column at the build''s origin edge, some satellites left the lo_k output dust stuck at power 5 or 6 after another slice fired, others did not; one cell of padding removed it on 5 servers, cause not identified). Trimmed: none beyond power states. MEASURED: latency 4 game ticks (2 repeater delays) for both paths, rising and falling; output dust reads power 14 for l (it climbs through a dust ramp) and 15 for r.'
