name: ref_mattbatwings_flipper_8bit
description: '8-bit flipper (reverses a vertical column of 8 bits): in0..in7 are inputs at y=1,3,..,15 (x=8, z=4, east of each input repeater), out0..out7 the lamps at y=1,3,..,15 (x=0), and out k = in
  (7-k). Source: mattbatwings'' Logical Redstone Archive FLIPSWAP001_8-bit_flipper (endorsed by mattbatwings, tags Tested & Functional and Recommended, no author listed; Discord https://discord.com/channels/1361854816837435433/1472406935650439198),
  schematic FLIPSWAP001_8bit_flipper.schem, README claims "2 ticks" (SOURCED). The schematic is 8 wide, 16 tall and 9 deep; the input drivers sit in a 9th column at x=8, outside the footprint''s design.
  Each of the 8 lines is its own dust path (INFERRED from the blocks and one traced line: in2 zigzags up through wool and slab steps) and there is one unpowered floor oak_button at (3,9,3) kept from the
  schematic, which bends the elbow dust beside it so it does not leak into the wool south of it (removing it lit a second lamp: MEASURED). Harness changes: added the 8 input cells and named the lamps; all
  else is the schematic with power/lit stripped. Measured: all 256 input values pass; every output rises 4 gt after its input (INFERRED two diodes, 2 redstone ticks, matching the README) and falls 8 gt
  (the same path plus the lamp''s 4 gt off delay).'
traits:
- pistonless
- entityless
- vertical
- compact
- tick_accurate
- reset_safe
- survival_friendly
