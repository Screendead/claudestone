name: ref_wiki_moved_observer_red
description: 'Reference rebuild of the Minecraft Wiki "Moved observer RED", vertical 1x1x3 variant, credited to the wiki editors (Redstone circuits/Pulse, https://minecraft.wiki/w/Redstone_circuits/Pulse#moved_obs-RED). Wiki figures: 1x1x3 (3), 1-wide, circuit delay "Java: 2 ticks", output pulse 1 tick. The wiki gives only an image, so this follows its text: a sticky piston (x=3, y=1, facing up) lifts an observer (facing west, so not facing the piston) into x=3, y=3 (reserved), and the output is taken from the extended position (output dust fixture at x=4, y=3 on a glass fixture, which the observer''s home pulse cannot power). The input dust fixture (x=2, y=1) points into the piston; driver a (x=1) powers it, or a delay-1 repeater set into that cell and fed by b (repeater fed test).'
traits: [one_wide, piston_based, entityless]
palette:
  .: air
  _: {reserve: true}
  a: {input: a}
  b: {input: b}
  i: {name: in, block: redstone_wire, fixture: true}
  f: {block: smooth_stone, fixture: true}
  g: {block: glass, fixture: true}
  P: {name: piston, block: 'sticky_piston[facing=up]'}
  O: {name: obs, block: 'observer[facing=west]'}
  o: {output: out, block: redstone_wire, fixture: true}
layers:
  0: |
    ..f..
  1: |
    baiP.
  2: |
    ...Og
  3: |
    ..._o
