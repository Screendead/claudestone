name: pulse_rising_torch_1wide
description: 'One-wide vertical rising-edge detector from two torches. Input a is at x=0, y=3. a powers the dust under it (x=0, y=2), which steps down under glass to dust at x=1, y=1 and powers block Y (x=2, y=1); torch t1 on Y (x=2, y=2) is NOT a. a also drives a delay-3 repeater (x=1, y=3, facing west, standing on the glass) into block X (x=2, y=3), which t1 powers from below. Output torch out on X (x=2, y=4) is NOR(NOT a, a delayed) = a AND NOT a delayed: a rise lights out 4 ticks later for 4 ticks; a fall gives nothing. Pulse = 2 x repeater delay - 2 ticks (delay 2 gives nothing: the repeater and t1 switch X in the same tick). Inputs of 2 or 3 ticks pass at their own width, 1 tick is ignored. 3x5x1, one block wide, silent. Out is lit for 2 ticks after placement. Trade-off: fits in a 1-wide slice where comparator or lock designs cannot (their side inputs need a second column), at the cost of torches (light updates, burnout if toggled faster than 8 times in 60 ticks) and 4 ticks of delay.'
traits: [one_wide, vertical, torch_based, silent, pistonless, entityless, tick_accurate, survival_friendly]
palette:
  .: air
  '=': smooth_stone
  '#': white_concrete
  g: glass
  a: {input: a}
  '-': redstone_wire
  r: repeater[facing=west,delay=3]
  T: {name: t1, block: redstone_torch}
  o: {output: out, block: redstone_torch}
layers:
  0: |
    .=.
  1: |
    =-#
  2: |
    -gT
  3: |
    ar#
  4: |
    ..o
