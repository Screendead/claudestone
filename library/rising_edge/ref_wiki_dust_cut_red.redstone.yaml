name: ref_wiki_dust_cut_red
description: 'Reference rebuild of the Minecraft Wiki "Dust-cut rising edge detector (Unrepeated)", credited to the wiki editors (Redstone circuits/Pulse, https://minecraft.wiki/w/Redstone_circuits/Pulse#dust-cut_rising_edge_detector ; schematic from https://minecraft.wiki/w/Redstone_circuits/Pulse/red). Wiki figures: 1x5x3 (15), 1-wide, instant, delay 0, output pulse 1.5 rt. Side view, one block wide, running east. The wiki input line (dust at x=1, y=1, on a support) and output line (dust at x=7, y=1, on a support) are fixtures, so the measured size counts the same five columns the wiki counts; driver a (x=0) powers the input dust at 15; driver b (x=1, z=2) feeds it instead through a delay-1 repeater fixture from the south, for the repeater-fed test. Input dust climbs onto x=2 and steps down past the sticky piston (x=3, y=2, facing east, powered by that dust) into the lower line x=3..5, which climbs to x=6, y=2 and steps down to out. The piston pushes the concrete block from x=4 into x=5, y=2 (reserved), cutting the climb.'
traits: [one_wide, piston_based, entityless]
palette:
  .: air
  '=': smooth_stone
  '#': white_concrete
  '-': redstone_wire
  _: {reserve: true}
  a: {input: a}
  b: {input: b}
  r: {block: 'repeater[facing=south,delay=1]', fixture: true}
  i: {block: redstone_wire, fixture: true}
  f: {block: smooth_stone, fixture: true}
  P: {name: piston, block: 'sticky_piston[facing=east]'}
  L: {name: low, block: redstone_wire}
  u: {name: up, block: redstone_wire}
  o: {output: out, block: redstone_wire, fixture: true}
layers:
  0: |
    .f.===.f
    .f......
    ........
  1: |
    ai=--L=o
    .r......
    .b......
  2: |
    ..-P#_u.
    ........
    ........
