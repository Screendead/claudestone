name: pulse_rising_observer_lock
description: 'Rising-edge monostable from an observer and a locked repeater, no torches: observer (x=1, z=0, facing west) watches input a (x=0, z=0) and fires into repeater out (x=2, z=0, facing west, delay 1). A delay-4 repeater lock (x=2, z=1, facing south) fed by dust from a (x=0, z=1..2 and z=2, x=1..2) locks out 8 ticks after a rises, after the rising pulse has passed and before the falling pulse arrives, and unlocks 8 ticks after a falls. Every input, from 1 tick to any length, gives exactly one 2 tick pulse 4 ticks after the rise (output east of out, x=3); a fall gives nothing (tested for every width 1 to 9). 3x2x3 with its base. Emits one pulse 4 ticks after placement. Trade-off versus pulse_rising_comparator: a fixed pulse whatever the input width (a debounced one-shot), at 4 ticks instead of 2 and one more row.'
traits: [compact, flat, horizontal, observer_based, silent, lightless, pistonless, entityless, tick_accurate, survival_friendly]
palette:
  .: air
  '=': smooth_stone
  a: {input: a}
  '-': redstone_wire
  O: 'observer[facing=west]'
  L: {name: lock, block: 'repeater[facing=south,delay=4]'}
  o: {output: out, block: 'repeater[facing=west,delay=1]'}
layers:
  0: |
    ===
    =.=
    ===
  1: |
    aOo
    -.L
    ---
