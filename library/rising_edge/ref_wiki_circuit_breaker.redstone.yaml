name: ref_wiki_circuit_breaker
description: 'Reference rebuild of the Minecraft Wiki "Circuit breaker" rising edge detector, credited to the wiki editors (Redstone circuits/Pulse, https://minecraft.wiki/w/Redstone_circuits/Pulse#circuit_breaker ; schematic from https://minecraft.wiki/w/Redstone_circuits/Pulse/red). Wiki figures: 1x3x3 (9), 1-wide, delay 1 rt, output pulse 1 rt. Side view, one block wide, running east. The wiki input line (dust at x=2, y=1) and output line (dust at x=6, y=1) are fixtures on fixture supports, so the measured size counts the same three columns the wiki counts; driver a (x=1) powers the input dust (driver b at x=0 is used only by the repeater-fed test, which first sets a delay-1 repeater into the a cell). Dust x=3 powers its support, which powers the sticky piston x=4, y=0 (facing up), and points into the concrete block above that piston, which a delay-1 repeater (x=5) reads; the piston lifts the block into x=4, y=2 (reserved) and the repeater loses its input.'
traits: [one_wide, piston_based, entityless]
palette:
  .: air
  '=': smooth_stone
  '#': white_concrete
  '-': redstone_wire
  _: {reserve: true}
  a: {input: a}
  b: {input: b}
  i: {block: redstone_wire, fixture: true}
  f: {block: smooth_stone, fixture: true}
  P: {name: piston, block: 'sticky_piston[facing=up]'}
  R: {name: rep, block: 'repeater[facing=west,delay=1]'}
  o: {output: out, block: redstone_wire, fixture: true}
layers:
  0: |
    ..f=P=f
  1: |
    bai-#Ro
  2: |
    ...._..
