name: not_torch_down
description: |
  A torch inverter that also drops the signal two blocks. Input dust on top of a block B
  powers B; a wall torch on B's east face inverts it; a lit wall torch powers the dust
  directly beneath it (a wall torch withholds power only from the block it hangs on), so
  the output dust sits one block below the torch.
  Interface: input dust at (0,3,0) on top of B (0,2,0), driven here from the air cell above
  the torch (1,3,0). Torch at (1,2,0) facing east (named t). Output: dust at (1,1,0) on a
  support at (1,0,0), strength 15. Box 2x4x1. Delay 2 ticks on both edges.
  Trade-off: the fastest way to invert while descending (the inversion and the two-block drop
  cost one torch delay); the obvious alternative, a torch then a dust staircase, needs
  more length. Emits light; torch burnout limit applies (8 turn-offs in 60 ticks).
traits: [vertical, compact, fast, torch_based, silent, pistonless, entityless, survival_friendly, reset_safe, tick_accurate]
palette:
  .: air
  '=': smooth_stone
  '#': white_concrete
  '-': redstone_wire
  a: {input: a}
  t: {name: t, block: 'redstone_wall_torch[facing=east]'}
  o: {output: out, block: redstone_wire}
layers:
  0: |
    .=
  1: |
    .o
  2: |
    #t
  3: |
    -a
tests:
- name: logic
  truth_table: |
    a | out t
    0 | 1   1
    1 | 0   0
  delay: 2
