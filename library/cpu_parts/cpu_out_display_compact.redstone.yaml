name: cpu_out_display_compact
description: 'CPU output display, compact: out0-out3 (out0 least significant) enter on the south face at y=1, z=35, x=0,2,4,6 (out0 west), each through a repeater facing south at z=34. Units digit: a 3x5 lamp font at x=0..2, y=1..5 on the z=0 face (holes at (1,2) and (1,4)); tens: one lamp column at x=4 (the 1, segments b and c), frame column x=3, both read from the north. Each segment''s middle lamp (u_a..u_g, t_b, t_c) is hard-powered by a repeater behind it at z=1 and lights the lamps touching it. Decoder: a three-storey NOR-NOR PLA of 8 terms over b0, b2, N=(b1 xnor b3), K=b1-b3, K2=b3-b1 (a subtract-comparator pair), outputs climbing dust stairs to repeater lanes at their segment''s height.'
traits:
- torch_based
- comparator_based
- pistonless
- entityless
palette:
  .: air
  A: black_concrete
  '#': white_concrete
  L: redstone_lamp
  B: {name: u_d, block: redstone_lamp}
  ^: repeater[facing=south]
  <: repeater[facing=east]
  (: redstone_wall_torch[facing=west]
  '-': redstone_wire
  C: comparator[facing=south,mode=subtract]
  '>': repeater[facing=west]
  D: comparator[facing=north,mode=subtract]
  ): redstone_wall_torch[facing=east]
  o: {input: out0}
  E: {input: out1}
  F: {input: out2}
  G: {input: out3}
  H: {name: u_c, block: redstone_lamp}
  I: {name: u_e, block: redstone_lamp}
  t: {name: t_c, block: redstone_lamp}
  u: redstone_wall_torch[facing=south]
  J: {name: u_g, block: redstone_lamp}
  K: {name: u_b, block: redstone_lamp}
  M: {name: u_f, block: redstone_lamp}
  N: {name: t_b, block: redstone_lamp}
  O: {name: u_a, block: redstone_lamp}
  n: redstone_wall_torch[facing=north]
