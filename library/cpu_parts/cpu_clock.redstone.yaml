name: cpu_clock
description: 'Two-phase CPU clock, period 200 gt, torch-free: one start edge sets a two-repeater memory loop, a subtract comparator turns that step into one 10 gt pulse, and the pulse circulates forever in a 26-repeater ring (200 gt). COM is tapped at the injection node, CAP 150 gt downstream (18 x delay 4 + 1 x delay 3); each pin is fed through four delay-1 repeaters, so pins of one phase match to the tick. A second start finds the memory already set and adds nothing. Start (24,1,25) south face; capw (2,1,0), comw (6,1,0), cape (40,1,0), come (44,1,0) north face; comw crosses the CAP row on a dust stair over the repeater at (6,1,4).'
traits: [comparator_based, silent, lightless, pistonless, entityless, tick_accurate]
palette:
  '.': 'air'
  '=': 'smooth_stone'
  '-': 'redstone_wire'
  'e': 'repeater[facing=south,delay=1]'
  'f': 'repeater[facing=east,delay=1]'
  'g': 'repeater[facing=west,delay=4]'
  'h': 'repeater[facing=west,delay=3]'
  'j': 'repeater[facing=south,delay=4]'
  'k': 'repeater[facing=north,delay=4]'
  'l': 'repeater[facing=east,delay=4]'
  'n': 'repeater[facing=north,delay=1]'
  'a': {output: capw, block: 'redstone_wire[north=side,south=side]'}
  'b': {output: comw, block: 'redstone_wire[north=side,south=side]'}
  'c': {output: cape, block: 'redstone_wire[north=side,south=side]'}
  'd': {output: come, block: 'redstone_wire[north=side,south=side]'}
  'i': {name: cap_node, block: 'redstone_wire'}
  'm': {name: com_node, block: 'redstone_wire'}
  'o': {name: hold_b, block: 'repeater[facing=west,delay=1]'}
  'p': {name: pulse, block: 'comparator[facing=south,mode=subtract]'}
  'q': {name: hold_a, block: 'repeater[facing=east,delay=1]'}
  'r': {name: run, block: 'redstone_wire'}
  's': {name: armed, block: 'repeater[facing=west,delay=1]'}
  't': {name: start_rep, block: 'repeater[facing=south,delay=3]'}
  'u': {input: start}
