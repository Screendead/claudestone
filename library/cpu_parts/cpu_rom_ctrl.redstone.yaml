name: cpu_rom_ctrl
description: 'CPU4 program memory (stage 1 of ROM_CTRL: no control decoder yet). 16 words x 8 bits on levers, lever on = 1, words 1C 80 1A 40 A0 1A 50 A0 1A 60 A0 E6 CE F0 A0 F0. Lever of word w, bit b: x = 6+2w at y=2 for even w, x = 5+2w at y=6 for odd w (word 0 at the smallest x, the viewer''s right); z = 18, 21, 24, 27, 29, 31, 33, 35 for b = 0..7 (bit 0 nearest the viewer). pc0..3 in and pimm0..3 out on the east face; op0..3 are the bit 4-7 torches.'
traits:
- torch_based
- pistonless
- entityless
palette:
  .: air
  '=': smooth_stone
  '-': redstone_wire
  '#': white_concrete
  A: repeater[facing=east,delay=1]
  p: {input: pc0}
  B: {input: pc1}
  C: {input: pc2}
  D: {input: pc3}
  E: repeater[facing=north,delay=1]
  w: {name: w0, block: redstone_wire}
  F: repeater[facing=west,delay=1]
  G: {name: w2, block: redstone_wire}
  H: {name: w4, block: redstone_wire}
  I: {name: w6, block: redstone_wire}
  J: {name: w8, block: redstone_wire}
  K: {name: w10, block: redstone_wire}
  M: {name: w12, block: redstone_wire}
  N: {name: w14, block: redstone_wire}
  u: redstone_wall_torch[facing=south]
  O: {output: pimm0, block: redstone_wire}
  P: {output: pimm1, block: redstone_wire}
  Q: {output: pimm2, block: redstone_wire}
  T: {output: pimm3, block: redstone_wire}
  U: lever[face=floor,facing=north,powered=false]
  l: {name: lv2_0, block: 'lever[face=floor,facing=north,powered=false]'}
  V: {name: lv2_1, block: 'lever[face=floor,facing=north,powered=true]'}
  W: lever[face=floor,facing=north,powered=true]
  ): redstone_wall_torch[facing=east]
  o: {name: op0, block: 'redstone_wall_torch[facing=east]'}
  X: {name: op1, block: 'redstone_wall_torch[facing=east]'}
  Y: {name: op2, block: 'redstone_wall_torch[facing=east]'}
  Z: {name: op3, block: 'redstone_wall_torch[facing=east]'}
  '*': redstone_torch
  b: {name: w1, block: redstone_wire}
  c: {name: w3, block: redstone_wire}
  d: {name: w5, block: redstone_wire}
  e: {name: w7, block: redstone_wire}
  f: {name: w9, block: redstone_wire}
  g: {name: w11, block: redstone_wire}
  h: {name: w13, block: redstone_wire}
  i: {name: w15, block: redstone_wire}
