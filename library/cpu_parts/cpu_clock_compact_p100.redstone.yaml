name: cpu_clock_compact_p100
description: 'Compact two-phase CPU clock, period 100 gt: one start edge sets a two-repeater memory, a subtract comparator turns that step into one 10 gt pulse, and the pulse circulates forever in a folded repeater ring of 100 gt. COM is the ring node X, CAP the node 70 gt downstream; each pin is fed by one repeater, so the two match to the tick. The longer chain runs on a sheet at y=3 over roofs and comes down to X and Y by dust stairs, the shorter one is a hairpin on the ground. A second start finds the memory set and adds nothing. Box 9x4x10: com (4,1,0) and cap (6,1,0) on the north face, start (0,1,9) on the south face. First COM 12 gt after the start rises.'
traits:
- comparator_based
- silent
- lightless
- pistonless
- entityless
- tick_accurate
palette:
  .: air
  '#': white_concrete
  c: {output: com, block: redstone_wire}
  A: {output: cap, block: redstone_wire}
  B: repeater[facing=south,delay=1]
  C: {name: com_node, block: redstone_wire}
  D: {name: cap_node, block: redstone_wire}
  '-': redstone_wire
  E: repeater[facing=west,delay=3]
  F: repeater[facing=west,delay=2]
  p: {name: pulse, block: 'comparator[facing=south,mode=subtract]'}
  G: repeater[facing=south,delay=3]
  H: repeater[facing=north,delay=3]
  a: {name: armed, block: 'repeater[facing=south,delay=1]'}
  I: repeater[facing=east,delay=3]
  J: repeater[facing=east,delay=1]
  r: {name: run, block: redstone_wire}
  K: repeater[facing=west,delay=1]
  s: {input: start}
  M: repeater[facing=north,delay=4]
  N: repeater[facing=south,delay=4]
  O: repeater[facing=west,delay=4]
layers:
  0: |
    #########
    #########
    #########
