name: cpu_alu_compact
description: 'CPU4 ALU, compact pass 2: x = n if xsel else b; y = (a - za) + (x xor sub) + sub, co = carry out (for sub, 1 = no borrow), zo = (y == 0). Bit k owns rows z 1+8k..8+8k. Per bit, west to east: n pin (0,1,4+8k) -> mux (two subtract comparators as in mux_comparator_2to1: n - NOT xsel, NOT xsel being dust lit by a wall torch above it, hung on a block that xsel''s tap dust sits on, and b - xsel), X'' = x xor sub (xor_comparator_bridge), P = A'' xor X'' (xor_comparator_bridge; A'' = a - za by a comparator at (21,1,1+8k)), sum = P xor carry (xor_comparator_bridge), and a carry-cancel chain along z at x=33, y=2 (add_carry_cancel_cell''s subtract comparator into a hard-powered block, kill = NOT P from a torch, gen = X'' - P; one repeater per bit restores the carry). a and b enter the east face and ride y=5 highways west; controls enter the west face at z 34 (xsel), 36 (sub), 38 (za) and run along z at y=7. zo is a torch on the south end of a y=7 collector at x=29. East face (abuts cpu_regs_compact):
  y_k out (43,1,1+8k), a_k in (43,1,4+8k), b_k in (43,1,6+8k), zo out (43,1,33), co out (43,1,35). Cells adapted from scripts/alu.py; nets routed by scripts.alu_route with a fixed A* step check.'
traits:
- pistonless
- entityless
- comparator_based
palette:
  .: air
  '#': white_concrete
  '-': redstone_wire
  A: comparator[facing=east,mode=subtract]
  B: repeater[facing=west,delay=1]
  y: {output: y0, block: redstone_wire}
  C: repeater[facing=north,delay=1]
  D: repeater[facing=south,delay=1]
  E: comparator[facing=south,mode=subtract]
  F: repeater[facing=east,delay=1]
  G: {input: n0}
  H: comparator[facing=west,mode=subtract]
  I: comparator[facing=north,mode=subtract]
  a: {input: a0}
  b: {input: b0}
  J: {output: y1, block: redstone_wire}
  K: {input: n1}
  M: {input: a1}
  N: {input: b1}
  O: {output: y2, block: redstone_wire}
  P: {input: n2}
  Q: {input: a2}
  T: {input: b2}
  U: {output: y3, block: redstone_wire}
  V: {input: n3}
  W: {input: a3}
  X: {input: b3}
  z: {output: zo, block: redstone_wire}
  x: {input: xsel}
  c: {output: co, block: redstone_wire}
  s: {input: sub}
  Y: {input: za}
  u: redstone_wall_torch[facing=south]
  ): redstone_wall_torch[facing=east]
  Z: {name: c1, block: redstone_wire}
  d: {name: c2, block: redstone_wire}
  e: {name: c3, block: redstone_wire}
