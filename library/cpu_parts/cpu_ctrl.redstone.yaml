name: cpu_ctrl
description: 'CPU4 control decoder. A two-plane torch PLA from op0..3, z and c to za, sub, wa, wb, wf, wo, hlt, xsel and jt = B or (C and z) or (D and c); then imm0..3 = n0..3 AND xsel, each a torch on a block fed NOT n (torch) and NOT xsel (inverter on a branch of the xsel row, through a repeater). Op, z and c pins on the north face at y=3; control outputs on the east face; n pins and imm outputs on the south face. Computed bounds: 28 gt to the PLA outputs, 36 gt to imm.'
palette:
  .: air
  '=': smooth_stone
  '-': redstone_wire
  '>': repeater[facing=west]
  '#': white_concrete
  z: {output: za, block: redstone_wire}
  s: {output: sub, block: redstone_wire}
  w: {output: wa, block: redstone_wire}
  A: {output: wb, block: redstone_wire}
  B: {output: wf, block: redstone_wire}
  C: {output: wo, block: redstone_wire}
  h: {output: hlt, block: redstone_wire}
  j: {output: jt, block: redstone_wire}
  x: {output: xsel, block: redstone_wire}
  u: redstone_wall_torch[facing=south]
  v: repeater[facing=north]
  n: redstone_wall_torch[facing=north]
  ^: repeater[facing=south]
  i: {output: imm3, block: redstone_wire}
  D: {input: n3}
  E: {output: imm2, block: redstone_wire}
  F: {input: n2}
  G: {output: imm1, block: redstone_wire}
  H: {input: n1}
  I: {output: imm0, block: redstone_wire}
  J: {input: n0}
  ): redstone_wall_torch[facing=east]
  o: {input: op0}
  K: {input: op1}
  M: {input: op2}
  N: {input: op3}
  O: {input: z}
  c: {input: c}
