name: cpu_alu
description: 'CPU4 ALU, arithmetic: y = (a - za) + (((b - xsel) | imm) xor sub) + sub, co = carry out (for sub, 1 = no borrow). Covers ADD, SUB, ADDI, SUBI (imm already gated by xsel in the decoder) and the pass ops LDI and SWAP (za zeroes a). Four bit slices 7 rows apart along z; in each, a comparator mux and xor bridge form X'' = ((b - xsel) | imm) xor sub, a second bridge forms P = a xor X'', and a carry-cancel chain at x=44, y=2 takes NOT P (a torch) on the cancel comparator''s side and Gen = X'' - P from the east; the sum bridge reads the carry tapped off the chain. Pins: b_i (0,1,7+7i), a_i (0,1,9+7i), y_i out (0,3,10+7i); control lanes enter the north face at y=5: xsel x=7, za 10, imm0-3 13/16/19/22, sub 28; co is the chain''s last link at (44,2,31), zo out (34,6,0) on the north face. Hand-placed cells, nets routed by scripts/alu_route.py.'
traits:
- pistonless
- entityless
- comparator_based
palette:
  .: air
  '#': white_concrete
  '-': redstone_wire
  A: repeater[facing=north,delay=1]
  B: comparator[facing=south,mode=subtract]
  C: repeater[facing=east,delay=1]
  D: repeater[facing=west,delay=1]
  b: {input: b0}
  E: comparator[facing=west,mode=subtract]
  F: comparator[facing=north,mode=subtract]
  a: {input: a0}
  G: {input: b1}
  H: {input: a1}
  I: {input: b2}
  J: {input: a2}
  K: {input: b3}
  M: {input: a3}
  ): redstone_wall_torch[facing=east]
  N: comparator[facing=east,mode=subtract]
  c: {name: c1, block: redstone_wire}
  O: {name: c2, block: redstone_wire}
  P: {name: c3, block: redstone_wire}
  Q: {output: co, block: redstone_wire}
  y: {output: y0, block: redstone_wire}
  T: {output: y1, block: redstone_wire}
  U: {output: y2, block: redstone_wire}
  V: {output: y3, block: redstone_wire}
  x: {input: xsel}
  z: {input: za}
  i: {input: imm0}
  W: {input: imm1}
  X: {input: imm2}
  Y: {input: imm3}
  s: {input: sub}
  Z: {output: zo, block: redstone_wire}
  n: redstone_wall_torch[facing=north]
  d: repeater[facing=south,delay=1]
