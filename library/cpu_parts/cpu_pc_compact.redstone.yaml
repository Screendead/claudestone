name: cpu_pc_compact
description: 'CPU4 program counter, compact: master/slave 4-bit register, next = 0 if rst, else imm if jt, else pc+1. The pc pin repeaters at (1,1,1+3i) are the slaves (locked from NOT com), so COM to pc is 8 gt; a second slave per bit feeds a torch/comparator incrementer (carry chain of NOR cells at x=25), and per bit a subtract comparator G_i = (P_i or c_i) - (c_i+1 or J) feeds the master input d_i, OR''ed with imm_i - NJ from gates at y=3 whose outputs reach d_i over a bus on the top deck (y=7). L = NOT cap OR (hlt - rst) locks the masters, J = jt OR rst, NJ = NOT(J - rst). imm/jt/hlt/rst must settle 30 gt before cap (imm reaches d in up to ~20 gt). Pins: west pc0..3 out at z=1,4,7,10 and imm0..3 in at z=16,19,22,25; east n0..3 out at x=31, same z; south (z=27) com x=3, cap x=5, hlt x=7, rst x=9, jt x=11. Built from scripts/cpu_pc_compact.py.'
traits:
- torch_based
- comparator_based
- pistonless
- entityless
palette:
  .: air
  '#': white_concrete
  '-': redstone_wire
  p: {output: pc0, block: redstone_wire}
  s: {name: s0, block: 'repeater[facing=east,delay=1]'}
  A: comparator[facing=south,mode=subtract]
  B: repeater[facing=east,delay=1]
