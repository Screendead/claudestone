name: cpu_regs
description: 'CPU4 register file: A and B master/slave, OUT, Z and C single latches, all repeater latches. Bit k of A, B and OUT sits on deck y=3+2k (Z on deck 0, C on deck 1), so each register is a vertical stack of four latches like dl_lock_stack: masters at z=8 (OUT x=10, A x=16, B x=25), A and B slaves one block east. Every master is locked from the north by a repeater fed by its register''s hold line, which climbs a glass zigzag (z=5/6) from a head of two wall torches on the control deck (y=1): hold = NOT cap OR NOT we. Every slave is locked from the south by a NOT com line climbing the same way (z=10/11). A takes y, B and OUT take a (A''s slave), so SWAP is race-free; Z takes zo and C co. Each deck''s a, b and y lines fan out east to that bit''s band, then step down (a, b) or up (y) to the east-face pins, which match cpu_alu''s west face (regs z = alu z + 11). Pins: east face b_k (49,1,18+7k), a_k (49,1,20+7k), y_k in (49,3,21+7k); west face cap (0,1,8), wf (0,1,12), out_k (0,3+2k,8),
  zo (0,3,14), co (0,5,14), z (0,3,17), c (0,5,17); north face wo (12,1,0), wa (18,1,0), wb (27,1,0); south face com (22,1,43). OUT, Z and C change during cap when enabled; A and B change after com.'
traits:
- pistonless
- entityless
- torch_based
palette:
  .: air
  '#': white_concrete
  w: {input: wo}
  A: {input: wa}
  B: {input: wb}
  C: repeater[facing=north,delay=1]
  '-': redstone_wire
  D: glass
  ): redstone_wall_torch[facing=east]
