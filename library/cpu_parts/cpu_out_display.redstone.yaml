name: cpu_out_display
description: 'CPU output display: out0-out3 (out0 least significant, pins on the south face at x=4,6,8,10, y=1) shown as two seven-segment digits facing north on the z=0 face, tens on the viewer''s left (blank for 0-9, 1 for 10-15). A 14-term sum-of-products decoder in three storeys, routed to the digits; u_a-u_g, t_b, t_c are each segment''s middle lamp.'
traits:
- torch_based
- pistonless
- entityless
palette:
  .: air
  '#': white_concrete
  A: black_concrete
  B: {name: units.d2, block: redstone_lamp}
  C: {name: u_d, block: redstone_lamp}
  D: {name: units.d1, block: redstone_lamp}
  ^: repeater[facing=south]
  '-': redstone_wire
  '>': repeater[facing=west]
  <: repeater[facing=east]
  n: redstone_wall_torch[facing=north]
  E: redstone_wire[north=side,south=side,east=side,west=side]
  o: {input: out0}
  F: {input: out1}
  G: {input: out2}
  H: {input: out3}
  I: {name: units.c2, block: redstone_lamp}
  J: {name: units.e2, block: redstone_lamp}
  t: {name: tens.c2, block: redstone_lamp}
  K: {name: u_c, block: redstone_lamp}
  M: {name: u_e, block: redstone_lamp}
  N: {name: t_c, block: redstone_lamp}
  O: {name: units.c1, block: redstone_lamp}
  P: {name: units.e1, block: redstone_lamp}
  Q: {name: tens.c1, block: redstone_lamp}
  ): redstone_wall_torch[facing=east]
  T: {name: units.g2, block: redstone_lamp}
  U: {name: u_g, block: redstone_lamp}
  V: {name: units.g1, block: redstone_lamp}
  W: {name: units.b2, block: redstone_lamp}
  X: {name: units.f2, block: redstone_lamp}
  Y: {name: tens.b2, block: redstone_lamp}
  u: redstone_wall_torch[facing=south]
  Z: {name: u_b, block: redstone_lamp}
  b: {name: u_f, block: redstone_lamp}
  c: {name: t_b, block: redstone_lamp}
  d: {name: units.b1, block: redstone_lamp}
  e: {name: units.f1, block: redstone_lamp}
  f: {name: tens.b1, block: redstone_lamp}
  g: {name: units.a2, block: redstone_lamp}
  h: {name: u_a, block: redstone_lamp}
  i: {name: units.a1, block: redstone_lamp}
