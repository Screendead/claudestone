name: cpu_regs_compact
description: 'CPU4 register file, compact: A and B master/slave, OUT, Z and C latches, every latch a repeater locked from the south by a repeater that reads a block; dust on that block climbs to a hold line at y=3 running along z (x=2 A masters, 6 both slaves, 10 B masters, 14 OUT, 18 flags). Lines come down to heads at row 38: hold = NOT cap OR NOT we (a wall torch on the cap row, cap dust on blocks at row 40, and one on the enable''s block); the slave line holds while NOT com. Bit k owns rows 1+8k..8+8k: y_k in at (0,1,1+8k) -> A master (3) -> A slave (5) -> a; a_k out at (0,1,4+8k), b_k out at (0,1,6+8k) after B master (9) and B slave (7) on row 6+8k; OUT latch (13,1,1+8k), out_k pins on the north face at x=16+2k. zo in (0,1,33), co in (0,1,35); south face (z=45): wa 4, com 8, cap 10, wb 12, wo 16, wf 20 in, c 22, z 24 out. B and OUT take a (A''s slave), so SWAP is race-free.'
traits:
- pistonless
- entityless
- torch_based
palette:
  .: air
  '#': white_concrete
  o: {output: out0, block: redstone_wire}
  A: {output: out1, block: redstone_wire}
  B: {output: out2, block: redstone_wire}
