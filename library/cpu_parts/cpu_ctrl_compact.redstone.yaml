name: cpu_ctrl_compact
description: 'CPU4 compact control decoder: op0..3, z, c to xsel, za, sub, wa, wb, wo, wf, hlt and jt = B or (C and z) or (D and c), the function of scripts/cpu_ctrl.py without the imm gates. The four op bits run overhead as dust at y=3 on blocks at y=2 along z (op3 x=1, op1 x=4, op2 x=7, op0 x=10), as the input lines of redstone/pla.py do; the logic sits at y=1 under them. A wall torch on a bus block hangs over a y=1 cell and lights it with NOT bit (pla.py''s tap; mechanics weak_powered_block_skips_dust keeps the cells under the buses dark), and a repeater reading a bus block drives a solid that powers the dust below it with the bit (not_gate''s repeater-into-block, mechanics dust_powers_block_below and comparator_through_block_keeps_dust_level for the reads). Every product term is a row of subtract comparators, each an AND NOT of and/and_comparator_lightless and and/and_comparator_3input: the row starts on a positive literal tap and each comparator subtracts the taps on its side cells
  (mechanics comparator_side_input_sources); rows two apart share the side row between them. Outputs that OR several terms merge as dust in the feed column x=11; a term feeding two outputs (m14 into xsel and sub), and wa = wf or za, go through repeaters. jz and jc run west from the z and c pins and m11 west from an op0 tap into the jt column x=1; hlt runs east to x=11 and up to the north pin. Buses are refreshed by repeaters at y=3 where they would run out. Pins: west op0..op3 at z=13,15,17,19 (y=1); north jt x=1, hlt x=11; east (x=13, north to south) z 8, c 10, xsel 23, sub 29, za 31, wa 33, wf 35, wo 41, wb 43.'
palette:
  .: air
  '#': white_concrete
  j: {output: jt, block: redstone_wire}
  h: {output: hlt, block: redstone_wire}
  ^: repeater[facing=south]
  '-': redstone_wire
  A: comparator[facing=east,mode=subtract]
  B: comparator[facing=west,mode=subtract]
  <: repeater[facing=east]
  z: {input: z}
  c: {input: c}
  o: {input: op0}
  '>': repeater[facing=west]
  C: {input: op1}
  D: {input: op2}
  E: {input: op3}
  x: {output: xsel, block: redstone_wire}
  v: repeater[facing=north]
  s: {output: sub, block: redstone_wire}
  F: {output: za, block: redstone_wire}
  w: {output: wa, block: redstone_wire}
  G: {output: wf, block: redstone_wire}
  H: {output: wo, block: redstone_wire}
  I: {output: wb, block: redstone_wire}
  ): redstone_wall_torch[facing=east]
  (: redstone_wall_torch[facing=west]
