name: cpu_pc
description: '4-bit program counter for the CPU4 computer: a master/slave register with an incrementer and a next-PC mux (next = 0 if rst, else imm if jt, else pc+1 mod 16). The master captures next while cap AND (rst OR NOT hlt); the slave copies the master while com; pc0..pc3 are the slave. Built as a diagonal stack: bit i lives on its own layer at y=4+3i shifted 3 rows south per bit, so the shared hold, jump and jump-or-reset lines are dust staircases rising one row per level, the carries are short staircases, imm rises in a glass zigzag and each bit''s value comes down a spiral to the pin slave. The slave next to each pc pin is unlocked by a NOT com torch fed through one regenerating repeater, giving COM rise to pc settled in 10 gt (the pins are 35 rows apart, so 8 gt cannot be reached with repeater and torch stages). The incrementer reads the master through a 16 gt delay chain, so the master is never fed its own new value while CAP is high: CAP pulses must be shorter than about 16 gt (10 nominal). Torches on the control plane and the incrementer; no pistons or entities. Hand-authored from a scratch generator (scratchpad cpu/pc/build_pc.py).'
traits: [torch_based, pistonless, entityless]
