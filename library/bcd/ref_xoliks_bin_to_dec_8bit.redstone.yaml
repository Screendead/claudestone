name: ref_xoliks_bin_to_dec_8bit
description: 'Xoliks, Uni and Flyingdean''s BintoDec Converter 4.2 (BINTOBCD003, Logical Redstone Archive, tags Tested & Functional, Recommended, endorsed by mattbatwings; Discord https://discord.com/channels/1361854816837435433/1472406276838260859).
  SOURCED (README): converts an n-bit binary number to N decimal digits as signal strengths (0-9, one dust per digit, to tile with 7-segment displays), speed 2*b+1 ticks, expandable by 7x4x2 per cell, uses
  TTP to remove directionality issues. Rebuilt from the .schem block states and barrel items (barrels 4, 8, 9 and 14 are constants read by comparators; the item counts are kept exactly), update_pass all.
  Harness change: the 8 levers (bit b at y=2b+2, x=0, z=0, bit 0 at the bottom) are kept as named cells b0..b7, but the 8 indicator redstone lamps they hang on are white_concrete, because the harness can
  only click a lever on a plain full block; the wall torch on each still reads the block. Outputs: the dust at x=6, y=1 at z=5, 9, 13 are ones, tens, hund (0-9 strength each). Size 7x18x15 (1235 blocks).
  MEASURED: all 256 values give the right three digits, in Gray-code order (one lever per step), in a shuffled order (seed 26, multi-bit changes) and on decimal carries and edges (9, 10, 99, 100, 127, 128,
  199, 200, 249, 250, 255); every bit alone is right. The outputs settle within 42 gt of the lever click for 0 to 128, 128 to 0, 0 to 255 and 255 to 0 (first output change about 10 gt after the click; at
  255 the ones digit passes through intermediate values and the tens and hundreds digits last), against 34 gt from the README''s 2*b+1 ticks. The digits are not glitch-free: they run through intermediate
  values while settling (255: ones 1, 3, 7, 5 then tens 1, 3, 6, 3, 5, then hund 1, 2), and after placement they flicker for about 36 gt. Server dependence: these results hold on sat1-sat6 and dsat1; the
  same spec on dsat2 and dsat3 settled later than 50 gt for 0 to 128 and, on dsat3, to the wrong value (ones=1 tens=4 hund=2 for 255), so a run pinned there can fail. INFERRED (not tested piecewise): each
  bit is one 2-layer cell per digit, a stack in y; each cell has an inverting torch and a repeater from its lever, a 14 constant (barrel 14) through a compare comparator, and a side-8 barrel read by a subtract
  comparator; strength passes up and down the stack as dust and comparators, i.e. a double-dabble style conversion done in signal strength.'
traits:
- pistonless
- entityless
update_pass: all
