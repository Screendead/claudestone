name: ref_xoliks_dectobin_converter
description: "Rebuild of BCDTOBIN002 DectoBin Converter (Xoliks, Uni, Flyingdean, Stickman; mattbatwings' Logical Redstone Archive, https://discord.com/channels/1361854816837435433/1487531006155034716), 25x18x14. SOURCED: three decimal digits go in as lectern page signals (strength = digit, book page n shows n; no book = 0) and the binary comes out LSB first on lamps in a column on the east side (x=12, z=13, one per 2 layers), README speed 2*floor(x/log10 2)+x+3 redstone ticks. Harness changes: the schematic's three lecterns (named dig0 hundreds z=1, dig1 tens z=5, dig2 ones z=9) are set by run setblock of a lectern with a 15-page book; the 149 barrels get their wooden-shovel counts from the .schem block entities (2, 14, 16 or 18 shovels = strengths 2, 8, 9, 10: constants for the subtract comparators); lamps are y4..y18 and the torches under them q4..q18 are named for timing. MEASURED: a stage (one per 2 layers) turns the strength-inverted digits (15-d, from a redstone block minus the lectern signal) into those of n div 2 (n=10: ones 15->10 i.e. 5; n=90: tens 4, ones 5) and drops n mod 2 onto the next lamp; the parity of the ones digit is bit k. Only 8 stages are built, so this 3-digit build shows n mod 256 (999 gives 231); the README's 'n bit' formula would need 10 stages for 3 digits (INFERRED). All of 0..255 pass in order. Lamps settle within 46 gt of the change (torches 42, lamps add 4 on a fall) on 21 transitions incl. the worst seen, 930->857 (the README bound for 3 digits is 24 redstone ticks = 48 gt); 45 gt fails. Not every pair of values was timed."
