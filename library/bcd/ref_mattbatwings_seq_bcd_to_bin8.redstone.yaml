name: ref_mattbatwings_seq_bcd_to_bin8
description: 'Sequential 8-bit BCD to binary (BCDTOBIN001, mattbatwings'' Logical Redstone Archive, endorsed by mattbatwings, tagged Tested & Functional; Discord https://discord.com/channels/1361854816837435433/1472406495927992342).
  SOURCED: set one BCD digit on four levers (d5 = 1, d7 = 2, d9 = 4, d11 = 8), press type, repeat; clear resets; the 8-bit result n -> 10n + digit shows on lamps y2 (bit 0) to y16 (bit 7). 12x20x24, 1114
  blocks (the two decorative signs left out); an 8-layer-pair stack with one locked-repeater latch per bit (5,3+2k,3), a torch-and-dust-decay adder row per bit, target blocks as torch taps. The lever and
  button faces hang on lamps, which the harness `use` step does not emulate, so the tests flip them with run: setblock plus a clone of the lamp (what `use` does). MEASURED on 26.3: with a type press of
  0 to 2 gt every entry of 1 to 4 digits tested passes (0..255 including 99, 199, 254, 255), outputs change 18 gt after the press starts (16 after a 2 gt press ends; a lamp falls 4 gt after its latch).
  With a press of 3 gt or longer (hold 3, 4, 5, 6, 8, 12, 80 all measured) a second digit loses the first: the latches are open for as long as the press lasts, and 4 gt after bit 1 and 3 latch 10 the open
  latches take a feedback value of 0 (traces: 12 -> 2, 10 -> 0, 100 -> 0). A stone button holds 20 gt, so the README''s own input fails here; a 20 gt press of 1 then 2 gives 2, not 12;
  the tests use a 2 gt press. Clear is also broken: it opens the latches for a 4 gt shaped pulse (comparator minus a delay-2 repeater) and, with 57 stored, left 250 (0b11111010),
  not 0, whatever the press length (2, 6, 20 and 40 gt tried). Past 255 the result is not n mod 256 (256 -> 0, 333 -> 13, 777 -> 137 measured), so only 0..255
  is claimed. The settled start state matches the schematic''s saved dust, torch, repeater and lamp states exactly, so a bad port of the idle state is ruled out; whether the long-press failure is a 26.3
  change or was always there is not known.'
