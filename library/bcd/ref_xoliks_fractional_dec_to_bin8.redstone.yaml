name: ref_xoliks_fractional_dec_to_bin8
description: 'Xoliks, Flyingdean, Uni and Stickman''s Fractional DectoBin Converter (BCDTOBIN003, Logical Redstone Archive, tags Tested & Functional, Recommended, endorsed by Waffle [Wueffi]; Discord https://discord.com/channels/1361854816837435433/1487528241144004640). SOURCED (README): converts a fractional decimal (n digits as signal strength, "ss on the top") to binary (n bits on the side, MSB at the top), speed 2(d-1)+2(p-1)+3rt for d digits and p bits, expandable by 7x4x2 per cell, uses TTP to remove directionality issues. This is the 3-digit, 8-bit build, 7x18x14, 1241 blocks. Inputs are three lecterns on the top layer (y=17, x=0) holding a 15-page book: the comparator beside each reads page+1 (docs/MECHANICS.md lectern_page_signal_and_pulse), so digit d is page d-1 and digit 0 is a lectern with no book (strength 0). z=8 is the tenths digit, z=4 the hundredths, z=0 the thousandths; the tests drive them with run steps (setblock for no book or a book, data merge for the page). Outputs
  are the 8 lamps at x=0, z=13, y=15 (b1, weight 1/2) down to y=1 (b8, weight 1/256). As saved the lecterns are on pages 4, 1, 0 (strengths 5, 2, 1, 0.125) and the third lamp is lit, as in the README render. Rebuilt from the .schem block entities and the full saved block states (power, lit, powered; the skeleton strips these): barrel items (26, 18 and 14 wooden shovels, one per slot, are the constants 14, 10 and 8 read by comparators), the lectern books and every comparator''s OutputSignal; update_pass all. No block was changed. MEASURED on sat1 and dsat4 (fresh build per value, all three lecterns set to no book and 60 gt of rest, then the value set, 150 gt of rest): all 1000 inputs 0.000 to 0.999 give 8 bits equal to floor((256*v + 250) / 1000) for v in thousandths. That is the exact truncated binary expansion for 752 of the 1000 values and one more (rounded up) for the 248 whose remainder 256*v mod 1000 is 750 or more (v=50 gives 13, not 12; v=300 gives 77, not 76); the threshold lies
  between remainder 744 (v=249, truncated) and 752 (v=42, rounded up). Exact binary fractions (0.125, 0.25, 0.375, 0.5, 0.625, 0.75, 0.875) and 0 and 0.999 (255) are right. The README does not say whether the last bit truncates or rounds; the tests assert the measured rule. Timing: over 89 input changes the first lamp change came 6 to 38 gt after the lectern change and the last lamp change at most 42 gt after it (including a lamp''s 4 gt on a fall); the ''settles within 44 gt'' test passes on sat2, against 24 gt if the README''s 3rt is 3 redstone ticks (6 gt), so it is slower than the formula reads, but the formula''s unit was not pinned down. History does not matter in the shuffled and settling tests (values in sequence, no reset). INFERRED (not tested piecewise): each of the 8 stacked 2-layer stages doubles the 3-digit decimal fraction digit by digit, thousandths first with the decimal carry rippling to the tenths digit, using the barrel constants as subtract and compare thresholds to
  fold a doubled digit back below 10 and detect the carry; the carry out of the tenths digit is that stage''s bit, read through an inverting wall torch at z=12 that drives the lamp, and the remaining three digits are passed down to the next stage; the compactness comes from carrying every digit as one strength and from constants in barrels, which need no wiring. Pitfalls found: (1) built from the skeleton alone (no saved power or comparator output) the lamps all rest lit and the outputs stay wrong until an input changes, and a digit left at its built value (tenths 1) gave the pattern of 0.9; the saved states fix both. (2) Before the desktop satellites went down, the same build on dsat2 and dsat3 left one or two of the 24 constant comparators in column x=0 (z=6 at y=11 on dsat2; z=6 at y=3 and y=5 on dsat3) at output 0 for good, even when re-placed, which changed the outputs; sat1 to sat6, dsat1 and dsat4 to dsat6 had none (checked with the skeleton-based build, not with this file). A run
  pinned to dsat2 or dsat3 may fail.'
