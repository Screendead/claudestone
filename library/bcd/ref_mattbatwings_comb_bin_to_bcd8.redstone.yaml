name: ref_mattbatwings_comb_bin_to_bcd8
description: 'mattbatwings BINTOBCD001 8-bit Combinational Binary to BCD (Logical Redstone Archive, tags Tested & Functional, Recommended; Discord https://discord.com/channels/1361854816837435433/1472406154553327722).
  SOURCED (README): converts any 8-bit number to its 3 BCD digits, no clock. Rebuilt from the .schem block states, update_pass all. Harness change: the 8 input levers on their indicator lamps (x=0,2,..,14,
  z=0) are replaced by input cells i0..i7 (i0 = least significant) at the lamp cells, where a redstone block feeds the first repeater of each column directly; the 10 output lamps (x=0,2,..,18, z=47) are
  outputs o0..o9, o0-o3 the ones digit, o4-o7 the tens, o8-o9 the hundreds, bit 0 first. The black wool markers between the digits are kept as built. Size 19x19x48 (4124 blocks). MEASURED: all 256 values
  give the right 3 digits, in counting order and in a shuffled order (seed 26) where every step is a multi-bit change; worst delay 36 gt in counting order and 38 in the shuffled order (counting order: ones
  and tens bits rise 28-32, fall 32-36; hundreds rise 28, fall 32-36). The outputs are not glitch-free: the load settle shows lamps flickering for about 36 gt after placement. INFERRED (not tested piecewise):
  the 7 add-3 modules (counts 1,1,1,2,2 per stage band, each shifted 2 cells in x) are the shift-and-add-3 (double dabble) network: 5 modules on the ones digit after 3..7 bits shifted in, 2 on the tens
  digit after 6 and 7 bits.'
traits:
- pistonless
- entityless
update_pass: all
