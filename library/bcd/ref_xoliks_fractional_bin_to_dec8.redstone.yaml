name: ref_xoliks_fractional_bin_to_dec8
description: 'Xoliks/Flyingdean/Uni/Stickman ''Fractional BintoDec Converter'' (Logical Redstone Archive BINTOBCD004, tags Recommended, Tested & Functional, endorsed by Waffle [Wueffi]; Discord https://discord.com/channels/1361854816837435433/1487529084115484874). SOURCED (README): converts a fractional binary number 0.b1b2..bn to decimal digits, each digit a signal strength (0-9) on a dust line; "3*b redstone ticks" (b bits); infinitely expandable (25x4x2 per cell), more digits = more precision. This build is b=8 bits, 3 digits, so 8 stacked 2-layer cells (y=0..15, 2 layers per bit, LSB bottom, MSB top: levers b8..b1 at x=12, z=0, y=0,2,..14) and a 3-digit output stage on top: dust cells f1 (tenths), f2 (hundredths), f3 (thousandths) at x=10, y=17, z=4/8/12, each a 13-minus-pipeline-strength subtract comparator from a barrel holding 24 shovels (strength 13). Size 25x18x14 (2683 blocks). Rebuilt block-for-block from the .schem, barrel contents (27-slot barrels of 18/16/14/2/24 non-stackable shovels = strengths 10/9/8/2/13) and the 15-page lectern (page 7, comparator reads 8) kept as built, update_pass all. Harness change: none in the layout; the 8 levers are kept. `use:` refuses a lever hung on a lamp, so each flip is a `run` pair, setblock of the lever''s new state then a clone of the lamp onto itself, the same two commands the harness uses for a lever it can emulate. MEASURED: all 256 inputs (counting order, and a shuffled order seed 26 starting with 255,0,255,0,170,85,170,0 so most steps change several bits) read digits floor(k*1000/256) except 16 inputs (k = 11,22,43,54,75,86,107,118,139,150,171,182,203,214,235,246, the k where (125k mod 32) >= 30, i.e. the exact value''s fraction is 15/16 or more) whose last digit reads one higher (k=11: 42.97 reads 043; k=1: 3.9 reads 003); the tests assert exactly these values. Worst settle 38 gt (19 redstone ticks) from the lever flip to the last change of any digit, for a multi-bit flip; mean 34.6 gt over 264 steps, under the README''s 48 gt (3*8 rt). Outputs are not glitch-free: digits ripple through intermediate values while the pipeline settles, and after load f2/f3 take about 32 gt to fall to 0. INFERRED (not tested piecewise): the lever drives a lamp whose wall torch inverts it into a hard-powered block above the torch, giving the bit as strength 15/0; the rest is a pipeline of per-bit halvers in which each decimal digit is a signal strength that is halved with barrel-constant subtract comparators (rows z=4, 8, 12 = the three digits, a 2-layer cell per bit), the remainder of one digit carried into the next as +5.'
traits:
- pistonless
- entityless
update_pass: all
