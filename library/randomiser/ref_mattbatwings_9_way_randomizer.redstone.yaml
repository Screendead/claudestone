name: ref_mattbatwings_9_way_randomizer
description: "ref_mattbatwings_9_way_randomizer: mattbatwings 9-way randomizer (Logical Redstone Archive RANDOM004_9_way_Randomizer, https://discord.com/channels/1361854816837435433/1472398306025148609): one button press puts a random signal strength 1-9 on a comparator for 2 gt, shown as 1-9 lamps of a unary bar. A dispenser holds 7 and a dropper 2 shulker boxes filled with 1, 3, 5, 7, 9, 10, 12, 15 and 17 stacks of redstone (their comparator strengths 1-9). The press makes a comparator pulse the dropper, whose block hard-powers the dispenser above it, so both fire in the same tick: the dropper moves a random shulker up into the dispenser, which places a random one onto the cell in front of the comparator; the comparator reads it, the piston above breaks it, and the dropped item falls onto the hopper that returns it to the dropper. Needs doTileDrops true (the default). Size 3x4x15. Harness change: update_pass strict, since under the default and the none pass lamps 4-6 come up lit and stay lit (MEASURED), and with strict none do. Schematic carried only the 9 strengths in item NBT, rebuilt from the .schem block entities. Measured on a 26.3 satellite: 150 presses 30 gt apart all gave 1..9 with every strength seen; lamps = strength; the comparator is on 8 gt after the press for 2 gt and lamp 8 stays lit 6 gt; 9 items conserved (dispenser + dropper + hopper) and no stray item or lost comparator after any press; 60 presses at 25 gt pass, 24 gt failed."
traits: [container_based, comparator_based, piston_based]
update_pass: strict
