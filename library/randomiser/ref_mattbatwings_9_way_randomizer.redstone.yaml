tests:
- name: random_strength
  settle: 20
  finally: [scoreboard objectives remove r9]
  steps:
  - run: scoreboard objectives add r9 dummy
  - run: 'scoreboard players set #c1 r9 0'
  - run: 'scoreboard players set #c2 r9 0'
  - run: 'scoreboard players set #c3 r9 0'
