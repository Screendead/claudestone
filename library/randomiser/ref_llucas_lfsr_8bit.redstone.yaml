name: ref_llucas_lfsr_8bit
description: "Rebuild of Logical Redstone Archive RANDOM005 \"Linear Feedback Shift Register\" by LLucas, endorsed by mattbatwings (Discord https://discord.com/channels/1361854816837435433/1472588062658920611). README (SOURCED): MCHPRS-compatible \"random\" number generator, \"16 long\"; input a randomizer pulse; output an 8-bit number; speed 6t randomization + reset time; built-in pulse shortener; the seed is changed by changing the states of the locked repeaters; tags Tested and Functional. Size 11x17x50 trimmed from the 19x22x59 schematic box; the decorative sign is dropped, every other block and state (repeater powered/locked, dust power, lamps) is kept so the seed is the saved one. How it works (MEASURED unless marked): eight stacked copies (y = 1,3,..15, one per output bit, each its own 24-stage register) share one pulse line that zigzags up the east edge through dust and glass; each layer has 24 repeaters facing north in a column (x=4), each feeding the next through a wool block and each locked by its own side repeater that reads a lock dust line running down the column, so the register holds its bits while the lock line is high. A press (the button at x=10,z=28, its support is the pulse lamp) reaches the layer clock wire 4 gt later, a delay-3 repeater and a torch (INFERRED: the built-in pulse shortener) drop the lock line for 4 gt (lock line off at +6, side repeaters off at +8, back on at +12) and every stage takes its predecessor's old bit at +10, so each press moves all bits one stage south; the new bit at the north end is stage 22 XOR stage 23 (MEASURED by fitting 20 states of every layer, unique among XORs of up to 4 stages), made by subtract comparators at the south end and returned up a long dust column with repeater boosters (the exact comparator gates were not traced further, INFERRED). The output lamp of a layer shows its last stage, stage 23. Measured: all 8 layers follow a_new = s22 xor s23 for 30 presses from the saved seeds, so the 8 lamps give one byte per press; each 24-bit register has period 2^21-1 = 2097151 from its saved seed (computed from the measured recurrence, not run in game; the README's \"16 long\" is not what these blocks do); lamps rise 10 gt and fall 14 gt after the press and are valid from +14; a pulse of 3 gt or more (tested 3, 4, 5, 8, 60, 200) shifts exactly once, after a 2 gt pulse in one run the layer 6 lamp was wrong (expected 1, read 0), so 2 gt is too short; two 4 gt pulses with an 8 gt gap (12 gt start to start) shift twice, with a 7 or 6 gt gap the second is ignored; flipping the saved state of one stage repeater changes the stream as the recurrence predicts. Harness changes: the button hangs on a redstone lamp, which Rig.use does not emulate, so the tests press it with run steps (setblock the button powered, clone its support onto itself, hold, release the same way); a stone button lasts 20 gt in the world, tests hold 20 gt unless a test says otherwise."
traits: [vertical, pistonless, entityless, lockable]
