name: ref_mattbatwings_subset_selector
description: |-
  Rebuild of mattbatwings' "Subset Selector (from 2048)" from his Logical Redstone Archive, entry
  RANDOM001 (Discord: https://discord.com/channels/1361854816837435433/1472398216610844844, tagged
  Tested and Functional and Recommended, schematic RANDOM001_subset_selector). SOURCED from the README:
  4 input bits on levers, a button starts it, the output is a 4-bit one-hot pulse, and given any
  subset of the inputs it picks one input of that subset at random; needs the block-drops game rule on
  (26.3 name `block_drops`, formerly doTileDrops). Size 24x11x27 (the archive's 24x10x27 plus one layer, see below).
  HOW IT WORKS (INFERRED from the traces and the container NBT, then each step MEASURED):
  each of the 15 non-empty subsets owns a column of (hopper, dropper, dispenser, piston, comparator)
  at x = 9..21 (lower copy, y 1..4, the 7 subsets that contain lever 1) and x = 9..23 (upper copy, y 6..9,
  the 8 that do not). The dropper and dispenser of a column hold shulker boxes of 1, 3, 5 or 7 full stacks of
  redstone (comparator strength 1..4), one box per member of the subset, split between the two containers as
  the author left them. Lever k feeds a subtract comparator whose side input is a lit torch; the button's
  pulse (stone button, 20 ticks) turns those torches off for the pulse, so the levers are sampled once,
  then each lever line is carried along the x axis by a decaying dust line and a staggered tap per
  column (dust strength falls 1 a block, so each column sees a different level) switches off exactly
  the column line of the subset that matches. That column's torch pulses the repeater into the
  dropper, which moves one shulker box up into the dispenser (a dropper above a container feeds it),
  and the dispenser, powered in the same tick through the dropper block, places a RANDOM one of its
  boxes (a dispenser picks uniformly among its occupied slots, which is the whole source of randomness)
  in front of it. A comparator reads the placed box (strength 1..4), a piston above it destroys the box
  (a shulker box has a destroy push reaction), which drops as an item with its contents because
  block_drops is on and falls into the hopper below, which carries it back into the dropper: the column
  is reset with every box where it started. The strength then goes through a merging tree of comparators
  into a dust line whose length is the strength (a thermometer), two staggered copies of it turn that into a
  one-hot row of torches, and a dust/wool route per row drives a 2-tick repeater into a lamp. Lever k picks lamp
  out k (strength 5-k); the compactness comes from using container fullness as the 4-way code and
  the dispenser as the random source, so no counter or LFSR is needed.
  HARNESS CHANGES: the four lever supports (redstone lamps) and the wool under the button became white wool,
  because the harness emulates a click only on plain full blocks (a lamp conducts power the same way);
  the two glass corner markers are dropped; the shulker boxes are rebuilt from the schematic's block-entity
  NBT without their custom names and lore; the block states are the schematic's saved ones (with dust
  power and torch state), so the build is quiet at placement, update_pass all. Levers are named lever1..4
  (the z = 20, 22, 24, 26 rows), the button go, the lamps out1..out4 (the z = 0, 2, 4, 6 rows).
  DEFECT FOUND AND REPAIRED: as archived, an upper-copy column cannot light out2: the torch row that
  selects strength 3 sits at (13,9,3), and the lower copy lights its lamp through blocks one layer above the torch
  (a wool at (13,5,3), dust at (12,5,3)), which for the upper copy would be at y = 10, outside the
  schematic. So subsets {2}, {2,3}, {2,4} and {2,3,4} (every subset with lever 2 and without lever 1)
  never pulse out2: MEASURED 0 of 30 presses on {2}, and on {2,3}, {2,4}, {2,3,4} out2 never lit
  in 30 presses while the other members did, so those presses give nothing 40 to 50 percent of the time. The
  test as_archived_lone_input2_is_dead proves it by removing five blocks. The repair is five blocks that
  mirror the lower route a layer higher: wool (13,10,3) on the torch, dust (12,10,3) and (12,10,2),
  wool (12,9,2) as the dust's support and wool (12,10,4) so the lamp-4 dust at (12,9,4) does not climb onto the new
  dust (without it out3 lit falsely when only lever 2 was on). That it is what the author had is a guess
  (INFERRED from the cropped height); the repair is mine. With it all 15 subsets pass.
  MEASURED on 26.3: for every subset, 40 presses at 60-tick spacing each gave exactly one lamp, always a member,
  and every member at least once (the tests), 160 presses of {1,2,3,4} gave each lamp 20 to 60 times (uniform
  within 3 sigma). The lamp lights 36 game ticks after the click and stays lit 8 ticks (pulse_timing); with
  no lever on the button gives nothing, and a lever alone gives nothing. Presses 45 ticks apart also worked
  (12 of 12 on {3}); faster was not tried. With block_drops off the first press destroys the box for good and
  every container is empty afterwards. One stray item entity is present all the time and is not part of the design.
traits:
- container_based
- comparator_based
- torch_based
- piston_based
- analog
update_pass: all
