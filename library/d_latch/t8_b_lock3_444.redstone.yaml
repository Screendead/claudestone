name: t8_b_lock3_444
description: 'Addressable RAM, 4x4x4 blocks per bit, stackable in all three directions (the ORE 4x4x4 Tileable RAM Cube rules: repeater-lock memory, no pistons, data-in/out lines parallel along x, hold/read control lines parallel along z, no per-cell diodes in any line). Found by a SAT search over periodic lattices (scratchpad t8b). Per bit three repeaters: s (memory, reads the din line through the block under it) is side-locked by k (reads the hold line through a block); o reads the rd line, is side-locked by s, and hard-powers a block touching the dout line. s stores the inverted bit, so din carries the inverted bit and hold is active-low (hold=1 keeps, 0 writes); o is unlocked only when the bit is 1, so rd=1 puts the bit on dout. This spec is a 2x2x2 array (words ik = hold ik/rd ik, bits j = din jk/dout jk): 8 cells in a 16x12x16 box; the cell pitch is 4 in x, y and z (64 per bit, pitch product). Write: k drops 2 gt after hold falls, s changes 4 gt after; read: dout 2 gt after rd, over lines two cells long. Reading and writing one word at the same time is not supported.'
traits: [pistonless, entityless, silent, lightless]
