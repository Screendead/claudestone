- name: write and read latency, word 00 bit 0
  initial: {hold00: 1, hold10: 1, hold01: 1, hold11: 1}
  settle: 30
  steps:
  - drive: {din00: 1}
  - wait: 4
  - drive: {hold00: 0}
  - wave: {k000: '11000000', s000: '00001111'}
  - drive: {hold00: 1}
  - wait: 6
  - drive: {din00: 0}
  - wait: 6
  - expect: {s000: 1, dout00: 0}
  - drive: {rd00: 1}
  - wave: {dout00: '00000000'}
  - drive: {rd00: 0}
  - wait: 4
  - drive: {hold00: 0}
  - wave: {k000: '11000000', s000: '11110000'}
  - drive: {hold00: 1}
  - wait: 6
  - drive: {rd00: 1}
  - wave: {dout00: '00111111'}
  - drive: {rd00: 0}
  - wave: {dout00: '11000000'}
