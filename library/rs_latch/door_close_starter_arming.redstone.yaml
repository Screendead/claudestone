name: door_close_starter_arming
description: 'Door part (arming, lane 2) for lane 1''s close starter X_C and depower relay D_W (door_close_wave1''s probe
  cluster): both are armed by piston-moved blocks instead of setblock strict, and re-homed after they fire. Spec = door -
  (1,-1,-2); the door''s own coords are listed in door2/parts/door_close_starter_arming.md. Lane 1''s cluster (unchanged except
  S_X is stone from the start and S_D is a slime block): X_C (0,8,1) piston east, S_X (1,8,1), gate G_W (2,8,1), D_W (1,9,1)
  piston east, S_D (2,9,1), RB_W (3,9,1), live dust (3,9,0), (2,8,0) on stone, L0 (2,7,1) on glass. Added: stone G3 (3,8,1)
  extends X_C''s line; blocker B (5,8,1) (piston west, extended, head (4,8,1)) makes the line immovable, so X_C ignores every
  update while B is out; E (5,9,1) (piston west) pushes D_W''s payload home; W (2,10,1) (redstone block, a QC cell of D_W)
  is D_W''s arm, carried by the slime: D_W''s own push drags it to (3,10,1) (D_W disarms itself), E''s push drags it back.
  Post-fire detector: dust (3,10,2) on obsidian beside W''s fired cell, repeater RQ (4,10,2) into stone Q_E (5,10,2), a QC
  cell of E, so E is powered from 2 gt after W lands and (INFERRED) is woken only by B''s base update. B''s timer: repeater
  R1 (6,1,2) (delay 2) reads NA, dust climbs x=7 ((7,1,2), (7,2,3), (7,3,2), (7,4,3), (7,5,2), (7,6,3), (7,7,2), (7,7,1))
  on glass, repeater R2 (6,7,1) (delay 1) into stone (5,7,1) under B: NA delayed 6 gt. Stand-ins (fixtures/inputs): na (5,1,2)
  = NA (on while the door is closed; the door kills it in t0 g and restores it at c2 j via part 1''s sticky I_A); kin (0,9,0)
  = K_in (QC power for X_C while open; also powers fixture sticky piston I_A (0,8,0), whose base updates X_C on both edges,
  like the door''s I_A); rbt (0,7,1) = RB_T''s open cell (powers X_C directly; driving it on is RB_T''s t5 j landing, off
  is part 5''s departure). Here tick k is k ticks after a drive. Opening (kin on, na off): I_A''s update reaches X_C at k=1
  and rbt''s at k=5, both while B is out; B retracts at k=6 (6 gt after na) and X_C is armed; D_W has been armed since the
  last close (W at its QC cell, nothing next to D_W changes until S_X moves): a deliberate departure from arming it inside
  the opening, since no opening event changes a cell next to D_W. Close (kin off): X_C fires at k=1 (gate G_W moving, live
  dust dead in the same g after D_W); D_W retracts at k=3 (unpowered; INFERRED cause: X_C''s head landing next to it). na
  on at k=3, rbt off at k=5 retracts X_C; B and E extend 6 gt after na (B first), pushing G3, G_W, S_X and RB_W, S_D, W home;
  they land 2 ticks later, gate stones before RB_W, so the live dust returns with the gate closed; E retracts the tick after.
  Requirement on part 5: RB_T must leave (1,6,-1) after c2 d and before B''s return (door c8 g), else B is blocked by X_C''s
  head and the cycle stalls (with a lever input, every close tick is one earlier). Build order by hand: place E extended before
  W or D_W; D_W is powered by W from the start and only E''s head keeps it still until E retracts. Test 1 runs three cycles
  tick by tick (waves); test 2 holds B''s timer on with a redstone block under the climb''s first dust (X_C stays retracted
  at the close); test 3 removes B (X_C fires during the opening).'
traits:
- piston_based
- tick_accurate
