    check: if block ~1 ~8 ~1 stone
  - &id002
    check: if block ~2 ~8 ~1 stone
  - &id003
    check: if block ~3 ~8 ~1 stone
  - &id004
    check: if block ~4 ~8 ~1 piston_head[facing=west]
  - &id005
    check: if block ~2 ~9 ~1 slime_block
  - &id006
    check: if block ~3 ~9 ~1 redstone_block
  - &id007
    check: if block ~2 ~10 ~1 redstone_block
  - &id008
    check: if block ~3 ~10 ~1 air
  - &id009
    check: if block ~4 ~9 ~1 air
  - &id010
    check: if block ~0 ~7 ~0 stone
