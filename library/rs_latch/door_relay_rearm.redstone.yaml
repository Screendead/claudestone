name: door_relay_rearm
description: 'Door part (arming, lane 3): a re-armable BUD relay that replaces the load-time `setblock strict` arming. Local
  frame: R at (0,0,0) faces +b (b = along F, a = lateral, y = up). R is a STICKY piston; payload redstone block at R+F (0,0,1).
  Arm W (redstone block) sits at Q_in (1,1,0), a QC cell of R not adjacent to R+F, on the face of sticky piston K (1,1,1)
  facing -b. Tap: dust D (1,0,2) on smooth stone (1,-1,2), pointing into target T (1,0,1) under K, so K is powered only while
  a redstone block sits at R+2F (0,0,2). Added beyond R, payload and arm: K, T, D, D''s support (4 blocks). Cells moved through
  or landed in: R+F and R+2F (payload, head), Q_in and Q_out (1,1,-1) (arm, K''s head). Fire: any update to R while armed,
  in g of tick f: payload leaves R+F in f g, real at R+2F at f+2 j (R still powered, so the head-landing check keeps it out);
  that landing powers D, K pushes W to Q_out in f+3 g (lands f+5 j), leaving R extended, unpowered and not updated. Reset:
  one change next to R+F (not next to R) in g of r0; the head forwards it, R retracts and pulls the payload home, D dies inside
  R''s event so K retracts after it and pulls W back; R, payload and W land at r0+2 j in that order, so R is armed at r0+2
  j (k = 2) without an update, and the payload''s net goes live once, at r0+2 j. Release of the reset cell while R is armed
  does nothing (the payload does not forward updates). Built twice (F north: X2; F west: Z_S, Y12), fixtures: a normal piston
  under R+F driven by input rst_* as the reset event, a cross dust beside R+F (named n*) as the door-net stand-in, and the
  fire is a stone placed and removed behind R. Start state is the fired state; the load update is the first reset (armed after
  settle). Test 3 is a fixture-only control: an up-facing sticky relay whose redstone-block payload sits at R+2 stays extended
  after its arm is removed and it is updated (a stone payload retracts), so this design cannot serve F=up relays; they need
  re-orienting to F horizontal (tested here; F=down is an untested option).'
traits:
- piston_based
- tick_accurate
- reset_safe
