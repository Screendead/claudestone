name: ref_mattbatwings_accumulator_8bit
description: "Rebuild of mattbatwings' 8-bit Manual Accumulator, Logical Redstone Archive OTHERSEQ001, https://discord.com/channels/1361854816837435433/1472418022231642244 (README SOURCED: adds a number to the total using an adder and a register; inputs an 8-bit number and an Add button; output the 8-bit total; tested and functional). 11x18x9, a 2-layer cell per bit stacked at y3,5,...,17 (bit 0 at the bottom) over a 2-layer base holding the Add button. Number levers a0..a7 at x0,z7 (attached to the wool at x1), total lamps q0..q7 at x1,z4, Add button at (0,1,7), and a lever cin at (7,2,6) that the README does not mention: it is the adder's carry-in (MEASURED: with it on an add gives total + number + 1). Harness changes: magenta_wool -> white_wool and the lamp each number lever sat on (x1,z7) is white_wool, because the harness emulates a lever only on plain blocks (the lamp only displayed the input). How it works: the number is a lever-powered wool beside a comparator-and-dust adder per bit; pressing Add (INFERRED from traces) sends a dust line along the base whose strength falls 15 to 3, then a pulse up the x=10 column, which carries strengths 15 down to 1 over the bits at rest, and latches each bit's sum into its register stage. There is no clear input; the total starts at 0 and can only be wrapped past 255. MEASURED: sums mod 256 over 17 adds including carry-in, zero, 255+1 (all eight carries) and 128+128 (top carry dropped); carries do not ripple in time: after an add every bit rises 8 gt after the click and every bit falls 12 gt after it (all eight falling together on 255+1, and mixed rise and fall on 15+1), as in the mattbatwings counters; the total ignores the levers and cin after the add."
traits: [entityless, pistonless, torch_based]
