name: ref_mattbatwings_encode_h2v
description: 'Rebuild of ENCODE004 Encoder horizontal to vertical (mattbatwings archive, endorsed; discord.com/channels/1361854816837435433/1472426523293257819). README: 4b one-hot in, 4b code out, 1 tick, programmable and expandable. 4x9x9 here (6x9x9 with the lever column). Each input is a zigzag dust column up through glass and wool; at every output layer a repeater isolates it from that layer''s OR bus (dust running along z to a lamp), so a code bit is set by keeping or removing the repeater. The schem has all 16 repeaters (every output = OR of all inputs); here the 0 bits are removed to give i0=1001 i1=0110 i2=0011 i3=1100. Harness change: lever+lamp input pair replaced by a driver at the lamp cell (a redstone block gives dust beside it the same strong feed the lit-by-lever lamp did). Layers y=2,4,6,8 are outputs o0..o3 at x0 z0. Measured: every output rises 2 gt after its input (one repeater, the README''s 1 tick) and falls 6 gt (repeater 2 + lamp 4); a rise from a second input to an already-lit bus adds no edge.'
palette:
  '.': air
  A: red_wool
  B: redstone_wire[east=side,north=none,south=none,west=up]
  D: redstone_wire[east=none,north=side,south=side,west=none]
  E: redstone_wire[east=side,north=side,south=side,west=none]
  F: repeater[delay=1,facing=east]
  G: redstone_wire[east=up,north=none,south=none,west=side]
  H: red_stained_glass
  I: redstone_wire[east=side,north=side,south=none,west=none]
  J: redstone_wire[east=side,north=none,south=none,west=side]
  '0': {output: o0, block: redstone_lamp}
  '1': {output: o1, block: redstone_lamp}
  '2': {output: o2, block: redstone_lamp}
  '3': {output: o3, block: redstone_lamp}
  a: {input: i0}
  b: {input: i1}
  c: {input: i2}
  d: {input: i3}
