name: ref_librok_vertical_priority_15
description: >-
  LiBRoK's 15-bit vertical priority (Logical Redstone Archive OTHERCOMB016, endorsed by mattbatwings,
  discord.com/channels/1361854816837435433/1479218567399477281; README SOURCED: lowest layer has the highest priority, 15 inputs
  give a one-hot output, 2t). 4x16x4, a 15-layer tower, one layer per bit: input repeater -> subtract comparator -> output lamp;
  the comparator's side input is the OR of all lower-numbered inputs. That OR is a dust staircase climbing one layer per bit over
  blue glass, and each rung re-reads the dust one layer below but not the one above (INFERRED from the shapes, supported by
  MECHANICS dust_transparent_step_one_way), so power only flows up the tower, decaying 1 per layer: bit 1's 15 reaches strength 1 at
  layer 15, exactly enough. A target block beside the staircase end takes the dust's weak power, a repeater turns it back into a full
  15 on the comparator's side, and 15 - 15 cancels the input. Layers alternate which side the comparator sits on, which is how the
  staircase zigzags in 4 deep. Changed from the schematic: each input lamp-plus-lever pair (the lever hard-powers the lamp, which
  feeds the input repeater and the carry dust beside it) is one harness input cell, a redstone block in the lamp's cell, which powers
  that repeater and dust directly (the lever column is dropped, so 4 wide not 5); outputs are the original lamps. MEASURED on a
  laptop satellite in 26.3: 98 rows (empty, every single input, all on, input k with every lower-priority input on, input k with only
  input 15 on, adjacent pairs, alternating patterns, 40 random) give exactly the lowest-numbered set input; every output rises 4 gt
  (2 redstone ticks, matching the README) and falls 8 gt (the same 4 plus the lamp's 4 gt off delay), whichever input changes.
traits: [vertical, comparator_based, silent, pistonless, entityless, compact]
