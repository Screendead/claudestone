name: ref_rcs33_choose_n_arbiter
description: 'RCS_33 Choose-n Arbiter (Logical Redstone Archive OTHERCOMB007, author RCS_33, endorsed by mattbatwings, tagged Tested & Functional; discord.com/channels/1361854816837435433/1472643663023706303). SOURCED: chooses up to n set bits of a k-bit vector by left/right priority, n output vectors of length k with at most one set bit each, 2t per layer, about 1t per k/5 wire delay, 3 wide per k, 4 wide per n, 5 high; schematic n=4, k=10. Here 22x6x32 (the gold stacking marker dropped). Rows (3 z apiece) are the k inputs k0..k9 (k0 north), the four columns are the layers; each cell is a comparator pair over a barrel of 26 wooden shovels (strength 14) and one of 4 (strength 3) (the parsed blocks lacked these; the schematic NBT carries them), and a torch on a target block lights the output lamp. Harness changes: the input levers (which sit on a lamp, which the harness cannot flip) and the four disable levers are redstone-block drivers k0..k9 and dis0..dis3 (a redstone block in the lamp cell the lever powered); outputs o<layer>_<k> are the lamps on top. MEASURED on a laptop satellite in 26.3, 174 vectors: the layers fill from o3 (east) to o0: o3 takes the lowest set bit, o2 the next and so on; a layer with dis<i>=1 takes none and does not use up a bit, so the remaining enabled layers take the next ones; with fewer set bits than enabled layers the rest are empty; all four layers choose when at least four bits are set. Timing: each layer adds 4 gt (2 redstone ticks, as claimed): o3 rises 4 gt after the input change, o2 8, o1 12, o0 16, plus up to 2 gt of wire over the k run; a lamp falls 4 gt after it would rise, worst case 22 gt.'
