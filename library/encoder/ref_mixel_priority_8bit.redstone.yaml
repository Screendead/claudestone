name: ref_mixel_priority_8bit
description: >-
  Mixel's 8 bit priority circuit (Logical Redstone Archive OTHERCOMB019, discord.com/channels/1361854816837435433/1513182951532269782;
  README, SOURCED: 8b number in, one-hot 8b number out, combinational, Tested & Functional). Block for block from the .schem, 10x3x15
  here (12x3x15 with the lever and display-lamp columns). Eight input rows, z = 0,2,..14. Each row: input -> repeater -> wool -> subtract
  comparator -> wool -> dust -> output lamp. A row's comparator is cancelled by a side-fed repeater whose input is a wool block powered by a
  diagonal dust staircase on y=2 (dust climbs over light-blue glass) that carries the OR of all rows below it (higher z) toward z=0, so the
  highest-z set input wins. MEASURED on a laptop satellite in 26.3: 255 of the 256 input patterns give the one-hot of the highest set
  input, every output rises 4 gt after the change whichever row (synchronized) and falls 8 gt (4 plus the lamp's off delay). The 256th,
  i0 and i7 set alone (10000001), leaves BOTH o0 and o7 lit (test i0_i7_both_stay_lit): the staircase dust loses 1 strength per block, so
  i7's signal is 15 at its repeater and 0 at the wool beside row 0's side repeater (test chain_reach: i6 leaves power 1 there, i7 leaves
  0; dust between is 3 per row hop), one block short of the 15-block dust range; i1..i6 reach row 0 or are removed by a nearer row. This is
  INFERRED to hold on any version since the decay is vanilla, but only 26.3 was run. Changed: the lever and its display lamp at x=0..1
  are one input cell at x=1 (a redstone block beside the repeater), since the harness cannot flip a lever on a lamp; the repeater reads
  it the same way. The 255-row table in priority_255 omits only that pattern; it is not loosened elsewhere.
traits: [comparator_based, silent, pistonless, entityless]
palette:
  .: air
  A: light_blue_wool
  C: repeater[delay=1,facing=west]
  D: comparator[facing=west,mode=subtract]
  E: redstone_wire[east=side,north=none,south=none,west=side]
  F: repeater[delay=1,facing=south]
  G: light_blue_stained_glass
  H: redstone_wire[east=up,north=up,south=none,west=side]
  I: redstone_wire[east=side,north=side,south=side,west=side]
  J: redstone_wire[east=none,north=side,south=side,west=none]
  K: redstone_wire[east=none,north=none,south=side,west=side]
  a: {input: i0}
  b: {input: i1}
  c: {input: i2}
  d: {input: i3}
  e: {input: i4}
  f: {input: i5}
  g: {input: i6}
  h: {input: i7}
  '0': {output: o0, block: redstone_lamp}
  '1': {output: o1, block: redstone_lamp}
  '2': {output: o2, block: redstone_lamp}
  '3': {output: o3, block: redstone_lamp}
