name: ref_librok_observer_encoder_serial
description: >-
  LiBRoK's TRANSMIT007 7-to-3 observer encoder, serial, rebuilt from the Logical Redstone Archive (mattbatwings), Discord https://discord.com/channels/1361854816837435433/1479225918621876276 (SOURCED: 7 levers and a send button in, one serial line out, 4 bits at 2t each, 8t after pressing send). 9x5x12. How it works (INFERRED from the layout, then confirmed by the traces): the 7 lever/lamp/observer pairs are the ENCODE006 encoder (see ref_librok_observer_encoder_7to3); its three 1t code pulses land on target blocks under three droppers (c0,c1,c2 at z=4), and each pulse moves that dropper's one item into its facing partner (d0,d1,d2 at z=5), so the code is stored as items. The send button cuts a wall torch, which turns off a chain of delay-2 repeaters (south side, y=1) one stage per 2 redstone ticks; they unmask four subtract-mode comparators that read the barrel (a constant start bit) and, through wool, d0,d1,d2. Each comparator that reads an item sends a pulse to its output repeater and to a repeater that triggers its d dropper, which hands the item back to c, so the memory clears as it is read; the four outputs meet on one dust line and a repeater (ser). Order on the line: start bit (barrel), then b0, b1, b2, 4 game ticks (2 redstone ticks) each. The schematic stores one wooden_axe in each of c0..c2 and the barrel (SOURCED, schem NBT); this harness places the build without block-entity items and the placement update fires the droppers, so every test inserts the items first. Harness changes: levers became redstone-block drivers l1..l7 (the harness only clicks levers on plain full blocks); the lamp under the button became stone so a real stone button (named send) can be clicked; the lever-to-code map l1..l7 = codes 2,3,6,7,1,4,5 is MEASURED on the ENCODE006 sibling. MEASURED: send_code_N for N=0..7 passes: ser rises 14 game ticks after the send click, then four 4-game-tick slots (start=1, b0, b1, b2) with ser high for each set bit; a second send with no new code outputs only the start bit (the items were consumed). Not tested: toggling a lever twice, or sending while a transmission is running.
