name: ref_mattbatwings_encode_v2v
description: 'mattbatwings'' Encoder (vertical to vertical) (Logical Redstone Archive ENCODE001, discord.com/channels/1361854816837435433/1472426008194846741; README: programmable and expandable, 4b one-hot
  in, 4b encoding out, 2 ticks). Four stacked layers (y=2,4,6,8), 6x10x13. Each input lever''s dust column runs to one row (z=9,6,5,2 for the levers at y=2,4,6,8) and climbs a dust-on-glass staircase through
  every layer; in each layer a repeater taps the row into that layer''s output bus (x=0 dust, ending at a lamp). Dust on wool powers the wool beneath, which feeds the tap repeater, so every input reaches
  every layer. The code is the set of tap repeaters present. MEASURED in 26.3: the archive schematic as shipped has all 16 taps and lights all four lamps for any single input (1111), a blank template, not
  a particular code. Changed: 11 taps removed here (air) to program the codes lv2=0001, lv4=0010, lv6=0011, lv8=0100 (o2 low bit, o8 high bit); test reprogram_all_taps puts them back with setblock and measures
  1111 again, which proves the taps are the program. The input lamps under the levers are white concrete (the harness cannot flip a lever on a lamp); levers are flipped by steps (use). Inputs are one-hot
  by claim, so multi-input rows are not tested. MEASURED: rise 4 gt (two repeaters, 2 redstone ticks, matching the README), fall 8 gt (4 more for the lamp off delay).'
