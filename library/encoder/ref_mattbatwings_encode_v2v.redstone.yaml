  - run: setblock ~1 ~6 ~9 repeater[delay=1,facing=east]
  - run: setblock ~2 ~8 ~9 repeater[delay=1,facing=east]
  - run: setblock ~2 ~2 ~6 repeater[delay=1,facing=east]
  - run: setblock ~2 ~6 ~6 repeater[delay=1,facing=east]
  - run: setblock ~1 ~8 ~6 repeater[delay=1,facing=east]
  - run: setblock ~1 ~6 ~5 repeater[delay=1,facing=east]
  - run: setblock ~2 ~8 ~5 repeater[delay=1,facing=east]
  - run: setblock ~2 ~2 ~2 repeater[delay=1,facing=east]
  - run: setblock ~1 ~4 ~2 repeater[delay=1,facing=east]
  - run: setblock ~1 ~8 ~2 repeater[delay=1,facing=east]
  - wait: 10
  - use: lv2
  - wait: 10
