name: ref_mattbatwings_small_priority
description: >-
  mattbatwings' Small Priority Circuit (Logical Redstone Archive OTHERCOMB005, discord.com/channels/1361854816837435433/1472424700461191179;
  README: outputs the rightmost input, unsynced due to rippling, size grows linearly per input). Four rows, one per input, 7x2x10.
  Row k: a lever on a block strongly powers it; a torch on that block (burns off when the lever is on) feeds dust into a
  wool block that carries a second torch whose lamp is the output, and that second torch's output rides dust and a
  repeater into the next row's wool, switching its torch off. So the first lever on (a0, the north row) wins; one-hot
  lamps. Changed: the lever's lamp (display of the input) is white concrete because the harness cannot flip a lever
  on a lamp; levers are flipped by steps (use), not inputs, because a lever strongly powers its block, which a redstone-block driver
  does not. MEASURED on a laptop satellite in 26.3: all 16 input combinations give the one-hot of the lowest-numbered set lever;
  lead lever on: its lamp lights 4 gt later and the next row's falls at 12 gt; off: lamp falls 8 gt (lamp off delay 4);
  worst ripple (a0 off with only a3 also on): o3 rises 12 gt after the click.
palette:
  .: air
  A: yellow_wool
  '#': white_concrete
  (: redstone_wall_torch[facing=west]
  B: redstone_wire[east=side,north=none,south=none,west=side]
  D: redstone_wire[east=side,north=side,south=none,west=none]
  E: redstone_wire[east=none,north=none,south=side,west=side]
  F: repeater[delay=1,facing=north]
  '0': {output: o0, block: redstone_lamp}
  '1': {output: o1, block: redstone_lamp}
  '2': {output: o2, block: redstone_lamp}
  '3': {output: o3, block: redstone_lamp}
  a: {name: lv0, block: 'lever[face=wall,facing=east]'}
  b: {name: lv1, block: 'lever[face=wall,facing=east]'}
  c: {name: lv2, block: 'lever[face=wall,facing=east]'}
  d: {name: lv3, block: 'lever[face=wall,facing=east]'}
layers:
  0: |
    ...A...
    .AA....
    ..A....
    ...A...
    .AA....
    ..A....
    ...A...
    .AA....
    ..A....
    ...A...
  1: |
    0(AB(#a
    .DE....
    ..F....
    1(AB(#b
    .DE....
    ..F....
    2(AB(#c
    .DE....
    ..F....
    3(AB(#d
