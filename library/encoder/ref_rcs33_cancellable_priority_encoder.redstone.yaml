name: ref_rcs33_cancellable_priority_encoder
description: |
  Cancellable priority encoder (10 bits) by RCS_33, endorsed by mattbatwings, rebuilt from
  OTHERCOMB013 in mattbatwings' Logical Redstone Archive (Discord post
  https://discord.com/channels/1361854816837435433/1472693290150137866, tag Tested & Functional).
  SOURCED: n-wide vector I and n-wide split vector S; a set S[k] makes bits 0..k and k+1..n-1 separate
  priority encoders; the output has at most one set bit per region (lowest index = highest priority),
  and with no S it is a plain priority encoder. Stacks 3 wide per bit, z=5, y=5; README speed
  "1t per k/5 (wire delay)" and "2t". Here input i<k> (lever, z = 2+3k) and split s<k> (lever, z = 3+3k,
  between bit k and k+1) and output o<k> (lamp, z = 1+3k).
  Harness changes: (1) the two lever columns are each replaced by a fixture repeater[delay=1] driven by
  an input cell, because the lamp each lever hard-powers feeds a torch (I) or dust (S) and a bare redstone
  block only soft-powers a lamp; so every delay here includes that repeater's 2 gt. (2) The schematic's
  barrels carried no item data in the parse; their strengths are INFERRED from the saved dust powers and
  the tests then confirmed them: the two 14s (compare comparators at z=1, one per chain) and the 15 that
  feeds the subtract comparators at (x2,y3) at the head of each later 5-bit module are 26 and 27 stacks of
  64 cobblestone. (3) The row z=31 (head of an eleventh bit) is cut off. The gold marker blocks are dropped.
  How it works (INFERRED from the saved powers, then MEASURED by the tests): per bit there are two dust
  lines in a strength race, A (x3 of the build, level y2 and y3) and B (x5). Both start each 5-bit module
  at 14 or 15 from a barrel-fed comparator and lose 1 per dust, so 3 per bit. B is what the I lamp
  overwrites: lit lamp I<k> beside B's dust sets it to 15 at bit k (the dust steps over a glass block,
  which lets dust climb but is not a conductor, so B only runs from low z to high z: a one-way dust).
  A is overwritten to 15 by the S lamp beside it. A subtract comparator per bit reads B at that bit
  (rear) minus A and B's next dust (sides): it outputs 1 exactly when B has been refreshed more recently
  than A, i.e. some I<j> (j<=k) is set with no S between j and k, and that hard-powers a concrete block
  whose dust powers the NEXT bit's output target: a powered target turns the output torch off. The
  output torch is also off when I is off (a torch on I's lamp, inverted into the same target). Each
  later module's head comparator subtracts that carry (1) from the barrel's 15, so the A baseline of
  the next 5 bits drops 1 and the carry crosses the module boundary; the barrel restart is what
  keeps the strengths above zero past 5 bits.
  Measured: 100+ vectors incl. every single bit, every single split with all inputs on, carries over the
  bit 4/5 module boundary, and random I/S, all match the reference model. MEASURED worst case 14 gt including the 2 gt fixture repeater (outputs rise 6 gt at modules' first 5 bits and 10 gt in the second module, fall 10 gt), so about 12 gt of circuit: far above the README's 2t, which cannot be a whole-vector input to output figure here (INFERRED: it is a per-stage cost).
