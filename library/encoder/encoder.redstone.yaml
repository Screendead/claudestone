name: encoder
description: One lever per digit 0-9 to a 4-bit number. Tested with one lever on at a time.
palette:
  .: air
  '=': smooth_stone
  '-': redstone_wire
  '>': repeater[facing=west]
  b: {output: bit0, block: redstone_wire}
  A: {output: bit1, block: redstone_wire}
  B: {output: bit2, block: redstone_wire}
  C: {output: bit3, block: redstone_wire}
  '#': white_concrete
  ): redstone_wall_torch[facing=east]
  d: {input: d9}
  D: {input: d8}
  E: {input: d7}
  F: {input: d6}
  G: {input: d5}
  H: {input: d4}
  I: {input: d3}
  J: {input: d2}
  K: {input: d1}
  M: {input: d0}
  v: repeater[facing=north]
  u: redstone_wall_torch[facing=south]
