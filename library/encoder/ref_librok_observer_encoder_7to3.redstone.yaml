name: ref_librok_observer_encoder_7to3
description: >-
  LiBRoK's ENCODE006 7-to-3 observer encoder, rebuilt from the Logical Redstone Archive (mattbatwings), Discord https://discord.com/channels/1361854816837435433/1479225971637751852 (SOURCED: authors LiBRoK, endorsed Waffle; 7 levers in, 3 bits out, 1t; each toggled lever impulses its binary code). 5x5x5. Each lever sits on a redstone lamp with an observer facing it; any lamp change (either edge) makes the observer fire 1t from its back, and yellow/light-blue/pink wool + dust OR the seven observers into three target-block/repeater outputs b0,b1,b2 (INFERRED from the layout; the code table is MEASURED). Harness change: the levers became redstone-block drivers c1..c7 (named by the code each emits) because the harness only emulates lever clicks on plain full blocks; a redstone block lights the lamp the same way. Output is a 2 game-tick (1 redstone tick, matching the README's 1t) pulse on the three output repeaters (MEASURED): high 4 game ticks after a lever turns on and 8 after it turns off (the lamp's own 4 game-tick off delay). Two levers at once give the OR of their codes. The build fires all three outputs once while it is placed (MEASURED, tick 4); tests settle 30 ticks first.
palette:
  .: air
  L: redstone_lamp
  B: observer[facing=north]
  C: yellow_wool
  D: light_blue_wool
  E: pink_wool
  F: redstone_wire[east=up,north=none,south=side,west=none]
  G: redstone_wire[east=none,north=side,south=side,west=none]
  H: redstone_wire[east=none,north=none,south=side,west=up]
  I: target
  K: yellow_stained_glass
  M: redstone_wire[east=none,north=side,south=none,west=side]
  N: lime_wool
  O: redstone_wire[east=side,north=side,south=none,west=none]
  P: pink_stained_glass
  Q: redstone_wire[east=side,north=none,south=side,west=none]
  T: redstone_wire[east=none,north=none,south=side,west=side]
  U: redstone_wire[east=up,north=side,south=none,west=none]
  V: redstone_wire[east=none,north=side,south=none,west=up]
  W: redstone_wire[east=side,north=none,south=none,west=side]
  '1': {input: c1}
  '2': {input: c2}
  '3': {input: c3}
  '4': {input: c4}
  '5': {input: c5}
  '6': {input: c6}
  '7': {input: c7}
  J: {output: b0, block: 'repeater[delay=1,facing=north]'}
  j: {output: b1, block: 'repeater[delay=1,facing=north]'}
  k: {output: b2, block: 'repeater[delay=1,facing=north]'}
