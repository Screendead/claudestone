tests:
- name: code1
  settle: 30
  steps:
  - drive: {c1: 1}
  - wave: {b0: '000011000', b1: '000000000', b2: '000000000'}
  - wait: 10
  - drive: {c1: 0}
  - wave: {b0: '0000000011000', b1: '0000000000000', b2: '0000000000000'}
