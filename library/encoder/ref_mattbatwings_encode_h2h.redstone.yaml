name: ref_mattbatwings_encode_h2h
description: "Rebuild of ENCODE003 Encoder (horizontal to horizontal), mattbatwings' Logical Redstone Archive (endorsed by mattbatwings, tagged Recommended and Tested & Functional; Discord thread 1472426342099189852; README: 4b one-hot in, 4b encoding out, 2 ticks, programmable and expandable). Each input lever hard-powers a lamp, a torch on the lamp's far side inverts it onto a dust row over a wool strip, and a torch per (row, column) beside the strip inverts the strip again and drops onto that column's dust; a column is the OR of the rows that have a torch in it, so removing a torch edits the code table. The archive schematic has every torch placed (all outputs = any input); this spec removes some to program row0->o0+o3, row1->o1+o2, row2->o2+o3, row3->o0+o1 (my choice, MEASURED to work; the archive's own table is not stated). Harness change: each lever is replaced by a redstone-block input behind a fixture repeater and wool (a bare redstone block does not power the lamp), adding 2 gt that the delay includes; output lamps are the named cells, which adds the lamp's 4 gt off-lag. Measured: 6 gt rise, 10 gt fall including the 2 gt fixture, so 4 gt rise (2 redstone ticks, matching the README) from the lamp."
palette:
  .: air
  A: red_wool
  B: redstone_wire
  L: redstone_lamp
  n: redstone_wall_torch[facing=north]
  '(': redstone_wall_torch[facing=west]
  '0': {output: o0, block: redstone_lamp}
  '1': {output: o1, block: redstone_lamp}
  '2': {output: o2, block: redstone_lamp}
  '3': {output: o3, block: redstone_lamp}
  '<': {block: 'repeater[delay=1,facing=east]', fixture: true}
  F: {block: red_wool, fixture: true}
  a: {input: i0}
  b: {input: i1}
  c: {input: i2}
  d: {input: i3}
