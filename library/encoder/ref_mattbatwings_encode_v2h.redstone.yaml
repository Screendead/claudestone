name: ref_mattbatwings_encode_v2h
description: "mattbatwings' Logical Redstone Archive ENCODE002 (encode_v2h), Discord https://discord.com/channels/1361854816837435433/1472426173618196530 (SOURCED: endorsed by mattbatwings, tags Tested & Functional/Recommended; programmable, expandable 4b one-hot to 4b encoding, 1 tick). A 4x4 repeater crossbar: each lever's dust line (one per y level, 4 levers stacked) is tapped by one repeater per output bit, each feeding a dust path down to that bit's lamp; the schematic ships with all 16 repeaters, so every lever gives 1111, and removing a repeater clears that (input, bit) pair, so a code is programmed by deleting repeaters (INFERRED from the layout, MEASURED: cutting each of the 16 one at a time clears exactly one output of its lever). Taps for odd and even levers sit on alternate layers (the wool floor under a lever's dust is weakly powered and feeds repeaters on the layer below), which interleaves the 4 inputs 2 layers apart. Outputs are bit j = lamp o{j} at z=1,3,5,7 (o0 first). Size 6x9x11, 184 blocks. Harness change: the lever holder blocks at the far end were redstone lamps in the schematic; the harness only emulates levers on plain full blocks, so they are white_concrete here (a lever strongly powers either the same; the original lamp lights as a side effect). MEASURED: lever on to lamps lit 2 game ticks (one repeater), lever off to lamps dark 6 (repeater 2 + lamp 4); tests: as built (every lever 1111), binary program (codes 0-3), arbitrary program (1,7,10,12) with OR of simultaneous levers."
