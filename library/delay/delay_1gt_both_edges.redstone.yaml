name: delay_1gt_both_edges
description: 'DRAFT: exact 1 game tick delay on both edges with a real dust output, from one sticky piston and a dust whose shape the moving block sets. North row, west to east: sticky piston facing east, redstone block R, its travel cell, dust y. South row: input a, dust d, stone w, out dust (joined to y). At rest R sits north of d, so with a on d is a corner (a and R) and powers nothing east. Rise: the piston starts moving R 1 tick later, R stops being a connection, d becomes a straight line pointing into w, and w hard-powers out. R lands beside y 3 ticks in and holds out on. Fall: d dies with a at once, but R still powers out through y until the retraction pulls it 1 tick later. Needs pulses and gaps of at least 3 ticks.'
traits: [flat, horizontal, piston_based, entityless, tick_accurate, reset_safe, survival_friendly]
palette:
  .: air
  '=': smooth_stone
  a: {input: a}
  P: sticky_piston[facing=east]
  R: redstone_block
  _: {reserve: true}
  d: {name: d, block: 'redstone_wire[north=side,south=side]'}
  w: stone
  y: {name: y, block: 'redstone_wire[north=side,south=side]'}
  o: {output: out, block: 'redstone_wire[north=side,south=side]'}
layers:
  0: |
    ...=
    .=.=
  1: |
    PR_y
    adwo
tests:
- name: logic
  truth_table: |
    a | out
    0 | 0
    1 | 1
  delays: {out: {rise: 1, fall: 1}}
  glitch_free: true
- name: exact edges and a 3 tick pulse and gap
  settle: 20
  steps:
  - drive: {a: 1}
  - wave: {out: '0111111111'}
  - drive: {a: 0}
  - wave: {out: '1000000000'}
  - drive: {a: 1}
  - wave: {out: '011'}
  - drive: {a: 0}
  - wave: {out: '100'}
  - drive: {a: 1}
  - wave: {out: '0111111'}
  - drive: {a: 0}
  - wave: {out: '1000000'}
