name: ref_mattbatwings_bus4_56_comparator_fanout
description: 'Rebuilt from mattbatwings'' ''How To Wire Like a Redstone Pro!'' world (Java 1.18.2), cluster W86, world origin 38,57,19 (SOURCED). The east 19 columns are the same four-layer fan-out as ref_mattbatwings_comparator_fanout4 (cluster W85, 40 blocks east and 4 south of here): one comparator
  at (57,3,8) facing east feeds red wool that powers layer 1''s dust below it and layer 2''s above, and a glass column carries it up to layers 3 and 4 (INFERRED from the layout; the same wiring as W85, whose per-comparator levels were read). West of that, four dust lines run 47 blocks along z=4 on y=1,3,5,7,
  separated by cyan wool layers at y=2,4,6, with a repeater[facing=east] at x=9, 25 and 41 on each line to restore strength every 16 blocks (the bus technique of library/wire/ref_mattbatwings_stacked_flat_bus4_repeater); at the west end they meet comparators, empty barrels and dust risers feeding four
  lamps at (4,1,3), (4,1,5), (4,4,3), (4,4,5). HARNESS: the cell (58,3,8) behind the input comparator is the input ''in'' (a redstone block; the lever that fed it lies outside the cut); the four lamps are out1 (4,1,3), out2 (4,1,5), out3 (4,4,3), out4 (4,4,5); the barrels are kept empty (the parsed cluster
  carries no block-entity data, so whatever they held in the world is unknown). Size 58x9x9. MEASURED in 26.3: all four lamps follow the input. out2, out3 and out4 rise 14 gt and fall 18 gt. Tick-level probe of layer 1 (MEASURED, not in the test): its dust reaches x=42 6 gt after the input (comparator,
  repeater, comparator), the repeaters at x=41, 25 and 9 turn on at +8, +10 and +12, and out2 lights at +14: 3 bus repeaters at 2 gt each add 6 gt over the 54-block run. out1 is quicker, rise 2 gt and fall 6 gt, i.e. a single comparator away from the input: its path is not through the bus (UNEXPLAINED:
  I did not trace which route feeds the lamp at (4,1,3) in 2 gt, and the barrel and comparator cluster at its west end was not taken apart).'
