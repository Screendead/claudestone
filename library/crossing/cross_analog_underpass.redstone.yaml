name: cross_analog_underpass
description: 'A signal-strength-preserving crossing: cross_underpass with a comparator (compare mode, no side input) instead of the repeater, so B leaves at exactly the strength it arrived with, and A is plain dust that loses 1 per block exactly as if the crossing were not there. The crossing cell itself is 1x3x3 (base, A dust, two supports, B dust, block X, comparator); the rest of this build is test fixture: 9 dust cells bring B down to strength 6 before X, and past the comparator the named cells b_on and b_off sit where strength 6 reaches 1 and 0; A''s a_on and a_off sit where full strength reaches 1 and 0 on the other side of X. A repeater in place of the comparator would leave b_off lit, and any leak into A would move its edge, so the test proves the strengths, not just on/off. Delay: A 0 ticks, B 2 ticks. Interface: A west to east at y1 under X; B north to south at y2, entering as dust into X and leaving out of the comparator. Versus cross_underpass: same size, keeps B''s strength
  (use it on analog buses and for comparator logic downstream).'
traits:
- analog
- comparator_based
- fast
- lightless
- silent
- pistonless
- entityless
- survival_friendly
- reset_safe
- tick_accurate
palette:
  .: air
  '=': smooth_stone
  '#': white_concrete
  a: {input: a}
  '-': redstone_wire
  A: {output: a_on, block: redstone_wire}
  B: {output: a_off, block: redstone_wire}
  b: {input: b}
  C: comparator[facing=north,mode=compare]
  D: {output: b_on, block: redstone_wire}
  E: {output: b_off, block: redstone_wire}
