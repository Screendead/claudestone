name: ref_kuggo_instant_crosswire_a
description: "Rebuilt from mattbatwings' Logical Redstone Archive CROSSWIRE001 'Instant crosswire (2 versions)' by Kuggo, endorsed by mattbatwings, https://discord.com/channels/1361854816837435433/1472407008970936320. README (SOURCED): crosses multi-bit vertical wires through each other, 8b in and out, 0 ticks. The schematic holds two versions side by side in z; this spec is version A (rows z 0-8). Eight x-wires (7-dust runs on wool, west to east) and eight z-wires (11-dust staircases, north to south) are interleaved in a 17-layer stack, every wire a separate dust circuit (INFERRED from the dust connection states: x-wire dust cannot connect to a z-wire it passes over or under because the dust sits two layers apart on wool, and each pair meets only through a powered wool block, which does not power dust). No repeaters or torches, so nothing is delayed. Harness changes: the glass corner markers are dropped; a redstone-block input cell is added before the entry end of each wire (x* at x=0, z* just north of its first dust) and the far end dust is the named output. MEASURED: 16 inputs, 70 patterns (zero, all, alternating, each single, each all-but-one, 30 random), every output equals only its own input; delay 0 ticks, rise and fall. Size 7x18x9."
