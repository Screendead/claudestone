name: cross_bus_pitch1_2d
description: 'Two instant buses crossing at pitch 1 in both directions: every cell of the 4x4 grid is a crossing. Each bus alternates its lanes between two layers, lower dust under a block and upper dust on a block, so no two dust cells at one level touch and the block over each lower lane stops the diagonal step connection. B lanes run along z at y1/y2 (b0, b2 low; b1, b3 high); a full plane of blocks at y3 separates them from the A lines along x at y4/y5 (a0, a2 low; a1, a3 high). Every line is plain dust, 0 ticks whatever the bus width, up to dust''s 15-block reach. 4x6x4 including the base, 6 layers per crossing column versus 16 cells per crossing for cross_instant_bus (pitch 2). Interface: A lines enter the west face and leave east, B lanes enter the north face and leave south, each at its own layer; leads beside each other must keep the same two-layer stagger. No tile test: a second copy beside it would put its input blocks against this copy''s output dust, so a wider bus is built by extending the grid.'
traits:
- ultrafast
- instant
- lightless
- silent
- pistonless
- entityless
- survival_friendly
- reset_safe
- tick_accurate
palette:
  .: air
  '=': smooth_stone
  '#': white_concrete
  '-': redstone_wire
  b: {input: b0}
  c: {input: b1}
  d: {input: b2}
  e: {input: b3}
  a: {input: a0}
  f: {input: a1}
  g: {input: a2}
  h: {input: a3}
  P: {output: b0_out, block: redstone_wire}
  Q: {output: b1_out, block: redstone_wire}
  R: {output: b2_out, block: redstone_wire}
  S: {output: b3_out, block: redstone_wire}
  T: {output: a0_out, block: redstone_wire}
  U: {output: a1_out, block: redstone_wire}
  V: {output: a2_out, block: redstone_wire}
  W: {output: a3_out, block: redstone_wire}
