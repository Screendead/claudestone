name: ref_mattbatwings_comparator_fanout4
description: 'Rebuilt from mattbatwings'' ''How To Wire Like a Redstone Pro!'' world (Java 1.18.2), cluster W85, world origin 58,57,0 (SOURCED). The cut is 19x9x5 with four lamps (lime wool behind each) at x=1 on y=1,3,5,7 and no lever; the lever that fed it lies outside the cut, so the one entry is the
  comparator at (17,3,4) facing east, whose rear is the cell at x=18. HARNESS: that cell (18,3,4) is the input ''in'' (a redstone block); the lamps are out1..out4 (y=1,3,5,7); nothing else changed, size 19x9x5. HOW IT WORKS (INFERRED from the layout, confirmed by the traces and per-comparator levels in
  the ''taps'' test): one input becomes four 15-block bus lines, one per layer pair. The comparator (17,3,4) powers the red wool (16,3,4) west of it; that wool strongly powers the dust above it (16,4,4, layer 2''s line, y=4) AND the dust below it (16,2,4, layer 1''s line, y=2). Layer 2''s dust is stepped
  (east=up) onto the dust at (17,5,4) beside a glass column, which steps onto (16,6,4) (layer 3''s line, y=6) and then (17,7,4) and (16,8,4) (layer 4, y=8): dust climbs through red stained glass because glass does not cut the diagonal link, so the same signal is fed up the column to every layer. Each
  line is a zigzag over wool (dust on top of wool pairs/triples, stepping down between them), which decays: MEASURED: with 15 at x=16, layer 1''s dust at x=3 reads 2. At the west end of each line (the westmost tap) a repeater at z=3 reads the line''s last dust and restores it to 15 and pushes it north
  into a subtract comparator, which powers the red wool at z=1 that powers the output dust at z=0 and lights the lamp. The other taps along each line are dead: the repeaters beside them also feed the dust on the comparator''s side, so rear 15 - side 15 = 0 (levels read in ''taps'': live1-4 = 15, dead1/dead1b/dead2
  = 0). Only the westmost tap of each layer carries the signal; the rest are structure (INFERRED: they matter for the other wires of the original world''s demo, not here). MEASURED in 26.3: all four lamps follow the input; rise 6 gt (comparator, repeater, comparator, 2 gt each, the lamps light as the
  last one powers), fall 10 gt (6 + 4 for the lamp''s turn-off). The dust lines in between add no delay (dust is instant).'
