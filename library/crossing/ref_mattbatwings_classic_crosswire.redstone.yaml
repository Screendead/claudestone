name: ref_mattbatwings_classic_crosswire
description: "Rebuilt from mattbatwings' Logical Redstone Archive CROSSWIRE002 'Classic crosswire' (no author listed; endorsed by mattbatwings; https://discord.com/channels/1361854816837435433/1472407038117285951). README (SOURCED): 5 bits in, 5 out, 1 tick. Five vertical-in-z wires cross five x-wires, interleaved by layer: odd y holds a z-wire (dust, repeater[delay=1,facing=south] flowing north, dust) whose repeater feeds a red-wool row at z=2 that re-powers the dust on its far side; even y holds an x-wire (dust, repeater[facing=east] flowing west, dust) lying on the previous layer's wool row, so the two wires of a layer pair never touch: each is cut by a repeater and bridged by a powered block, and the repeaters stop the wool from feeding the other wire. Harness changes: wool and decoration kept as is; added a redstone-block input cell at the entry end of each wire (v* at z=5, h* at x=5) and the exit dust is the named output. MEASURED: 1024-row space sampled with 41 patterns (zero, each single, all, alternating, 20 random, each all-but-one): every output equals only its own input, so no wire leaks into another; delay 2 game ticks (= 1 redstone tick, one repeater) on all 10 wires, rise and fall. Size 5x11x5."
palette:
  '.': air
  '#': blue_wool
  R: red_wool
  '-': redstone_wire
  D: repeater[delay=1,facing=south]
  F: repeater[delay=1,facing=east]
  a: {output: v0_out, block: redstone_wire}
  b: {input: v0}
  c: {output: h0_out, block: redstone_wire}
  d: {input: h0}
  e: {output: v1_out, block: redstone_wire}
  f: {input: v1}
  g: {output: h1_out, block: redstone_wire}
  h: {input: h1}
  i: {output: v2_out, block: redstone_wire}
  j: {input: v2}
  k: {output: h2_out, block: redstone_wire}
  l: {input: h2}
  m: {output: v3_out, block: redstone_wire}
  n: {input: v3}
  o: {output: h3_out, block: redstone_wire}
  p: {input: h3}
  q: {output: v4_out, block: redstone_wire}
  r: {input: v4}
  s: {output: h4_out, block: redstone_wire}
  t: {input: h4}
