  - wait: 1
  - expect: {out: 1}
  - wait: 1
  - expect: {out: 0}
  - wait: 10
  - expect: {out: 0}
  - drive: {b: 1}
  - wait: 1
  - expect: {out: 0}
  - wait: 1
  - expect: {out: 0}
  - wait: 1
  - expect: {out: 0}
  - wait: 1
  - expect: {out: 1}
  - wait: 8
  - expect: {out: 1}
