- name: edges 2 ticks apart
  steps:
  - drive: {a: 1}
  - wait: 2
  - drive: {b: 1}
  - wait: 12
  - expect: {out: 1}
  - drive: {b: 0}
  - wait: 2
  - drive: {a: 0}
  - wait: 12
  - expect: {out: 1}
- name: hazard, edges 0 or 1 tick apart
  steps:
  - drive: {a: 1, b: 1}
  - wait: 12
  - expect: {out: 0}
