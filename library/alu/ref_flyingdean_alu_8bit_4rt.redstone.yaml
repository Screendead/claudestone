name: ref_flyingdean_alu_8bit_4rt
description: 'Rebuild of ALU003 small 4rt alu, an 8-bit ALU by Flyingdean (endorsed by mattbatwings, Logical Redstone Archive, https://discord.com/channels/1361854816837435433/1472702174076342422), based on Aminotreal''s 3rt comparator carry adder. SOURCED: 9x10 footprint, inputs A and B (8 bit), !A, !B, Xor, And, Cin, Rsh, outputs C (8 bit) and Cout, 4rt for all operations. Eight bit slices of two layers stacked in y (bit 0 at the bottom, Cout lamp on top), A on the east lever column and B on the west one, container constants (barrels of wooden shovels, taken from the .schem block entities: strength 15 or 14, plus a 11/10/8/6/4/2/0 ladder up the middle column) read by compare and subtract comparators. Harness changes: each lever (the 16 operand levers, !A !B Xor And Cin Rsh) is a fixture repeater into the same lamp (a lever hard-powers the block it hangs on, a driver redstone block does not), so every input arrives 2 gt late (the delays below include that); signs and two stray glass corners dropped; the build is padded one cell on each side for the input cells. MEASURED (26.3, lamps read; falls include the lamp''s 4 gt, fixture repeater 2 gt): ops follow the control table when Cin is set as the table says, and the lamp-side rise is 8 gt (4rt) for add, xor, or, and, rsh sum bits; cout rise is 10 gt (5rt) for add; ~ outputs (not, xnor, nor, nand) rise in 14 gt (7rt); subtract cout rises in 16 gt (8rt). So 4rt holds for add, xor, or, and, rsh but not for every operation. Control levers (!A !B Xor And Cin Rsh): add 000000; A-B 010010 (with !A 100010 gives B-A, not A-B); ~A + B 100000 (so ~A needs B=0; ~B needs A=0); xor 001000; xnor !A or !B + Xor; or 111100; nor 110110; and 000110 (And and Cin both set; And alone gives (A and B) - 1); nand 001100; rsh 101111 gives A>>1 when B=0 and 011111 gives B>>1 when A=0 (a mixed A and B is not a plain shift). The table''s grey cells (either !A or !B) are not interchangeable everywhere: xnor is the same either way, subtract gives A-B with !B and B-A with !A, and rsh with !A shifts A while !B shifts B.'
traits: [compact, vertical, pistonless, entityless, comparator_based, container_based, torch_based]
