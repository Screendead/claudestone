name: ref_mattbatwings_alu_cca_8bit
description: "Rebuild of mattbatwings' 8 bit ALU (CCA-based), Logical Redstone Archive ALU001, https://discord.com/channels/1361854816837435433/1472407087693959312 (README SOURCED: performs many operations on two 8-bit numbers; input 2 8-bit numbers and 11 operation options; output an 8-bit number; Tested & Functional). 33x21x22, 2235 blocks. Inputs are lever A bit i at (0, 4+2i, 21), lever B bit i at (8, 4+2i, 21), eleven operation levers op0..op10 at (12+2k, 3, 18) (the schematic shows op2 on); output lamp o_i at (9, 4+2i, 0); bit i has its own two-layer slice stacked at pitch 2 in y. Harness changes: the 18 lamps each lever hangs on became white_wool because the harness emulates a lever only on plain blocks (they only displayed the input; a wool is a conductor like a lamp), and the 17 decorative signs were dropped. Operations (MEASURED, 619 operand vectors with edges, carries and walking bits, plus op switching): none selected or op0 = A+B mod 256; op1 A-B; op2 A&B; op3 ~(A&B); op4 A|B; op5 ~(A|B); op6 A^B; op7 ~(A^B); op8 ~A|B; op9 A&~B; op10 (A+B mod 256)>>1 (the carry is dropped, not shifted in; the README names none of the operations). op0 has no torch in the control matrix, so its lever changes nothing (MEASURED: lever on equals all off). How it works (INFERRED from the blocks and fitted to the measurements): a lever lights its lamp, a wall torch on the lamp inverts it, and the line runs north over purple wool in an orange matrix; a wall torch at (x-1, 2, z) beside the wool of column x lights the dust row below it at y=1 whenever op column x is selected, so each of six control rows z=5,7,9,11,13,15 is the OR of the operations that carry a torch in it (rows: z5 op10 = shift right; z9 op1 = subtract carry-in; z7 ops 2,5,6,7,9; z11 ops 2,3,4,5,8,9; z13 ops 2,3,6,8,9; z15 ops 1,2,3) and the six rows are repeated west (repeaters at x=10 and 16) into the slices, which feed a comparator carry-chain adder with per-bit logic; MEASURED consequence: two operation levers on give the OR of their rows (OR plus XOR selects A&~B, rows 7,11,13; AND plus op0 is AND). Timing (MEASURED): after an operand lever click the outputs have reached their final values within 22 gt on every one of the 619 vectors (21 fails); 255+1 makes all eight bits fall together 22 gt after the click and rise together 18 gt after it, a click on bit 0 or bit 7 takes the same 22 and 18, so latency does not depend on carry length; changing the operation takes up to 32 gt (31 fails; 52 operation steps: all eleven up and down plus 30 random), and from the freshly loaded build the first selection also settles within 32 gt but can glitch, so each test waits 60 gt on its first vector; two-lever operation changes settle within 30 gt."
traits: [comparator_based, torch_based, pistonless, entityless, vertical]
