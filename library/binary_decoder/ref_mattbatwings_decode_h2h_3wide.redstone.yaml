name: ref_mattbatwings_decode_h2h_3wide
description: 'Rebuild of DECODE003 ''Decoder horizontal to horizontal (2 versions)'' from mattbatwings'' Logical Redstone Archive (endorsed by mattbatwings; Discord https://discord.com/channels/1361854816837435433/1472425622319136915), 3-wide version, as shipped. A programmable 4-input, 4-output AND plane: each input row r4/r6/r8/r10 (the z of its line) runs west along y3 dust and taps wool at y2; each output column (dust running north along y1) is OFF only when every row''s literal holds, then a torch inverts it into a lamp. A row''s literal in a column is a wall torch on the tapped wool above the column (column on while input 0, so the output needs the input 1) or a repeater-powered wool above the column dust (strongly powered wool powers the dust below, column on while input 1, so the output needs input 0). As shipped the columns are programmed r4&~r6&r8&~r10 (o0, o2) and ~r4&r6&~r8&r10 (o1, o3), so pairs repeat; moving torches and repeaters makes each column a different product (one-hot
  if unique). Harness changes: the lever on a lamp at the end of each input line is replaced by an input cell where the lamp stood (a driver block powers the dust x9 neighbour as the lever-powered lamp did), output lamps named o0..o3 west to east. README claims (SOURCED): 4 bit in, 4 bit one-hot out if uniquely programmed, 2 ticks, 3-wide columns, easily programmable. MEASURED: all 16 input rows give the table; worst delay 8 game ticks (rise 4, fall 8 on every output), i.e. 4 redstone ticks on a fall, so the README''s 2 ticks matches only the rise. Size 13x5x11, 212 blocks.'
