  .: air
  A: lime_wool
  n: redstone_wall_torch[facing=north]
  B: redstone_wire[east=none,north=side,south=side,west=none]
  C: repeater[delay=1,facing=east]
  D: redstone_wire[east=side,north=none,south=none,west=side]
  E: redstone_wire[east=up,north=none,south=none,west=side]
  F: redstone_wire[east=side,north=none,south=none,west=up]
  G: air
  '1':
