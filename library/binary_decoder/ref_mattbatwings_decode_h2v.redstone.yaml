name: ref_mattbatwings_decode_h2v
description: >-
  Rebuild of mattbatwings' Logical Redstone Archive entry DECODE004 "Decoder (horizontal to
  vertical)" (schematic DECODE004_decode_h2v; Discord
  https://discord.com/channels/1361854816837435433/1472425812019118131; endorsed by mattbatwings,
  tagged Tested and Functional, Recommended). SOURCED: programmable, expandable 4-bit decoder, 4-bit
  one-hot output if uniquely programmed, 2 ticks. Four input bits in a row (z = 4, 6, 8, 10) feed
  a dust ladder that zigzags up between x=3 and x=4 over glass; at each of four output levels
  (y = 2, 4, 6, 8) each bit's dust powers a wool block that either a repeater (bit must be 0) or
  a wall torch (bit must be 1) reads onto a dust bus at x=0; a torch on a wool block at the end
  of the bus inverts it into the output lamp (an AND of four matches, written as a NOR of the
  four mismatches). INFERRED from the blocks: the programming is the repeater/torch choice per
  bit and level. As shipped all four levels carry the same code (repeater, torch, repeater,
  torch: in1 0, in2 1, in3 0, in4 1), so all four lamps light together on 0101 and the schematic
  is not uniquely programmed. Harness changes: each lever, hung on a lamp, became a
  redstone-block input where the lamp was (in1..in4 from z=4 to z=10); the four output lamps
  are o1..o4 from the bottom. MEASURED on 26.3: as shipped the table holds for all 16 inputs; every
  output turns on 4 game ticks (2 redstone ticks, matching the README) after the last mismatching
  input clears and off 8 game ticks after a mismatch appears. reprogram_level_2 swaps level 2's
  four parts (setblock) to the code 1010 and shows that level alone follows it while the other
  three keep 0101, so the decoder is programmable by that swap plus a glass block under each new repeater (the shipped rows that hold torches have no support at x=1, y=3, and a repeater placed there pops off). Size 5x9x11.
traits:
- silent
- pistonless
- entityless
- torch_based
- compact
