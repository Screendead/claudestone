  A: lime_stained_glass
  B: lime_wool
  C: redstone_wire[east=side,north=none,south=none,west=up]
  n: redstone_wall_torch[facing=north]
  E: redstone_wire[east=none,north=side,south=side,west=none]
  F: redstone_wire[east=side,north=side,south=side,west=none]
  G: repeater[delay=1,facing=east]
  H: redstone_wire[east=up,north=none,south=none,west=side]
  (: redstone_wall_torch[facing=west]
  I: redstone_wire[east=side,north=side,south=none,west=none]
  J: redstone_wire[east=side,north=none,south=none,west=side]
