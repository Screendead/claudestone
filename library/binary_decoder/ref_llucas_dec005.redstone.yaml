name: ref_llucas_dec005
description: >-
  Rebuild of LLucas's "2 tick torchless decoder" from mattbatwings' Logical Redstone Archive,
  entry DECODE005 (Discord:
  https://discord.com/channels/1361854816837435433/1472977649205772485, endorsed by Waffle
  [Wueffi], tagged Tested and Functional, schematic DECODE005_torchlessdecode). SOURCED: no
  torches, vertical input to horizontal output (2 wide, staggered), up to 8 input bits
  (schematic: 3 bits, 8 outputs), one-hot output, expandable, 1 tick for the inverted output
  (part of the decoder removed) and 2 ticks for the output. Changes for the harness: the three
  wall levers, each hung on a redstone lamp, became redstone-block inputs standing where the
  lamps were; the 8 output lamps are the named outputs; the hoppers and barrels keep their
  redstone-dust fill as the constant analog sources the subtract comparators read (the dust is
  repacked from slot 0 at the same strength; the original slot layout differs and a comparator
  reads only fullness). Input names are the weights found by test: i4 = 4, i2 = 2, i1 = 1, and
  output dN is the one lit when 4*i4 + 2*i2 + i1 = N, which is not the order of the levers in
  the schematic (lever heights are i4, i1, i2 from the bottom). MEASURED on 26.3: all 8
  outputs follow the one-hot table through a 16-change sequence, including 0 to 7 and 7 to 0.
  After any input change the new output turns on 4 game ticks later and the old one turns off
  8 game ticks after the change, so two outputs are lit together for 4 ticks on every change
  (a hazard for clocked consumers). Pulses are not glitched on the other 6 outputs, also when
  all three inputs flip at once. The archive's 1 and 2 ticks are consistent with redstone
  ticks (2 game ticks) to the first output change (INFERRED; the first output change here is
  at 4 game ticks = 2 redstone ticks). Size 6x8x17.
traits: [silent, pistonless, entityless, comparator_based, container_based, tick_accurate]
