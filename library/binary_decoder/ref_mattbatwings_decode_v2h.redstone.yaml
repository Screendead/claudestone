name: ref_mattbatwings_decode_v2h
description: >-
  Rebuild of mattbatwings' "Decoder (vertical to horizontal)" from his Logical Redstone Archive,
  entry DECODE002 (Discord: https://discord.com/channels/1361854816837435433/1472425336376528978,
  endorsed by mattbatwings, tagged Tested and Functional and Recommended, schematic
  DECODE002_decode_v2h). SOURCED: programmable, expandable, 4-bit decoding in, 4-bit one-hot out
  (if uniquely programmed), 2 ticks. How it works (INFERRED from the blocks, then MEASURED): four
  bit buses run east-west on levels y=2,4,6,8, each over a wool row; each output column reads the
  bus through one tap per bit (a wall torch on the wool is an inverting tap, a repeater from the
  wool a plain one), the four taps join in one dust staircase that zigzags up between z=3 and
  z=4 (a dust OR), and a last torch inverts the OR into the output lamp, so a column is a
  4-input AND of the bits whose polarity is picked by torch versus repeater at each tap.
  Programming a column is swapping tap blocks, which is why the decoder is expandable: one more
  column is one more stack at 2-block pitch. The schematic ships all four columns with the same
  taps (torch, repeater, torch, repeater: lit at b1 b2 b3 b4 = 1 0 1 0), so as shipped all four
  lamps agree; here column o0 is exactly that, and o1 (0101), o2 (1111) and o3 (0000) swap
  taps (a repeater in a torch slot needs a glass support block under it, a torch in a repeater
  slot leaves its glass unused) to show the programmable one-hot claim and every tap polarity.
  Harness changes: the four levers hung on lamps at x=8 became redstone-block inputs b1..b4 where
  the lamps stood (bus y=2,4,6,8), the output lamps are the named outputs, and dust h2 is named for
  timing. MEASURED on 26.3: all 16 inputs give exactly the one-hot row (one lamp on for 1010,
  0101, 1111, 0000, none otherwise); a lamp turns on 4 game ticks after an input change (2
  redstone ticks, matching the 2 ticks claimed) and off 8 game ticks after (tap 2 + last torch 2
  + the lamp's own 4 tick off delay, INFERRED from the probe dust rising at +2 and the lamp
  falling at +8). Changing all four bits from 1010 to 0101 leaves both o0 and o1 lit for 4
  ticks, so a clocked reader should sample 8 ticks after a change. Size 8x9x7.
traits: [silent, pistonless, entityless, torch_based, compact]
