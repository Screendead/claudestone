name: ref_llucas_torchless_a
description: >-
  Rebuild of LLucas's "Torchless A" 3-to-8 decoder from mattbatwings' Logical Redstone
  Archive, entry DECODE007 Super Tiny Torchless Decoders (Discord:
  https://discord.com/channels/1361854816837435433/1474839116058460321, endorsed by Mixel,
  tagged Tested and Functional, schematic DECODE007_smalltorchlessa). SOURCED claims: 3 wide,
  regular torchless decoder, flipped 3-bit input, 8 inverted (active-low) outputs, 1 tick with
  1 signal strength out, not expandable. No torches: every comparator reads a barrel packed
  with redstone dust as a constant analog source, so the logic is subtract and compare
  comparators on dust at set strengths. Changes for the harness: the three wall levers (each
  hung on a redstone lamp) became the redstone-block inputs a b c standing where the lamps
  were, the lamp-sign was dropped, the 8 output lamps are the named outputs o0..o7, and each
  barrel was refilled with the same strength of dust packed from slot 0 (the original slot
  layout differs; the comparator reads only fullness). MEASURED on 26.3: output o_k is lit-low
  only for 4a+2b+c = k, so a is the high bit and every other output stays lit. Changing an
  input releases the old output after 2 ticks and pulls the new one low after 6 ticks, for
  every input and for all three flipping at once, with no glitch on any other output (all
  other lines stay lit through the change). The archive's 1 tick is consistent with redstone
  ticks (2 game ticks) to the first output change, the release at 2 game ticks (INFERRED); the
  full switch to the new code takes 6 game ticks. Size 3x11x18. How it works (INFERRED, not
  traced cell by cell): the barrels fix strengths 3 to 12, each of the three input lines is
  fed through subtract comparators against those strengths in 2 compare/subtract stages per
  output, and the final comparator lights a wool block through dust so the lamp lights unless
  the code matches.
traits: [silent, pistonless, entityless, comparator_based, container_based, tick_accurate]
