- name: single_bit_waves
  steps:
  - drive: {a: 1}
  - wave: {o0: '0011111111', o1: '1111111111', o2: '1111111111', o3: '1111111111', o4: '1111110000', o5: '1111111111', o6: '1111111111', o7: '1111111111'}
  - wait: 10
  - drive: {a: 0, b: 1}
  - wave: {o0: '1111111111', o1: '1111111111', o2: '1111110000', o3: '1111111111', o4: '0011111111', o5: '1111111111', o6: '1111111111', o7: '1111111111'}
  - wait: 10
  - drive: {b: 0, c: 1}
  - wave: {o0: '1111111111', o1: '1111110000', o2: '0011111111', o3: '1111111111', o4: '1111111111', o5: '1111111111', o6: '1111111111', o7: '1111111111'}
  - wait: 10
  - drive: {c: 0}
  - wave: {o0: '1111110000', o1: '0011111111', o2: '1111111111', o3: '1111111111', o4: '1111111111', o5: '1111111111', o6: '1111111111', o7: '1111111111'}
  - wait: 10
- name: all_bits_flip_at_once
  steps:
  - drive: {a: 1, b: 1, c: 1}
  - wave: {o0: '0011111111', o1: '1111111111', o2: '1111111111', o3: '1111111111', o4: '1111111111', o5: '1111111111', o6: '1111111111', o7: '1111110000'}
  - wait: 10
  - drive: {a: 0, b: 0, c: 0}
  - wave: {o0: '1111110000', o1: '1111111111', o2: '1111111111', o3: '1111111111', o4: '1111111111', o5: '1111111111', o6: '1111111111', o7: '0011111111'}
