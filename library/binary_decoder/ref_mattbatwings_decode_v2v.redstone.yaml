      rise: 4
      fall: 8
    p4:
      rise: 4
      fall: 8
    p6:
      rise: 4
      fall: 8
    p8:
      rise: 4
      fall: 8
- name: program_by_removal
  settle: 30
  steps:
  - run: setblock ~3 ~4 ~1 air
  - wait: 4
  - drive:
      q2: 1
      q6: 1
  - wait: 16
  - expect:
      p2: 1
      p4: 0
      p6: 1
      p8: 1
  - drive:
      q4: 1
  - wait: 16
  - expect:
      p2: 0
      p4: 0
      p6: 0
      p8: 0
