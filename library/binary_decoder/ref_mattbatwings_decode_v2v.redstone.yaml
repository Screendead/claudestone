name: ref_mattbatwings_decode_v2v
description: 'DECODE001 Decoder (vertical to vertical) by mattbatwings, Logical Redstone Archive (endorsed, Tested & Functional; https://discord.com/channels/1361854816837435433/1472425164812587162). README:
  programmable, expandable 4b decoder, 4b one-hot out if uniquely programmed, 2 ticks (SOURCED; MEASURED here: 4 game ticks = 2 redstone ticks to rise, 8 = 4 redstone ticks to fall, so the claim holds for
  the rising edge only). Rebuilt block for block, 9x11x7. Harness change: the original puts a lever on each input lamp (q2..q8, hard-powering it so it feeds the back line''s dust); the harness cannot attach
  a lever to a lamp, so each lamp and lever is one redstone block that powers the same dust at 15. MEASURED: as shipped all four outputs p2..p8 are the same minterm q2 & !q4 & q6 & !q8 (4b match 1010; the
  other 15 inputs give 0), so ''one-hot'' needs each output programmed differently; deleting one output''s programming torch silences that output (program_by_removal). INFERRED: each output line is the
  OR of wall torches on its back line, each torch reading a wool powered by one of four dust staircases (one per output); a staircase is held up by a lower torch cut by q2 and an upper torch cut by q6,
  and q4/q8 feed the staircases to hold them up.'
