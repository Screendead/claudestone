name: ref_llucas_tristate_decoder_2t
description: >-
  Rebuild of LLucas's "2 tick torchless tristate decoder" from mattbatwings' Logical Redstone
  Archive, entry DECODE006_2_tick_torchless_tristate_decoder (Discord:
  https://discord.com/channels/1361854816837435433/1473018624896794706, endorsed by Waffle
  [Wueffi], tagged Tested and Functional, schematic DECODE006_torchlesstristatedecoder; same
  layout as ref_llucas_dec005 plus a 14-strength stage). SOURCED: 3 inputs that are analog
  strengths, 15 = bit on, 14 = don't care, 0 = bit off; 8 one-hot outputs; plain decoder at
  15, 14 on all three bits lights every output, and 14 on single bits makes just those bits
  don't care; no torches; 2 ticks, 1 tick for the inverted output (part removed; not tested
  here). Schematic size 8x22x16 with the container fill read from its block entities (hoppers
  and barrels of redstone are the constant sources the subtract comparators read; slot layout
  kept). Harness changes. The three input lamps at x=7,z=17 (y=4,6,8) became redstone-block
  drivers b4, b1, b2 (15 on that bit's dust, as a lever on the lamp did; weights found by
  test, same order as dec005). The 14 level is fed by the wire at x=6,z=18 one layer above
  each input (the schematic's lever chain through the three z=19 repeaters feeds all three,
  and the dust steps down one to 14); drivers x4, x1, x2 stand at (7,5,18), (7,7,18), (7,9,18)
  next to those wires for per-bit don't care. The lever (named all14) hangs on white_wool
  instead of black_wool because the harness lever click only emulates plain supports; wool
  conducts the same. Outputs d0..d7 are the eight lamps at x=1. MEASURED on 26.3: all 8 plain
  codes, all 27 combinations of bit state 0/1/don't care, and 15 and 14 on one bit together
  (15 wins) give the exact one-hot or multi-hot result; the lever lights all 8 and with b4 on
  lights d4..d7 only. Every output rises 4 game ticks after the input change and falls 8 (2
  redstone ticks to light, same as dec005); the old output outlasts the new one by 4 ticks, so
  two outputs overlap on every code change. Size as built 7x8x20.
traits: [pistonless, entityless, comparator_based, container_based]
